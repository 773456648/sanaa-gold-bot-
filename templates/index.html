<!DOCTYPE html><html lang="ar" dir="rtl"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>💎 FADI SYSTEM PRO | منظومة فادي</title>    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>    <style>        :root { --fadi-gold: #ffcc00; --fadi-neon: #00ffe0; --fadi-bg: #05080a; }        body { background: var(--fadi-bg); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 15px; height: 100vh; display: flex; flex-direction: column; }        .header { text-align: center; border-bottom: 2px solid var(--fadi-gold); padding-bottom: 10px; margin-bottom: 15px; }        .header h1 { font-size: 22px; color: var(--fadi-gold); margin: 0; text-shadow: 0 0 10px var(--fadi-gold); }        .setup-box { background: #161b22; padding: 20px; border-radius: 15px; border: 1px solid var(--fadi-neon); box-shadow: 0 0 15px rgba(0,255,224,0.2); }        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: white; text-align: center; font-weight: bold; }        .btn-gold { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: linear-gradient(45deg, #ffcc00, #ffaa00); color: #000; font-size: 16px; transition: 0.3s; }        #chat { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.5); border-radius: 12px; padding: 15px; border: 1px solid #1a2c38; margin: 15px 0; display: flex; flex-direction: column; gap: 10px; }        .msg { padding: 10px 15px; border-radius: 12px; max-width: 85%; position: relative; font-size: 14px; }        .msg.me { background: #1d2a35; align-self: flex-start; border-right: 4px solid var(--fadi-neon); }        .msg.other { background: #21262d; align-self: flex-end; border-left: 4px solid #58a6ff; }        .input-row { display: flex; gap: 8px; align-items: center; }        .tool-btn { background: #222; border: 1px solid var(--fadi-gold); color: var(--fadi-gold); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }        #videoArea { display: none; position: relative; width: 100%; height: 200px; background: #000; border-radius: 12px; border: 1px solid var(--fadi-gold); margin-bottom: 10px; overflow: hidden; }        #remoteVid { width: 100%; height: 100%; object-fit: cover; }        #localVid { width: 80px; height: 60px; position: absolute; bottom: 5px; right: 5px; border: 1px solid var(--fadi-neon); }        #endCallBtn { display: none; background: #ff4444 !important; border-color: #ff4444 !important; }    </style></head><body>    <div class="header"><h1>👑FADI SYSTEM PRO👑</h1></div>    <div class="setup-box" id="setup">        <input type="text" id="userName" placeholder="اكتب اسمك للمجموعة">        <input type="text" id="roomNum" placeholder="رقم الغرفة">        <button class="btn-gold" onclick="initFadi()">🚀 دخول المنظومة الآن</button>    </div>    <div id="videoArea"><video id="remoteVid" autoplay playsinline></video><video id="localVid" autoplay muted playsinline></video></div>    <div id="chat"></div>    <audio id="remoteVoice" autoplay></audio>    <div class="input-row" id="inputSection" style="display:none;">        <button class="tool-btn" id="micBtn" onclick="handleMic()">🎤</button>        <button class="tool-btn" onclick="callAll(false)">📞</button>        <button class="tool-btn" onclick="callAll(true)">🎥</button>        <button class="tool-btn" id="endCallBtn" onclick="endCall()">🛑</button>        <input type="text" id="msgInput" placeholder="اكتب للجميع..." onkeypress="if(event.key==='Enter') send()">        <button class="btn-gold" style="width: 70px; height: 40px;" onclick="send()">إرسال</button>    </div><script>    let peer, myName, myRoom, conns = [], currentCall, myStream, mediaRec;    const chatBox = document.getElementById('chat');    const cfg = { config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] } };    function initFadi() {        myName = document.getElementById('userName').value;        myRoom = document.getElementById('roomNum').value;        if(!myName || !myRoom) return alert("يا فادي البيانات!");        document.getElementById('setup').style.display = 'none';        document.getElementById('inputSection').style.display = 'flex';        tryHost();    }    function tryHost() {        peer = new Peer(myRoom, cfg);        peer.on('open', () => {            log("👑 أنت الزعيم.. المجموعة جاهزة", "sys");            peer.on('connection', c => { conns.push(c); handleConn(c, true); });            peer.on('call', call => handleCall(call));        });        peer.on('error', err => { if(err.type === 'unavailable-id') joinRoom(); });    }    function joinRoom() {        peer = new Peer(myRoom + "-" + Math.floor(Math.random()*999), cfg);        peer.on('open', () => {            log("✅ دخلت المنظومة", "sys");            let c = peer.connect(myRoom);            conns.push(c); handleConn(c, false);        });        peer.on('call', call => handleCall(call));    }    function handleConn(c, isHost) {        c.on('open', () => c.send({type:'join', user:myName}));        c.on('data', d => {            if(isHost) conns.forEach(client => { if(client !== c) client.send(d); }); // بث للكل            if(d.type === 'msg') log(d.text, "other", d.user);            if(d.type === 'voice') log(`<audio controls src="${d.data}"></audio>`, "other", d.user);            if(d.type === 'join') log(d.user + " انضم", "sys");        });    }    function handleCall(call) {        if(confirm("اتصال وارد.. ترد؟")) {            navigator.mediaDevices.getUserMedia({audio:true, video:!!call.metadata?.video}).then(s => {                myStream = s;                if(call.metadata?.video) { document.getElementById('videoArea').style.display='block'; document.getElementById('localVid').srcObject=s; }                call.answer(s); setupCall(call);            });        }    }    function setupCall(call) {        currentCall = call;        document.getElementById('endCallBtn').style.display = 'flex';        call.on('stream', rs => {            if(call.metadata?.video) document.getElementById('remoteVid').srcObject = rs;            else document.getElementById('remoteVoice').srcObject = rs;        });        call.on('close', endCall);    }    function callAll(video) {        navigator.mediaDevices.getUserMedia({audio:true, video:video}).then(s => {            myStream = s;            if(video) { document.getElementById('videoArea').style.display='block'; document.getElementById('localVid').srcObject=s; }            conns.forEach(c => {                let call = peer.call(c.peer, s, {metadata:{video:video}});                setupCall(call);            });        });    }    function endCall() {        if(currentCall) currentCall.close();        if(myStream) myStream.getTracks().forEach(t => t.stop());        document.getElementById('videoArea').style.display = 'none';        document.getElementById('endCallBtn').style.display = 'none';        log("🔴 تم الإغلاق", "sys");    }    function send() {        const inp = document.getElementById('msgInput');        if(!inp.value) return;        conns.forEach(c => c.send({type:'msg', user:myName, text:inp.value}));        log(inp.value, "me", myName); inp.value = "";    }    function handleMic() { /* نفس كود التسجيل السابق بدون تغيير */ }    function log(m, t, u) {        const d = document.createElement('div');        d.className = `msg ${t}`;        d.innerHTML = u ? `<b>${u}:</b><br>${m}` : m;        chatBox.appendChild(d); chatBox.scrollTop = chatBox.scrollHeight;    }</script></body></html>
