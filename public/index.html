<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 FADI SYSTEM PRO | منظومة فادي الذهبية</title>
    <!-- مكتبة لإنشاء الاتصالات المباشرة -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- مكتبة التصميم TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        
        :root {
            --primary: #FFD700;
            --primary-dark: #CCAC00;
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --chat-me: #334155;
            --chat-other: #1e293b;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* تأثيرات الزجاج (Glassmorphism) */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        /* شبكة الفيديو الديناميكية */
        #videoGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            padding: 15px;
            max-height: 40vh;
            overflow-y: auto;
            background: #000;
            border-bottom: 2px solid var(--primary);
            transition: all 0.3s ease;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-name {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0,0,0,0.7);
            padding: 2px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            color: var(--primary);
        }

        /* تنسيق الرسائل */
        .msg-bubble {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            word-wrap: break-word;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-me {
            background: var(--chat-me);
            border-bottom-right-radius: 2px;
            margin-right: auto;
            border-right: 3px solid var(--primary);
        }

        .msg-other {
            background: var(--chat-other);
            border-bottom-left-radius: 2px;
            margin-left: auto;
            border-left: 3px solid #0ea5e9;
        }

        .system-msg {
            text-align: center;
            background: rgba(255, 215, 0, 0.1);
            color: var(--primary);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 10px auto;
            width: fit-content;
        }

        /* شريط التمرير مخصص */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* الرسوم المتحركة للخلفية */
        .bg-animated {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            position: relative;
        }
        .bg-animated::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,215,0,0.05) 10%, transparent 20%),
                        radial-gradient(circle, rgba(14,165,233,0.05) 10%, transparent 20%);
            background-size: 100px 100px;
            animation: moveBg 20s linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes moveBg {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* إخفاء عناصر غير نشطة */
        .hidden-sys { display: none !important; }
    </style>
</head>
<body class="bg-animated flex items-center justify-center">

    <!-- شاشة الدخول (Login) -->
    <div id="loginScreen" class="glass-panel p-8 rounded-3xl shadow-2xl w-11/12 max-w-md z-10 text-center border-t-4 border-t-yellow-400">
        <h1 class="text-4xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-200">FADI PRO</h1>
        <p class="text-gray-400 mb-8">منظومة الاتصال المشفرة</p>
        
        <div class="space-y-4">
            <input type="text" id="userNameInput" placeholder="اسمك الكريم..." class="w-full bg-slate-800 text-white px-5 py-4 rounded-xl outline-none focus:ring-2 focus:ring-yellow-400 text-center text-lg transition-all" autocomplete="off">
            <input type="text" id="roomIdInput" placeholder="رقم الغرفة (أو كلمة السر)" class="w-full bg-slate-800 text-white px-5 py-4 rounded-xl outline-none focus:ring-2 focus:ring-yellow-400 text-center text-lg transition-all" autocomplete="off">
            <button onclick="joinSystem()" class="w-full bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-black font-bold py-4 rounded-xl text-lg shadow-lg hover:shadow-yellow-500/50 transition-all transform hover:scale-[1.02]">
                <i class="fas fa-rocket ml-2"></i> دخول النظام
            </button>
        </div>
    </div>

    <!-- واجهة التطبيق الرئيسية (Main App) -->
    <div id="mainApp" class="hidden-sys w-full h-full flex flex-col md:flex-row z-10">
        
        <!-- الشريط الجانبي (الأعضاء) -->
        <div class="glass-panel w-full md:w-64 h-auto md:h-full flex flex-col border-l border-slate-700">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                <h2 class="font-bold text-yellow-400"><i class="fas fa-users ml-2"></i> المتصلين</h2>
                <span id="userCount" class="bg-yellow-500 text-black text-xs px-2 py-1 rounded-full font-bold">1</span>
            </div>
            <div id="usersList" class="flex-1 overflow-y-auto p-2 space-y-2">
                <!-- قائمة المستخدمين ستظهر هنا -->
            </div>
            <div class="p-4 border-t border-slate-700 text-center">
                <p class="text-xs text-gray-400 mb-2">غرفة: <span id="displayRoomId" class="text-yellow-400 font-bold"></span></p>
                <button onclick="leaveRoom()" class="w-full bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white py-2 rounded-lg text-sm transition-all border border-red-500/50">
                    <i class="fas fa-sign-out-alt ml-1"></i> خروج
                </button>
            </div>
        </div>

        <!-- منطقة الدردشة والفيديو -->
        <div class="flex-1 flex flex-col h-full relative">
            
            <!-- شبكة الفيديو (تظهر عند الاتصال) -->
            <div id="videoGrid" class="hidden-sys">
                <!-- الفيديوهات ستضاف هنا برمجياً -->
            </div>

            <!-- منطقة الرسائل -->
            <div id="chatBox" class="flex-1 overflow-y-auto p-4 flex flex-col space-y-2 scroll-smooth">
                <div class="system-msg"><i class="fas fa-shield-alt ml-1"></i> الاتصال مشفر بين الأطراف</div>
            </div>

            <!-- شريط الأدوات والكتابة -->
            <div class="glass-panel p-3 border-t border-slate-700 flex items-center gap-2">
                
                <!-- أزرار الفيديو والصوت -->
                <div class="flex gap-1">
                    <button onclick="toggleVideoCall()" id="camBtn" class="w-10 h-10 rounded-full bg-slate-700 hover:bg-yellow-500 hover:text-black text-gray-300 transition-all flex items-center justify-center" title="تشغيل الكاميرا">
                        <i class="fas fa-video"></i>
                    </button>
                    <button onclick="toggleMic()" id="micBtn" class="w-10 h-10 rounded-full bg-slate-700 hover:bg-yellow-500 hover:text-black text-gray-300 transition-all flex items-center justify-center" title="كتم/تشغيل المايك">
                        <i class="fas fa-microphone"></i>
                    </button>
                </div>

                <!-- فاصل -->
                <div class="w-px h-8 bg-slate-600 mx-1"></div>

                <!-- المرفقات والتسجيل -->
                <div class="flex gap-1 relative">
                    <input type="file" id="fileInput" class="hidden" onchange="sendFile(event)">
                    <button onclick="document.getElementById('fileInput').click()" class="w-10 h-10 rounded-full bg-slate-700 hover:bg-slate-600 text-gray-300 transition-all flex items-center justify-center" title="إرسال ملف">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <button onclick="toggleVoiceRecord()" id="recordBtn" class="w-10 h-10 rounded-full bg-slate-700 hover:bg-red-500 hover:text-white text-gray-300 transition-all flex items-center justify-center" title="تسجيل صوتي">
                        <i class="fas fa-microphone-alt"></i>
                    </button>
                </div>

                <!-- مربع النص -->
                <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." class="flex-1 bg-slate-800 text-white px-4 py-3 rounded-full outline-none focus:ring-1 focus:ring-yellow-400 transition-all" onkeypress="if(event.key==='Enter') sendMessage()">
                
                <!-- زر الإرسال -->
                <button onclick="sendMessage()" class="w-12 h-12 rounded-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold transition-all flex items-center justify-center transform hover:scale-105">
                    <i class="fas fa-paper-plane mr-1"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- الإشعارات المنبثقة -->
    <div id="toastContainer" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2"></div>

    <script>
        // المتغيرات العالمية
        let peer;
        let myId;
        let myName;
        let roomName;
        let connections = {}; // تخزين كل الاتصالات {peerId: DataConnection}
        let activeCalls = {}; // تخزين مكالمات الفيديو {peerId: MediaConnection}
        let myStream = null;
        let peersList = []; // قائمة بأسماء وايديات المتصلين
        
        // متغيرات التسجيل
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let isMicMuted = false;
        let isVideoActive = false;

        // --- دوال النظام الأساسية ---

        function joinSystem() {
            myName = document.getElementById('userNameInput').value.trim();
            roomName = document.getElementById('roomIdInput').value.trim();

            if (!myName || !roomName) {
                showToast('يرجى إدخال الاسم ورقم الغرفة', 'error');
                return;
            }

            // تبديل الشاشات
            document.getElementById('loginScreen').classList.add('hidden-sys');
            document.getElementById('mainApp').classList.remove('hidden-sys');
            document.getElementById('displayRoomId').textContent = roomName;
            
            // إنشاء ايدي فريد يعتمد على الغرفة
            const randomString = Math.random().toString(36).substring(2, 8);
            myId = `${roomName}_${randomString}`;

            initPeer();
        }

        function initPeer() {
            // إعداد خوادم STUN مجانية لتحسين الاتصال
            peer = new Peer(myId, {
                config: {
                    'iceServers': [
                        { url: 'stun:stun.l.google.com:19302' },
                        { url: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                showToast('تم الاتصال بالخادم بنجاح', 'success');
                updateUsersList({ id: myId, name: myName }, true);
                
                // البحث عن مستخدمين آخرين في الغرفة (عن طريق الاتصال بصاحب الغرفة الأول)
                // بما أنه نظام P2P، سنستخدم آلية Broadcasting
                connectToRoom();
            });

            // استقبال اتصالات الداتا (الدردشة)
            peer.on('connection', (conn) => {
                handleDataConnection(conn);
            });

            // استقبال مكالمات الفيديو/الصوت
            peer.on('call', (call) => {
                if(myStream) {
                    call.answer(myStream); // الرد التلقائي إذا كانت الكاميرا مفتوحة عندي
                } else {
                    // إذا لم تكن الكاميرا مفتوحة، نرسل تيار فارغ أو نرفض (هنا نرد بدون تيار مؤقتاً)
                    call.answer(); 
                }
                handleMediaCall(call);
            });

            peer.on('error', (err) => {
                console.error(err);
                if(err.type !== 'peer-unavailable') {
                    showToast('خطأ في الاتصال: ' + err.type, 'error');
                }
            });
        }

        // بما أن PeerJS لا يملك "غرف"، سنطلب من المستخدمين مشاركة الـ ID الخاص بهم
        // هنا محاكاة بسيطة: عند الدخول نسأل إن كان هناك "مستضيف" للغرفة
        // إذا لم ينجح، نفترض أننا أول شخص
        let isHost = false;
        const hostId = roomName + "_HOST";

        function connectToRoom() {
            if (myId === hostId) return; // أنا المستضيف بالفعل

            // نحاول الاتصال بالـ Host الثابت للغرفة
            const conn = peer.connect(hostId);
            
            conn.on('open', () => {
                // نجح الاتصال بالهوست! يعني لسنا أول شخص
                showToast('تم الانضمام للغرفة', 'success');
                handleDataConnection(conn);
                // إرسال معلوماتي للهوست ليوزعها للكل
                conn.send({ type: 'intro', id: myId, name: myName });
            });

            // إذا لم نتمكن من الاتصال بالهوست (نحن أول شخص في الغرفة)
            setTimeout(() => {
                if(!conn.open) {
                    // سنعيد تهيئة أنفسنا لنكون نحن الهوست
                    peer.destroy(); // تدمير الاتصال العشوائي
                    myId = hostId; // تغيير الـ ID ليكون ID المستضيف
                    isHost = true;
                    initPeer(); // إعادة الاتصال بالاسم الجديد
                    addSystemMsg('أنت أول شخص هنا. أنت زعيم الغرفة 👑');
                }
            }, 2000);
        }

        function handleDataConnection(conn) {
            if (connections[conn.peer]) return; // متصل بالفعل
            connections[conn.peer] = conn;

            conn.on('open', () => {
                if(!isHost) {
                     // إذا كنت مستخدم عادي، أرسل اسمي
                     conn.send({ type: 'intro', id: myId, name: myName });
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'intro') {
                    // شخص جديد انضم
                    updateUsersList({ id: data.id, name: data.name });
                    addSystemMsg(`انضم ${data.name} إلى الغرفة`);
                    
                    // إذا كنت أنا الهوست، سأخبر الجميع بالشخص الجديد وأخبر الشخص الجديد بالجميع
                    if(isHost) {
                        broadcast({ type: 'new_peer', id: data.id, name: data.name }, data.id);
                        // إرسال قائمة المتصلين الحاليين للشخص الجديد
                        conn.send({ type: 'peer_list', list: peersList });
                    }
                }
                else if (data.type === 'new_peer') {
                    // الهوست يخبرنا بشخص جديد، لنتصل به!
                    if (data.id !== myId) {
                        updateUsersList({ id: data.id, name: data.name });
                        const newConn = peer.connect(data.id);
                        handleDataConnection(newConn);
                    }
                }
                else if (data.type === 'peer_list') {
                    // تلقينا قائمة الأعضاء من الهوست
                    data.list.forEach(p => {
                        if(p.id !== myId && p.id !== hostId) {
                            updateUsersList(p);
                            const newConn = peer.connect(p.id);
                            handleDataConnection(newConn);
                        }
                    });
                }
                else if (data.type === 'chat') {
                    appendMessage(data.name, data.content, 'other');
                }
                else if (data.type === 'voice') {
                    appendAudioMsg(data.name, data.content, 'other');
                }
                else if (data.type === 'file') {
                    appendFileMsg(data.name, data.content, data.fileName, data.fileType, 'other');
                }
            });

            conn.on('close', () => {
                removeUser(conn.peer);
            });
        }

        function broadcast(data, excludePeer = null) {
            Object.values(connections).forEach(conn => {
                if (conn.open && conn.peer !== excludePeer) {
                    conn.send(data);
                }
            });
        }

        // --- واجهة المستخدم (UI) للدردشة ---

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('أنت', text, 'me');
            broadcast({ type: 'chat', name: myName, content: text });
            
            input.value = '';
            input.focus();
        }

        function appendMessage(sender, text, type) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            const msgClass = type === 'me' ? 'msg-me' : 'msg-other';
            const align = type === 'me' ? 'self-start' : 'self-end';
            
            div.className = `msg-bubble ${msgClass} ${align} flex flex-col`;
            div.innerHTML = `
                <span class="text-xs font-bold ${type==='me' ? 'text-yellow-400' : 'text-sky-400'} mb-1">${sender}</span>
                <span class="text-sm">${escapeHTML(text)}</span>
            `;
            chatBox.appendChild(div);
            scrollToBottom();
        }

        function addSystemMsg(text) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'system-msg';
            div.innerHTML = `<i class="fas fa-info-circle mr-1"></i> ${text}`;
            chatBox.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- إدارة المتصلين (Sidebar) ---

        function updateUsersList(user, isMe = false) {
            // التحقق من عدم التكرار
            if(peersList.find(p => p.id === user.id)) return;
            
            peersList.push(user);
            document.getElementById('userCount').textContent = peersList.length;

            const list = document.getElementById('usersList');
            const div = document.createElement('div');
            div.id = `user-${user.id}`;
            div.className = 'flex items-center gap-2 p-2 rounded-lg bg-slate-800/50 border border-slate-700/50';
            
            const iconColor = isMe ? 'text-yellow-400' : 'text-green-400';
            const displayName = isMe ? `${user.name} (أنت)` : user.name;
            const crown = user.id === hostId ? '<i class="fas fa-crown text-yellow-500 text-xs ml-1" title="الزعيم"></i>' : '';

            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center ${iconColor}">
                    <i class="fas fa-user text-sm"></i>
                </div>
                <div class="text-sm font-medium flex-1 truncate">${displayName} ${crown}</div>
                <div class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_5px_#22c55e]"></div>
            `;
            list.appendChild(div);
        }

        function removeUser(peerId) {
            const index = peersList.findIndex(p => p.id === peerId);
            if (index > -1) {
                const userName = peersList[index].name;
                peersList.splice(index, 1);
                document.getElementById('userCount').textContent = peersList.length;
                
                const el = document.getElementById(`user-${peerId}`);
                if (el) el.remove();

                // إزالة فيديو المستخدم إذا كان موجوداً
                const vidContainer = document.getElementById(`vid-container-${peerId}`);
                if(vidContainer) vidContainer.remove();
                
                checkVideoGridDisplay();
                addSystemMsg(`غادر ${userName} الغرفة`);
            }
        }

        // --- الصوت والفيديو (المكالمات) ---

        async function toggleVideoCall() {
            const camBtn = document.getElementById('camBtn');
            const videoGrid = document.getElementById('videoGrid');

            if (!isVideoActive) {
                try {
                    myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    isVideoActive = true;
                    
                    camBtn.classList.add('bg-yellow-500', 'text-black');
                    camBtn.classList.remove('bg-slate-700', 'text-gray-300');
                    videoGrid.classList.remove('hidden-sys');

                    // عرض الفيديو الخاص بي
                    addVideoStream(myId, myStream, 'أنت');

                    // الاتصال بجميع المتواجدين (Mesh)
                    Object.values(connections).forEach(conn => {
                        if (conn.open) {
                            const call = peer.call(conn.peer, myStream);
                            handleMediaCall(call);
                        }
                    });
                    showToast('تم تشغيل الكاميرا', 'success');

                } catch (err) {
                    showToast('يرجى السماح بالوصول للكاميرا والمايكروفون', 'error');
                }
            } else {
                // إيقاف الكاميرا
                myStream.getTracks().forEach(track => track.stop());
                myStream = null;
                isVideoActive = false;
                
                camBtn.classList.remove('bg-yellow-500', 'text-black');
                camBtn.classList.add('bg-slate-700', 'text-gray-300');
                
                // إغلاق كل المكالمات النشطة
                Object.values(activeCalls).forEach(call => call.close());
                activeCalls = {};

                // إزالة الفيديو الخاص بي
                const myVid = document.getElementById(`vid-container-${myId}`);
                if(myVid) myVid.remove();
                checkVideoGridDisplay();
            }
        }

        function handleMediaCall(call) {
            activeCalls[call.peer] = call;
            
            call.on('stream', (remoteStream) => {
                // البحث عن اسم المتصل من القائمة
                const user = peersList.find(p => p.id === call.peer);
                const name = user ? user.name : 'مستخدم';
                addVideoStream(call.peer, remoteStream, name);
                document.getElementById('videoGrid').classList.remove('hidden-sys');
            });

            call.on('close', () => {
                const vid = document.getElementById(`vid-container-${call.peer}`);
                if (vid) vid.remove();
                checkVideoGridDisplay();
            });
        }

        function addVideoStream(id, stream, name) {
            // منع تكرار نفس الفيديو
            if (document.getElementById(`vid-container-${id}`)) return;

            const grid = document.getElementById('videoGrid');
            const container = document.createElement('div');
            container.id = `vid-container-${id}`;
            container.className = 'video-container shadow-lg shadow-yellow-500/20';
            
            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            if (id === myId) {
                video.muted = true; // كتم الصوت الخاص بي لمنع الصدى
                video.style.transform = 'scaleX(-1)'; // عكس الكاميرا كالمرايا
            }

            const nameTag = document.createElement('div');
            nameTag.className = 'video-name';
            nameTag.innerHTML = `<i class="fas fa-video text-xs mr-1"></i> ${name}`;

            container.appendChild(video);
            container.appendChild(nameTag);
            grid.appendChild(container);
        }

        function checkVideoGridDisplay() {
            const grid = document.getElementById('videoGrid');
            if (grid.children.length === 0) {
                grid.classList.add('hidden-sys');
            }
        }

        function toggleMic() {
            const micBtn = document.getElementById('micBtn');
            if (!myStream) {
                showToast('قم بتشغيل المكالمة أولاً لتتمكن من التحكم بالمايك', 'warning');
                return;
            }

            isMicMuted = !isMicMuted;
            myStream.getAudioTracks()[0].enabled = !isMicMuted;

            if (isMicMuted) {
                micBtn.innerHTML = '<i class="fas fa-microphone-slash"></i>';
                micBtn.classList.add('bg-red-500', 'text-white');
                micBtn.classList.remove('bg-slate-700', 'text-gray-300', 'hover:bg-yellow-500');
            } else {
                micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                micBtn.classList.remove('bg-red-500', 'text-white');
                micBtn.classList.add('bg-slate-700', 'text-gray-300', 'hover:bg-yellow-500');
            }
        }

        // --- الرسائل الصوتية والمرفقات ---

        async function toggleVoiceRecord() {
            const recBtn = document.getElementById('recordBtn');
            
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };
                    
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const dataUrl = e.target.result;
                            appendAudioMsg('أنت', dataUrl, 'me');
                            broadcast({ type: 'voice', name: myName, content: dataUrl });
                        };
                        reader.readAsDataURL(audioBlob);
                        stream.getTracks().forEach(track => track.stop()); 
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    recBtn.classList.add('bg-red-500', 'text-white', 'animate-pulse');
                    recBtn.classList.remove('bg-slate-700', 'text-gray-300');
                    showToast('جاري التسجيل...', 'info');
                    
                } catch (err) {
                    showToast('يرجى السماح بالمايكروفون للتسجيل', 'error');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
                recBtn.classList.add('bg-slate-700', 'text-gray-300');
            }
        }

        function appendAudioMsg(sender, audioData, type) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            const msgClass = type === 'me' ? 'msg-me' : 'msg-other';
            const align = type === 'me' ? 'self-start' : 'self-end';
            
            div.className = `msg-bubble ${msgClass} ${align} flex flex-col min-w-[250px]`;
            div.innerHTML = `
                <span class="text-xs font-bold ${type==='me' ? 'text-yellow-400' : 'text-sky-400'} mb-2">
                    <i class="fas fa-microphone-alt mr-1"></i> ${sender}
                </span>
                <audio src="${audioData}" controls class="w-full h-10 rounded-full outline-none"></audio>
            `;
            chatBox.appendChild(div);
            scrollToBottom();
        }

        function sendFile(event) {
            const file = event.target.files[0];
            if(!file) return;
            
            if(file.size > 5 * 1024 * 1024) { 
                showToast('الملف كبير جداً (الحد الأقصى 5MB)', 'error');
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const dataUrl = e.target.result;
                appendFileMsg('أنت', dataUrl, file.name, file.type, 'me');
                broadcast({ 
                    type: 'file', 
                    name: myName, 
                    fileName: file.name, 
                    fileType: file.type, 
                    content: dataUrl 
                });
            };
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function appendFileMsg(sender, data, fileName, fileType, type) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            const msgClass = type === 'me' ? 'msg-me' : 'msg-other';
            const align = type === 'me' ? 'self-start' : 'self-end';
            
            let contentHtml = '';
            if(fileType.startsWith('image/')) {
                contentHtml = `<img src="${data}" class="max-w-full rounded-lg mt-1 border border-slate-600 cursor-pointer hover:opacity-90" onclick="window.open('${data}')">`;
            } else if (fileType.startsWith('video/')) {
                contentHtml = `<video src="${data}" controls class="max-w-full rounded-lg mt-1 border border-slate-600"></video>`;
            } else {
                contentHtml = `
                    <a href="${data}" download="${fileName}" class="flex items-center p-3 bg-slate-800 rounded-lg mt-1 hover:bg-slate-700 transition-colors border border-slate-600">
                        <i class="fas fa-file-alt text-2xl text-yellow-400 ml-3"></i>
                        <div class="flex flex-col overflow-hidden">
                            <span class="text-sm text-white truncate font-bold">${fileName}</span>
                            <span class="text-xs text-gray-400">اضغط للتحميل</span>
                        </div>
                    </a>`;
            }

            div.className = `msg-bubble ${msgClass} ${align} flex flex-col min-w-[200px] max-w-sm`;
            div.innerHTML = `
                <span class="text-xs font-bold ${type==='me' ? 'text-yellow-400' : 'text-sky-400'} mb-1">
                    <i class="fas fa-paperclip mr-1"></i> ${sender}
                </span>
                ${contentHtml}
            `;
            chatBox.appendChild(div);
            scrollToBottom();
        }

        // --- دوال مساعدة ---

        function showToast(msg, type = 'info') {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-800';
            let borderClass = 'border-blue-500';
            let icon = 'fa-info-circle text-blue-500';

            if(type === 'success') { borderClass = 'border-green-500'; icon = 'fa-check-circle text-green-500'; }
            if(type === 'error') { borderClass = 'border-red-500'; icon = 'fa-times-circle text-red-500'; }
            if(type === 'warning') { borderClass = 'border-yellow-500'; icon = 'fa-exclamation-triangle text-yellow-500'; }

            toast.className = `${bgClass} border-b-2 ${borderClass} text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 transform transition-all duration-300 translate-y-[-20px] opacity-0`;
            toast.innerHTML = `<i class="fas ${icon} text-xl"></i> <span class="font-bold text-sm">${msg}</span>`;
            
            toastContainer.appendChild(toast);
            
            // Animation
            setTimeout(() => {
                toast.classList.remove('translate-y-[-20px]', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag]));
        }

        function leaveRoom() {
            if(confirm('هل أنت متأكد من مغادرة المنظومة؟')) {
                if(peer) peer.destroy();
                if(myStream) myStream.getTracks().forEach(t => t.stop());
                location.reload();
            }
        }
    </script>
</body>
</html>
