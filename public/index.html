<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الهيبة | المزامنة الملكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #060608; color: #f0f0f0; font-family: 'Changa', sans-serif; }
        .gold-text { color: #d4af37; }
        .gold-btn { background: linear-gradient(135deg, #d4af37, #b8860b); color: #000; font-weight: bold; }
        .glass-card { background: rgba(15, 15, 20, 0.98); border: 1px solid #222; border-radius: 20px; }
        input, select { background: #111 !important; border: 1px solid #333 !important; color: #fff; border-radius: 12px; padding: 12px; width: 100%; outline: none; }
        .type-select.active { border-color: #d4af37; background: rgba(212, 175, 55, 0.05); }
        .type-select { border: 2px solid #333; cursor: pointer; padding: 15px; text-align: center; border-radius: 15px; transition: 0.3s; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="p-4">

    <!-- واجهة الدخول -->
    <div id="auth-ui" class="max-w-md mx-auto mt-10 space-y-8">
        <div class="text-center">
            <h1 class="text-6xl font-black gold-text italic">HEIBA</h1>
            <p class="text-[10px] text-gray-500 tracking-[0.3em] uppercase mt-2">Royal Financial Engine</p>
        </div>

        <div class="glass-card p-8 space-y-6">
            <div class="grid grid-cols-2 gap-3">
                <div id="sel-merchant" onclick="setType('merchant')" class="type-select active">👑 تاجر</div>
                <div id="sel-debtor" onclick="setType('debtor')" class="type-select">👤 مواطن</div>
            </div>
            <input id="u-name" type="text" placeholder="اسم المستخدم">
            <input id="u-pass" type="password" placeholder="كلمة المرور">
            
            <label class="flex items-center gap-2 text-xs text-gray-400 cursor-pointer">
                <input type="checkbox" id="save-session-check" checked class="w-4 h-4">
                حفظ بيانات الدخول (البقاء متصلاً)
            </label>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="doAuth('login')" class="bg-zinc-800 py-3 rounded-xl font-bold">دخول</button>
                <button onclick="doAuth('reg')" class="gold-btn py-3 rounded-xl">تسجيل</button>
            </div>

            <div id="saved-sessions-div" class="hidden pt-4 border-t border-white/5 space-y-2">
                <p class="text-[9px] text-gray-600 text-center">جلسات محفوظة</p>
                <div id="sessions-list"></div>
            </div>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div id="main-ui" class="hidden max-w-6xl mx-auto space-y-4">
        <header class="glass-card p-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 gold-btn rounded-lg flex items-center justify-center text-black font-bold">H</div>
                <div>
                    <h2 id="display-name" class="font-bold gold-text"></h2>
                    <p id="role-tag" class="text-[9px] opacity-50"></p>
                </div>
            </div>
            <div class="flex gap-2">
                <button id="verify-nav-btn" class="hidden bg-green-900/20 text-green-500 px-3 py-1 rounded-lg text-[10px] border border-green-900" onclick="openModal('verify-modal')">تفعيل بصمة ✅</button>
                <button onclick="logout()" class="bg-red-900/20 text-red-500 px-3 py-1 rounded-lg text-[10px]">خروج</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <!-- القائمة الجانبية -->
            <div class="lg:col-span-4 space-y-4">
                <div class="glass-card p-4">
                    <p class="text-[10px] text-gray-500 mb-3 uppercase tracking-tighter">إحصائيات الحساب العام</p>
                    <div id="grand-totals" class="space-y-2"></div>
                </div>
                <div class="glass-card p-4 min-h-[300px]">
                    <div id="merchant-tools" class="hidden mb-4">
                        <input id="target-search" placeholder="إضافة مواطن..." onchange="addTarget()">
                    </div>
                    <div id="main-list" class="space-y-2"></div>
                </div>
            </div>

            <!-- صفحة التفاصيل -->
            <div class="lg:col-span-8">
                <div id="details-pane" class="hidden glass-card p-6 min-h-[500px] flex flex-col">
                    <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-4">
                        <div>
                            <h3 id="active-target-name" class="text-2xl font-bold gold-text"></h3>
                            <div id="target-totals" class="grid grid-cols-3 gap-2 mt-3"></div>
                        </div>
                        <div id="debtor-actions" class="hidden">
                            <button onclick="openSmartStampModal()" class="gold-btn px-4 py-2 rounded-lg text-[10px]">توثيق مبلغ محدد ✋</button>
                        </div>
                    </div>
                    
                    <div id="ops-list" class="flex-grow space-y-2 overflow-y-auto max-h-[400px] mb-4"></div>

                    <div id="add-form" class="hidden grid grid-cols-2 md:grid-cols-4 gap-2 bg-white/5 p-3 rounded-xl">
                        <input id="op-amt" type="number" placeholder="المبلغ">
                        <select id="op-cur"><option value="YER">يمني</option><option value="USD">دولار</option><option value="SAR">سعودي</option></select>
                        <select id="op-type"><option value="دين">دين</option><option value="سداد">سداد</option></select>
                        <button onclick="saveOp()" class="gold-btn rounded-lg">إضافة</button>
                    </div>
                </div>
                <div id="empty-hint" class="glass-card p-20 text-center text-gray-600 italic">اختر اسماً للعرض...</div>
            </div>
        </div>
    </div>

    <!-- النوافذ -->
    <div id="smart-stamp-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
        <div class="glass-card p-6 w-full max-w-sm space-y-4">
            <h3 class="gold-text font-bold text-center">توثيق مبلغ محدد</h3>
            <select id="smart-cur"><option value="YER">يمني</option><option value="USD">دولار</option><option value="SAR">سعودي</option></select>
            <input id="smart-amt" type="number" placeholder="المبلغ المطلوب توثيقه">
            <input id="smart-code" placeholder="كود البصمة الخاص بك">
            <div class="flex gap-2">
                <button onclick="submitSmartStamp()" class="gold-btn flex-grow py-3 rounded-xl">إرسال</button>
                <button onclick="closeModal('smart-stamp-modal')" class="bg-zinc-800 px-4 rounded-xl">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="verify-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
        <div class="glass-card p-6 w-full max-w-sm space-y-4">
            <h3 class="text-green-500 font-bold text-center">تفعيل البصمة</h3>
            <input id="verify-code-input" placeholder="أدخل الكود المستلم">
            <button onclick="processVerify()" class="gold-btn w-full py-3 rounded-xl">تأكيد المطابقة</button>
            <button onclick="closeModal('verify-modal')" class="w-full text-xs opacity-50 text-center">إغلاق</button>
        </div>
    </div>

    <script>
        let user = null; let activeTarget = null; let userType = 'merchant'; let discoveredData = [];
        
        window.onload = () => {
            const saved = localStorage.getItem('heiba_active_session');
            if(saved) {
                const s = JSON.parse(saved);
                document.getElementById('u-name').value = s.name;
                document.getElementById('u-pass').value = s.pass;
                userType = s.type;
                doAuth('login');
            }
            loadSessionsList();
        };

        function loadSessionsList() {
            const list = JSON.parse(localStorage.getItem('heiba_all_sessions') || '[]');
            if(list.length > 0) {
                document.getElementById('saved-sessions-div').classList.remove('hidden');
                document.getElementById('sessions-list').innerHTML = list.map(s => `
                    <div class="flex justify-between items-center p-2 bg-white/5 rounded-lg text-[10px] italic">
                        <span onclick="quickLogin('${s.name}','${s.pass}','${s.type}')" class="cursor-pointer">${s.name} (${s.type})</span>
                        <button onclick="removeSession('${s.name}')" class="text-red-500">حذف</button>
                    </div>`).join('');
            }
        }

        function quickLogin(n, p, t) {
            document.getElementById('u-name').value = n;
            document.getElementById('u-pass').value = p;
            userType = t;
            doAuth('login');
        }

        async function doAuth(action) {
            const name = document.getElementById('u-name').value.trim();
            const password = document.getElementById('u-pass').value;
            const res = await fetch('/api/auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, password, type: userType, action }) });
            const data = await res.json();
            if(res.ok) {
                if(document.getElementById('save-session-check').checked) {
                    localStorage.setItem('heiba_active_session', JSON.stringify({name, pass: password, type: userType}));
                    let all = JSON.parse(localStorage.getItem('heiba_all_sessions') || '[]');
                    if(!all.find(x => x.name === name)) all.push({name, pass: password, type: userType});
                    localStorage.setItem('heiba_all_sessions', JSON.stringify(all));
                }
                user = data; start();
            } else alert(data.error);
        }

        function start() {
            document.getElementById('auth-ui').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('display-name').innerText = user.name;
            document.getElementById('role-tag').innerText = user.type === 'merchant' ? 'رتبة تاجر ملكي' : 'رتبة مواطن مستخدم';
            if(user.type === 'merchant') {
                document.getElementById('merchant-tools').classList.remove('hidden');
                document.getElementById('add-form').classList.remove('hidden');
                document.getElementById('verify-nav-btn').classList.remove('hidden');
                renderList(); calculateGrand();
            } else {
                document.getElementById('debtor-actions').classList.remove('hidden');
                setInterval(fetchAuto, 3000); fetchAuto();
            }
        }

        async function fetchAuto() {
            const res = await fetch(`/api/auto-discover?debtorName=${encodeURIComponent(user.name)}`);
            discoveredData = await res.json();
            document.getElementById('main-list').innerHTML = discoveredData.map(m => `<div onclick="showDetails('${m.merchantName}')" class="p-3 bg-zinc-900 border border-white/5 rounded-xl mb-1 ${activeTarget === m.merchantName ? 'border-yellow-600' : ''}">${m.merchantName}</div>`).join('');
            calculateGrand(); if(activeTarget) showDetails(activeTarget);
        }

        function calculateGrand() {
            let rs = (user.type === 'merchant') ? user.myRecords : [].concat(...discoveredData.map(m => m.records));
            let stats = { YER: {t:0, v:0}, USD: {t:0, v:0}, SAR: {t:0, v:0} };
            rs.forEach(r => {
                let a = parseFloat(r.amount); let d = r.type === 'دين';
                stats[r.currency].t += d ? a : -a;
                if(r.isVerified) stats[r.currency].v += d ? a : -a;
            });
            document.getElementById('grand-totals').innerHTML = Object.keys(stats).map(c => `
                <div class="stat-box flex justify-between items-center">
                    <span class="text-[10px]">${c}</span>
                    <div class="text-right">
                        <p class="text-sm font-bold">${stats[c].t.toLocaleString()}</p>
                        <p class="text-[8px] text-green-500 font-bold italic">موثق: ${stats[c].v.toLocaleString()}</p>
                    </div>
                </div>`).join('');
        }

        function showDetails(name) {
            activeTarget = name; document.getElementById('empty-hint').classList.add('hidden'); document.getElementById('details-pane').classList.remove('hidden');
            document.getElementById('active-target-name').innerText = name;
            let rs = (user.type === 'merchant') ? user.myRecords.filter(r => r.targetName === name) : (discoveredData.find(m => m.merchantName === name)?.records || []);
            
            let stats = { YER: {t:0, v:0}, USD: {t:0, v:0}, SAR: {t:0, v:0} };
            document.getElementById('ops-list').innerHTML = rs.map(r => {
                let a = parseFloat(r.amount); let d = r.type === 'دين';
                stats[r.currency].t += d ? a : -a; if(r.isVerified) stats[r.currency].v += d ? a : -a;
                return `<div class="p-3 bg-white/5 rounded-xl flex justify-between items-center border-l-2 ${d?'border-red-500':'border-green-500'}">
                    <div><p class="text-xs font-bold">${r.type}</p><p class="text-[8px] opacity-40">${new Date(r.id*1).toLocaleString()}</p></div>
                    <div class="text-right">
                        <p class="text-sm font-bold ${d?'text-red-500':'text-green-500'}">${d?'+':'-'}${a}</p>
                        ${r.isVerified ? `<span class="text-[7px] text-green-500 border border-green-500 px-1 rounded italic">موثق كود: ${r.authCode}</span>` : ''}
                    </div>
                </div>`;
            }).reverse().join('');

            document.getElementById('target-totals').innerHTML = Object.keys(stats).map(c => `
                <div class="stat-box text-center">
                    <p class="text-[8px] opacity-50">${c}</p>
                    <p class="text-[10px] font-bold">${stats[c].t}</p>
                    <p class="text-[7px] text-green-500 font-bold">🔐 ${stats[c].v}</p>
                </div>`).join('');
        }

        async function saveOp() {
            const a = document.getElementById('op-amt').value; if(!a || !activeTarget) return;
            const op = { id: Date.now().toString(), targetName: activeTarget, amount: a, currency: document.getElementById('op-cur').value, type: document.getElementById('op-type').value, isVerified: false };
            const res = await fetch('/api/sync', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId: user.id, op }) });
            user.myRecords = (await res.json()).newRecords; showDetails(activeTarget); calculateGrand();
        }

        function openSmartStampModal() { openModal('smart-stamp-modal'); }
        async function submitSmartStamp() {
            const cur = document.getElementById('smart-cur').value;
            const amt = document.getElementById('smart-amt').value;
            const code = document.getElementById('smart-code').value.trim();
            const res = await fetch('/api/verify-auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'create_smart', debtorName: user.name, merchantName: activeTarget, amount: amt, currency: cur, authCode: code }) });
            if(res.ok) { alert("تم إرسال البصمة"); closeModal('smart-stamp-modal'); } else alert((await res.json()).error);
        }

        async function processVerify() {
            const code = document.getElementById('verify-code-input').value.trim();
            const res = await fetch('/api/verify-auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'check', authCode: code, merchantId: user.id }) });
            if(res.ok) { user.myRecords = (await res.json()).newRecords; showDetails(activeTarget); closeModal('verify-modal'); } else alert("كود خاطئ");
        }

        function setType(t) { userType = t; document.getElementById('sel-merchant').classList.toggle('active', t==='merchant'); document.getElementById('sel-debtor').classList.toggle('active', t==='debtor'); }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function renderList() { const ts = [...new Set(user.myRecords.map(r => r.targetName))]; document.getElementById('main-list').innerHTML = ts.map(n => `<div onclick="showDetails('${n}')" class="p-3 bg-zinc-900 rounded-xl mb-1 cursor-pointer ${activeTarget===n?'border border-yellow-600':''}">${n}</div>`).join(''); }
        function addTarget() { const n = document.getElementById('target-search').value.trim(); if(!n) return; activeTarget = n; showDetails(n); renderList(); }
        function logout() { localStorage.removeItem('heiba_active_session'); location.reload(); }
        function removeSession(n) { let all = JSON.parse(localStorage.getItem('heiba_all_sessions') || '[]'); all = all.filter(x => x.name !== n); localStorage.setItem('heiba_all_sessions', JSON.stringify(all)); loadSessionsList(); }
    </script>
</body>
</html>
