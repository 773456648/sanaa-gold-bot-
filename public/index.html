<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 FADI SYSTEM PRO | منظومة فادي الذهبية</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', system-ui, sans-serif;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        :root {
            --gold: #FFD700;
            --gold-dark: #CCAC00;
            --neon: #00ffff;
            --dark-bg: #0A0C0F;
            --card-bg: #1A1E24;
            --input-bg: #2A2F36;
        }
        
        body {
            background: var(--dark-bg);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* خلفية متحركة */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.1) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.1) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }
        
        /* الهيدر */
        .header {
            text-align: center;
            padding: 15px;
            background: rgba(26, 30, 36, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 2px solid var(--gold);
            margin-bottom: 20px;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(45deg, #FFD700, #00ffff, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 5px;
        }
        
        .role-badge {
            display: inline-block;
            padding: 8px 25px;
            background: linear-gradient(45deg, var(--gold), var(--gold-dark));
            color: black;
            font-weight: bold;
            border-radius: 50px;
            font-size: 16px;
            box-shadow: 0 0 20px var(--gold);
        }
        
        /* صندوق التسجيل */
        .setup-box {
            background: var(--card-bg);
            border: 2px solid var(--neon);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            margin-bottom: 20px;
        }
        
        .setup-box input {
            width: 100%;
            padding: 18px;
            margin: 10px 0;
            background: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 20px;
            color: white;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
            transition: 0.3s;
        }
        
        .setup-box input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 25px var(--gold);
            outline: none;
        }
        
        .setup-box input::placeholder {
            color: #888;
            font-size: 16px;
        }
        
        .btn-enter {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, var(--gold), #FFA500);
            border: none;
            border-radius: 20px;
            color: black;
            font-weight: bold;
            font-size: 22px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
            box-shadow: 0 0 30px var(--gold);
        }
        
        .btn-enter:hover {
            transform: scale(1.02);
            box-shadow: 0 0 50px var(--gold);
        }
        
        /* منطقة الفيديو */
        #videoArea {
            display: none;
            position: relative;
            width: 100%;
            height: 250px;
            background: black;
            border-radius: 25px;
            border: 3px solid var(--gold);
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 0 40px var(--gold);
            z-index: 10;
        }
        
        #remoteVid {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #localVid {
            width: 120px;
            height: 90px;
            position: absolute;
            bottom: 10px;
            left: 10px;
            border: 3px solid var(--neon);
            border-radius: 15px;
            object-fit: cover;
            box-shadow: 0 0 20px var(--neon);
        }
        
        /* منطقة الشات */
        #chat {
            flex: 1;
            background: rgba(26, 30, 36, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 20px;
            margin: 15px 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 2px solid var(--neon);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            z-index: 10;
            min-height: 300px;
            max-height: 400px;
        }
        
        /* الرسائل */
        .msg {
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 85%;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: popIn 0.3s ease;
        }
        
        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .msg.me {
            background: linear-gradient(135deg, #1D2A35, #0F1A24);
            align-self: flex-start;
            border-right: 5px solid var(--neon);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.2);
        }
        
        .msg.other {
            background: linear-gradient(135deg, #2A2F36, #1A1F26);
            align-self: flex-end;
            border-left: 5px solid var(--gold);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.2);
        }
        
        .msg.sys {
            background: rgba(255, 215, 0, 0.15);
            align-self: center;
            border: 2px solid var(--gold);
            color: var(--gold);
            font-size: 14px;
            max-width: 70%;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        
        .msg b {
            color: var(--gold);
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }
        
        /* شريط الإدخال */
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 40px;
            border: 2px solid var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            z-index: 10;
            position: relative;
            margin-top: 10px;
        }
        
        .tool-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: var(--input-bg);
            border: 2px solid var(--gold);
            color: var(--gold);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            flex-shrink: 0;
        }
        
        .tool-btn:hover {
            transform: scale(1.1);
            background: var(--gold);
            color: black;
            box-shadow: 0 0 25px var(--gold);
        }
        
        #msgInput {
            flex: 1;
            padding: 18px;
            background: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 30px;
            color: white;
            font-size: 18px;
            direction: rtl;
            text-align: right;
        }
        
        #msgInput:focus {
            border-color: var(--neon);
            box-shadow: 0 0 20px var(--neon);
            outline: none;
        }
        
        #msgInput::placeholder {
            color: #888;
            font-size: 16px;
        }
        
        .btn-send {
            background: linear-gradient(45deg, var(--gold), #FFA500);
            border: none;
            border-radius: 40px;
            padding: 15px 25px;
            color: black;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px var(--gold);
            min-width: 100px;
        }
        
        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px var(--gold);
        }
        
        #endCallBtn {
            background: #ff4444 !important;
            border-color: white !important;
            color: white !important;
        }
        
        /* الإشعارات */
        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .toast {
            background: var(--card-bg);
            border-right: 5px solid var(--gold);
            padding: 15px 25px;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideIn 0.3s;
            backdrop-filter: blur(10px);
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="toastContainer"></div>
    
    <div class="header">
        <h1>👑 FADI SYSTEM ULTRA 👑</h1>
        <span class="role-badge" id="roleBadge">منتظر الدخول...</span>
    </div>
    
    <div class="setup-box" id="setup">
        <input type="text" id="userName" placeholder="الاسم الثلاثي" autocomplete="off">
        <input type="text" id="roomNum" placeholder="رقم الغرفة" autocomplete="off">
        <button class="btn-enter" onclick="initFadi()">🚀 ادخل المنظومة</button>
    </div>
    
    <div id="videoArea">
        <video id="remoteVid" autoplay playsinline></video>
        <video id="localVid" autoplay muted playsinline></video>
    </div>
    
    <div id="chat"></div>
    <audio id="remoteVoice" autoplay></audio>
    
    <div class="input-row" id="inputSection" style="display:none;">
        <button class="tool-btn" id="micBtn" onclick="toggleMic()">🎤</button>
        <button class="tool-btn" onclick="callAll(false)">📞</button>
        <button class="tool-btn" onclick="callAll(true)">🎥</button>
        <button class="tool-btn" id="endCallBtn" onclick="endCall()">🛑</button>
        <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key==='Enter') send()">
        <button class="btn-send" onclick="send()">إرسال</button>
    </div>

    <script>
        let peer, myName, myRoom, conns = [], currentCall, myStream;
        let isMicMuted = false;
        const chatBox = document.getElementById('chat');
        const toastContainer = document.getElementById('toastContainer');
        
        const cfg = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };
        
        // نظام الإشعارات
        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            toast.style.borderRightColor = type === 'gold' ? '#FFD700' : '#00ffff';
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // بداية التشغيل
        function initFadi() {
            myName = document.getElementById('userName').value.trim();
            myRoom = document.getElementById('roomNum').value.trim();
            
            if(!myName || !myRoom) {
                showToast('❌ اكتب اسمك ورقم الغرفة', 'gold');
                return;
            }
            
            document.getElementById('setup').style.display = 'none';
            document.getElementById('inputSection').style.display = 'flex';
            showToast('⚡ جاري الاتصال...', 'info');
            
            tryHost();
        }
        
        function tryHost() {
            peer = new Peer(myRoom, cfg);
            
            peer.on('open', () => {
                document.getElementById('roleBadge').textContent = '👑 زعيم المجموعة';
                log('👑 انت الزعيم.. المجموعة جاهزة', 'sys');
                showToast('👑 انت الزعيم', 'gold');
                
                peer.on('connection', c => {
                    conns.push(c);
                    handleConn(c, true);
                    showToast('📱 عضو جديد انضم', 'info');
                });
                
                peer.on('call', call => handleCall(call));
            });
            
            peer.on('error', err => {
                if(err.type === 'unavailable-id') {
                    joinRoom();
                } else {
                    showToast('⚠️ خطأ: ' + err.type, 'gold');
                }
            });
        }
        
        function joinRoom() {
            peer = new Peer(myRoom + '-' + Math.floor(Math.random() * 9999), cfg);
            
            peer.on('open', () => {
                document.getElementById('roleBadge').textContent = '👤 عضو في المجموعة';
                log('✅ دخلت المجموعة', 'sys');
                showToast('✅ تم الاتصال', 'info');
                
                let c = peer.connect(myRoom);
                conns.push(c);
                handleConn(c, false);
            });
            
            peer.on('call', call => handleCall(call));
        }
        
        function handleConn(c, isHost) {
            c.on('open', () => {
                c.send({ type: 'join', user: myName });
            });
            
            c.on('data', d => {
                if(isHost && d.type !== 'join') {
                    conns.forEach(client => {
                        if(client !== c) client.send(d);
                    });
                }
                
                if(d.type === 'msg') {
                    log(d.text, 'other', d.user);
                    if(d.text.includes('@' + myName)) {
                        showToast(`💬 ${d.user} منشن لك`, 'gold');
                    }
                }
                
                if(d.type === 'join') {
                    log(d.user + ' انضم للمجموعة', 'sys');
                }
            });
        }
        
        function handleCall(call) {
            if(confirm('📞 اتصال وارد.. تريد الرد؟')) {
                navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: call.metadata?.video || false
                }).then(s => {
                    myStream = s;
                    
                    if(call.metadata?.video) {
                        document.getElementById('videoArea').style.display = 'block';
                        document.getElementById('localVid').srcObject = s;
                    }
                    
                    call.answer(s);
                    setupCall(call);
                    
                }).catch(e => {
                    showToast('❌ لا يمكن فتح الكاميرا', 'gold');
                });
            } else {
                call.close();
            }
        }
        
        function setupCall(call) {
            currentCall = call;
            document.getElementById('endCallBtn').style.display = 'flex';
            
            call.on('stream', remoteStream => {
                if(call.metadata?.video) {
                    document.getElementById('remoteVid').srcObject = remoteStream;
                } else {
                    document.getElementById('remoteVoice').srcObject = remoteStream;
                }
            });
            
            call.on('close', () => endCall());
        }
        
        function callAll(video) {
            navigator.mediaDevices.getUserMedia({
                audio: true,
                video: video
            }).then(s => {
                myStream = s;
                
                if(video) {
                    document.getElementById('videoArea').style.display = 'block';
                    document.getElementById('localVid').srcObject = s;
                }
                
                conns.forEach(c => {
                    let call = peer.call(c.peer, s, { metadata: { video: video } });
                    setupCall(call);
                });
                
                showToast(video ? '📹 مكالمة فيديو بدأت' : '📞 مكالمة صوتية بدأت', 'info');
                
            }).catch(e => {
                showToast('❌ صلاحيات الكاميرا مطلوبة', 'gold');
            });
        }
        
        function endCall() {
            if(currentCall) currentCall.close();
            if(myStream) myStream.getTracks().forEach(t => t.stop());
            
            document.getElementById('videoArea').style.display = 'none';
            document.getElementById('endCallBtn').style.display = 'none';
            log('🔴 تم إنهاء المكالمة', 'sys');
            showToast('🔴 انتهت المكالمة', 'info');
        }
        
        function toggleMic() {
            if(myStream) {
                myStream.getAudioTracks().forEach(t => t.enabled = isMicMuted);
                isMicMuted = !isMicMuted;
                
                document.getElementById('micBtn').style.background = isMicMuted ? '#ff4444' : '';
                document.getElementById('micBtn').style.color = isMicMuted ? 'white' : '';
                
                showToast(isMicMuted ? '🔇 الميكروفون كاتم' : '🎤 الميكروفون شغال', 'info');
            }
        }
        
        function send() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            
            if(!text) return;
            
            // عرض عندي
            log(text, 'me', myName);
            
            // ارسال للكل
            conns.forEach(c => {
                c.send({ type: 'msg', user: myName, text: text });
            });
            
            input.value = '';
            input.focus();
        }
        
        function log(msg, type, user = null) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            
            if(type === 'sys') {
                div.innerHTML = `⚡ ${msg}`;
            } else {
                // تحويل @ mentions
                let formattedMsg = msg.replace(/@(\w+)/g, '<span style="background: #FFD70033; padding: 2px 5px; border-radius: 10px; color: #FFD700;">@$1</span>');
                div.innerHTML = user ? `<b>${user}</b><br>${formattedMsg}` : formattedMsg;
            }
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        // تحذير الخروج
        window.onbeforeunload = function() {
            return "انت خارج من المنظومة!";
        };
    </script>
</body>
</html>
