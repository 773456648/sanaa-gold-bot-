<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEIBA GLOBAL | المنظومة العملاقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root { --gold: #d4af37; --bg: #050508; --card: rgba(15, 15, 25, 0.9); }
        body { background: var(--bg); color: #fff; font-family: 'Changa', sans-serif; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: var(--card); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.15); border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .gold-glow { color: #f1d279; text-shadow: 0 0 15px rgba(212, 175, 55, 0.5); }
        .input-heiba { background: rgba(0,0,0,0.5); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 12px; color: var(--gold); text-align: center; outline: none; }
        .asset-tab.active { border-color: var(--gold); background: rgba(212, 175, 55, 0.1); color: var(--gold); }
        .scanning { background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.1), transparent); background-size: 200% 100%; animation: scan 2s infinite linear; }
        @keyframes scan { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .activity-item { border-left: 2px solid var(--gold); padding: 5px 10px; margin-bottom: 8px; background: rgba(255,255,255,0.02); font-size: 11px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="lock" class="fixed inset-0 z-[1000] bg-black flex items-center justify-center p-6">
        <div class="glass-panel p-10 max-w-md w-full text-center border-gold/30">
            <h2 class="text-3xl font-black gold-glow mb-2 orbitron">HEIBA GLOBAL</h2>
            <p class="text-[10px] tracking-[5px] uppercase mb-8">Quantum Access Only</p>
            <input type="text" id="user-identity" class="input-heiba w-full p-3 mb-3" placeholder="اسمك البرمجي">
            <input type="password" id="pass" class="input-heiba w-full p-4 text-2xl mb-6 tracking-[10px]" placeholder="••••">
            <button onclick="unlock()" class="w-full bg-gradient-to-r from-[#d4af37] to-[#a17d1a] text-black py-4 rounded-xl font-black uppercase">دخول المنظومة</button>
        </div>
    </div>

    <div id="main" class="hidden">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-6">
            <div class="flex items-center gap-5">
                <div class="p-5 glass-panel border-gold/40 gold-glow orbitron font-black text-2xl">H</div>
                <div><h1 class="text-2xl font-black tracking-tight">HEIBA <span class="gold-glow">TRADER V2</span></h1></div>
            </div>
            <div class="glass-panel px-8 py-4 border-r-4 border-gold">
                <div id="live-price" class="text-3xl font-black orbitron gold-glow">$0.00</div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-3 space-y-6">
                <div class="glass-panel p-6">
                    <h3 class="text-xs font-bold gold-glow mb-4">🤖 إدارة البوت الشخصي</h3>
                    <div class="space-y-3">
                        <input id="bot-n" class="input-heiba w-full p-2 text-xs" placeholder="اسم البوت (فريد)">
                        <input id="bot-t" class="input-heiba w-full p-2 text-xs" placeholder="Telegram Token">
                        <input id="bot-c" class="input-heiba w-full p-2 text-xs" placeholder="Chat ID">
                        <input id="bot-p" type="password" class="input-heiba w-full p-2 text-xs" placeholder="كلمة سر الحماية">
                        <button onclick="linkBot()" class="w-full bg-gold/20 text-gold py-2 rounded-lg text-xs font-bold">ربط وحماية</button>
                    </div>
                </div>

                <div class="glass-panel p-6">
                    <h3 class="text-xs font-bold text-gray-500 mb-4 tracking-widest uppercase">📡 رادار الأنشطة المباشرة</h3>
                    <div id="activity-log" class="max-h-[200px] overflow-y-auto space-y-2">
                        </div>
                </div>
            </div>

            <div class="lg:col-span-6 space-y-6">
                <div class="glass-panel h-[450px] overflow-hidden">
                    <div id="chart-container" class="w-full h-full"></div>
                </div>
                <div class="glass-panel p-8 scanning flex gap-4">
                    <input id="trade-amount" type="number" class="input-heiba flex-1 p-4 text-2xl font-black" placeholder="0.00">
                    <button onclick="placeOrder('BUY')" class="bg-green-600 px-8 rounded-xl font-black">BUY</button>
                    <button onclick="placeOrder('SELL')" class="bg-red-600 px-8 rounded-xl font-black">SELL</button>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                <div class="glass-panel p-6">
                    <h3 class="text-xs font-bold text-gray-400 mb-4 uppercase">المنظومات المتصلة</h3>
                    <div id="active-bots" class="space-y-2 text-[10px]">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = "";
        let currentAsset = { symbol: 'OANDA:XAUUSD', name: 'GOLD' };
        let allPrices = {};

        function unlock() {
            const user = document.getElementById('user-identity').value;
            const pass = document.getElementById('pass').value;
            if(pass === '771232690' && user.trim() !== "") {
                currentUser = user;
                document.getElementById('lock').style.display='none';
                document.getElementById('main').classList.remove('hidden');
                init();
            } else { alert("تأكد من الاسم والرمز!"); }
        }

        function init() {
            loadChart();
            setInterval(syncData, 2000);
            updatePrices();
            setInterval(updatePrices, 5000);
        }

        async function syncData() {
            const res = await fetch('/api/data');
            const data = await res.json();
            
            // تحديث سجل الأنشطة
            const log = document.getElementById('activity-log');
            log.innerHTML = data.activities.map(a => `
                <div class="activity-item">
                    <span class="gold-glow font-bold">${a.user}</span>: ${a.action} <br>
                    <span class="text-[8px] opacity-50">${a.time}</span>
                </div>
            `).join('');

            // تحديث قائمة البوتات مع خيار الحذف
            const botsDiv = document.getElementById('active-bots');
            botsDiv.innerHTML = data.bots.map(b => `
                <div class="flex justify-between items-center bg-white/5 p-2 rounded">
                    <span>${b.name}</span>
                    <button onclick="requestDeleteBot(${b.id})" class="text-red-500 hover:scale-110">✖</button>
                </div>
            `).join('');
        }

        async function linkBot() {
            const name = document.getElementById('bot-n').value;
            const token = document.getElementById('bot-t').value;
            const chatid = document.getElementById('bot-c').value;
            const password = document.getElementById('bot-p').value;

            if(!name || !password) return alert("الاسم وكلمة السر ضروريان للحماية!");

            await fetch('/api/bots', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, token, chatid, password })
            });
            alert("تم الحماية والربط!");
        }

        async function requestDeleteBot(id) {
            const pass = prompt("أدخل كلمة سر الحماية لهذا البوت لحذفه:");
            if(!pass) return;

            const res = await fetch('/api/bots/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id, password: pass })
            });

            if(res.ok) alert("تم الحذف"); else alert("خطأ: كلمة السر غير صحيحة!");
        }

        async function updatePrices() {
            const r = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
            const d = await r.json();
            allPrices['GOLD'] = parseFloat(d.price);
            document.getElementById('live-price').innerText = "$" + allPrices['GOLD'].toLocaleString();
        }

        function loadChart() {
            new TradingView.widget({
                "width": "100%", "height": "100%", "symbol": currentAsset.symbol,
                "interval": "15", "theme": "dark", "container_id": "chart-container",
                "locale": "ar", "style": "1"
            });
        }

        async function placeOrder(side) {
            const amount = document.getElementById('trade-amount').value;
            if(!amount) return;
            await fetch('/api/trade', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    asset: currentAsset.name,
                    side,
                    amount,
                    entryPrice: allPrices[currentAsset.name],
                    userName: currentUser
                })
            });
            alert("تم إرسال الأمر للمنظومة");
        }
    </script>
</body>
</html>
