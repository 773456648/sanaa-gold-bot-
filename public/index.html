<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEIBA CLOUD | المنظومة السحابية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, query, addDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // إعدادات البيئة
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'heiba-ultimate-app';
        
        // تهيئة فيربيز
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // متغيرات الحالة
        let currentUser = null;
        let livePrices = { GOLD: 0, BTC: 0, ETH: 0 };
        const MASTER_KEY = "771232690";

        // 1. الدخول والمصادقة (قاعدة رقم 3)
        async function initAuth() {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        document.getElementById('auth-status').innerText = "متصل بالسيرفر";
                        startRealtimeSync();
                    }
                });
            } catch (error) {
                console.error("Auth Error", error);
            }
        }

        // 2. المزامنة اللحظية (تظهر عند الجميع)
        function startRealtimeSync() {
            if (!currentUser) return;

            // مزامنة البوتات
            const botsRef = collection(db, 'artifacts', appId, 'public', 'data', 'bots');
            onSnapshot(botsRef, (snapshot) => {
                const bots = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderBots(bots);
            }, (err) => console.error("Bots Sync Error", err));

            // مزامنة الصفقات المشتركة
            const tradesRef = collection(db, 'artifacts', appId, 'public', 'data', 'trades');
            onSnapshot(tradesRef, (snapshot) => {
                const trades = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTrades(trades);
            }, (err) => console.error("Trades Sync Error", err));
        }

        // 3. الوظائف الأساسية (إضافة بوت)
        window.registerBot = async () => {
            const name = document.getElementById('bot-name').value;
            const token = document.getElementById('bot-token').value;
            const chatid = document.getElementById('bot-chatid').value;

            if (!name || !token || !chatid) return alert("أكمل البيانات!");

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'bots'), {
                    name, token, chatid, createdAt: Date.now()
                });
                alert("تم الحفظ في السيرفر بنجاح!");
                // إرسال رسالة ترحيب عبر تليجرام
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatid}&text=🚀 تم تفعيل منظومة الهيبة السحابية! ستصلك التنبيهات هنا طوال فترة اتصال المنصة.`);
            } catch (e) { alert("خطأ في السيرفر"); }
        };

        // 4. حذف بوت (بكلمة سر)
        window.deleteBot = async (id) => {
            const pass = prompt("أدخل كلمة سر الإدارة للحذف من السيرفر:");
            if (pass === MASTER_KEY) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bots', id));
            } else {
                alert("غير مصرح لك!");
            }
        };

        // 5. تنفيذ صفقة (تظهر للكل)
        window.executeTrade = async () => {
            const asset = document.getElementById('trade-asset').value;
            const amount = document.getElementById('trade-amount').value;
            if (!amount) return;

            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'trades'), {
                asset, amount, entryPrice: livePrices[asset], owner: "القيادة العامة", status: "نشطة"
            });
        };

        // 6. الرصد المباشر للأسعار
        setInterval(async () => {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price');
                const data = await res.json();
                const pairs = {'PAXGUSDT': 'GOLD', 'BTCUSDT': 'BTC', 'ETHUSDT': 'ETH'};
                data.forEach(item => {
                    if(pairs[item.symbol]) livePrices[pairs[item.symbol]] = parseFloat(item.price);
                });
                document.getElementById('price-gold').innerText = livePrices.GOLD.toFixed(2);
                document.getElementById('price-btc').innerText = livePrices.BTC.toLocaleString();
            } catch(e) {}
        }, 3000);

        // الدوال المساعدة للرسم (Render)
        function renderBots(bots) {
            const list = document.getElementById('bots-list');
            list.innerHTML = bots.map(b => `
                <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/5 group">
                    <div>
                        <div class="text-[11px] font-bold gold-text">${b.name}</div>
                        <div class="text-[8px] text-gray-500">${b.chatid}</div>
                    </div>
                    <button onclick="deleteBot('${b.id}')" class="text-red-500 text-[10px] opacity-0 group-hover:opacity-100">حذف</button>
                </div>
            `).join('');
        }

        function renderTrades(trades) {
            const list = document.getElementById('trades-list');
            list.innerHTML = trades.map(t => {
                const current = livePrices[t.asset] || t.entryPrice;
                const pnl = ((current - t.entryPrice) / t.entryPrice) * t.amount;
                return `
                    <div class="p-3 bg-black/40 rounded-xl border border-white/5 mb-2">
                        <div class="flex justify-between text-[10px] mb-1">
                            <span class="text-white font-bold">${t.asset}</span>
                            <span class="${pnl >=0 ? 'text-green-500' : 'text-red-500'} font-mono">PnL: ${pnl.toFixed(2)}$</span>
                        </div>
                        <div class="text-[8px] text-gray-500">سعر الدخول: $${t.entryPrice}</div>
                    </div>
                `;
            }).join('');
        }

        window.checkAccess = () => {
            if(document.getElementById('master-pass').value === MASTER_KEY) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                initAuth();
                // تشغيل الشارت
                new TradingView.widget({
                    "width": "100%", "height": "400", "symbol": "OANDA:XAUUSD",
                    "interval": "60", "theme": "dark", "container_id": "chart_div"
                });
            } else { alert("خطأ!"); }
        };
    </script>

    <style>
        :root { --gold: #d4af37; --bg: #050508; }
        body { background: var(--bg); color: #e5e7eb; font-family: 'Changa', sans-serif; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .gold-text { color: var(--gold); }
        .panel { background: rgba(15, 17, 26, 0.98); border: 1px solid rgba(212, 175, 55, 0.1); border-radius: 20px; }
        .btn-gold { background: linear-gradient(135deg, #d4af37, #b8860b); color: #000; font-weight: bold; }
        .input-dark { background: #000; border: 1px solid #222; border-radius: 10px; padding: 10px; color: var(--gold); outline: none; width: 100%; font-size: 12px; }
    </style>
</head>
<body class="p-4">

    <!-- شاشة القفل -->
    <div id="lock-screen" class="fixed inset-0 z-[1000] bg-black flex items-center justify-center">
        <div class="panel p-10 max-w-sm w-full text-center">
            <h2 class="text-2xl font-black gold-text mb-6 orbitron">HEIBA CLOUD ACCESS</h2>
            <input type="password" id="master-pass" class="input-dark text-center text-2xl mb-6" placeholder="••••••••">
            <button onclick="checkAccess()" class="w-full btn-gold py-3 rounded-xl">دخول السيرفر</button>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="main-app" class="hidden max-w-7xl mx-auto">
        
        <header class="flex justify-between items-center mb-8 bg-white/5 p-4 rounded-2xl border border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gold/10 rounded-lg flex items-center justify-center text-gold font-bold">H</div>
                <h1 class="text-xl font-bold orbitron">HEIBA <span class="gold-text">ELITE</span></h1>
            </div>
            <div id="auth-status" class="text-[10px] text-green-500 font-bold uppercase tracking-widest animate-pulse">جاري الاتصال بالسيرفر..</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- لوحة التحكم الجانبية -->
            <div class="lg:col-span-3 space-y-6">
                <div class="panel p-5">
                    <h3 class="text-sm font-bold gold-text mb-4">🤖 إضافة بوت للسيرفر</h3>
                    <div class="space-y-3">
                        <input type="text" id="bot-name" class="input-dark" placeholder="اسم المشترك">
                        <input type="text" id="bot-token" class="input-dark" placeholder="Bot Token">
                        <input type="text" id="bot-chatid" class="input-dark" placeholder="Chat ID">
                        <button onclick="registerBot()" class="w-full btn-gold py-2 rounded-lg text-xs">حفظ في السيرفر</button>
                    </div>
                </div>

                <div class="panel p-5">
                    <h3 class="text-sm font-bold mb-4">👥 المشتركين (Live)</h3>
                    <div id="bots-list" class="space-y-2 max-h-[200px] overflow-y-auto"></div>
                </div>
            </div>

            <!-- مركز التحليل والصفقات -->
            <div class="lg:col-span-6 space-y-6">
                <div id="chart_div" class="panel overflow-hidden h-[400px]"></div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="panel p-5">
                        <h3 class="text-xs font-bold text-green-500 mb-3 uppercase">تنفيذ صفقة عامة</h3>
                        <select id="trade-asset" class="input-dark mb-2">
                            <option value="GOLD">الذهب</option>
                            <option value="BTC">البيتكوين</option>
                        </select>
                        <input type="number" id="trade-amount" class="input-dark mb-2" placeholder="المبلغ ($)">
                        <button onclick="executeTrade()" class="w-full bg-green-600 text-white py-2 rounded-lg text-xs font-bold">فتح صفقة حقيقية</button>
                    </div>
                    <div class="panel p-5 overflow-hidden">
                        <h3 class="text-xs font-bold text-blue-500 mb-3 uppercase">الصفقات الحية</h3>
                        <div id="trades-list" class="max-h-[150px] overflow-y-auto"></div>
                    </div>
                </div>
            </div>

            <!-- الرادار والأسعار -->
            <div class="lg:col-span-3 space-y-6">
                <div class="panel p-5 border-b-4 border-gold">
                    <h3 class="text-xs font-bold text-gray-500 mb-4 uppercase">رادار الأسعار (Realtime)</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-gray-400 italic">XAU/USD:</span>
                            <span id="price-gold" class="text-xl font-bold orbitron gold-text">----.--</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-gray-400 italic">BTC/USDT:</span>
                            <span id="price-btc" class="text-xl font-bold orbitron text-white">--,---</span>
                        </div>
                    </div>
                </div>

                <div class="bg-yellow-500/5 p-4 rounded-2xl border border-yellow-500/10 text-center">
                    <p class="text-[10px] text-gray-500 leading-relaxed">
                        ⚠️ هذه المنظومة مربوطة بسيرفر مركزي. أي تغيير هنا يظهر فوراً عند جميع المستخدمين حول العالم.
                    </p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
