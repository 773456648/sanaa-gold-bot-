<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار القناص - نسخة فادي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Changa', sans-serif; }
        .radar-screen { position: relative; width: 300px; height: 300px; border: 3px solid #004400; border-radius: 50%; margin: 20px auto; background: repeating-radial-gradient(circle, #001100 0, #001100 20px, #002200 21px); overflow: hidden; box-shadow: 0 0 30px rgba(0, 255, 0, 0.1); }
        .sweep { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent 70%, rgba(0, 255, 0, 0.3) 100%); transform-origin: 0 0; animation: rotate 4s linear infinite; margin-top: -50%; margin-left: -50%; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .arrow { position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 30px solid #ff0000; transform-origin: 50% 100%; margin-top: -45px; margin-left: -15px; filter: drop-shadow(0 0 10px red); display: none; }
        .zero-locked { animation: blink 0.3s infinite; color: #fff !important; background: #ff0000 !important; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="p-4">

    <div id="login-box" class="max-w-sm mx-auto mt-10 p-6 border-2 border-green-900 rounded-3xl bg-black">
        <h2 class="text-3xl font-black text-center mb-6 italic tracking-tighter">LOGIN SYSTEM</h2>
        <input id="user" type="text" placeholder="اسم المستخدم" class="w-full bg-zinc-900 border border-green-800 p-4 rounded-xl mb-4 text-green-400 outline-none">
        <input id="pass" type="password" placeholder="كلمة المرور" class="w-full bg-zinc-900 border border-green-800 p-4 rounded-xl mb-6 text-green-400">
        <button onclick="doLogin()" class="w-full bg-green-700 text-black font-extrabold p-4 rounded-xl hover:bg-green-500 transition">دخول النظام</button>
    </div>

    <div id="main-radar" class="hidden max-w-sm mx-auto text-center">
        <div class="flex justify-between text-[10px] mb-2 px-4 uppercase opacity-50">
            <span id="user-tag"></span>
            <span>Accuracy: <span id="gps-acc">--</span></span>
        </div>

        <div class="radar-screen" id="radar-ui">
            <div class="sweep"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-white rounded-full z-50"></div>
            <div id="target-arrow" class="arrow"></div>
        </div>

        <div class="p-4 bg-zinc-900/50 rounded-3xl border border-green-900/50 mb-4">
            <div class="text-xs opacity-50 mb-1">المسافة للهدف (بالمتر)</div>
            <div id="dist-text" class="text-6xl font-black tracking-tighter italic">--</div>
        </div>

        <button onclick="setMine()" class="w-full bg-red-900 text-red-200 border-2 border-red-600 p-5 rounded-2xl font-black text-xl mb-4 active:scale-95 transition">
            💣 رصد "اللغم" في موقعي
        </button>

        <button onclick="initCompass()" class="text-[10px] border border-green-900 px-6 py-2 rounded-full opacity-50">تشغيل الحساسات 🧭</button>
        <button onclick="location.reload()" class="block mx-auto mt-6 text-xs text-red-500">خروج</button>
    </div>

    <script>
        let currUser = "";
        let myPos = null;
        let targetPos = null;
        let heading = 0;

        function doLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(!u || !p) return;
            currUser = u;
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('main-radar').style.display = 'block';
            document.getElementById('user-tag').innerText = "USER: " + u;
            
            // تحميل آخر لغم للمستخدم
            const saved = localStorage.getItem('mine_' + u);
            if(saved) targetPos = JSON.parse(saved);
            
            startTracking();
        }

        function initCompass() {
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(s => {
                        if(s === 'granted') window.addEventListener('deviceorientation', e => heading = e.webkitCompassHeading || (360 - e.alpha));
                    });
                } else {
                    window.addEventListener('deviceorientationabsolute', e => heading = 360 - e.alpha);
                }
            }
        }

        function startTracking() {
            navigator.geolocation.watchPosition(pos => {
                myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                document.getElementById('gps-acc').innerText = "+/-" + pos.coords.accuracy.toFixed(1) + "m";
                updateUI();
            }, null, { enableHighAccuracy: true, maximumAge: 0 });
        }

        function setMine() {
            if(!myPos) return;
            targetPos = { ...myPos };
            localStorage.setItem('mine_' + currUser, JSON.stringify(targetPos));
            alert("تم زراعة الإحداثية بدقة! ارجع لها وشف الدقة.");
        }

        function updateUI() {
            if(!myPos || !targetPos) return;

            const d = calcDist(myPos.lat, myPos.lng, targetPos.lat, targetPos.lng) * 1000;
            const distElement = document.getElementById('dist-text');
            distElement.innerText = d.toFixed(2);

            // توجيه السهم
            const bear = calcBear(myPos.lat, myPos.lng, targetPos.lat, targetPos.lng);
            const relBear = (bear - heading + 360) % 360;
            const arrow = document.getElementById('target-arrow');
            arrow.style.display = 'block';
            arrow.style.transform = `rotate(${relBear}deg)`;

            // حالة "الصفر" (أقل من نصف متر)
            if(d <= 0.5) {
                distElement.innerText = "0.00";
                distElement.parentElement.classList.add('zero-locked');
                if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
            } else {
                distElement.parentElement.classList.remove('zero-locked');
            }
        }

        function calcDist(l1, n1, l2, n2) {
            const R = 6371;
            const dL = (l2-l1)*Math.PI/180;
            const dN = (n2-n1)*Math.PI/180;
            const a = Math.sin(dL/2)**2 + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dN/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function calcBear(l1, n1, l2, n2) {
            const y = Math.sin((n2-n1)*Math.PI/180)*Math.cos(l2*Math.PI/180);
            const x = Math.cos(l1*Math.PI/180)*Math.sin(l2*Math.PI/180)-Math.sin(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.cos((n2-n1)*Math.PI/180);
            return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
        }
    </script>
</body>
</html>
