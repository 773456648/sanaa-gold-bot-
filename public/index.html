<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 منظومة فادي برو للعقارات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #e2b714; --bg: #05070a; --glass: rgba(22, 27, 34, 0.9); --border: #30363d; --success: #238636; --danger: #da3633; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #e6edf3; font-family: 'Segoe UI', sans-serif; }
        header { background: var(--glass); backdrop-filter: blur(10px); padding: 15px 5%; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--gold); }
        .search-container { padding: 20px 5%; background: #0d1117; border-bottom: 1px solid var(--border); }
        .search-box { width: 100%; max-width: 600px; margin: 0 auto; position: relative; }
        .search-box input { width: 100%; padding: 15px 45px 15px 15px; background: #000; border: 1px solid var(--gold); border-radius: 30px; color: #fff; }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); }
        .filters { display: flex; justify-content: center; gap: 10px; padding: 15px; flex-wrap: wrap; }
        .filter-btn { background: var(--glass); border: 1px solid var(--border); color: #fff; padding: 8px 18px; border-radius: 20px; cursor: pointer; }
        .filter-btn.active { background: var(--gold); color: #000; font-weight: bold; }
        .container { padding: 20px 5% 100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--glass); border-radius: 15px; border: 1px solid var(--border); overflow: hidden; position: relative; }
        .card-body { padding: 20px; }
        .price { font-size: 1.4rem; font-weight: 800; color: var(--gold); }
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .contact-btn { padding: 12px; border-radius: 10px; background: var(--success); color: #fff; text-decoration: none; text-align: center; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .delete-btn { background: transparent; color: #8b949e; border: none; font-size: 0.8rem; cursor: pointer; padding-top: 10px; }
        .fab { position: fixed; bottom: 25px; left: 25px; background: var(--gold); width: 60px; height: 60px; border-radius: 50%; font-size: 1.5rem; color: #000; border: none; cursor: pointer; z-index: 999; }
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-box { background: #161b22; padding: 25px; border-radius: 20px; border: 1px solid var(--gold); width: 100%; max-width: 450px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; }
    </style>
</head>
<body>

<header>
    <div class="logo">💎 فادي برو</div>
    <div style="font-size: 0.8rem; color: var(--gold);">المنظومة العالمية الموحدة</div>
</header>

<div class="search-container">
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="ابحث في كل المحافظات..." onkeyup="searchProps()">
    </div>
</div>

<div class="filters">
    <button class="filter-btn active" onclick="filterData('all', this)">الكل</button>
    <button class="filter-btn" onclick="filterData('apt', this)">شقق</button>
    <button class="filter-btn" onclick="filterData('land', this)">أراضي</button>
</div>

<div class="container" id="mainGrid"></div>

<button class="fab" onclick="showModal()"><i class="fas fa-plus"></i></button>

<div id="modal">
    <div class="modal-box">
        <h3 style="text-align:center; color:var(--gold); margin-bottom:15px;">إضافة عرض للسوق</h3>
        <input type="text" id="pOwner" placeholder="اسم المعلن">
        <input type="number" id="pPhone" placeholder="رقم الواتساب">
        <input type="text" id="pTitle" placeholder="الموقع / النوع">
        <input type="text" id="pPrice" placeholder="السعر">
        <input type="text" id="pSpace" placeholder="المساحة">
        <select id="pCat">
            <option value="apt">شقة</option>
            <option value="land">أرضية</option>
        </select>
        <input type="password" id="pPass" placeholder="كلمة سر الحذف (خاصة بك)" style="border-color: var(--danger);">
        <button onclick="publish()" style="width:100%; padding:15px; background:var(--gold); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">نشر للجميع الآن 🚀</button>
        <button onclick="hideModal()" style="width:100%; background:none; border:none; color:gray; margin-top:10px; cursor:pointer;">إلغاء</button>
    </div>
</div>

<script>
    let allProps = [];

    async function loadData() {
        try {
            const res = await fetch('/api/properties');
            allProps = await res.json();
            render(allProps);
        } catch (e) { console.error("فشل الاتصال بالسيرفر"); }
    }

    function render(data) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = data.map(p => `
            <div class="card">
                <div class="card-body">
                    <span style="color:var(--gold); font-size:0.8rem;">👤 ${p.owner}</span>
                    <h3 style="margin: 10px 0;">${p.title}</h3>
                    <div class="price">${p.price}</div>
                    <p style="color:#8b949e; font-size:0.9rem;">المساحة: ${p.space}</p>
                    <div class="btn-group">
                        <a href="https://wa.me/967${p.phone}" class="contact-btn"><i class="fab fa-whatsapp"></i> تواصل</a>
                        <button onclick="deleteProp('${p.id}')" class="delete-btn"><i class="fas fa-lock"></i> حذف الإعلان</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function publish() {
        const prop = {
            owner: document.getElementById('pOwner').value,
            phone: document.getElementById('pPhone').value,
            title: document.getElementById('pTitle').value,
            price: document.getElementById('pPrice').value,
            space: document.getElementById('pSpace').value,
            category: document.getElementById('pCat').value,
            password: document.getElementById('pPass').value
        };
        if(!prop.title || !prop.password) return alert("أدخل العنوان وكلمة السر!");

        await fetch('/api/properties', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(prop)
        });
        hideModal();
        loadData();
    }

    async function deleteProp(id) {
        const password = prompt("أدخل كلمة سر الحذف:");
        if(!password) return;

        const res = await fetch('/api/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id, password })
        });

        const result = await res.json();
        if(result.success) {
            alert("تم الحذف بنجاح");
            loadData();
        } else {
            alert("كلمة السر غلط يا خبير!");
        }
    }

    function searchProps() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        render(allProps.filter(p => p.title.toLowerCase().includes(term) || p.owner.toLowerCase().includes(term)));
    }

    function filterData(cat, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(cat === 'all' ? allProps : allProps.filter(p => p.category === cat));
    }

    function showModal() { document.getElementById('modal').style.display = 'flex'; }
    function hideModal() { document.getElementById('modal').style.display = 'none'; }

    setInterval(loadData, 5000); // تحديث تلقائي كل 5 ثواني
    window.onload = loadData;
</script>
</body>
</html>
