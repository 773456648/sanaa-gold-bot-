<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEIBA AI | المنظومة الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0f; }
        body { background: var(--bg); color: #fff; font-family: 'Changa', sans-serif; margin:0; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(20, 20, 30, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 12px; }
        .gold-glow { color: #f1d279; text-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
        .input-heiba { background: #000; border: 1px solid #d4af37; border-radius: 8px; color: #fff; text-align: center; outline: none; }
        .btn-trade { transition: 0.2s; font-weight: 900; }
        .btn-trade:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-2 md:p-4">

    <div id="lock" class="fixed inset-0 z-[100] bg-black flex items-center justify-center p-6 text-center">
        <div class="glass p-10 w-full max-w-sm">
            <h2 class="gold-glow orbitron text-3xl mb-6 font-black italic">HEIBA</h2>
            <input type="password" id="pass" class="input-heiba w-full p-4 mb-4 text-xl" placeholder="كلمة السر">
            <button onclick="unlock()" class="w-full bg-[#d4af37] text-black py-4 rounded-xl font-bold text-lg">دخول المنظومة</button>
        </div>
    </div>

    <div id="main" class="hidden">
        <header class="flex justify-between items-center mb-4 glass p-4 border-r-4 border-gold">
            <div>
                <h1 class="text-xl font-black orbitron gold-glow">HEIBA <span class="text-white">AI</span></h1>
                <p class="text-[9px] text-green-500 uppercase font-bold">Trading Intelligence System</p>
            </div>
            <div class="text-left">
                <div id="demo-balance" class="text-2xl font-black orbitron text-white">$0.00</div>
                <div class="text-[9px] text-gray-500">الرصيد التجريبي (المنظومة)</div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <div class="lg:col-span-8 space-y-4">
                <div class="glass h-[400px] overflow-hidden" id="chart-container"></div>
                
                <div class="glass p-5 flex flex-col md:flex-row gap-4 items-center">
                    <div class="w-full md:w-1/3">
                        <span class="text-[10px] text-gray-500 block mb-1">حدد مبلغ الصفقة ($)</span>
                        <input id="trade-amount" type="number" class="input-heiba w-full p-3 text-lg font-bold" value="100">
                    </div>
                    <div class="flex w-full gap-3">
                        <button onclick="placeOrder('BUY')" class="btn-trade flex-1 bg-green-600 py-4 rounded-xl text-xl">BUY / شراء</button>
                        <button onclick="placeOrder('SELL')" class="btn-trade flex-1 bg-red-600 py-4 rounded-xl text-xl">SELL / بيع</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4 space-y-4">
                <div class="glass p-4 min-h-[150px]">
                    <h3 class="text-xs gold-glow mb-4 uppercase font-bold">📊 الصفقات النشطة</h3>
                    <div id="trades-list" class="space-y-3"></div>
                </div>

                <div class="glass p-4">
                    <h3 class="text-xs text-green-500 mb-3 uppercase font-bold">🤖 مستشار الذكاء (AI)</h3>
                    <div id="chat-box" class="h-48 overflow-y-auto mb-3 text-[11px] space-y-2 p-2 bg-black/30 rounded border border-white/5">
                        <div class="text-gray-400">مرحباً قائد! اسألني عن الذهب أو السوق وسأحلل لك فوراً.</div>
                    </div>
                    <div class="flex gap-1">
                        <input id="ai-input" class="input-heiba flex-1 p-2 text-xs" placeholder="اسأل الذكاء...">
                        <button onclick="askAI()" class="bg-gold text-black px-3 rounded font-bold text-xs">ارسل</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAsset = { symbol: 'OANDA:XAUUSD', name: 'GOLD' };
        let livePrice = 0;

        function unlock() {
            if(document.getElementById('pass').value === '771232690') {
                document.getElementById('lock').style.display='none';
                document.getElementById('main').classList.remove('hidden');
                init();
            } else { alert("خطأ!"); }
        }

        function init() {
            loadChart();
            setInterval(updatePrice, 2000);
            fetchData();
            setInterval(fetchData, 4000);
        }

        function loadChart() {
            new TradingView.widget({
                "container_id": "chart-container", "width": "100%", "height": "100%",
                "symbol": currentAsset.symbol, "interval": "15", "theme": "dark", "style": "1", "locale": "ar"
            });
        }

        async function updatePrice() {
            try {
                const r = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
                const d = await r.json();
                livePrice = parseFloat(d.price);
            } catch(e){}
        }

        async function fetchData() {
            const r = await fetch('/api/data');
            const data = await r.json();
            document.getElementById('demo-balance').innerText = "$" + data.balance.toLocaleString(undefined, {minimumFractionDigits: 2});
            renderTrades(data.trades);
        }

        function renderTrades(trades) {
            const list = document.getElementById('trades-list');
            if(!trades || trades.length === 0) { list.innerHTML = "<p class='text-center text-gray-600 text-xs'>لا صفقات مفتوحة</p>"; return; }
            list.innerHTML = trades.map(t => {
                const diff = livePrice - t.entryPrice;
                const pnl = t.side === 'BUY' ? (diff * t.amount / t.entryPrice) : (-diff * t.amount / t.entryPrice);
                return `
                <div class="p-3 bg-white/5 rounded-lg border-l-4 ${pnl>=0?'border-green-500':'border-red-500'}">
                    <div class="flex justify-between font-black text-xs">
                        <span>${t.side} ${t.asset}</span>
                        <span class="${pnl>=0?'text-green-500':'text-red-500'}">${pnl.toFixed(2)}$</span>
                    </div>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-[9px] text-gray-500">الدخول: ${t.entryPrice}</span>
                        <button onclick="closeTrade(${t.id})" class="bg-white/10 px-2 py-1 rounded text-[9px] hover:bg-white/20">إغلاق</button>
                    </div>
                </div>`;
            }).reverse().join('');
        }

        async function placeOrder(side) {
            const amount = document.getElementById('trade-amount').value;
            await fetch('/api/trade', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ asset: currentAsset.name, side, amount: parseFloat(amount), entryPrice: livePrice })
            });
            fetchData();
        }

        async function closeTrade(id) {
            await fetch('/api/close-trade', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id, currentPrice: livePrice })
            });
            fetchData();
        }

        async function askAI() {
            const inp = document.getElementById('ai-input');
            const chat = document.getElementById('chat-box');
            if(!inp.value) return;
            
            chat.innerHTML += `<div class="text-gold text-right font-bold">أنت: ${inp.value}</div>`;
            const r = await fetch('/api/ai-chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ question: inp.value, price: livePrice, asset: currentAsset.name })
            });
            const d = await r.json();
            chat.innerHTML += `<div class="text-white bg-white/5 p-1 rounded">🤖: ${d.answer}</div>`;
            inp.value = '';
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
