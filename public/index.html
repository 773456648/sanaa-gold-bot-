<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منظومة فادي للاتصال بالمودم</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        .box { border: 2px solid #7289da; padding: 20px; border-radius: 15px; display: inline-block; }
        input { padding: 10px; font-size: 18px; border-radius: 5px; border: none; width: 200px; text-align: center; }
        button { padding: 10px 20px; font-size: 18px; background: #43b581; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        #status { margin-top: 20px; color: #faa61a; }
    </style>
</head>
<body>

    <div class="box">
        <h2>📞 منظومة فادي للاتصال</h2>
        <p>عبر مودم Huawei B535</p>
        <input type="text" id="phoneNum" placeholder="ادخل الرقم هنا">
        <br>
        <button onclick="makeCall()">اتصال الآن (بالرصيد)</button>
        <div id="status">جاهز للاتصال...</div>
    </div>

    <script>
        async function makeCall() {
            const num = document.getElementById('phoneNum').value;
            const status = document.getElementById('status');
            const modemIp = "192.168.8.1";

            if(!num) { alert("اكتب الرقم أولاً!"); return; }

            status.innerHTML = "جاري طلب الإذن من المودم...";

            try {
                // الخطوة 1: جلب التوكن (Token) لفك حماية هواوي
                let sessionRes = await fetch(`http://${modemIp}/api/webserver/SesTokInfo`);
                let sessionData = await sessionRes.text();
                let parser = new DOMParser();
                let xmlDoc = parser.parseFromString(sessionData, "text/xml");
                let token = xmlDoc.getElementsByTagName("TokInfo")[0].textContent;

                status.innerHTML = "تم الحصول على التصريح.. جاري طلب الرقم " + num;

                // الخطوة 2: إرسال أمر الاتصال الصوتي (Voice Call)
                let callXml = `<?xml version="1.0" encoding="UTF-8"?><request><phonenumber>${num}</phonenumber></request>`;

                let response = await fetch(`http://${modemIp}/api/voice/call`, {
                    method: 'POST',
                    headers: {
                        '__RequestVerificationToken': token,
                        'Content-Type': 'application/xml'
                    },
                    body: callXml
                });

                if(response.ok) {
                    status.innerHTML = "✅ جاري الاتصال الآن.. ارفع سماعة التلفون أو الميكروفون!";
                } else {
                    status.innerHTML = "❌ المودم رفض الطلب (تأكد من وجود رصيد وصلاحية الشريحة)";
                }

            } catch (err) {
                status.innerHTML = "⚠️ خطأ: تأكد أنك متصل بواي فاي المودم 192.168.8.1";
                console.error(err);
            }
        }
    </script>
</body>
</html>
