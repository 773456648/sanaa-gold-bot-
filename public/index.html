<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الهيبة | HEIBA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #060608; color: #f0f0f0; font-family: 'Changa', sans-serif; }
        .gold-text { color: #d4af37; }
        .gold-btn { background: linear-gradient(135deg, #d4af37, #b8860b); color: #000; font-weight: bold; }
        .glass-card { background: rgba(15, 15, 20, 0.98); border: 1px solid #222; border-radius: 28px; }
        input, select { background: #111 !important; border: 1px solid #333 !important; color: #fff; border-radius: 16px; padding: 14px; width: 100%; outline: none; }
        .type-select { border: 2px solid #333; transition: 0.3s; cursor: pointer; border-radius: 16px; }
        .type-select.active { border-color: #d4af37; background: rgba(212, 175, 55, 0.05); }
        .modal-backdrop { background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="p-4">

    <!-- شاشة الدخول -->
    <div id="auth-ui" class="max-w-md mx-auto mt-10 space-y-8">
        <div class="text-center">
            <h1 class="text-6xl font-black gold-text italic">HEIBA</h1>
            <p class="text-[10px] text-gray-500 tracking-[0.3em] uppercase mt-2">Financial Sovereignty</p>
        </div>

        <div class="glass-card p-8 space-y-5">
            <div class="grid grid-cols-2 gap-3">
                <div id="sel-merchant" onclick="setType('merchant')" class="type-select active p-4 text-center text-sm font-bold">تاجر</div>
                <div id="sel-debtor" onclick="setType('debtor')" class="type-select p-4 text-center text-sm font-bold">مواطن</div>
            </div>
            <input id="u-name" type="text" placeholder="الاسم الكامل">
            <input id="u-pass" type="password" placeholder="كلمة المرور">
            <div class="flex items-center gap-2 px-1">
                <input type="checkbox" id="remember-me" class="w-4 h-4 accent-[#d4af37]">
                <label for="remember-me" class="text-xs text-gray-400">تذكرني (دخول تلقائي)</label>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="doAuth('login')" class="bg-zinc-800 py-3 rounded-xl font-bold">دخول</button>
                <button onclick="doAuth('reg')" class="gold-btn py-3 rounded-xl">تسجيل</button>
            </div>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div id="main-ui" class="hidden max-w-4xl mx-auto space-y-4">
        <header class="flex justify-between items-center glass-card p-5">
            <div>
                <h2 id="display-name" class="text-xl font-bold gold-text"></h2>
                <span id="role-tag" class="text-[10px] text-gray-500 uppercase"></span>
            </div>
            <div class="flex gap-2">
                <button onclick="openModal('settings-modal')" class="bg-zinc-900 p-2 rounded-lg">⚙️</button>
                <button onclick="logout()" class="text-red-500 text-xs font-bold">خروج</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- الرصيد والقائمة -->
            <div class="space-y-4">
                <div class="glass-card p-5 space-y-3">
                    <p class="text-[10px] text-gray-500 font-bold uppercase">الرصيد العام</p>
                    <div class="flex justify-between text-blue-400 text-sm font-bold"><span>يمني</span><span id="gt-yer">0</span></div>
                    <div class="flex justify-between text-green-400 text-sm font-bold"><span>دولار</span><span id="gt-usd">0</span></div>
                    <div class="flex justify-between text-orange-400 text-sm font-bold"><span>سعودي</span><span id="gt-sar">0</span></div>
                </div>
                <div class="glass-card p-4 min-h-[300px]">
                    <div id="merchant-tools" class="hidden mb-4"><input id="target-search" class="text-xs" placeholder="أضف مواطن..." onchange="addTarget()"></div>
                    <div id="main-list" class="space-y-2"></div>
                </div>
            </div>
            <!-- التفاصيل -->
            <div class="md:col-span-2">
                <div id="details-pane" class="hidden glass-card p-6 min-h-[450px] flex flex-col">
                    <h3 id="active-target-name" class="text-xl font-bold gold-text mb-4 border-b border-white/5 pb-2"></h3>
                    <div id="ops-list" class="flex-grow space-y-2 overflow-y-auto mb-4"></div>
                    <div id="add-form" class="hidden grid grid-cols-2 gap-2">
                        <input id="op-amt" type="number" placeholder="المبلغ" class="text-xs">
                        <select id="op-cur" class="text-xs"><option value="YER">يمني</option><option value="USD">دولار</option><option value="SAR">سعودي</option></select>
                        <select id="op-type" class="text-xs"><option value="دين">دين</option><option value="سداد">سداد</option></select>
                        <button onclick="saveOp()" class="gold-btn rounded-xl text-xs">حفظ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة الإعدادات (تغيير كلمة السر) -->
    <div id="settings-modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center z-50 p-4">
        <div class="glass-card w-full max-w-sm p-6 space-y-5">
            <h3 class="font-bold gold-text">تغيير كلمة السر</h3>
            <input id="new-pass" type="password" placeholder="كلمة السر الجديدة">
            <input id="confirm-pass" type="password" placeholder="تأكيد كلمة السر">
            <div class="flex gap-2">
                <button onclick="updatePassword()" class="gold-btn flex-grow py-3 rounded-xl">تحديث</button>
                <button onclick="closeModal('settings-modal')" class="bg-zinc-800 px-4 rounded-xl">إغاء</button>
            </div>
        </div>
    </div>

    <script>
        let user = null;
        let activeTarget = null;
        let userType = 'merchant';
        let discoveredData = [];

        function setType(t) {
            userType = t;
            document.getElementById('sel-merchant').classList.toggle('active', t === 'merchant');
            document.getElementById('sel-debtor').classList.toggle('active', t === 'debtor');
        }

        window.onload = () => {
            const saved = localStorage.getItem('heiba_auth_session');
            if (saved) { user = JSON.parse(saved); start(); }
        };

        async function doAuth(action) {
            const name = document.getElementById('u-name').value;
            const password = document.getElementById('u-pass').value;
            const rememberMe = document.getElementById('remember-me').checked;
            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, password, type: userType, action })
            });
            const data = await res.json();
            if(res.ok) {
                user = data;
                if(rememberMe) localStorage.setItem('heiba_auth_session', JSON.stringify(user));
                start();
            } else alert(data.error);
        }

        function start() {
            document.getElementById('auth-ui').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('display-name').innerText = user.name;
            document.getElementById('role-tag').innerText = user.type === 'merchant' ? '👑 تاجر' : '👤 مواطن';
            if(user.type === 'merchant') {
                document.getElementById('merchant-tools').classList.remove('hidden');
                document.getElementById('add-form').classList.remove('hidden');
                renderList();
            } else { setInterval(fetchAutoDebts, 3000); fetchAutoDebts(); }
            calculateGrand();
        }

        // دالة تغيير كلمة السر المصلحة لترسل البيانات كما يطلبها السيرفر
        async function updatePassword() {
            const p1 = document.getElementById('new-pass').value;
            const p2 = document.getElementById('confirm-pass').value;
            if(!p1 || p1 !== p2) return alert("كلمات المرور غير متطابقة");

            const res = await fetch('/api/update-pass', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: user.id, newPass: p1 })
            });

            if(res.ok) {
                user.password = p1;
                if(localStorage.getItem('heiba_auth_session')) localStorage.setItem('heiba_auth_session', JSON.stringify(user));
                alert("تم تغيير كلمة السر بنجاح وإرسال تقرير لتلجرام.");
                closeModal('settings-modal');
            } else {
                alert("فشل التحديث.. المستخدم غير موجود بالسيرفر.");
            }
        }

        function calculateGrand() {
            let y=0, u=0, s=0;
            user.myRecords.forEach(r => {
                const a = parseFloat(r.amount); const d = r.type === 'دين';
                if(r.currency === 'YER') y+=d?a:-a; else if(r.currency === 'USD') u+=d?a:-a; else s+=d?a:-a;
            });
            document.getElementById('gt-yer').innerText = y;
            document.getElementById('gt-usd').innerText = u;
            document.getElementById('gt-sar').innerText = s;
        }

        function addTarget() {
            const n = document.getElementById('target-search').value;
            if(!n) return; activeTarget = n; showDetails(n); renderList();
            document.getElementById('target-search').value = "";
        }

        function renderList() {
            const t = [...new Set(user.myRecords.map(r => r.targetName))];
            document.getElementById('main-list').innerHTML = t.map(n => `
                <div onclick="showDetails('${n}')" class="p-3 bg-zinc-900 rounded-xl cursor-pointer border ${activeTarget===n?'border-yellow-600':''}">${n}</div>
            `).join('');
        }

        async function fetchAutoDebts() {
            const res = await fetch(`/api/auto-discover?debtorName=${user.name}`);
            discoveredData = await res.json();
            document.getElementById('main-list').innerHTML = discoveredData.map(m => `
                <div onclick="showDetails('${m.merchantName}')" class="p-3 bg-zinc-900 border-l-4 border-blue-500 rounded-xl">${m.merchantName}</div>
            `).join('');
            if(activeTarget) showDetails(activeTarget);
        }

        function showDetails(name) {
            activeTarget = name;
            document.getElementById('details-pane').classList.remove('hidden');
            document.getElementById('active-target-name').innerText = name;
            let records = (user.type === 'merchant') ? user.myRecords.filter(r => r.targetName === name) : (discoveredData.find(m => m.merchantName === name)?.records || []);
            document.getElementById('ops-list').innerHTML = records.map(r => `
                <div class="p-3 bg-black/40 rounded-lg flex justify-between">
                    <span class="text-xs">${r.type} - ${r.currency}</span>
                    <span class="font-bold ${r.type==='دين'?'text-red-500':'text-green-500'}">${r.amount}</span>
                </div>
            `).reverse().join('');
        }

        async function saveOp() {
            const a = document.getElementById('op-amt').value;
            const c = document.getElementById('op-cur').value;
            const t = document.getElementById('op-type').value;
            if(!a || !activeTarget) return;
            user.myRecords.push({ id: Date.now(), targetName: activeTarget, amount: a, currency: c, type: t, date: new Date().toISOString() });
            showDetails(activeTarget); calculateGrand();
            fetch('/api/sync', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId: user.id, myRecords: user.myRecords }) });
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function logout() { localStorage.removeItem('heiba_auth_session'); location.reload(); }
    </script>
</body>
</html>
