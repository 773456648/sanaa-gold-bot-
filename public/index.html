<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار القناص - نظام الطيارة الدروب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Changa', sans-serif; overflow-x: hidden; }
        .radar-box { position: relative; width: 300px; height: 300px; border-radius: 50%; border: 2px solid var(--gold); background: radial-gradient(circle, #101a10 0%, #000 100%); margin: 20px auto; overflow: hidden; box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        .sweep { position: absolute; top: 50%; left: 50%; width: 50%; height: 50%; background: conic-gradient(from 0deg, transparent 80%, rgba(212, 175, 55, 0.4) 100%); transform-origin: 0% 0%; animation: rotate 3s linear infinite; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .center-point { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; background: #3b82f6; border-radius: 50%; box-shadow: 0 0 15px #3b82f6; z-index: 20; }
        .target-blip { position: absolute; width: 14px; height: 14px; background: #ff0000; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px #ff0000; z-index: 10; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; } }
        .target-locked { border-color: #22c55e !important; box-shadow: 0 0 40px #22c55e !important; }
        .nav-arrow { position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 20px solid var(--gold); transform-origin: 50% 100%; margin-top: -40px; margin-left: -10px; z-index: 25; transition: 0.1s; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-md mx-auto space-y-6">
        <div class="text-center">
            <h1 class="text-4xl font-black text-gold tracking-widest italic">SNIPER RADAR</h1>
            <p class="text-[10px] text-gray-500 tracking-[0.5em] uppercase">نظام ملاحقة الإحداثيات بالملي</p>
        </div>

        <div class="radar-box" id="radar-container">
            <div class="sweep"></div>
            <div class="center-point"></div>
            <div id="nav-arrow" class="nav-arrow"></div>
            <div id="blip-container"></div>
        </div>

        <div class="glass-card space-y-4">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <span class="text-gray-400 text-sm">المسافة للهدف:</span>
                <span id="dist-val" class="text-2xl font-black text-gold">--</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-gray-400 text-sm">دقة الجهاز (GPS):</span>
                <span id="acc-val" class="text-green-500 font-bold">--</span>
            </div>
            <button onclick="recordTarget()" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-800 p-4 rounded-xl font-bold text-black shadow-lg active:scale-95 transition">
                📍 تسجيل نقطة "المكنة" الآن
            </button>
            <button onclick="activateCompass()" id="comp-btn" class="w-full bg-blue-900/40 border border-blue-500/50 p-2 rounded-lg text-xs font-bold text-blue-400">
                🧭 تفعيل البوصلة للتوجيه
            </button>
        </div>
    </div>

    <script>
        let myLoc = null;
        let targetLoc = null;
        let heading = 0;

        // تفعيل البوصلة
        function activateCompass() {
            if (DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') window.addEventListener('deviceorientation', e => updateHeading(e));
                });
            } else {
                window.addEventListener('deviceorientationabsolute', e => updateHeading(e));
            }
            document.getElementById('comp-btn').innerText = "البوصلة متصلة ✅";
        }

        function updateHeading(e) {
            heading = e.webkitCompassHeading || (360 - e.alpha);
            updateUI();
        }

        // تسجيل الهدف (النقطة المكنة)
        function recordTarget() {
            navigator.geolocation.getCurrentPosition(pos => {
                targetLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                localStorage.setItem('home_point', JSON.stringify(targetLoc));
                alert("تم تثبيت نقطة المكنة بنجاح! طير وارجع لها.");
            }, null, { enableHighAccuracy: true });
        }

        // مراقبة الحركة بالملي
        navigator.geolocation.watchPosition(pos => {
            myLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            document.getElementById('acc-val').innerText = "+/- " + pos.coords.accuracy.toFixed(1) + " متر";
            updateUI();
        }, null, { enableHighAccuracy: true, maximumAge: 0 });

        function updateUI() {
            if (!myLoc || !targetLoc) return;

            const dist = calcDist(myLoc.lat, myLoc.lng, targetLoc.lat, targetLoc.lng);
            const distMeters = (dist * 1000).toFixed(1);
            document.getElementById('dist-val').innerText = distMeters + " م";

            const bear = calcBear(myLoc.lat, myLoc.lng, targetLoc.lat, targetLoc.lng);
            const relativeBear = (bear - heading + 360) % 360;

            // تحريك السهم
            const arrow = document.getElementById('nav-arrow');
            arrow.style.transform = `rotate(${relativeBear}deg)`;

            // رسم النقطة في الرادار
            const container = document.getElementById('blip-container');
            container.innerHTML = '';
            
            // نطاق الرادار البصري (50 متر)
            if (dist <= 0.05) {
                const distPercent = (dist / 0.05) * 50;
                const rad = relativeBear * (Math.PI / 180);
                const x = 50 + (distPercent * Math.sin(rad));
                const y = 50 - (distPercent * Math.cos(rad));

                const blip = document.createElement('div');
                blip.className = 'target-blip';
                blip.style.left = x + '%';
                blip.style.top = y + '%';
                container.appendChild(blip);
            }

            // إذا وصلت فوقها تماماً (أقل من 1.5 متر)
            const radarBox = document.getElementById('radar-container');
            if (dist <= 0.0015) {
                radarBox.classList.add('target-locked');
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            } else {
                radarBox.classList.remove('target-locked');
            }
        }

        function calcDist(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2-lat1)*Math.PI/180;
            const dLon = (lon2-lon1)*Math.PI/180;
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function calcBear(lat1, lon1, lat2, lon2) {
            const y = Math.sin((lon2-lon1)*Math.PI/180) * Math.cos(lat2*Math.PI/180);
            const x = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180) - Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos((lon2-lon1)*Math.PI/180);
            return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
        }

        // استرجاع النقطة المحفوظة
        const saved = localStorage.getItem('home_point');
        if (saved) targetLoc = JSON.parse(saved);
    </script>
</body>
</html>
