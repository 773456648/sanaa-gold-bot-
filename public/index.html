<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 FADI SYSTEM PRO | منظومة فادي الذهبية</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', system-ui, sans-serif;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        :root {
            --gold: #FFD700;
            --gold-dark: #CCAC00;
            --neon: #00ffff;
            --dark-bg: #0A0C0F;
            --card-bg: #1A1E24;
            --input-bg: #2A2F36;
        }
        
        body {
            background: var(--dark-bg);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
            overflow: hidden; /* لمنع النزول العشوائي */
        }
        
        /* خلفية متحركة */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.05) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }
        
        .header {
            text-align: center;
            padding: 10px;
            background: rgba(26, 30, 36, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 2px solid var(--gold);
            margin-bottom: 15px;
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            flex-shrink: 0;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(45deg, #FFD700, #00ffff, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        
        .role-badge {
            display: inline-block;
            padding: 4px 15px;
            background: linear-gradient(45deg, var(--gold), var(--gold-dark));
            color: black;
            font-weight: bold;
            border-radius: 50px;
            font-size: 14px;
            margin-top: 5px;
        }
        
        /* صندوق التسجيل */
        .setup-box {
            background: var(--card-bg);
            border: 2px solid var(--neon);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            z-index: 10;
            max-width: 400px;
            width: 100%;
            margin: auto;
        }
        
        .setup-box input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 15px;
            color: white;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            outline: none;
        }
        
        .setup-box input:focus { border-color: var(--gold); }
        
        .btn-enter {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--gold), #FFA500);
            border: none;
            border-radius: 15px;
            color: black;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
        
        /* الواجهة الرئيسية للمنظومة */
        #mainWorkspace {
            display: none;
            flex-direction: column;
            flex: 1;
            z-index: 10;
            overflow: hidden;
            gap: 10px;
        }
        
        /* منطقة الفيديو (مخفية بالبداية) */
        #videoArea {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 15px;
            border: 2px solid var(--gold);
            max-height: 30vh;
            overflow-y: auto;
        }
        
        .video-box {
            position: relative;
            background: black;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--input-bg);
        }
        .video-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .video-name {
            position: absolute; bottom: 5px; left: 5px;
            background: rgba(0,0,0,0.7); padding: 2px 8px;
            border-radius: 5px; font-size: 12px; color: var(--gold);
        }
        
        /* منطقة الشات */
        #chat {
            flex: 1;
            background: rgba(26, 30, 36, 0.8);
            border-radius: 20px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 2px solid var(--neon);
        }
        
        .msg {
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 85%;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .msg.me {
            background: linear-gradient(135deg, #1D2A35, #0F1A24);
            align-self: flex-start; border-right: 4px solid var(--neon);
        }
        
        .msg.other {
            background: linear-gradient(135deg, #2A2F36, #1A1F26);
            align-self: flex-end; border-left: 4px solid var(--gold);
        }
        
        .msg.sys {
            background: rgba(255, 215, 0, 0.1);
            align-self: center; border: 1px solid var(--gold);
            color: var(--gold); font-size: 13px; text-align: center;
        }
        
        .msg b { color: var(--gold); font-size: 13px; display: block; margin-bottom: 5px; }
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 5px; }
        .msg a { color: var(--neon); text-decoration: none; font-weight: bold; }
        
        /* شريط الإدخال والأزرار */
        .controls-row {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        
        .controls-row::-webkit-scrollbar { display: none; }
        
        .btn-action {
            background: var(--input-bg);
            border: 1px solid var(--gold);
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            display: flex; align-items: center; gap: 5px;
        }
        .btn-action:hover { background: var(--gold); color: black; }
        .btn-danger { border-color: #ff4444; color: #ff4444; }
        
        .input-row {
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 20px;
            border: 2px solid var(--gold);
            align-items: center;
        }
        
        #msgInput {
            flex: 1;
            padding: 12px;
            background: var(--input-bg);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        
        .btn-send {
            background: linear-gradient(45deg, var(--gold), #FFA500);
            border: none;
            border-radius: 15px;
            padding: 12px 20px;
            color: black;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        
        /* الإشعارات */
        #toastContainer {
            position: fixed; top: 10px; left: 10px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background: var(--card-bg); border-right: 4px solid var(--gold);
            padding: 10px 15px; border-radius: 10px; color: white; font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="toastContainer"></div>
    
    <div class="header">
        <h1>👑 FADI SYSTEM ULTRA 👑</h1>
        <span class="role-badge" id="roleBadge">منتظر الدخول...</span>
    </div>
    
    <!-- واجهة الدخول -->
    <div class="setup-box" id="setup">
        <input type="text" id="userName" placeholder="الاسم الكريم" autocomplete="off">
        <input type="text" id="roomNum" placeholder="رقم الغرفة السري" autocomplete="off">
        <button class="btn-enter" onclick="initFadi()">🚀 ادخل المنظومة</button>
    </div>
    
    <!-- الواجهة الرئيسية -->
    <div id="mainWorkspace">
        
        <!-- الأزرار العلوية -->
        <div class="controls-row">
            <button class="btn-action" onclick="toggleMic()" id="btnMic">🎤 مايك</button>
            <button class="btn-action" onclick="startCall(false)">📞 اتصال صوت</button>
            <button class="btn-action" onclick="startCall(true)">🎥 فيديو</button>
            <button class="btn-action" onclick="shareScreen()">🖥️ شاشة</button>
            <button class="btn-action" onclick="document.getElementById('fileInput').click()">📁 إرسال ملف</button>
            <button class="btn-action btn-danger" onclick="endCall()" id="btnEnd" style="display:none;">🛑 إنهاء</button>
            <input type="file" id="fileInput" style="display:none;" onchange="sendFile(this)">
        </div>

        <div id="videoArea"></div>
        
        <div id="chat"></div>
        
        <div class="input-row">
            <!-- حل مشكلة نزول الكيبورد: التركيز يرجع للمربع بعد الإرسال -->
            <input type="text" id="msgInput" placeholder="اكتب رسالتك..." 
                   onkeypress="if(event.key==='Enter') { event.preventDefault(); sendText(); this.focus(); }">
            <button class="btn-send" onclick="sendText(); document.getElementById('msgInput').focus();">إرسال 🚀</button>
        </div>
    </div>

    <script>
        let peer, myId, myName, roomName;
        let isHost = false;
        let connections = {}; // لحفظ اتصالات الدردشة
        let activeCalls = {}; // لحفظ المكالمات
        let myStream = null;
        let isMicMuted = false;

        const cfg = { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } };

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast'; t.innerText = msg;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function logMsg(htmlContent, type, user = null) {
            const box = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerHTML = type === 'sys' ? `⚡ ${htmlContent}` : `<b>${user}</b>${htmlContent}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // --- تهيئة المنظومة ---
        function initFadi() {
            myName = document.getElementById('userName').value.trim();
            roomName = document.getElementById('roomNum').value.trim();
            
            if(!myName || !roomName) return showToast('❌ اكتب الاسم ورقم الغرفة!');
            
            document.getElementById('setup').style.display = 'none';
            document.getElementById('mainWorkspace').style.display = 'flex';
            showToast('⚡ جاري الاتصال بالمنظومة...');
            
            // محاولة إنشاء الغرفة كالزعيم
            const tempPeer = new Peer(roomName, cfg);
            
            tempPeer.on('open', (id) => {
                peer = tempPeer;
                myId = id;
                isHost = true;
                document.getElementById('roleBadge').textContent = '👑 أنت الزعيم (المضيف)';
                logMsg('المنظومة جاهزة وأنت الزعيم!', 'sys');
                setupHost();
            });

            tempPeer.on('error', (err) => {
                if(err.type === 'unavailable-id') {
                    // الغرفة موجودة، أدخل كعضو
                    isHost = false;
                    document.getElementById('roleBadge').textContent = '👤 عضو في المنظومة';
                    myId = roomName + '-' + Math.floor(Math.random()*9999);
                    peer = new Peer(myId, cfg);
                    
                    peer.on('open', () => {
                        logMsg('✅ دخلت المنظومة بنجاح', 'sys');
                        setupClient();
                    });
                } else {
                    showToast('خطأ: ' + err.type);
                }
            });
        }

        // --- إدارة الزعيم (Host) ---
        function setupHost() {
            peer.on('connection', c => {
                connections[c.peer] = c;
                c.on('open', () => c.send({ type: 'sys', text: 'تم الربط مع الزعيم بنجاح' }));
                
                c.on('data', data => {
                    if(data.type === 'join') {
                        logMsg(`${data.user} انضم للمنظومة`, 'sys');
                        broadcast({type: 'sys', text: `${data.user} انضم للمنظومة`}, c.peer);
                    } else {
                        // عرض الرسالة للزعيم وإعادة إرسالها للباقي
                        handleData(data);
                        broadcast(data, c.peer);
                    }
                });
                
                c.on('close', () => delete connections[c.peer]);
            });
            peer.on('call', answerCall);
        }

        // --- إدارة العضو (Client) ---
        function setupClient() {
            const c = peer.connect(roomName);
            c.on('open', () => {
                connections[roomName] = c;
                c.send({ type: 'join', user: myName });
            });
            c.on('data', handleData);
            peer.on('call', answerCall);
        }

        // --- معالجة البيانات (نصوص وصور وملفات) ---
        function broadcast(data, exclude = null) {
            for(let id in connections) {
                if(id !== exclude) connections[id].send(data);
            }
        }

        function handleData(d) {
            if(d.type === 'sys') logMsg(d.text, 'sys');
            else if(d.type === 'text') logMsg(d.text, 'other', d.user);
            else if(d.type === 'file') {
                if(d.fileType.startsWith('image/')) {
                    logMsg(`<img src="${d.fileData}" alt="صورة">`, 'other', d.user);
                } else {
                    logMsg(`📁 <a href="${d.fileData}" download="${d.fileName}">تحميل ملف: ${d.fileName}</a>`, 'other', d.user);
                }
            }
        }

        function sendText() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if(!text) return;
            
            logMsg(text, 'me', myName);
            const data = { type: 'text', user: myName, text: text };
            
            if(isHost) broadcast(data);
            else if(connections[roomName]) connections[roomName].send(data);
            
            input.value = '';
        }

        // --- إرسال الملفات والصور ---
        function sendFile(input) {
            const file = input.files[0];
            if(!file) return;
            
            // تحويل الملف لـ Base64 عشان يرسله بسهولة
            const reader = new FileReader();
            reader.onload = function(e) {
                const fileData = e.target.result;
                const data = { type: 'file', user: myName, fileName: file.name, fileType: file.type, fileData: fileData };
                
                // عرض عندي
                if(file.type.startsWith('image/')) logMsg(`<img src="${fileData}" alt="صورة">`, 'me', myName);
                else logMsg(`📁 <a href="${fileData}" download="${file.name}">تم إرسال: ${file.name}</a>`, 'me', myName);
                
                // إرسال للباقي
                if(isHost) broadcast(data);
                else if(connections[roomName]) connections[roomName].send(data);
            };
            reader.readAsDataURL(file);
            input.value = ''; // تصفير الحقل
        }

        // --- نظام المكالمات (صوت/فيديو/شاشة) ---
        function addVideo(stream, peerId, label) {
            const area = document.getElementById('videoArea');
            area.style.display = 'grid';
            
            if(document.getElementById('vid_'+peerId)) return; // موجود مسبقا
            
            const box = document.createElement('div');
            box.className = 'video-box';
            box.id = 'vid_'+peerId;
            
            const vid = document.createElement('video');
            vid.srcObject = stream;
            vid.autoplay = true;
            vid.playsInline = true;
            if(peerId === 'me') vid.muted = true; // كتم صوتي أنا عشان الصدى
            
            const nameLbl = document.createElement('div');
            nameLbl.className = 'video-name';
            nameLbl.innerText = label;
            
            box.appendChild(vid);
            box.appendChild(nameLbl);
            area.appendChild(box);
            
            document.getElementById('btnEnd').style.display = 'block';
        }

        async function startCall(isVideo) {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
                addVideo(myStream, 'me', myName + ' (أنت)');
                
                // الاتصال بالكل
                if(isHost) {
                    for(let id in connections) makeCall(id, myStream);
                } else {
                    makeCall(roomName, myStream);
                }
                showToast(isVideo ? '🎥 بدأ بث الفيديو' : '📞 بدأت المكالمة الصوتية');
            } catch(e) { showToast('❌ يرجى إعطاء صلاحية الكاميرا والمايك'); }
        }

        async function shareScreen() {
            try {
                myStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                addVideo(myStream, 'me', myName + ' (شاشتي)');
                
                if(isHost) {
                    for(let id in connections) makeCall(id, myStream);
                } else {
                    makeCall(roomName, myStream);
                }
                showToast('🖥️ جاري مشاركة الشاشة');
                
                myStream.getVideoTracks()[0].onended = endCall; // لما يوقف من المتصفح
            } catch(e) { showToast('❌ تم إلغاء مشاركة الشاشة'); }
        }

        function makeCall(peerId, stream) {
            const call = peer.call(peerId, stream, { metadata: { caller: myName } });
            handleCallEvents(call, peerId);
        }

        function answerCall(call) {
            const callerName = call.metadata ? call.metadata.callerName : 'عضو';
            showToast(`📞 بث وارد من ${callerName}`);
            
            // الرد بدون بث كاميرتي (إلا لو كنت باثث أصلا)
            call.answer(myStream); 
            handleCallEvents(call, call.peer);
        }

        function handleCallEvents(call, peerId) {
            activeCalls[peerId] = call;
            call.on('stream', remoteStream => addVideo(remoteStream, peerId, 'مشارك'));
            call.on('close', () => {
                const v = document.getElementById('vid_'+peerId);
                if(v) v.remove();
                delete activeCalls[peerId];
                if(Object.keys(activeCalls).length === 0) endCall();
            });
        }

        function endCall() {
            if(myStream) myStream.getTracks().forEach(t => t.stop());
            myStream = null;
            
            for(let id in activeCalls) activeCalls[id].close();
            activeCalls = {};
            
            document.getElementById('videoArea').innerHTML = '';
            document.getElementById('videoArea').style.display = 'none';
            document.getElementById('btnEnd').style.display = 'none';
            logMsg('🔴 تم إنهاء البث/المكالمة', 'sys');
        }

        function toggleMic() {
            if(myStream) {
                isMicMuted = !isMicMuted;
                myStream.getAudioTracks().forEach(t => t.enabled = !isMicMuted);
                document.getElementById('btnMic').innerText = isMicMuted ? '🔇 مكتوم' : '🎤 مايك';
                document.getElementById('btnMic').style.borderColor = isMicMuted ? '#ff4444' : 'var(--gold)';
            } else {
                showToast('لازم تبدأ اتصال أولاً عشان تتحكم بالمايك');
            }
        }
    </script>
</body>
</html>
