<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 منظومة فادي برو للعقارات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #e2b714; --bg: #05070a; --glass: rgba(22, 27, 34, 0.9); --border: #30363d; --success: #238636; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #e6edf3; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        header { background: var(--glass); backdrop-filter: blur(10px); padding: 15px 5%; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--gold); }

        .search-container { padding: 20px 5%; background: #0d1117; border-bottom: 1px solid var(--border); }
        .search-box { width: 100%; max-width: 600px; margin: 0 auto; position: relative; }
        .search-box input { width: 100%; padding: 15px 45px 15px 15px; background: #000; border: 1px solid var(--gold); border-radius: 30px; color: #fff; font-size: 1rem; outline: none; }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); }

        .filters { display: flex; justify-content: center; gap: 10px; padding: 15px; flex-wrap: wrap; }
        .filter-btn { background: var(--glass); border: 1px solid var(--border); color: #fff; padding: 8px 18px; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        .filter-btn.active { background: var(--gold); color: #000; font-weight: bold; }

        .container { padding: 20px 5% 100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--glass); border-radius: 15px; border: 1px solid var(--border); overflow: hidden; position: relative; transition: 0.3s; }
        .card:hover { border-color: var(--gold); }
        
        .badge { position: absolute; top: 15px; right: 15px; background: var(--gold); color: #000; padding: 4px 12px; border-radius: 15px; font-weight: bold; font-size: 0.75rem; }
        .delete-icon { position: absolute; top: 15px; left: 15px; color: #444; cursor: pointer; z-index: 10; padding: 5px; }
        .delete-icon:hover { color: #ff4444; }

        .card-body { padding: 20px; }
        .price { font-size: 1.4rem; font-weight: 800; color: var(--gold); margin-bottom: 5px; }
        .owner-info { font-size: 0.85rem; color: var(--gold); margin-bottom: 10px; display: block; }
        .details { background: #0d1117; padding: 12px; border-radius: 8px; margin-bottom: 15px; color: #8b949e; display: flex; justify-content: space-between; }

        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        .contact-btn { padding: 12px; border-radius: 10px; background: var(--success); color: #fff; text-decoration: none; text-align: center; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .dev-btn { padding: 8px; border-radius: 8px; background: transparent; border: 1px dashed var(--gold); color: var(--gold); text-decoration: none; text-align: center; font-size: 0.8rem; }

        .fab { position: fixed; bottom: 25px; left: 25px; background: var(--gold); width: 60px; height: 60px; border-radius: 50%; font-size: 1.5rem; color: #000; border: none; cursor: pointer; z-index: 2001; box-shadow: 0 4px 15px rgba(226,183,20,0.4); }

        #modal, #deleteModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; backdrop-filter: blur(5px); }
        .modal-box { background: #161b22; padding: 25px; border-radius: 20px; border: 1px solid var(--gold); width: 100%; max-width: 450px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; outline: none; font-size: 16px; }
        input:focus { border-color: var(--gold); }
        .primary-btn { width:100%; padding:15px; background:var(--gold); border:none; border-radius:10px; font-weight:bold; cursor:pointer; font-size: 1rem; }
    </style>
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-gem"></i> فادي برو</div>
    <a href="https://wa.me/967779847980" class="dev-btn">تواصل مع المصمم 👤</a>
</header>

<div class="search-container">
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="ابحث عن منطقة، اسم، أو سعر..." oninput="searchProps()">
    </div>
</div>

<div class="filters">
    <button class="filter-btn active" onclick="filterData('all', this)">الكل</button>
    <button class="filter-btn" onclick="filterData('apt', this)">شقق</button>
    <button class="filter-btn" onclick="filterData('land', this)">أراضي</button>
    <button class="filter-btn" onclick="filterData('house', this)">بيوت</button>
</div>

<div class="container" id="mainGrid">
    <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #555;">جاري تحميل العروض...</div>
</div>

<button class="fab" onclick="showModal()"><i class="fas fa-plus"></i></button>

<!-- مودال الإضافة -->
<div id="modal">
    <div class="modal-box">
        <h3 style="text-align:center; color:var(--gold); margin-bottom:15px;">إضافة عرض جديد</h3>
        <input type="text" id="pOwner" placeholder="اسم المعلن">
        <input type="number" id="pPhone" placeholder="رقم التواصل (7XXXXXXXX)">
        <input type="text" id="pTitle" placeholder="اسم العقار أو موقعه">
        <input type="text" id="pPrice" placeholder="السعر">
        <input type="text" id="pSpace" placeholder="المساحة">
        <select id="pCat">
            <option value="apt">شقة</option>
            <option value="land">أرضية</option>
            <option value="house">بيت</option>
        </select>
        <div style="border-top: 1px solid #333; margin: 10px 0; padding-top: 10px;">
            <p style="font-size: 0.7rem; color: var(--gold); margin-bottom: 5px;">رمز حماية للحذف (سري):</p>
            <input type="password" id="pPass" placeholder="أدخل كلمة سر العرض">
        </div>
        <button id="publishBtn" onclick="publish()" class="primary-btn">نشر الآن 🚀</button>
        <button onclick="hideModal()" style="width:100%; background:none; border:none; color:gray; margin-top:10px; cursor:pointer;">إلغاء</button>
    </div>
</div>

<!-- مودال الحذف -->
<div id="deleteModal">
    <div class="modal-box" style="border-color: #ff4444; text-align: center;">
        <h3 style="color:#ff4444; margin-bottom:15px;">تأكيد الحذف</h3>
        <p style="font-size: 0.9rem; margin-bottom: 15px;">أدخل كلمة السر الخاصة بهذا العرض لتمكن من حذفه:</p>
        <input type="password" id="confirmPass" placeholder="كلمة السر">
        <button onclick="confirmDelete()" class="primary-btn" style="background:#ff4444; color:white;">حذف نهائي</button>
        <button onclick="hideDeleteModal()" style="width:100%; background:none; border:none; color:gray; margin-top:10px; cursor:pointer;">إلغاء</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = JSON.parse('__firebase_config');
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'fadi_pro_v3';

    let allProps = [];
    let currentFilter = 'all';
    let targetDeleteId = null;
    let targetDeletePass = null;

    // الدخول والمزامنة
    signInAnonymously(auth).then(() => {
        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'properties'), (snap) => {
            allProps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
        });
    });

    window.render = () => {
        const grid = document.getElementById('mainGrid');
        const term = document.getElementById('searchInput').value.toLowerCase();
        
        const filtered = allProps.filter(p => {
            const matchesSearch = (p.title||"").toLowerCase().includes(term) || (p.owner||"").toLowerCase().includes(term);
            const matchesCat = currentFilter === 'all' || p.category === currentFilter;
            return matchesSearch && matchesCat;
        });

        if(filtered.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #555;">لا توجد عروض حالياً..</div>`;
            return;
        }

        grid.innerHTML = filtered.map(p => `
            <div class="card">
                <i class="fas fa-trash delete-icon" onclick="window.initDelete('${p.id}', '${p.pass}')"></i>
                <div class="badge">${p.category === 'apt' ? 'شقة' : p.category === 'land' ? 'أرض' : 'بيت'}</div>
                <div class="card-body">
                    <span class="owner-info"><i class="fas fa-user"></i> المعلن: ${p.owner}</span>
                    <h3 style="color:#fff; margin-bottom:10px;">${p.title}</h3>
                    <div class="price">${p.price}</div>
                    <div class="details">
                        <span>المساحة: ${p.space}</span>
                    </div>
                    <div class="btn-group">
                        <a href="https://wa.me/967${p.phone}?text=استفسار عن عقار: ${p.title}" target="_blank" class="contact-btn">
                            <i class="fab fa-whatsapp"></i> تواصل مع المعلن
                        </a>
                    </div>
                </div>
            </div>
        `).join('');
    };

    window.publish = async () => {
        const btn = document.getElementById('publishBtn');
        const prop = {
            owner: document.getElementById('pOwner').value || "معلن",
            phone: document.getElementById('pPhone').value || "779847980",
            title: document.getElementById('pTitle').value,
            price: document.getElementById('pPrice').value,
            space: document.getElementById('pSpace').value,
            category: document.getElementById('pCat').value,
            pass: document.getElementById('pPass').value
        };

        if(!prop.title || !prop.pass) return alert("يا فادي، املأ الموقع وكلمة السر ضروري!");

        btn.innerText = "جاري النشر...";
        btn.disabled = true;

        try {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'properties'), prop);
            window.hideModal();
            // تصفير الحقول
            ['pOwner','pPhone','pTitle','pPrice','pSpace','pPass'].forEach(id => document.getElementById(id).value = '');
        } catch (e) { alert("حدث خطأ في الاتصال بالسحاب!"); }
        
        btn.innerText = "نشر الآن 🚀";
        btn.disabled = false;
    };

    window.initDelete = (id, pass) => {
        targetDeleteId = id;
        targetDeletePass = pass;
        document.getElementById('deleteModal').style.display = 'flex';
    };

    window.confirmDelete = async () => {
        const passInp = document.getElementById('confirmPass').value;
        if(passInp === targetDeletePass) {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'listings', targetDeleteId)); // ملاحظة: تم تعديل المسار ليتوافق مع الحذف
            // إعادة المحاولة بالمسار الصحيح
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'properties', targetDeleteId));
            window.hideDeleteModal();
            document.getElementById('confirmPass').value = '';
        } else {
            alert("كلمة السر غلط يا خبير!");
        }
    };

    window.filterData = (cat, btn) => {
        currentFilter = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        window.render();
    };

    window.searchProps = () => window.render();
    window.showModal = () => document.getElementById('modal').style.display = 'flex';
    window.hideModal = () => document.getElementById('modal').style.display = 'none';
    window.hideDeleteModal = () => document.getElementById('deleteModal').style.display = 'none';

</script>

</body>
</html>
