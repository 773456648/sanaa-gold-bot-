<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رادار فادي - نظام الملاحة الصارم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #020202; color: #00ff41; font-family: 'Changa', sans-serif; touch-action: none; overflow: hidden; }
        .radar-screen { position: relative; width: 90vw; height: 90vw; max-width: 400px; max-height: 400px; border: 2px solid #00441a; border-radius: 50%; margin: 10px auto; background: #000; box-shadow: inset 0 0 30px #00220d; }
        .grid-circle { position: absolute; top: 50%; left: 50%; border: 1px solid #00441a; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .scanner-line { position: absolute; width: 50%; height: 2px; background: linear-gradient(to right, transparent, #00ff41); top: 50%; left: 50%; transform-origin: left center; animation: scan 4s linear infinite; z-index: 5; }
        @keyframes scan { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .user-arrow { position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 25px solid #00ff41; transform: translate(-50%, -100%); z-index: 100; transition: transform 0.1s ease-out; }
        .target-dot { position: absolute; width: 14px; height: 14px; background: #ff3333; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px #ff3333; z-index: 50; }
        .target-dot.active { background: #fff; box-shadow: 0 0 20px #fff; animation: blink 0.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .data-panel { background: rgba(0, 20, 0, 0.9); border: 1px solid #00ff41; border-radius: 15px; padding: 10px; font-size: 12px; margin-top: 10px; }
        .status-led { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 5px; }
        .led-green { background: #00ff41; box-shadow: 0 0 5px #00ff41; }
        .led-red { background: #ff3333; box-shadow: 0 0 5px #ff3333; }
    </style>
</head>
<body class="p-4 flex flex-col h-screen">

    <div class="flex justify-between items-center mb-2 px-2">
        <div class="text-lg font-black italic tracking-widest">FADI-OS <span class="text-xs font-normal">v4.0</span></div>
        <div class="flex items-center">
            <span id="gps-status" class="status-led led-red"></span>
            <span id="accuracy-text" class="text-[10px]">بحث عن إشارة...</span>
        </div>
    </div>

    <div class="radar-screen" id="radar-ui">
        <!-- خطوط الشبكة -->
        <div class="grid-circle" style="width: 25%; height: 25%;"></div>
        <div class="grid-circle" style="width: 50%; height: 50%;"></div>
        <div class="grid-circle" style="width: 75%; height: 75%;"></div>
        <div class="absolute w-full h-[1px] bg-[#00441a] top-1/2 left-0"></div>
        <div class="absolute h-full w-[1px] bg-[#00441a] left-1/2 top-0"></div>
        
        <div class="scanner-line"></div>
        <div id="me" class="user-arrow"></div>
        <div id="targets-layer"></div>
    </div>

    <div class="data-panel grid grid-cols-2 gap-4">
        <div>
            <div class="opacity-50">المسافة الفعلية</div>
            <div id="main-dist" class="text-3xl font-bold tracking-tighter">-- m</div>
        </div>
        <div class="text-left border-r border-[#00441a] pr-4">
            <div class="opacity-50 text-right">الانحراف (Heading)</div>
            <div id="main-bearing" class="text-3xl font-bold text-right tracking-tighter">--°</div>
        </div>
    </div>

    <div class="flex-1 mt-4 overflow-y-auto space-y-2" id="points-list"></div>

    <div class="grid grid-cols-2 gap-2 mt-4">
        <button onclick="saveCurrentLocation()" class="bg-[#00220d] border border-[#00ff41] p-3 rounded-xl font-bold text-sm">📍 تثبيت هدف</button>
        <button onclick="initCompass()" class="bg-[#00220d] border border-[#00ff41] p-3 rounded-xl font-bold text-sm">🧭 معايرة</button>
    </div>

    <script>
        let myLat, myLng, myAcc;
        let heading = 0;
        let points = [];
        let activePointId = null;
        let smoothHeading = 0;

        function initCompass() {
            if (DeviceOrientationEvent.requestPermission) {
                DeviceOrientationEvent.requestPermission().then(r => {
                    if(r == 'granted') window.addEventListener('deviceorientation', e => updateHeading(e));
                });
            } else {
                window.addEventListener('deviceorientationabsolute', e => updateHeading(e), true);
            }
        }

        function updateHeading(e) {
            let h = e.webkitCompassHeading || (360 - e.alpha);
            heading = h;
        }

        // محرك الحركة السلسة (مثل الدرون)
        function renderLoop() {
            // تنعيم البوصلة لتقليل الرجفة
            let diff = heading - smoothHeading;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            smoothHeading += diff * 0.15; 
            
            document.getElementById('me').style.transform = `translate(-50%, -100%) rotate(${smoothHeading}deg)`;
            document.getElementById('main-bearing').innerText = Math.round(smoothHeading) + "°";
            
            updateTargetsUI();
            requestAnimationFrame(renderLoop);
        }

        function startTracking() {
            navigator.geolocation.watchPosition(p => {
                myLat = p.coords.latitude;
                myLng = p.coords.longitude;
                myAcc = p.coords.accuracy;
                
                const led = document.getElementById('gps-status');
                document.getElementById('accuracy-text').innerText = "دقة: " + myAcc.toFixed(1) + "m";
                
                if(myAcc < 10) { led.className = 'status-led led-green'; }
                else { led.className = 'status-led led-red'; }

            }, null, { enableHighAccuracy: true, maximumAge: 0 });
        }

        function saveCurrentLocation() {
            if(!myLat) return;
            const name = "هدف-" + (points.length + 1);
            points.push({ lat: myLat, lng: myLng, name: name, id: Date.now() });
            updatePointsList();
        }

        function updatePointsList() {
            const list = document.getElementById('points-list');
            list.innerHTML = points.map(p => `
                <div onclick="activePointId=${p.id}" class="p-3 border border-[#00441a] rounded-lg flex justify-between items-center bg-black/40">
                    <span>${p.name}</span>
                    <span class="text-[10px] opacity-50 italic">اضغط للتتبع</span>
                </div>
            `).join('');
        }

        function updateTargetsUI() {
            if(!myLat) return;
            const container = document.getElementById('targets-layer');
            container.innerHTML = '';

            points.forEach(p => {
                const d = getDistance(myLat, myLng, p.lat, p.lng);
                const b = getBearing(myLat, myLng, p.lat, p.lng);
                
                // عرض النقاط في نطاق 100 متر
                if(d < 100) {
                    const distPx = (d / 100) * (document.getElementById('radar-ui').offsetWidth / 2);
                    const angleRad = (b - 90) * (Math.PI / 180);
                    const x = 50 + (distPx / (document.getElementById('radar-ui').offsetWidth / 2) * 50) * Math.cos(angleRad);
                    const y = 50 + (distPx / (document.getElementById('radar-ui').offsetWidth / 2) * 50) * Math.sin(angleRad);
                    
                    const isActive = activePointId === p.id;
                    container.innerHTML += `<div class="target-dot ${isActive?'active':''}" style="left:${x}%; top:${y}%"></div>`;
                    
                    if(isActive) {
                        document.getElementById('main-dist').innerText = d.toFixed(1) + " m";
                        if(d < 2) { // وصل للهدف بالضبط
                            document.getElementById('main-dist').style.color = "#ff3333";
                            if(navigator.vibrate) navigator.vibrate(200);
                        } else {
                            document.getElementById('main-dist').style.color = "#00ff41";
                        }
                    }
                }
            });
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getBearing(lat1, lon1, lat2, lon2) {
            const y = Math.sin((lon2-lon1)*Math.PI/180) * Math.cos(lat2*Math.PI/180);
            const x = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180) - Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos((lon2-lon1)*Math.PI/180);
            return (Math.atan2(y, x) * 180/Math.PI + 360) % 360;
        }

        startTracking();
        renderLoop();
    </script>
</body>
</html>
