<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FADI PRO - بناء فوري</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 40px; }
        .builder-box { background: #1e293b; padding: 30px; border-radius: 20px; border: 2px solid #00d2ff; display: inline-block; width: 400px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; }
        .btn { background: #00d2ff; color: #000; padding: 15px; width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #status { margin-top: 20px; color: #38bdf8; }
        #downloadBtn { display: none; margin-top: 20px; background: #22c55e; color: white; padding: 15px; text-decoration: none; border-radius: 8px; display: block; font-weight: bold; }
    </style>
</head>
<body>
    <div class="builder-box">
        <h2>🏗️ صانع التطبيقات الفوري</h2>
        <input type="text" id="appName" placeholder="اسم التطبيق">
        <input type="url" id="appUrl" placeholder="رابط الموقع">
        <button class="btn" onclick="buildNow()">إنشاء وتحميل الآن 🚀</button>
        <div id="status"></div>
        <a id="downloadBtn" href="#">📥 تحميل ملف APK المباشر</a>
    </div>

    <script>
        async function buildNow() {
            const status = document.getElementById('status');
            const dlBtn = document.getElementById('downloadBtn');
            status.innerText = "جاري البناء الفوري... انتظر ثوانٍ";
            
            const res = await fetch('/build-and-download', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    appName: document.getElementById('appName').value,
                    appUrl: document.getElementById('appUrl').value 
                })
            });
            
            const data = await res.json();
            if(data.success) {
                status.innerText = "✅ اكتمل البناء!";
                dlBtn.href = data.downloadUrl;
                dlBtn.style.display = 'block';
                // التحميل التلقائي فوراً
                window.location.href = data.downloadUrl;
            } else {
                status.innerText = "❌ خطأ: " + data.message;
            }
        }
    </script>
</body>
</html>
