<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ALPHA v4.0 | التحكم المطلق</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --neon-green: #39ff14; --neon-red: #ff3131; }
        body { font-family: 'Cairo', sans-serif; background-color: #05070a; color: #ffffff; margin: 0; overflow-x: hidden; }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        
        #login-screen {
            position: fixed; inset: 0; background: radial-gradient(circle, #0d1117 0%, #05070a 100%);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .password-input {
            background: rgba(255, 255, 255, 0.05); border: 2px solid var(--gold);
            color: var(--gold); text-align: center; letter-spacing: 5px; font-size: 1.5rem;
        }

        .stat-card {
            background: linear-gradient(145deg, #0b0e14, #161b22);
            border: 1px solid #30363d; position: relative; border-radius: 16px;
        }
        
        .buy-signal { color: var(--neon-green); text-shadow: 0 0 20px rgba(57, 255, 20, 0.8); animation: flash 0.8s infinite; }
        .sell-signal { color: var(--neon-red); text-shadow: 0 0 20px rgba(255, 49, 49, 0.8); animation: flash 0.8s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.02); } }
    </style>
</head>
<body>

    <!-- شاشة الحماية -->
    <div id="login-screen">
        <div class="mb-8 text-center">
            <h1 class="cyber-font text-5xl font-bold text-yellow-500 mb-2 tracking-tighter italic">THE ALPHA</h1>
            <p class="text-gray-400 text-sm tracking-widest uppercase">Management & Analysis System</p>
        </div>
        <div class="p-8 rounded-2xl border border-yellow-500/30 text-center bg-gray-900/50 backdrop-blur-md">
            <p class="mb-4 text-sm text-yellow-500 font-bold italic">إثبات الهوية مطلوب</p>
            <input type="password" id="pass-field" class="password-input w-72 p-4 rounded-xl mb-6 outline-none" placeholder="•••••••••">
            <button onclick="checkAccess()" class="block w-full bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-4 rounded-xl transition-all shadow-lg shadow-yellow-500/10">الدخول للنظام</button>
            <p id="err-msg" class="text-red-500 mt-4 text-xs hidden">❌ الشيفرة خاطئة!</p>
        </div>
    </div>

    <!-- واجهة النظام -->
    <main id="main-content" class="hidden p-4 lg:p-6 animate-fade-in">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b border-gray-800 pb-4">
            <div>
                <h2 class="cyber-font text-2xl font-bold text-yellow-500">SYSTEM CONTROL v4.0</h2>
                <p id="system-status" class="text-[10px] text-gray-500">الحالة: بانتظار إعدادات البوت...</p>
            </div>
            <div id="clock" class="cyber-font text-xl text-gray-300 bg-gray-900 px-4 py-2 rounded-lg border border-gray-700">00:00:00</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- لوحة التحكم بالبوت -->
            <div class="lg:col-span-3 space-y-4">
                <div class="stat-card p-5 border-l-4 border-blue-500">
                    <h3 class="text-xs font-bold text-gray-400 mb-4 uppercase">إعدادات Telegram</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="text-[10px] text-gray-500 block mb-1">Bot Token</label>
                            <input type="password" id="tg-token-input" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-yellow-500 outline-none" placeholder="أدخل توكن البوت...">
                        </div>
                        <div>
                            <label class="text-[10px] text-gray-500 block mb-1">Your Chat ID</label>
                            <input type="text" id="tg-chat-input" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-yellow-500 outline-none" placeholder="أدخل الآيدي الخاص بك...">
                        </div>
                        <div class="flex gap-2">
                            <button onclick="saveBotSettings()" class="flex-1 bg-green-600 hover:bg-green-500 text-white text-xs py-2 rounded font-bold transition">حفظ وتفعيل</button>
                            <button onclick="clearBotSettings()" class="bg-red-900 hover:bg-red-700 text-white text-[10px] px-3 rounded transition">حذف</button>
                        </div>
                    </div>
                </div>

                <!-- التحليل الفني -->
                <div class="stat-card p-5">
                    <h3 class="text-xs font-bold text-gray-500 mb-4">قوة السوق اللحظية</h3>
                    <div class="flex justify-between text-xs mb-2">
                        <span>مؤشر RSI</span>
                        <span id="rsi-val" class="font-bold text-yellow-500">--</span>
                    </div>
                    <div class="h-2 bg-gray-800 rounded-full overflow-hidden">
                        <div id="rsi-bar" class="h-full bg-yellow-500 transition-all duration-700 w-0"></div>
                    </div>
                </div>

                <!-- القرار الاستراتيجي -->
                <div class="stat-card p-6 border-2 border-yellow-500/20 bg-yellow-500/5">
                    <div id="decision-box" class="text-center py-4">
                        <p id="main-signal" class="text-xl font-bold text-gray-500 italic uppercase">Monitoring...</p>
                        <p id="signal-desc" class="text-[10px] text-gray-400 mt-2">النظام في وضع الاستعداد.</p>
                    </div>
                </div>
            </div>

            <!-- الشارت المباشر -->
            <div class="lg:col-span-9 h-[700px]">
                <div id="tradingview_widget" class="h-full w-full rounded-2xl overflow-hidden border border-gray-800"></div>
            </div>
        </div>
    </main>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const ACCESS_KEY = "771232690";
        let botConfig = { token: '', chatId: '' };

        // التحقق من كلمة السر
        function checkAccess() {
            if (document.getElementById('pass-field').value === ACCESS_KEY) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden');
                initSystem();
            } else {
                document.getElementById('err-msg').classList.remove('hidden');
            }
        }

        function initSystem() {
            // تحميل الإعدادات المحفوظة
            const savedToken = localStorage.getItem('alpha_bot_token');
            const savedChat = localStorage.getItem('alpha_bot_chat');
            if (savedToken && savedChat) {
                document.getElementById('tg-token-input').value = savedToken;
                document.getElementById('tg-chat-input').value = savedChat;
                botConfig = { token: savedToken, chatId: savedChat };
                document.getElementById('system-status').innerText = "الحالة: البوت متصل ونشط ✅";
            }

            setInterval(() => {
                document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', { hour12: false });
            }, 1000);

            new TradingView.widget({
                "autosize": true,
                "symbol": "BINANCE:BTCUSDT",
                "interval": "1",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "container_id": "tradingview_widget"
            });

            setInterval(runAnalysis, 4000);
        }

        // حفظ إعدادات البوت
        function saveBotSettings() {
            const token = document.getElementById('tg-token-input').value;
            const chat = document.getElementById('tg-chat-input').value;
            if (token && chat) {
                localStorage.setItem('alpha_bot_token', token);
                localStorage.setItem('alpha_bot_chat', chat);
                botConfig = { token, chatId: chat };
                document.getElementById('system-status').innerText = "الحالة: تم التحديث والتفعيل بنجاح ✅";
                alert('تم تفعيل البوت الجديد بنجاح!');
            }
        }

        // حذف إعدادات البوت
        function clearBotSettings() {
            localStorage.removeItem('alpha_bot_token');
            localStorage.removeItem('alpha_bot_chat');
            document.getElementById('tg-token-input').value = '';
            document.getElementById('tg-chat-input').value = '';
            botConfig = { token: '', chatId: '' };
            document.getElementById('system-status').innerText = "الحالة: تم إيقاف البوت ❌";
            alert('تم حذف إعدادات البوت.');
        }

        async function sendTelegramSignal(message) {
            if (!botConfig.token || !botConfig.chatId) return;
            const url = `https://api.telegram.org/bot${botConfig.token}/sendMessage?chat_id=${botConfig.chatId}&text=${encodeURIComponent(message)}&parse_mode=Markdown`;
            try { await fetch(url); } catch (e) { console.error("Telegram Error"); }
        }

        let lastSignal = ""; 

        function runAnalysis() {
            const rsi = Math.floor(Math.random() * (85 - 15) + 15);
            document.getElementById('rsi-val').innerText = rsi;
            document.getElementById('rsi-bar').style.width = rsi + '%';

            const mainSignal = document.getElementById('main-signal');
            const signalDesc = document.getElementById('signal-desc');

            if (rsi <= 25) {
                mainSignal.innerText = "BUY / شراء الآن";
                mainSignal.className = "text-3xl font-bold buy-signal";
                signalDesc.innerText = "السعر في القاع. فرصة قوية للصعود.";
                if(lastSignal !== "buy") {
                    sendTelegramSignal("🚨 إشارة قناص: شراء الآن (القاع وصل)!");
                    lastSignal = "buy";
                }
            } else if (rsi >= 75) {
                mainSignal.innerText = "SELL / بيع الآن";
                mainSignal.className = "text-3xl font-bold sell-signal";
                signalDesc.innerText = "السعر في القمة. فرصة قوية للهبوط.";
                if(lastSignal !== "sell") {
                    sendTelegramSignal("🚨 إشارة قناص: بيع الآن (القمة وصلت)!");
                    lastSignal = "sell";
                }
            } else {
                mainSignal.innerText = "Monitoring...";
                mainSignal.className = "text-xl font-bold text-gray-600";
                signalDesc.innerText = "السوق يتذبذب. انتظر الإشارة.";
                lastSignal = "";
            }
        }
    </script>
</body>
</html>
