<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>IG Runner</title>
<style>
body { font-family: Arial; text-align:center; margin-top:50px; }
button { padding:15px; margin:10px; font-size:18px; }
</style>
</head>
<body>

<h2>تشغيل الجلسة</h2>

<button onclick="start()">تشغيل المتصفح</button>
<button onclick="keepAlive()">تفعيل النشاط</button>
<button onclick="stop()">إيقاف</button>

<p id="status"></p>

<script>
const API = '/api';

async function start() {
    const res = await fetch(API + '/start', { method: 'POST' });
    const data = await res.json();
    document.getElementById('status').innerText = data.message;
}

async function keepAlive() {
    await fetch(API + '/keep-alive', { method: 'POST' });
    document.getElementById('status').innerText = "تم تفعيل النشاط";
}

async function stop() {
    await fetch(API + '/stop', { method: 'POST' });
    document.getElementById('status').innerText = "تم الإيقاف";
}
</script>

</body>
</html>
