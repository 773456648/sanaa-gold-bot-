<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الهيبة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #060608; color: #f0f0f0; font-family: 'Changa', sans-serif; }
        .gold-text { color: #d4af37; }
        .gold-btn { background: linear-gradient(135deg, #d4af37, #b8860b); color: #000; font-weight: bold; }
        .glass-card { background: rgba(15, 15, 20, 0.98); border: 1px solid #222; border-radius: 28px; }
        input, select { background: #111 !important; border: 1px solid #333 !important; color: #fff; border-radius: 16px; padding: 16px; outline: none; }
        .type-select.active { border-color: #d4af37; background: rgba(212, 175, 55, 0.05); }
        .status-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
        .st-pending { color: orange; border: 1px solid orange; }
        .st-confirmed { color: #00ff00; border: 1px solid #00ff00; }
        .st-rejected { color: #ff4444; border: 1px solid #ff4444; }
        .tafqit-box { font-size: 11px; color: #d4af37; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="auth-ui" class="max-w-md mx-auto mt-20 space-y-8">
        <h1 class="text-6xl font-black gold-text italic text-center">HEIBA</h1>
        <div class="glass-card p-8 space-y-4">
            <div class="grid grid-cols-2 gap-2">
                <div id="sel-merchant" onclick="setType('merchant')" class="type-select active border p-4 rounded-xl text-center cursor-pointer">👑 تاجر</div>
                <div id="sel-debtor" onclick="setType('debtor')" class="type-select border p-4 rounded-xl text-center cursor-pointer">👤 مواطن</div>
            </div>
            <input id="u-name" class="w-full" placeholder="الاسم">
            <div class="relative">
                <input id="u-pass" type="password" class="w-full" placeholder="كلمة السر">
                <button onclick="togglePass('u-pass')" class="absolute left-4 top-5">👁️</button>
            </div>
            <button onclick="doAuth('login')" class="w-full bg-zinc-800 py-4 rounded-xl font-bold">دخول</button>
            <button onclick="doAuth('reg')" class="w-full gold-btn py-4 rounded-xl">تسجيل جديد</button>
        </div>
    </div>

    <div id="main-ui" class="hidden max-w-6xl mx-auto space-y-6">
        <header class="flex justify-between items-center glass-card p-6">
            <h2 id="display-name" class="text-2xl font-black gold-text"></h2>
            <button onclick="logout()" class="text-red-500 text-xs">خروج</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 space-y-4">
                <div class="glass-card p-6 space-y-2">
                    <p class="text-xs text-gray-500 uppercase">الصافي (المؤكد فقط)</p>
                    <div class="text-blue-400">يمني: <span id="gt-yer">0</span></div>
                    <div class="text-green-400">دولار: <span id="gt-usd">0</span></div>
                    <div class="text-orange-400">سعودي: <span id="gt-sar">0</span></div>
                </div>
                <div class="glass-card p-4 min-h-[300px]">
                    <div id="merchant-tools" class="hidden mb-4 flex gap-2">
                        <input id="target-search" class="flex-grow p-2 text-sm" placeholder="اسم المواطن...">
                        <button onclick="addTarget()" class="gold-btn px-4 rounded-xl">+</button>
                    </div>
                    <div id="main-list" class="space-y-2"></div>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div id="details-pane" class="hidden glass-card p-6 min-h-[500px] flex flex-col">
                    <h3 id="active-target-name" class="text-2xl font-bold gold-text mb-4 border-b border-white/5 pb-2"></h3>
                    <div id="ops-list" class="flex-grow space-y-3 overflow-y-auto max-h-[400px]"></div>
                    <div id="add-form" class="hidden mt-4 grid grid-cols-2 gap-2">
                        <div class="col-span-2">
                            <input id="op-amt" type="number" class="w-full" placeholder="المبلغ" oninput="applyTafqit()">
                            <div id="tafqit-text" class="tafqit-box"></div>
                        </div>
                        <select id="op-cur"><option value="YER">يمني</option><option value="USD">دولار</option><option value="SAR">سعودي</option></select>
                        <select id="op-type"><option value="دين">دين</option><option value="سداد">سداد</option></select>
                        <input id="op-note" class="col-span-2" placeholder="البيان">
                        <button onclick="saveOp()" class="col-span-2 gold-btn py-4 rounded-xl mt-2">تثبيت العملية</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let user = null; let activeTarget = null; let userType = 'merchant'; let discoveredData = [];

        function togglePass(id) { const i = document.getElementById(id); i.type = i.type === 'password' ? 'text' : 'password'; }
        
        function formatAr(num) {
            if (num == 0) return "صفر";
            const units = ["", "واحد", "اثنان", "ثلاثة", "أربعة", "خمسة", "ستة", "سبعة", "ثمانية", "تسعة", "عشرة", "أحد عشر", "اثنا عشر", "ثلاثة عشر", "أربعة عشر", "خمسة عشر", "ستة عشر", "سبعة عشر", "ثمانية عشر", "تسعة عشر"];
            const tens = ["", "", "عشرون", "ثلاثون", "أربعون", "خمسون", "ستون", "سبعون", "ثمانون", "تسعون"];
            const hundreds = ["", "مائة", "مائتان", "ثلاثمائة", "أربعمائة", "خمسمائة", "ستمائة", "سبعمائة", "ثمانمائة", "تسعمائة"];
            function conv(n) {
                let r = ""; const h = Math.floor(n / 100); const t = n % 100;
                if (h > 0) r += hundreds[h];
                if (t > 0) { if (r !== "") r += " و "; if (t < 20) r += units[t]; else { const s = t % 10; const ten = Math.floor(t / 10); if (s > 0) r += units[s] + " و "; r += tens[ten]; } }
                return r;
            }
            let res = ""; const m = Math.floor(num / 1000000); const th = Math.floor((num % 1000000) / 1000); const rem = num % 1000;
            if (m > 0) res += (m === 1 ? "مليون" : (m === 2 ? "مليونان" : conv(m) + " ملايين"));
            if (th > 0) { if (res !== "") res += " و "; res += (th === 1 ? "ألف" : (th === 2 ? "ألفين" : conv(th) + " آلاف")); }
            if (rem > 0) { if (res !== "") res += " و "; res += conv(rem); }
            return res;
        }

        function applyTafqit() {
            const v = document.getElementById('op-amt').value;
            const c = document.getElementById('op-cur').options[document.getElementById('op-cur').selectedIndex].text;
            document.getElementById('tafqit-text').innerText = v > 0 ? formatAr(parseInt(v)) + " " + c : "";
        }

        function setType(t) { userType = t; document.getElementById('sel-merchant').classList.toggle('active', t==='merchant'); document.getElementById('sel-debtor').classList.toggle('active', t==='debtor'); }

        async function doAuth(action) {
            const name = document.getElementById('u-name').value;
            const password = document.getElementById('u-pass').value;
            const res = await fetch('/api/auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, password, type: userType, action }) });
            const data = await res.json();
            if(res.ok) { user = data; start(); } else alert(data.error);
        }

        function start() {
            document.getElementById('auth-ui').classList.add('hidden'); document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('display-name').innerText = user.name;
            if(user.type === 'merchant') {
                document.getElementById('merchant-tools').classList.remove('hidden');
                document.getElementById('add-form').classList.remove('hidden');
                renderList();
                setInterval(async () => {
                    const r = await fetch(`/api/merchant-sync?userId=${user.id}`);
                    const d = await r.json(); user.myRecords = d.myRecords;
                    if(activeTarget) showDetails(activeTarget);
                    calculateGrand(user.myRecords);
                }, 4000);
            } else {
                fetchAutoDebts(); setInterval(fetchAutoDebts, 4000);
            }
        }

        function calculateGrand(recs) {
            let y=0, u=0, s=0;
            recs.filter(r => r.status === 'confirmed').forEach(r => {
                const a = parseFloat(r.amount); const d = r.type==='دين';
                if(r.currency==='YER') y+=d?a:-a; else if(r.currency==='USD') u+=d?a:-a; else s+=d?a:-a;
            });
            document.getElementById('gt-yer').innerText = y.toLocaleString();
            document.getElementById('gt-usd').innerText = u.toLocaleString();
            document.getElementById('gt-sar').innerText = s.toLocaleString();
        }

        function addTarget() { activeTarget = document.getElementById('target-search').value; showDetails(activeTarget); renderList(); }

        function renderList() {
            const names = [...new Set(user.myRecords.map(r => r.targetName))];
            document.getElementById('main-list').innerHTML = names.map(n => `<div onclick="showDetails('${n}')" class="p-3 bg-zinc-900 rounded-xl cursor-pointer border ${activeTarget===n?'border-yellow-600':''}">${n}</div>`).join('');
        }

        async function fetchAutoDebts() {
            const res = await fetch(`/api/auto-discover?debtorName=${encodeURIComponent(user.name)}`);
            discoveredData = await res.json();
            let all = []; discoveredData.forEach(m => all = all.concat(m.records)); calculateGrand(all);
            document.getElementById('main-list').innerHTML = discoveredData.map(m => `<div onclick="showDetails('${m.merchantName}')" class="p-3 bg-zinc-900 rounded-xl mb-2">${m.merchantName}</div>`).join('');
            if(activeTarget) showDetails(activeTarget);
        }

        function showDetails(name) {
            activeTarget = name; document.getElementById('active-target-name').innerText = name;
            let recs = (user.type === 'merchant') ? user.myRecords.filter(r => r.targetName === name) : (discoveredData.find(m => m.merchantName === name)?.records || []);
            document.getElementById('ops-list').innerHTML = recs.map(r => {
                let st = r.status==='confirmed' ? 'st-confirmed' : (r.status==='rejected'?'st-rejected':'st-pending');
                return `<div class="p-3 bg-zinc-900/50 rounded-xl border-r-4 ${r.type==='دين'?'border-red-500':'border-green-500'}">
                    <div class="flex justify-between">
                        <div><span class="status-badge ${st}">${r.status||'انتظار'}</span> <b>${r.amount}</b></div>
                        <div class="text-[10px]">${r.currency}</div>
                    </div>
                    ${r.rejectReason ? `<div class="text-[11px] text-red-400">💬 السد: ${r.rejectReason}</div>` : ''}
                    ${user.type==='debtor' && (!r.status || r.status==='pending') ? `
                        <div class="mt-2 flex gap-2">
                            <button onclick="handleStatus('${r.id}', 'confirmed', '${name}')" class="bg-green-600 text-[10px] px-2 py-1 rounded">دكيد</button>
                            <button onclick="handleStatus('${r.id}', 'rejected', '${name}')" class="bg-red-600 text-[10px] px-2 py-1 rounded">رفض</button>
                        </div>
                    ` : ''}
                </div>`;
            }).reverse().join('');
        }

        async function handleStatus(opId, newStatus, merchantName) {
            let reason = newStatus === 'rejected' ? prompt("اكتب سبب الرفض (السد):") : "";
            if(newStatus === 'rejected' && !reason) return;
            await fetch('/api/op-status', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ opId, newStatus, reason, merchantName, debtorName: user.name }) });
            user.type === 'debtor' ? fetchAutoDebts() : start();
        }

        async function saveOp() {
            const a = document.getElementById('op-amt').value; if(!a || !activeTarget) return;
            const op = { id: "OP"+Date.now(), targetName: activeTarget, amount: a, currency: document.getElementById('op-cur').value, type: document.getElementById('op-type').value, note: document.getElementById('op-note').value, date: new Date().toISOString(), status: 'pending' };
            user.myRecords.push(op); showDetails(activeTarget); calculateGrand(user.myRecords);
            fetch('/api/sync', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId: user.id, myRecords: user.myRecords }) });
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
