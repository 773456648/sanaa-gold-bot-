<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة انستقرام 24/7 | PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ig-primary: #E1306C;
            --bg-dark: #09090b;
            --surface: #18181b;
        }
        body { background-color: var(--bg-dark); color: #fafafa; font-family: 'Tajawal', sans-serif; }
        .glass { background: var(--surface); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; }
        .input-dark { background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; padding: 12px; width: 100%; outline: none; }
        .input-dark:focus { border-color: var(--ig-primary); }
        .btn-grad { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; transition: opacity 0.3s; }
        .btn-grad:hover { opacity: 0.8; }
        .terminal { background: #000; color: #4ade80; font-family: monospace; font-size: 13px; padding: 12px; border-radius: 8px; height: 180px; overflow-y: auto; border: 1px solid #222; direction: ltr; text-align: left; }
        .pulse-green { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); animation: pulse 2s infinite; }
        @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); } }
        #loader { position: fixed; inset: 0; background: var(--bg-dark); display: flex; justify-content: center; align-items: center; z-index: 50; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--ig-primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- شاشة التحميل الأولية -->
    <div id="loader" class="hidden flex-col gap-3">
        <div class="spinner"></div>
        <p class="text-sm text-gray-400 font-bold">جاري فحص السيرفر...</p>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="glass p-8 w-full max-w-sm text-center">
        <h2 class="text-2xl font-black mb-6" style="color: var(--ig-primary)">النظام الإداري</h2>
        <input type="password" id="sys-pwd" class="input-dark mb-4 text-center tracking-widest text-lg" placeholder="كلمة المرور">
        <button onclick="login()" class="btn-grad">دخول</button>
        <p id="login-err" class="text-red-500 text-sm mt-3 hidden">كلمة المرور غير صحيحة</p>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboard" class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
        
        <!-- قسم الإعدادات -->
        <div class="glass p-6 relative">
            <button onclick="logout()" class="absolute top-4 left-4 text-xs bg-red-500/10 text-red-400 px-3 py-1 rounded hover:bg-red-500/20">خروج</button>
            <h1 class="text-2xl font-black mb-6">إعداد الجلسة</h1>
            
            <div id="setup-box" class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">اليوزر (بدون @)</label>
                    <input type="text" id="ig-user" class="input-dark" dir="ltr" placeholder="username">
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">مصفوفة Cookies (JSON)</label>
                    <textarea id="ig-cookies" class="input-dark h-24 text-xs font-mono" dir="ltr" placeholder='[{"name": "sessionid", "value": "..."}]'></textarea>
                </div>
                <button onclick="startBot()" class="btn-grad flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    تشغيل النقطة الخضراء
                </button>
                
                <div class="pt-4 border-t border-white/5 mt-4">
                    <p class="text-xs font-bold text-gray-400 mb-2">الحسابات المحفوظة (تعمل تلقائياً عند إعادة التشغيل):</p>
                    <div id="saved-list" class="space-y-2 max-h-32 overflow-y-auto"></div>
                </div>
            </div>

            <div id="active-box" class="hidden space-y-4 text-center py-8">
                <div class="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4 pulse-green">
                    <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h3 class="text-xl font-bold">الحساب متصل الآن!</h3>
                <p id="active-username" class="text-ig-primary font-mono text-lg" dir="ltr"></p>
                <p class="text-sm text-gray-400">السيرفر يقوم بتحريك الماوس في الخلفية لضمان البقاء</p>
                <button onclick="stopBot()" class="mt-4 px-6 py-2 bg-red-500/10 text-red-500 border border-red-500/20 rounded-lg hover:bg-red-500/20 transition">إيقاف الجلسة</button>
            </div>
        </div>

        <!-- قسم المراقبة -->
        <div class="glass p-6 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">سيرفر العمليات (Live)</h2>
                <span id="server-badge" class="px-2 py-1 text-xs rounded bg-gray-800 text-gray-400 border border-gray-700">في الانتظار</span>
            </div>
            <div id="terminal" class="terminal flex-grow">
                > نظام البقاء 24/7 جاهز للعمل...<br>
            </div>
        </div>

    </div>

    <script>
        const API = '/api';
        let currentUser = '';
        let statusInterval;

        window.onload = async () => {
            if (localStorage.getItem('auth') === 'yes') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('loader').classList.remove('hidden');
                await initializeDashboard();
            }
        };

        async function login() {
            const pwd = document.getElementById('sys-pwd').value;
            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                const data = await res.json();
                if(data.success) {
                    localStorage.setItem('auth', 'yes');
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('loader').classList.remove('hidden');
                    await initializeDashboard();
                } else {
                    document.getElementById('login-err').classList.remove('hidden');
                }
            } catch (e) { alert('السيرفر لا يستجيب'); }
        }

        function logout() {
            localStorage.removeItem('auth');
            window.location.reload();
        }

        async function initializeDashboard() {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            await loadSaved();
            await checkServerStatus();
            
            // فحص دوري للتأكد من حالة السيرفر وتحديث الـ Terminal
            statusInterval = setInterval(checkServerStatus, 10000);
        }

        async function checkServerStatus() {
            try {
                const res = await fetch(`${API}/status`);
                const data = await res.json();
                
                if (data.activeBots && data.activeBots.length > 0) {
                    currentUser = data.activeBots[0];
                    showActiveState(currentUser);
                } else {
                    showSetupState();
                }
            } catch (e) {
                logTerm('⚠️ فقدان الاتصال بالسيرفر...');
            }
        }

        function showActiveState(user) {
            document.getElementById('setup-box').classList.add('hidden');
            document.getElementById('active-box').classList.remove('hidden');
            document.getElementById('active-username').innerText = '@' + user;
            
            const badge = document.getElementById('server-badge');
            badge.innerText = 'متصل 🟢';
            badge.className = 'px-2 py-1 text-xs rounded bg-green-500/20 text-green-400 border border-green-500/20';
        }

        function showSetupState() {
            document.getElementById('setup-box').classList.remove('hidden');
            document.getElementById('active-box').classList.add('hidden');
            currentUser = '';
            
            const badge = document.getElementById('server-badge');
            badge.innerText = 'متوقف 🔴';
            badge.className = 'px-2 py-1 text-xs rounded bg-red-500/20 text-red-400 border border-red-500/20';
        }

        async function loadSaved() {
            try {
                const res = await fetch(`${API}/accounts`);
                const accounts = await res.json();
                const list = document.getElementById('saved-list');
                list.innerHTML = '';
                
                if(accounts.length === 0) {
                    list.innerHTML = '<p class="text-xs text-gray-500">لا يوجد حسابات محفوظة</p>';
                    return;
                }

                accounts.forEach(acc => {
                    list.innerHTML += `
                        <div class="flex justify-between items-center bg-black/50 p-2 rounded border border-white/5">
                            <span class="text-sm font-bold" dir="ltr">${acc.username}</span>
                            <div class="flex gap-2">
                                <button onclick="fillData('${acc.username}', '${btoa(encodeURIComponent(acc.cookies))}')" class="text-xs text-blue-400 hover:text-blue-300">تعبئة</button>
                                <button onclick="delAccount('${acc.username}')" class="text-xs text-red-400 hover:text-red-300">حذف</button>
                            </div>
                        </div>
                    `;
                });
            } catch(e) {}
        }

        function fillData(user, encodedCooks) {
            document.getElementById('ig-user').value = user;
            document.getElementById('ig-cookies').value = decodeURIComponent(atob(encodedCooks));
        }

        async function delAccount(user) {
            if(!confirm(`حذف ${user} من النظام؟`)) return;
            await fetch(`${API}/accounts/${user}`, { method: 'DELETE' });
            loadSaved();
            checkServerStatus();
        }

        async function startBot() {
            const username = document.getElementById('ig-user').value.trim();
            const cookies = document.getElementById('ig-cookies').value.trim();
            if(!username || !cookies) return alert('أدخل اليوزر والكوكيز!');

            logTerm(`> إرسال أمر التشغيل لحساب ${username}...`);
            showActiveState(username); 

            try {
                const res = await fetch(`${API}/start`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, cookies })
                });
                const data = await res.json();
                if(data.success) {
                    logTerm(`> ✅ المتصفح الخفي يعمل الآن للحساب ${username}`);
                    loadSaved();
                } else {
                    throw new Error('فشل التشغيل');
                }
            } catch (e) {
                alert('حدث خطأ');
                showSetupState();
            }
        }

        async function stopBot() {
            if(!currentUser) return;
            logTerm('> إرسال أمر الإيقاف للسيرفر...');
            try {
                await fetch(`${API}/stop`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser })
                });
                logTerm('> 🛑 تم إغلاق المتصفح بنجاح.');
            } catch(e) {}
            showSetupState();
        }

        function logTerm(msg) {
            const term = document.getElementById('terminal');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            term.innerHTML += `<span class="text-gray-500">[${time}]</span> ${msg}<br>`;
            term.scrollTop = term.scrollHeight;
        }
    </script>
</body>
</html>
