<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram 24/7 - فادي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f1015; color: #fff; font-family: 'Tajawal', sans-serif; }
        .ig-gradient { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .glass { background: #1a1b23; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }
        .terminal { background: #000; color: #0f0; font-family: monospace; height: 150px; overflow-y: auto; padding: 10px; border-radius: 10px; font-size: 12px; }
        .status-online { background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .hidden { display: none; }
    </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen">

    <!-- شاشة الدخول -->
    <div id="login-box" class="glass p-8 max-w-sm w-full text-center">
        <h2 class="text-2xl font-bold mb-6">دخول النظام</h2>
        <input type="password" id="pass" placeholder="كلمة المرور" class="w-full p-3 rounded-lg bg-black/40 border border-white/10 mb-4 text-center">
        <button onclick="login()" class="ig-gradient w-full py-3 rounded-lg font-bold">دخول</button>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="app-box" class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
        <div class="glass p-6 space-y-4">
            <h1 class="text-xl font-bold text-center">إعداد البوت</h1>
            
            <div id="setup-form">
                <input type="text" id="user" placeholder="@username" class="w-full p-3 rounded-lg bg-black/40 border border-white/10 mb-3" dir="ltr">
                <textarea id="cookies" placeholder="Paste Cookies JSON here..." class="w-full p-3 rounded-lg bg-black/40 border border-white/10 h-32 text-xs" dir="ltr"></textarea>
                <button onclick="start()" class="ig-gradient w-full py-3 rounded-lg font-bold mt-3">بدء التشغيل</button>
            </div>

            <div id="status-panel" class="hidden space-y-4">
                <div class="bg-green-500/10 border border-green-500/20 p-4 rounded-xl flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400">الحالة الحالية:</p>
                        <p class="font-bold text-green-400 flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full status-online"></span> متصل في السيرفر
                        </p>
                    </div>
                    <p id="active-user" class="font-bold" dir="ltr"></p>
                </div>
                <div id="log" class="terminal"></div>
                <button onclick="stop()" class="w-full py-3 rounded-lg font-bold bg-red-500/20 text-red-500 border border-red-500/50">إيقاف الجلسة</button>
            </div>
        </div>

        <div class="glass p-6 text-center flex flex-col justify-center">
            <h2 class="text-lg font-bold mb-4">المعاينة</h2>
            <div id="preview" class="bg-black/20 rounded-2xl p-10">
                <div id="preview-off">لا يوجد نشاط</div>
                <div id="preview-on" class="hidden">
                    <div class="w-20 h-20 mx-auto rounded-full ig-gradient p-1 mb-3">
                        <div class="w-full h-full bg-black rounded-full border-4 border-black"></div>
                    </div>
                    <p id="preview-name" class="font-bold text-xl"></p>
                    <p class="text-green-400 text-sm mt-2">متصل الآن 24/7</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = '/api';
        let currentBot = '';

        async function login() {
            const p = document.getElementById('pass').value;
            const res = await fetch(API+'/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:p})});
            if((await res.json()).success) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('app-box').classList.remove('hidden');
                refreshStatus(); // أول ما يدخل يشوف السيرفر
            } else alert('غلط!');
        }

        async function refreshStatus() {
            const res = await fetch(API+'/status');
            const data = await res.json();
            if(data.activeBots && data.activeBots.length > 0) {
                currentBot = data.activeBots[0];
                uiActive(currentBot);
                addLog("تم استعادة الجلسة النشطة من السيرفر.");
            }
        }

        function uiActive(user) {
            document.getElementById('setup-form').classList.add('hidden');
            document.getElementById('status-panel').classList.remove('hidden');
            document.getElementById('preview-off').classList.add('hidden');
            document.getElementById('preview-on').classList.remove('hidden');
            document.getElementById('active-user').innerText = user;
            document.getElementById('preview-name').innerText = user;
        }

        async function start() {
            const username = document.getElementById('user').value;
            const cookies = document.getElementById('cookies').value;
            if(!username || !cookies) return alert('املي البيانات!');
            
            addLog("جاري بدء الجلسة في السيرفر...");
            await fetch(API+'/start', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username, cookies})});
            
            // حفظ الحساب في السيرفر عشان يشتغل تلقائياً لو طفى السيرفر
            await fetch(API+'/accounts', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username, cookies})});
            
            uiActive(username);
            currentBot = username;
        }

        async function stop() {
            await fetch(API+'/stop', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:currentBot})});
            location.reload();
        }

        function addLog(m) {
            const l = document.getElementById('log');
            l.innerHTML += `> ${m}<br>`;
            l.scrollTop = l.scrollHeight;
        }

        // فحص الحالة كل دقيقة للتأكد إن كل شي تمام
        setInterval(refreshStatus, 60000);
    </script>
</body>
</html>
