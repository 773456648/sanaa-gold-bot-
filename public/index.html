<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FADI SYSTEM | مصنع الهندسة العكسية</title>
    <style>
        body { background: #020617; color: #00ff88; font-family: monospace; padding: 20px; }
        .box { border: 2px solid #00d2ff; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #1e293b; border: 1px solid #00d2ff; color: white; }
        button { width: 100%; padding: 15px; background: #00d2ff; color: #000; font-weight: bold; cursor: pointer; }
        #log { margin-top: 20px; background: #000; padding: 10px; border: 1px solid #334155; height: 150px; overflow-y: auto; font-size: 13px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🏗️ منظومة التعديل الحقيقي</h2>
        <input type="text" id="appName" placeholder="اسم التطبيق الجديد">
        <input type="text" id="appUrl" placeholder="الرابط المطلوب حقنه">
        <button onclick="runFactory()">🛠️ فتح الملف وتعديله الآن</button>
        <div id="log"></div>
    </div>

    <script>
        function log(msg) { document.getElementById('log').innerHTML += `> ${msg}<br>`; }
        async function runFactory() {
            const name = document.getElementById('appName').value;
            const url = document.getElementById('appUrl').value;
            
            log("بدء الاتصال بالسيرفر...");
            log("جاري طلب فتح ملف template.apk...");

            fetch('/build-mega-system', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ appName: name, appUrl: url })
            })
            .then(res => {
                if(!res.ok) throw new Error();
                return res.blob();
            })
            .then(blob => {
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.download = `${name}_Modified.apk`;
                link.click();
                log("✅ تم التعديل والتحميل بنجاح!");
            })
            .catch(() => log("❌ خطأ: السيرفر لا يمتلك Java/Apktool للقيام بالتعديل الحقيقي."));
        }
    </script>
</body>
</html>
