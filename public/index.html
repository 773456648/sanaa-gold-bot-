<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FADI SYSTEM PRO v3.0</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; padding: 40px; }
        .container { border: 2px solid #00ff41; padding: 30px; border-radius: 20px; display: inline-block; box-shadow: 0 0 20px #00ff41; }
        input { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 15px; font-size: 25px; width: 250px; text-align: center; border-radius: 10px; }
        button { background: #00ff41; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 10px; margin-top: 20px; font-size: 18px; }
        #status { margin-top: 20px; color: #ffff00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FADI CALL PRO</h1>
        <p>بوابة تحكم مودم B535</p>
        <input type="tel" id="num" placeholder="77XXXXXXX">
        <br>
        <button onclick="sendCall()">إرسال أمر اتصال 🚀</button>
        <div id="status">الحالة: جاهز</div>
    </div>

    <script>
        async function sendCall() {
            const number = document.getElementById('num').value;
            const status = document.getElementById('status');
            status.innerText = "جاري التنفيذ...";

            const res = await fetch('/api/fadi-call', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ number })
            });
            const result = await res.json();
            status.innerText = result.message;
        }
    </script>
</body>
</html>
