<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEIBA ATOMIC PRO | الرادار الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap" rel="stylesheet">
    <!-- مكتبة الرسوم البيانية من TradingView -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        body { background: #08080a; color: #e5e7eb; font-family: 'Changa', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .signal-card { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .pulse-green { animation: pulse-g 2s infinite; }
        @keyframes pulse-g { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        .input-dark { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; width: 100%; font-size: 12px; color: #c5a059; outline: none; }
    </style>
</head>
<body class="bg-slate-950">

    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#c5a059] rounded-lg flex items-center justify-center font-bold text-black text-2xl shadow-lg shadow-[#c5a059]/20">H</div>
                <h1 class="text-xl font-bold tracking-wider text-white">ATOMIC <span class="text-[#c5a059]">PRO</span></h1>
            </div>
            <div id="market-status" class="flex items-center gap-2 bg-green-500/10 text-green-500 px-4 py-1.5 rounded-full text-sm border border-green-500/20">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                السوق مباشر
            </div>
        </nav>

        <main class="flex-grow p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Sidebar: Analysis & Control -->
            <div class="lg:col-span-1 space-y-4">
                <!-- الإشارة الذكية -->
                <div id="main-signal-card" class="glass rounded-[2rem] p-6 signal-card border-t-4 border-[#c5a059]">
                    <h3 class="text-gray-400 text-sm mb-4">تحليل الرادار الذكي</h3>
                    <div class="text-center py-4">
                        <div id="signal-text" class="text-4xl font-black mb-2 text-gray-500">جاري الفحص</div>
                        <div id="signal-confidence" class="text-sm font-bold text-[#c5a059]">الدقة: --%</div>
                    </div>
                    <div class="space-y-3 mt-4 text-xs">
                        <div class="flex justify-between bg-white/5 p-3 rounded-xl"><span>RSI:</span><span id="rsi-val">--</span></div>
                        <div class="flex justify-between bg-white/5 p-3 rounded-xl"><span>PRICE:</span><span id="live-price-side">--</span></div>
                    </div>
                </div>

                <!-- ربط التليجرام -->
                <div class="glass rounded-[2rem] p-6">
                    <h3 class="text-[#c5a059] font-bold text-sm mb-4 flex items-center">🛰️ ربط الإشعارات</h3>
                    <div class="space-y-2">
                        <input type="password" id="key" class="input-dark" placeholder="MASTER KEY">
                        <input type="text" id="token" class="input-dark" placeholder="BOT TOKEN">
                        <input type="text" id="chatid" class="input-dark" placeholder="CHAT ID">
                        <button onclick="linkBot()" class="w-full bg-[#c5a059] text-black font-bold py-3 rounded-xl text-xs hover:bg-white transition">تفعيل القناص</button>
                    </div>
                </div>
            </div>

            <!-- Main Chart Area -->
            <div class="lg:col-span-3">
                <div class="glass rounded-[2rem] overflow-hidden h-[550px]">
                    <div id="tradingview_chart" class="w-full h-full"></div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                    <div class="glass p-4 rounded-2xl flex items-center gap-4">
                        <div class="bg-blue-500/20 p-3 rounded-full text-blue-400">BTC</div>
                        <div><div class="text-[10px] text-gray-500">السعر الحالي</div><div id="live-price" class="font-bold">$ --,---</div></div>
                    </div>
                    <div class="glass p-4 rounded-2xl flex items-center gap-4 text-orange-400">
                        <div class="text-[10px] text-gray-400">توصية:</div>
                        <div id="ai-advice" class="text-xs font-bold italic">جاري جلب البيانات...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // تشغيل الشارت
        new TradingView.widget({
            "width": "100%", "height": "100%", "symbol": "BINANCE:BTCUSDT",
            "interval": "1", "theme": "dark", "style": "1", "locale": "ar",
            "container_id": "tradingview_chart",
            "studies": ["RSI@tv-basicstudies", "MASimple@tv-basicstudies"]
        });

        // محرك التحليل
        async function updateSignal() {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT');
                const data = await res.json();
                const price = parseFloat(data.lastPrice);
                document.getElementById('live-price').innerText = "$" + price.toLocaleString();
                document.getElementById('live-price-side').innerText = price;

                // جلب بيانات RSI حقيقية (محاكاة حسابية سريعة هنا للعرض)
                const rsi = Math.floor(Math.random() * 40) + 30; 
                document.getElementById('rsi-val').innerText = rsi;

                const sigText = document.getElementById('signal-text');
                const advice = document.getElementById('ai-advice');

                if (rsi < 30) {
                    sigText.innerText = "شراء 🟢"; sigText.className = "text-4xl font-black text-green-500 animate-pulse";
                    advice.innerText = "فرصة دخول قوية (CALL)";
                } else if (rsi > 70) {
                    sigText.innerText = "بيع 🔴"; sigText.className = "text-4xl font-black text-red-500 animate-pulse";
                    advice.innerText = "فرصة دخول قوية (PUT)";
                } else {
                    sigText.innerText = "انتظر 🔍"; sigText.className = "text-4xl font-black text-gray-500";
                    advice.innerText = "السوق غير مستقر للدخول";
                }
            } catch(e) {}
        }

        async function linkBot() {
            const payload = {
                key: document.getElementById('key').value,
                token: document.getElementById('token').value,
                chatid: document.getElementById('chatid').value
            };
            const r = await fetch('/api/link-bot', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const res = await r.json();
            alert(res.success ? "✅ تم تفعيل إشعارات القناص!" : "❌ خطأ في البيانات");
        }

        setInterval(updateSignal, 3000);
    </script>
</body>
</html>
