<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 FADI SYSTEM PRO | منظومة فادي الذهبية</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', system-ui, sans-serif;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        :root {
            --gold: #FFD700;
            --gold-dark: #CCAC00;
            --neon: #00ffff;
            --dark-bg: #0A0C0F;
            --card-bg: #1A1E24;
            --input-bg: #2A2F36;
        }
        
        body {
            background: var(--dark-bg);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.1) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.1) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }
        
        .header {
            text-align: center;
            padding: 15px;
            background: rgba(26, 30, 36, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 2px solid var(--gold);
            margin-bottom: 20px;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(45deg, #FFD700, #00ffff, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 5px;
        }
        
        .role-badge {
            display: inline-block;
            padding: 8px 25px;
            background: linear-gradient(45deg, var(--gold), var(--gold-dark));
            color: black;
            font-weight: bold;
            border-radius: 50px;
            font-size: 16px;
            box-shadow: 0 0 20px var(--gold);
        }
        
        .setup-box {
            background: var(--card-bg);
            border: 2px solid var(--neon);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            margin-bottom: 20px;
        }
        
        .setup-box input {
            width: 100%;
            padding: 18px;
            margin: 10px 0;
            background: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 20px;
            color: white;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
            transition: 0.3s;
        }
        
        .setup-box input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 25px var(--gold);
            outline: none;
        }
        
        .btn-enter {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, var(--gold), #FFA500);
            border: none;
            border-radius: 20px;
            color: black;
            font-weight: bold;
            font-size: 22px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
            box-shadow: 0 0 30px var(--gold);
        }
        
        .btn-enter:hover {
            transform: scale(1.02);
            box-shadow: 0 0 50px var(--gold);
        }
        
        /* شبكة الفيديو الجماعية (Video Grid) */
        #videoArea {
            display: none;
            width: 100%;
            gap: 15px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            margin-bottom: 20px;
            z-index: 10;
            position: relative;
        }
        
        .video-card {
            position: relative;
            background: black;
            border-radius: 20px;
            border: 2px solid var(--gold);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            aspect-ratio: 4/3;
        }
        
        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-card .user-label {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--gold);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid var(--gold);
        }
        
        #chat {
            flex: 1;
            background: rgba(26, 30, 36, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 20px;
            margin: 15px 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 2px solid var(--neon);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            z-index: 10;
            min-height: 300px;
            max-height: 450px;
        }
        
        .msg {
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 85%;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: popIn 0.3s ease;
        }
        
        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .msg.me {
            background: linear-gradient(135deg, #1D2A35, #0F1A24);
            align-self: flex-start;
            border-right: 5px solid var(--neon);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.2);
        }
        
        .msg.other {
            background: linear-gradient(135deg, #2A2F36, #1A1F26);
            align-self: flex-end;
            border-left: 5px solid var(--gold);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.2);
        }
        
        .msg.sys {
            background: rgba(255, 215, 0, 0.15);
            align-self: center;
            border: 2px solid var(--gold);
            color: var(--gold);
            font-size: 14px;
            max-width: 70%;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        
        .msg b {
            color: var(--gold);
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 40px;
            border: 2px solid var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            z-index: 10;
            position: relative;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .tool-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--input-bg);
            border: 2px solid var(--gold);
            color: var(--gold);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            flex-shrink: 0;
        }
        
        .tool-btn:hover {
            transform: scale(1.1);
            background: var(--gold);
            color: black;
            box-shadow: 0 0 25px var(--gold);
        }
        
        #msgInput {
            flex: 1;
            padding: 15px;
            background: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            direction: rtl;
            text-align: right;
            min-width: 150px;
        }
        
        #msgInput:focus {
            border-color: var(--neon);
            box-shadow: 0 0 20px var(--neon);
            outline: none;
        }
        
        .btn-send {
            background: linear-gradient(45deg, var(--gold), #FFA500);
            border: none;
            border-radius: 40px;
            padding: 12px 20px;
            color: black;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px var(--gold);
            min-width: 80px;
        }
        
        #endCallBtn {
            background: #ff4444 !important;
            border-color: white !important;
            color: white !important;
        }
        
        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .toast {
            background: var(--card-bg);
            border-right: 5px solid var(--gold);
            padding: 15px 25px;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideIn 0.3s;
            backdrop-filter: blur(10px);
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="toastContainer"></div>
    
    <div class="header">
        <h1>👑 FADI SYSTEM ULTRA 👑</h1>
        <span class="role-badge" id="roleBadge">منتظر الدخول...</span>
    </div>
    
    <div class="setup-box" id="setup">
        <input type="text" id="userName" placeholder="الاسم الثلاثي" autocomplete="off">
        <input type="text" id="roomNum" placeholder="رقم الغرفة" autocomplete="off">
        <button class="btn-enter" onclick="initFadi()">🚀 ادخل المنظومة</button>
    </div>
    
    <!-- شبكة شاشات الفيديو الجماعية -->
    <div id="videoArea"></div>
    
    <div id="chat"></div>
    <div id="audioContainer"></div>
    
    <input type="file" id="fileInput" style="display:none;" onchange="handleFileUpload(event)">

    <div class="input-row" id="inputSection" style="display:none;">
        <button class="tool-btn" title="مرفقات وملفات" onclick="document.getElementById('fileInput').click()">📎</button>
        <button class="tool-btn" id="recordBtn" title="تسجيل رسالة صوتية" onclick="toggleVoiceRecord()">🎙️</button>
        <button class="tool-btn" id="micBtn" title="كتم/تشغيل المايك" onclick="toggleMic()">🎤</button>
        <button class="tool-btn" title="مكالمة صوتية جماعية" onclick="startGroupCall(false)">📞</button>
        <button class="tool-btn" title="مكالمة فيديو جماعية" onclick="startGroupCall(true)">🎥</button>
        <button class="tool-btn" id="endCallBtn" title="إنهاء المكالمة" onclick="endCall()" style="display: none;">🛑</button>
        
        <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key==='Enter') send()">
        <button class="btn-send" onclick="send()">إرسال</button>
    </div>

    <script>
        let peer, myName, myRoom, myPeerId;
        let conns = {}; // حفظ الاتصالات مع المعرفات
        let activeCalls = {};
        let myStream = null;
        let isMicMuted = false;
        let isHost = false;
        let peersList = {}; // قائمة أسماء الأعضاء المتصلين

        let mediaRecorder;
        let audioChunks = [];
        let isRecordingVoice = false;

        const chatBox = document.getElementById('chat');
        const toastContainer = document.getElementById('toastContainer');
        const videoArea = document.getElementById('videoArea');
        const audioContainer = document.getElementById('audioContainer');
        
        const cfg = {
            config: {
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            }
        };
        
        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            toast.style.borderRightColor = type === 'gold' ? '#FFD700' : '#00ffff';
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function initFadi() {
            myName = document.getElementById('userName').value.trim();
            myRoom = document.getElementById('roomNum').value.trim();
            
            if(!myName || !myRoom) {
                showToast('❌ اكتب اسمك ورقم الغرفة', 'gold');
                return;
            }
            
            document.getElementById('setup').style.display = 'none';
            document.getElementById('inputSection').style.display = 'flex';
            showToast('⚡ جاري الاتصال...', 'info');
            
            tryHost();
        }
        
        function tryHost() {
            myPeerId = myRoom;
            peer = new Peer(myPeerId, cfg);
            
            peer.on('open', () => {
                isHost = true;
                document.getElementById('roleBadge').textContent = '👑 زعيم المجموعة';
                log('👑 أنت الزعيم.. الغرفة جاهزة للمتصلين', 'sys');
                showToast('👑 أنت الزعيم', 'gold');
                
                setupPeerEvents();
            });
            
            peer.on('error', err => {
                if(err.type === 'unavailable-id') {
                    joinRoom();
                } else {
                    showToast('⚠️ خطأ اتصال: ' + err.type, 'gold');
                }
            });
        }
        
        function joinRoom() {
            isHost = false;
            myPeerId = myRoom + '-' + Math.floor(Math.random() * 9000 + 1000);
            peer = new Peer(myPeerId, cfg);
            
            peer.on('open', () => {
                document.getElementById('roleBadge').textContent = '👤 عضو في المجموعة';
                log('✅ دخلت المجموعة بنجاح', 'sys');
                showToast('✅ تم الاتصال بالغرفة', 'info');
                
                setupPeerEvents();
                let hostConn = peer.connect(myRoom);
                handleNewConnection(hostConn);
            });
        }

        function setupPeerEvents() {
            peer.on('connection', conn => handleNewConnection(conn));
            peer.on('call', call => handleIncomingCall(call));
        }

        function handleNewConnection(c) {
            c.on('open', () => {
                conns[c.peer] = c;
                c.send({ type: 'join', user: myName, peerId: myPeerId });
            });

            c.on('data', d => handleIncomingData(d, c));
            
            c.on('close', () => {
                if(peersList[c.peer]) {
                    log(`🔻 غادر ${peersList[c.peer]} المجموعة`, 'sys');
                    delete peersList[c.peer];
                }
                delete conns[c.peer];
                removeVideoElement(c.peer);
            });
        }

        function handleIncomingData(d, conn) {
            if(d.type === 'join') {
                peersList[d.peerId] = d.user;
                log(`${d.user} انضم للمجموعة`, 'sys');

                // إذا كان الزعيم، يرسل قائمة بقية الأعضاء للعضو الجديد ليتصل بهم جميعاً (Full Mesh)
                if(isHost) {
                    let allPeers = Object.keys(conns).map(id => ({ id: id, name: peersList[id] }));
                    conn.send({ type: 'peers_list', list: allPeers });
                }
            }

            if(d.type === 'peers_list') {
                d.list.forEach(item => {
                    if(item.id !== myPeerId && !conns[item.id]) {
                        peersList[item.id] = item.name;
                        let newConn = peer.connect(item.id);
                        handleNewConnection(newConn);
                    }
                });
            }

            if(d.type === 'msg') {
                log(d.text, 'other', d.user);
                if(d.text.includes('@' + myName)) {
                    showToast(`💬 ${d.user} أشار إليك`, 'gold');
                }
            }

            if(d.type === 'file' || d.type === 'voice') {
                renderMedia(d, 'other');
            }
        }

        // --- إدارة مكالمات الفيديو والصوت الجماعية المباشرة ---

        function startGroupCall(isVideo) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo }).then(stream => {
                myStream = stream;
                document.getElementById('endCallBtn').style.display = 'flex';
                videoArea.style.display = 'grid';

                // إضافة الشاشة المحلية أولاً
                addVideoElement(myPeerId, myName + ' (أنت)', myStream, true);

                // الاتصال بجميع المشتركين معاً
                Object.keys(conns).forEach(targetPeerId => {
                    let call = peer.call(targetPeerId, myStream, { metadata: { user: myName, video: isVideo } });
                    setupCallStream(call);
                });

                showToast(isVideo ? '📹 بدأت المكالمة الجماعية' : '📞 بدأت المكالمة الصوتية', 'info');

            }).catch(err => {
                showToast('❌ يتطلب الإذن للوصول للمايك والكاميرا', 'gold');
            });
        }

        function handleIncomingCall(call) {
            if(confirm(`📞 مكالمة واردة من ${call.metadata?.user || 'عضو'}.. هل تريد الرد؟`)) {
                navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: call.metadata?.video || false
                }).then(stream => {
                    myStream = stream;
                    document.getElementById('endCallBtn').style.display = 'flex';
                    videoArea.style.display = 'grid';

                    addVideoElement(myPeerId, myName + ' (أنت)', myStream, true);
                    call.answer(stream);
                    setupCallStream(call);

                }).catch(() => {
                    showToast('❌ تعذر فتح الكاميرا أو المايك', 'gold');
                });
            } else {
                call.close();
            }
        }

        function setupCallStream(call) {
            activeCalls[call.peer] = call;

            call.on('stream', remoteStream => {
                let remoteUserName = call.metadata?.user || peersList[call.peer] || 'عضو';
                addVideoElement(call.peer, remoteUserName, remoteStream, false);
            });

            call.on('close', () => {
                removeVideoElement(call.peer);
            });
        }

        function addVideoElement(peerId, labelName, stream, isMuted) {
            if(document.getElementById('vid-card-' + peerId)) return;

            const card = document.createElement('div');
            card.className = 'video-card';
            card.id = 'vid-card-' + peerId;

            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            if(isMuted) video.muted = true;

            const label = document.createElement('div');
            label.className = 'user-label';
            label.textContent = labelName;

            card.appendChild(video);
            card.appendChild(label);
            videoArea.appendChild(card);
        }

        function removeVideoElement(peerId) {
            const card = document.getElementById('vid-card-' + peerId);
            if(card) card.remove();

            if(videoArea.children.length === 0) {
                videoArea.style.display = 'none';
            }
        }

        function endCall() {
            Object.values(activeCalls).forEach(call => call.close());
            activeCalls = {};

            if(myStream) {
                myStream.getTracks().forEach(track => track.stop());
                myStream = null;
            }

            videoArea.innerHTML = '';
            videoArea.style.display = 'none';
            document.getElementById('endCallBtn').style.display = 'none';
            showToast('🔴 انتهت المكالمة الجماعية', 'info');
        }

        function toggleMic() {
            if(myStream) {
                let audioTrack = myStream.getAudioTracks()[0];
                if(audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    isMicMuted = !audioTrack.enabled;

                    const btn = document.getElementById('micBtn');
                    btn.style.background = isMicMuted ? '#ff4444' : '';
                    btn.style.color = isMicMuted ? 'white' : '';

                    showToast(isMicMuted ? '🔇 تم كتم الميكروفون' : '🎤 الميكروفون يعمل', 'info');
                }
            } else {
                showToast('⚠️ لا توجد مكالمة جارية للكتم', 'gold');
            }
        }

        // --- التسجيلات المباشرة والمرفقات ---

        async function toggleVoiceRecord() {
            const recBtn = document.getElementById('recordBtn');
            
            if (!isRecordingVoice) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };
                    
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const voiceData = { type: 'voice', user: myName, data: e.target.result };
                            renderMedia(voiceData, 'me');
                            broadcastData(voiceData);
                        };
                        reader.readAsDataURL(audioBlob);
                        stream.getTracks().forEach(track => track.stop()); 
                    };
                    
                    mediaRecorder.start();
                    isRecordingVoice = true;
                    recBtn.style.background = '#ff4444';
                    recBtn.style.color = 'white';
                    recBtn.innerHTML = '⏹️';
                    showToast('🔴 جاري التسجيل.. اضغط ثانية للإرسال', 'info');
                    
                } catch (err) {
                    showToast('❌ يلزم السماح بالمايك للتسجيل', 'gold');
                }
            } else {
                mediaRecorder.stop();
                isRecordingVoice = false;
                recBtn.style.background = '';
                recBtn.style.color = '';
                recBtn.innerHTML = '🎙️';
                showToast('✅ تم إرسال التسجيل الصوتي', 'info');
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const fileData = { 
                    type: 'file', 
                    user: myName, 
                    filename: file.name, 
                    filetype: file.type || 'unknown', 
                    data: e.target.result 
                };
                
                renderMedia(fileData, 'me');
                broadcastData(fileData);
            };
            
            if(file.size > 10000000) { 
                showToast('⚠️ حجم الملف كبير، قد يستغرق لحظات للوصول', 'gold');
            }
            
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function broadcastData(dataObj) {
            Object.values(conns).forEach(c => c.send(dataObj));
        }

        function renderMedia(d, typeStr) {
            let htmlContent = '';
            
            if (d.type === 'voice') {
                htmlContent = `<audio src="${d.data}" controls style="width: 100%; height: 40px; margin-top: 5px; border-radius: 20px; outline: none;"></audio>`;
                log('🎤 رسالة صوتية', typeStr, d.user, htmlContent);
            } 
            else if (d.type === 'file') {
                if(d.filetype.startsWith('image/')) {
                    htmlContent = `<img src="${d.data}" style="max-width:100%; border-radius:15px; margin-top:5px; border: 2px solid var(--neon);">`;
                } else if (d.filetype.startsWith('video/')) {
                    htmlContent = `<video src="${d.data}" controls style="max-width:100%; border-radius:15px; margin-top:5px; border: 2px solid var(--neon);"></video>`;
                } else {
                    htmlContent = `<div style="background: var(--input-bg); padding: 10px; border-radius: 10px; margin-top: 5px; text-align: center; border: 1px solid var(--gold);">
                        <a href="${d.data}" download="${d.filename}" style="color:var(--gold); text-decoration:none; font-weight: bold;">
                            📥 تحميل الملف:<br><span style="font-size:12px; color:#fff;">${d.filename}</span>
                        </a>
                    </div>`;
                }
                log('', typeStr, d.user, htmlContent);
            }
        }

        function log(msg, type, user = null, attachmentHtml = null) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            
            let finalContent = '';
            
            if(type === 'sys') {
                finalContent = `⚡ ${msg}`;
            } else {
                let formattedMsg = msg ? msg.replace(/@(\w+)/g, '<span style="background: #FFD70033; padding: 2px 5px; border-radius: 10px; color: #FFD700;">@$1</span>') : '';
                finalContent = user ? `<b>${user}</b><br>${formattedMsg}` : formattedMsg;
            }
            
            if(attachmentHtml) {
                finalContent += attachmentHtml;
            }
            
            div.innerHTML = finalContent;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function send() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            
            if(!text) return;
            
            log(text, 'me', myName);
            broadcastData({ type: 'msg', user: myName, text: text });
            
            input.value = '';
            input.focus();
        }
        
        window.onbeforeunload = function() {
            return "هل أنت تأكد من خروجك من المنظومة؟";
        };
    </script>
</body>
</html>
