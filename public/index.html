<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏢 منصة الإيجارات الذكية - نظام فادي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #0a1928; color: white; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .header { background: linear-gradient(145deg, #1e3a5f, #0a1a2f); border: 2px solid #ffd700; border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .header h1 { color: #ffd700; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 10px; }
        .tab { padding: 10px 20px; background: #1e3a5f; border: 1px solid #ffd700; border-radius: 30px; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .tab.active { background: #ffd700; color: black; font-weight: bold; }
        .card { background: rgba(30,58,95,0.3); border: 2px solid #ffd700; border-radius: 20px; padding: 20px; backdrop-filter: blur(10px); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #0a1a2f; border: 1px solid #ffd700; border-radius: 10px; color: white; }
        .btn { width: 100%; padding: 12px; background: #ffd700; border: none; border-radius: 10px; color: black; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .item-card { background: #0a1a2f; border: 1px solid #ffd700; border-radius: 15px; padding: 15px; margin-top: 15px; position: relative; }
        .badge { background: #ffd700; color: black; padding: 3px 10px; border-radius: 5px; font-size: 0.8em; margin-left: 5px; }
        .delete-btn { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; float: left; }
        .user-info { color: #00ff88; margin-bottom: 15px; text-align: center; font-weight: bold; }
        .notification { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ffd700; color: black; padding: 10px 30px; border-radius: 20px; z-index: 1000; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏢 منصة الإيجارات الذكية</h1>
        <p id="welcomeMsg">سجل دخولك يا خبير</p>
    </div>

    <div id="loginArea">
        <div class="card">
            <h2 id="authTitle">🔐 دخول / تسجيل</h2>
            <input type="text" id="userName" placeholder="الاسم الكامل">
            <input type="password" id="userPass" placeholder="كلمة السر">
            <select id="userRole">
                <option value="owner">تاج الملك (مالك)</option>
                <option value="tenant">ضيف الدار (مستأجر)</option>
            </select>
            <button class="btn" onclick="handleAuth()">دخول النظام</button>
        </div>
    </div>

    <div id="mainSystem" style="display:none;">
        <div class="user-info" id="currentUserDisplay"></div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('properties')">🏘️ العقارات</div>
            <div id="ownerOnlyTab" class="tab" onclick="switchTab('add')">➕ إضافة عقار</div>
            <div class="tab" onclick="logout()">🚪 خروج</div>
        </div>

        <div id="properties-view" class="card">
            <h2>📋 قائمة العقارات المتاحة</h2>
            <div id="listContainer"></div>
        </div>

        <div id="add-view" class="card" style="display:none;">
            <h2>➕ عقار جديد</h2>
            <input type="text" id="pName" placeholder="اسم العقار (مثلاً: شقة الأمل)">
            <input type="text" id="pAddress" placeholder="الموقع">
            <input type="number" id="pRent" placeholder="الإيجار (ريال)">
            <button class="btn" onclick="createNewProperty()">نشر العقار</button>
        </div>
    </div>
</div>

<script>
    let users = JSON.parse(localStorage.getItem('users')) || [];
    let properties = JSON.parse(localStorage.getItem('properties')) || [];
    let currentUser = null;

    function handleAuth() {
        const name = document.getElementById('userName').value.trim();
        const pass = document.getElementById('userPass').value;
        const role = document.getElementById('userRole').value;

        if(!name || !pass) return toast("أدخل بياناتك كاملة!");

        let user = users.find(u => u.name === name);
        
        if(user) {
            if(user.pass !== pass) return toast("كلمة السر غلط!");
            currentUser = user;
        } else {
            currentUser = { name, pass, role };
            users.push(currentUser);
            localStorage.setItem('users', JSON.stringify(users));
            toast("تم تسجيلك بنجاح");
        }
        enterSystem();
    }

    function enterSystem() {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('mainSystem').style.display = 'block';
        document.getElementById('currentUserDisplay').innerText = `أهلاً بك يا ${currentUser.name} (${currentUser.role === 'owner' ? 'مالك' : 'مستأجر'})`;
        
        if(currentUser.role !== 'owner') {
            document.getElementById('ownerOnlyTab').style.display = 'none';
        }
        renderProperties();
    }

    function createNewProperty() {
        const name = document.getElementById('pName').value;
        const address = document.getElementById('pAddress').value;
        const rent = document.getElementById('pRent').value;

        if(!name || !rent) return toast("املأ الحقول يا بطل");

        const newP = {
            id: Date.now(),
            name, address, rent,
            owner: currentUser.name
        };

        properties.push(newP);
        localStorage.setItem('properties', JSON.stringify(properties));
        toast("تمت إضافة العقار");
        switchTab('properties');
        renderProperties();
    }

    function renderProperties() {
        const container = document.getElementById('listContainer');
        container.innerHTML = properties.length === 0 ? '<p>لا توجد عقارات حالياً</p>' : '';
        
        properties.forEach(p => {
            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `
                <h3>${p.name} <span class="badge">${p.rent} ريال</span></h3>
                <p>📍 الموقع: ${p.address}</p>
                <p>👑 المالك: ${p.owner}</p>
                ${p.owner === currentUser.name ? `<button class="delete-btn" onclick="deleteProp(${p.id})">حذف</button>` : ''}
                <div style="clear:both"></div>
            `;
            container.appendChild(div);
        });
    }

    function deleteProp(id) {
        properties = properties.filter(p => p.id !== id);
        localStorage.setItem('properties', JSON.stringify(properties));
        renderProperties();
        toast("تم الحذف");
    }

    function switchTab(tab) {
        document.getElementById('properties-view').style.display = tab === 'properties' ? 'block' : 'none';
        document.getElementById('add-view').style.display = tab === 'add' ? 'block' : 'none';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
    }

    function logout() {
        location.reload();
    }

    function toast(msg) {
        const div = document.createElement('div');
        div.className = 'notification';
        div.innerText = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2000);
    }
</script>
</body>
</html>
