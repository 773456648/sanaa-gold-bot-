<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FADI PRO - Instant Builder</title>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: white; text-align: center; padding: 50px; }
        .card { background: #1e293b; padding: 30px; border-radius: 15px; border: 1px solid #38bdf8; display: inline-block; width: 400px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; }
        .btn { background: #38bdf8; color: #0f172a; padding: 15px 30px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        #status { margin-top: 20px; color: #94a3b8; }
        #downloadBtn { display: none; margin-top: 20px; background: #22c55e; color: white; padding: 15px; text-decoration: none; border-radius: 8px; display: block; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🏗️ صانع التطبيقات الفوري</h2>
        <input type="text" id="name" placeholder="اسم التطبيق">
        <input type="url" id="url" placeholder="رابط الموقع">
        <button class="btn" onclick="makeApp()">إنشاء وتحميل الآن 🚀</button>
        
        <div id="status"></div>
        <a id="downloadBtn" href="#">📥 تحميل ملف APK جاهز</a>
    </div>

    <script>
        async function makeApp() {
            const name = document.getElementById('name').value;
            const url = document.getElementById('url').value;
            const status = document.getElementById('status');
            const dlBtn = document.getElementById('downloadBtn');

            status.innerText = "جاري البناء... انتظر قليلاً (قد يستغرق دقيقة)";
            dlBtn.style.display = 'none';

            // إرسال الطلب للسيرفر الحقيقي
            const response = await fetch('/build', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ appName: name, appUrl: url })
            });

            const result = await response.json();
            if(result.success) {
                status.innerText = "✅ تم البناء بنجاح!";
                dlBtn.href = result.downloadUrl;
                dlBtn.style.display = 'block';
            } else {
                status.innerText = "❌ حدث خطأ في البناء";
            }
        }
    </script>
</body>
</html>
