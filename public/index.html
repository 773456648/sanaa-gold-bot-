<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> منصة النظام المالي المتكامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold-primary: #d4af37; --gold-light: #f3e5ab; --gold-dark: #aa7c11; --bg-dark: #0a0a0c; --surface-dark: rgba(20, 20, 25, 0.7); }
        body { background-color: var(--bg-dark); background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 50%); color: #f0f0f0; font-family: 'Changa', sans-serif; overflow-x: hidden; min-height: 100vh; }
        .gold-text { background: linear-gradient(to left, var(--gold-light), var(--gold-primary), var(--gold-dark)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0px 2px 10px rgba(212, 175, 55, 0.1); }
        .gold-btn { background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark)); color: #000; font-weight: 700; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); }
        .gold-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4); filter: brightness(1.1); }
        .glass-card { background: var(--surface-dark); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); transition: transform 0.3s ease, border-color 0.3s ease; }
        input, select { background: rgba(0, 0, 0, 0.5) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: #fff; border-radius: 16px; padding: 16px; width: 100%; outline: none; transition: all 0.3s ease; }
        input:focus, select:focus { border-color: var(--gold-primary) !important; box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2); }
        .type-select { border: 2px solid rgba(255, 255, 255, 0.05); background: rgba(0, 0, 0, 0.3); transition: all 0.3s ease; cursor: pointer; }
        .type-select.active { border-color: var(--gold-primary); background: rgba(212, 175, 55, 0.08); transform: scale(1.02); }
        .tafqit-box { font-size: 12px; color: var(--gold-light); margin-top: 8px; margin-right: 12px; font-weight: 500; }
        #toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 250px; padding: 16px 20px; border-radius: 12px; background: rgba(15, 15, 20, 0.95); border-right: 4px solid var(--gold-primary); color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 12px; transform: translateX(-120%); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .toast.show { transform: translateX(0); }
        .fade-in { animation: fadeIn 0.8s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="toast-container"></div>

    <div id="auth-ui" class="max-w-6xl mx-auto mt-4 space-y-12 fade-in">
        <div class="text-center space-y-2">
            <h1 class="text-7xl md:text-8xl font-black gold-text italic tracking-tighter">HEIBA</h1>
            <p class="text-xs md:text-sm text-gray-400 tracking-widest uppercase font-light">The Sovereign Financial Platform</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 md:gap-12 items-center">
            <div class="glass-card p-8 md:p-10 space-y-8 relative overflow-hidden">
                <div class="text-center">
                    <h2 class="text-2xl font-bold mb-1">تسجيل الدخول</h2>
                    <p class="text-sm text-gray-500">ادخل بياناتك للمتابعة</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div id="sel-merchant" onclick="setType('merchant')" class="type-select active p-4 rounded-2xl text-center flex flex-col items-center gap-2">
                        <span class="text-3xl">🏪</span><span class="text-sm font-bold">حساب تاجر</span>
                    </div>
                    <div id="sel-debtor" onclick="setType('debtor')" class="type-select p-4 rounded-2xl text-center flex flex-col items-center gap-2">
                        <span class="text-3xl">👤</span><span class="text-sm font-bold">حساب مواطن</span>
                    </div>
                </div>
                <div class="space-y-5">
                    <input id="u-name" type="text" placeholder="الاسم الكامل">
                    <div class="relative">
                        <input id="u-pass" type="password" placeholder="كلمة المرور">
                        <button onclick="togglePass('u-pass')" class="absolute left-4 top-1/2 -translate-y-1/2">👁️</button>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="doAuth('login')" class="bg-zinc-800 py-4 rounded-xl font-bold">تسجيل الدخول</button>
                    <button onclick="doAuth('reg')" class="gold-btn py-4 rounded-xl">إنشاء حساب</button>
                </div>
            </div>
            <div class="p-4"><h3 class="text-3xl font-black gold-text mb-4">لماذا نظام الهيبة؟</h3><p class="text-gray-400 border-r-4 border-[#d4af37] pr-4 bg-white/5 p-4 rounded-xl">نظام مالي متطور يحفظ حقوق التاجر والمواطن بدقة متناهية وسرية تامة.</p></div>
        </div>
    </div>

    <div id="main-ui" class="hidden max-w-7xl mx-auto space-y-6 fade-in">
        <header class="flex justify-between items-center glass-card p-4 md:p-6 gap-4">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 gold-btn rounded-2xl flex items-center justify-center text-black font-black text-3xl">H</div>
                <div>
                    <h2 id="display-name" class="text-xl md:text-2xl font-black text-white flex items-center"></h2>
                    <span id="role-tag" class="text-[10px] text-[#d4af37] font-bold"></span>
                </div>
            </div>
            <button onclick="logout()" class="bg-red-900/20 text-red-400 px-6 py-2 rounded-xl text-sm font-bold">خروج</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-card p-6 space-y-3">
                    <div class="flex justify-between p-4 bg-blue-900/10 rounded-xl border border-blue-500/10"><span class="text-xs">يمني</span><span id="gt-yer" class="font-black text-blue-400">0</span></div>
                    <div class="flex justify-between p-4 bg-green-900/10 rounded-xl border border-green-500/10"><span class="text-xs">دولار</span><span id="gt-usd" class="font-black text-green-400">0</span></div>
                    <div class="flex justify-between p-4 bg-orange-900/10 rounded-xl border border-orange-500/10"><span class="text-xs">سعودي</span><span id="gt-sar" class="font-black text-orange-400">0</span></div>
                </div>
                <div class="glass-card p-6 min-h-[400px]">
                    <div id="merchant-tools" class="hidden mb-4 flex gap-2">
                        <input id="target-search" placeholder="اسم المواطن...">
                        <button onclick="addTarget()" class="gold-btn px-4 rounded-xl">+</button>
                    </div>
                    <div id="main-list" class="space-y-2 overflow-y-auto max-h-[400px]"></div>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div id="empty-hint" class="glass-card p-24 text-center text-gray-500">الرجاء اختيار حساب للمتابعة</div>
                <div id="details-pane" class="hidden glass-card p-6 md:p-8 flex flex-col min-h-[500px]">
                    <h3 id="active-target-name" class="text-2xl font-black mb-6"></h3>
                    <div id="ops-list" class="flex-grow space-y-3 overflow-y-auto mb-6"></div>
                    <div id="add-form" class="hidden bg-zinc-900 p-5 rounded-2xl border border-white/10 space-y-4">
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                            <input id="op-amt" type="number" placeholder="0.00">
                            <select id="op-cur"><option value="YER">يمني</option><option value="USD">دولار</option><option value="SAR">سعودي</option></select>
                            <select id="op-type"><option value="دين">عليه (دين)</option><option value="سداد">له (سداد)</option></select>
                        </div>
                        <div class="flex gap-2">
                            <input id="op-note" class="flex-grow" placeholder="البيان (اختياري)">
                            <button onclick="saveOp()" class="gold-btn px-8 rounded-xl">تثبيت</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let user = null, activeTarget = null, userType = 'merchant', discoveredData = [];
        
        function showToast(m, type='error') {
            const c = document.getElementById('toast-container'), t = document.createElement('div');
            t.className = `toast ${type === 'success' ? 'success' : 'error'} show`;
            t.innerHTML = `<span>${m}</span>`;
            c.appendChild(t); setTimeout(() => { t.remove(); }, 3000);
        }

        function togglePass(id) { const i = document.getElementById(id); i.type = i.type === 'password' ? 'text' : 'password'; }
        function setType(t) { userType = t; document.getElementById('sel-merchant').classList.toggle('active', t === 'merchant'); document.getElementById('sel-debtor').classList.toggle('active', t === 'debtor'); }

        window.onload = () => { const s = localStorage.getItem('heiba_auth_session'); if(s) { user = JSON.parse(s); start(); } };

        async function doAuth(action) {
            const name = document.getElementById('u-name').value.trim();
            const password = document.getElementById('u-pass').value;
            if(!name || !password) return showToast("أدخل البيانات");

            const res = await fetch('/api/auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, password, type: userType, action }) });
            const data = await res.json();
            if(res.ok) { user = data; localStorage.setItem('heiba_auth_session', JSON.stringify(user)); start(); } 
            else showToast(data.error);
        }

        function start() {
            document.getElementById('auth-ui').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            
            // إضافة الصح الأزرق لو الحساب موثق
            const badge = user.verified ? '<span class="text-blue-500 mr-2">✔️</span>' : '';
            document.getElementById('display-name').innerHTML = user.name + badge;
            document.getElementById('role-tag').innerText = user.type === 'merchant' ? '👑 رتبة تاجر' : '👤 رتبة مواطن';
            
            if(user.type === 'merchant') {
                document.getElementById('merchant-tools').classList.remove('hidden');
                document.getElementById('add-form').classList.remove('hidden');
                renderList();
            } else { fetchAutoDebts(); setInterval(fetchAutoDebts, 5000); }
        }

        function renderList() {
            const t = [...new Set(user.myRecords.map(r => r.targetName))];
            document.getElementById('main-list').innerHTML = t.map(n => `<div onclick="showDetails('${n}')" class="p-4 bg-zinc-900 rounded-xl cursor-pointer border border-white/5 hover:border-yellow-500 transition">${n}</div>`).join('');
        }

        async function fetchAutoDebts() {
            const res = await fetch(`/api/auto-discover?debtorName=${encodeURIComponent(user.name)}`);
            discoveredData = await res.json();
            document.getElementById('main-list').innerHTML = discoveredData.map(m => `<div onclick="showDetails('${m.merchantName}')" class="p-4 bg-zinc-900 rounded-xl mb-2 border border-blue-500">${m.merchantName}</div>`).join('');
        }

        function showDetails(name) {
            activeTarget = name;
            document.getElementById('empty-hint').classList.add('hidden');
            document.getElementById('details-pane').classList.remove('hidden');
            document.getElementById('active-target-name').innerText = name;
            let recs = user.type === 'merchant' ? user.myRecords.filter(r => r.targetName === name) : (discoveredData.find(m => m.merchantName === name)?.records || []);
            document.getElementById('ops-list').innerHTML = recs.map(r => `<div class="p-4 bg-zinc-800 rounded-xl border-r-4 ${r.type==='دين'?'border-red-500':'border-green-500'} flex justify-between"><div>${r.note || r.type}</div><div class="font-bold ${r.type==='دين'?'text-red-400':'text-green-400'}">${r.amount} ${r.currency}</div></div>`).reverse().join('');
            calculateGrand(recs);
        }

        function calculateGrand(recs) {
            let y=0, u=0, s=0;
            recs.forEach(r => { const a = parseFloat(r.amount); const d = r.type==='دين'; if(r.currency==='YER') y+=d?a:-a; else if(r.currency==='USD') u+=d?a:-a; else s+=d?a:-a; });
            document.getElementById('gt-yer').innerText = y.toLocaleString();
            document.getElementById('gt-usd').innerText = u.toLocaleString();
            document.getElementById('gt-sar').innerText = s.toLocaleString();
        }

        function addTarget() { const n = document.getElementById('target-search').value.trim(); if(n) { activeTarget = n; showDetails(n); document.getElementById('target-search').value = ""; } }

        async function saveOp() {
            const a = document.getElementById('op-amt').value;
            if(!a || !activeTarget) return;
            user.myRecords.push({ id: Date.now(), targetName: activeTarget, amount: a, currency: document.getElementById('op-cur').value, type: document.getElementById('op-type').value, note: document.getElementById('op-note').value, date: new Date().toISOString() });
            showDetails(activeTarget);
            await fetch('/api/sync', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId: user.id, myRecords: user.myRecords }) });
            document.getElementById('op-amt').value = ""; document.getElementById('op-note').value = "";
        }

        function logout() { localStorage.removeItem('heiba_auth_session'); location.reload(); }
    </script>
</body>
</html>
