<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الهيبة | المزامنة الملكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #060608; color: #f0f0f0; font-family: 'Changa', sans-serif; }
        .gold-text { color: #d4af37; }
        .gold-btn { background: linear-gradient(135deg, #d4af37, #b8860b); color: #000; font-weight: bold; }
        .glass-card { background: rgba(15, 15, 20, 0.98); border: 1px solid #222; border-radius: 20px; }
        input, select { background: #111 !important; border: 1px solid #333 !important; color: #fff; border-radius: 12px; padding: 12px; width: 100%; outline: none; }
        .type-select.active { border-color: #d4af37; background: rgba(212, 175, 55, 0.05); }
        .type-select { border: 2px solid #333; cursor: pointer; padding: 15px; text-align: center; border-radius: 15px; transition: 0.3s; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .verified-badge { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body class="p-4">

    <!-- واجهة الدخول -->
    <div id="auth-ui" class="max-w-md mx-auto mt-10 space-y-8">
        <div class="text-center">
            <h1 class="text-6xl font-black gold-text italic">HEIBA</h1>
            <p class="text-[10px] text-gray-500 tracking-[0.3em] uppercase mt-2">Royal Financial Engine</p>
        </div>

        <div class="glass-card p-8 space-y-6">
            <div class="grid grid-cols-2 gap-3">
                <div id="sel-merchant" onclick="setType('merchant')" class="type-select active">👑 تاجر</div>
                <div id="sel-debtor" onclick="setType('debtor')" class="type-select">👤 مواطن</div>
            </div>
            <input id="u-name" type="text" placeholder="اسم المستخدم">
            <input id="u-pass" type="password" placeholder="كلمة المرور">
            
            <label class="flex items-center gap-2 text-xs text-gray-400 cursor-pointer">
                <input type="checkbox" id="save-session-check" checked class="w-4 h-4">
                حفظ بيانات الدخول (البقاء متصلاً)
            </label>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="doAuth('login')" class="bg-zinc-800 py-3 rounded-xl font-bold hover:bg-zinc-700">دخول</button>
                <button onclick="doAuth('reg')" class="gold-btn py-3 rounded-xl hover:opacity-90">تسجيل</button>
            </div>

            <div id="saved-sessions-div" class="hidden pt-4 border-t border-white/5 space-y-2">
                <p class="text-[9px] text-gray-600 text-center uppercase tracking-widest">جلسات محفوظة</p>
                <div id="sessions-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div id="main-ui" class="hidden max-w-6xl mx-auto space-y-4">
        <header class="glass-card p-4 flex justify-between items-center border-b border-yellow-900/20">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 gold-btn rounded-lg flex items-center justify-center text-black font-bold">H</div>
                <div>
                    <h2 id="display-name" class="font-bold gold-text text-xl"></h2>
                    <p id="role-tag" class="text-[9px] opacity-50 uppercase tracking-widest"></p>
                </div>
            </div>
            <div class="flex gap-2">
                <button id="verify-nav-btn" class="hidden bg-green-900/20 text-green-500 px-3 py-1 rounded-lg text-[10px] border border-green-900" onclick="openModal('verify-modal')">مطابقة بصمة ✅</button>
                <button onclick="logout()" class="bg-red-900/20 text-red-500 px-3 py-1 rounded-lg text-[10px] font-bold">خروج</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <!-- الجانب الأيمن: القائمة -->
            <div class="lg:col-span-4 space-y-4">
                <div class="glass-card p-4">
                    <p class="text-[10px] text-gray-500 mb-3 uppercase font-bold">الرصيد العام</p>
                    <div id="grand-totals" class="grid grid-cols-1 gap-2"></div>
                </div>
                <div class="glass-card p-4 min-h-[350px]">
                    <div id="merchant-tools" class="hidden mb-4">
                        <input id="target-search" placeholder="اسم المواطن..." onchange="addTarget()">
                    </div>
                    <div id="main-list" class="space-y-2"></div>
                </div>
            </div>

            <!-- الجانب الأيسر: التفاصيل -->
            <div class="lg:col-span-8">
                <div id="details-pane" class="hidden glass-card p-6 min-h-[550px] flex flex-col shadow-2xl">
                    <div class="flex justify-between items-start mb-6 border-b border-white/5 pb-6">
                        <div>
                            <h3 id="active-target-name" class="text-3xl font-black gold-text italic"></h3>
                            <div id="target-totals" class="flex gap-3 mt-4"></div>
                        </div>
                        <div id="debtor-actions" class="hidden">
                            <button onclick="openSmartStampModal()" class="gold-btn px-6 py-2 rounded-xl text-xs shadow-lg">توثيق مبلغ حدد ✋</button>
                        </div>
                    </div>
                    
                    <div id="ops-list" class="flex-grow space-y-3 overflow-y-auto max-h-[400px] mb-6 pr-2"></div>

                    <div id="add-form" class="hidden bg-white/5 p-4 rounded-2xl border border-white/5 space-y-4">
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                            <input id="op-amt" type="number" placeholder="المبلغ">
                            <select id="op-cur"><option value="YER">يمني</option><option value="USD">دولار</option><option value="SAR">سعودي</option></select>
                            <select id="op-type"><option value="دين">دين</option><option value="سداد">سداد</option></select>
                        </div>
                        <button onclick="saveOp()" class="gold-btn w-full py-3 rounded-xl text-sm">تثبيت العملية في السجل</button>
                    </div>
                </div>
                <div id="empty-hint" class="glass-card p-24 text-center text-gray-700 italic border-dashed border-gray-800">اختر حساباً لمتابعة السجلات الحية...</div>
            </div>
        </div>
    </div>

    <!-- نافذة توثيق مبلغ محدد -->
    <div id="smart-stamp-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-50 backdrop-blur-md">
        <div class="glass-card p-8 w-full max-w-sm space-y-6">
            <h3 class="gold-text font-bold text-center text-xl">توثيق مبلغ حدد</h3>
            <p class="text-[10px] text-gray-500 text-center">سيتم خصم هذا المبلغ من الديون وتحويله لموثق فور المطابقة</p>
            <div class="space-y-4">
                <select id="smart-cur"><option value="YER">يمني</option><option value="USD">دولار</option><option value="SAR">سعودي</option></select>
                <input id="smart-amt" type="number" placeholder="أدخل المبلغ">
                <input id="smart-code" placeholder="أدخل كود البصمة الخاص بك">
            </div>
            <div class="flex gap-2">
                <button onclick="submitSmartStamp()" class="gold-btn flex-grow py-4 rounded-xl">إرسال البصمة</button>
                <button onclick="closeModal('smart-stamp-modal')" class="bg-zinc-800 px-6 rounded-xl text-xs">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة مطابقة البصمة (للتاجر) -->
    <div id="verify-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-50 backdrop-blur-md">
        <div class="glass-card p-8 w-full max-w-sm space-y-4">
            <h3 class="text-green-500 font-bold text-center text-xl italic underline">تفعيل ومطابقة البصمة</h3>
            <input id="verify-code-input" placeholder="أدخل كود البصمة المستلم">
            <button onclick="processVerify()" class="gold-btn w-full py-4 rounded-xl shadow-green-900/20 shadow-lg">تأكيد المطابقة والخصم الفوري</button>
            <button onclick="closeModal('verify-modal')" class="w-full text-xs text-gray-600 text-center py-2">تراجع</button>
        </div>
    </div>

    <script>
        let user = null; let activeTarget = null; let userType = 'merchant'; let discoveredData = [];
        
        window.onload = () => {
            const saved = localStorage.getItem('heiba_active_session');
            if(saved) {
                const s = JSON.parse(saved);
                document.getElementById('u-name').value = s.name;
                document.getElementById('u-pass').value = s.pass;
                userType = s.type;
                doAuth('login');
            }
            loadSessionsList();
        };

        function loadSessionsList() {
            const list = JSON.parse(localStorage.getItem('heiba_all_sessions') || '[]');
            if(list.length > 0) {
                document.getElementById('saved-sessions-div').classList.remove('hidden');
                document.getElementById('sessions-list').innerHTML = list.map(s => `
                    <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/5">
                        <div onclick="quickLogin('${s.name}','${s.pass}','${s.type}')" class="cursor-pointer flex-grow">
                            <p class="text-sm font-bold">${s.name}</p>
                            <p class="text-[8px] opacity-40 uppercase">${s.type === 'merchant' ? '👑 تاجر' : '👤 مواطن'}</p>
                        </div>
                        <button onclick="removeSession('${s.name}')" class="text-red-900/60 hover:text-red-500 p-2">✕</button>
                    </div>`).join('');
            }
        }

        function quickLogin(n, p, t) {
            document.getElementById('u-name').value = n;
            document.getElementById('u-pass').value = p;
            userType = t;
            doAuth('login');
        }

        async function doAuth(action) {
            const name = document.getElementById('u-name').value.trim();
            const password = document.getElementById('u-pass').value;
            if(!name || !password) return;

            const res = await fetch('/api/auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, password, type: userType, action }) });
            const data = await res.json();
            
            if(res.ok) {
                if(document.getElementById('save-session-check').checked) {
                    localStorage.setItem('heiba_active_session', JSON.stringify({name, pass: password, type: userType}));
                    let all = JSON.parse(localStorage.getItem('heiba_all_sessions') || '[]');
                    if(!all.find(x => x.name === name)) all.push({name, pass: password, type: userType});
                    localStorage.setItem('heiba_all_sessions', JSON.stringify(all));
                }
                user = data; start();
            } else alert(data.error);
        }

        function start() {
            document.getElementById('auth-ui').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('display-name').innerText = user.name;
            document.getElementById('role-tag').innerText = user.type === 'merchant' ? '👑 رتبة تاجر ملكي' : '👤 رتبة مواطن مستخدم';
            
            if(user.type === 'merchant') {
                document.getElementById('merchant-tools').classList.remove('hidden');
                document.getElementById('add-form').classList.remove('hidden');
                document.getElementById('verify-nav-btn').classList.remove('hidden');
                renderList(); calculateGrand();
            } else {
                document.getElementById('debtor-actions').classList.remove('hidden');
                setInterval(fetchAuto, 3000); fetchAuto();
            }
        }

        async function fetchAuto() {
            const res = await fetch(`/api/auto-discover?debtorName=${encodeURIComponent(user.name)}`);
            discoveredData = await res.json();
            document.getElementById('main-list').innerHTML = discoveredData.map(m => `
                <div onclick="showDetails('${m.merchantName}')" class="p-4 bg-zinc-900 border border-white/5 rounded-2xl mb-2 cursor-pointer hover:border-blue-500 transition ${activeTarget === m.merchantName ? 'border-blue-500' : ''}">
                    <p class="font-bold text-sm italic">${m.merchantName}</p>
                    <p class="text-[8px] text-blue-500 font-bold mt-1 uppercase">مزامنة حية 📶</p>
                </div>`).join('');
            calculateGrand(); if(activeTarget) showDetails(activeTarget);
        }

        function calculateGrand() {
            let rs = (user.type === 'merchant') ? user.myRecords : [].concat(...discoveredData.map(m => m.records));
            let stats = { YER: {t:0, v:0}, USD: {t:0, v:0}, SAR: {t:0, v:0} };
            rs.forEach(r => {
                let a = parseFloat(r.amount); let d = r.type === 'دين';
                stats[r.currency].t += d ? a : -a;
                if(r.isVerified) stats[r.currency].v += d ? a : -a;
            });
            document.getElementById('grand-totals').innerHTML = Object.keys(stats).map(c => `
                <div class="stat-box flex justify-between items-center border border-white/5">
                    <span class="text-[10px] font-bold opacity-40">${c}</span>
                    <div class="text-right">
                        <p class="text-sm font-black">${stats[c].t.toLocaleString()}</p>
                        <p class="text-[9px] text-green-500 font-bold italic">الموثق: ${stats[c].v.toLocaleString()} 🔐</p>
                    </div>
                </div>`).join('');
        }

        function showDetails(name) {
            activeTarget = name; document.getElementById('empty-hint').classList.add('hidden'); document.getElementById('details-pane').classList.remove('hidden');
            document.getElementById('active-target-name').innerText = name;
            let rs = (user.type === 'merchant') ? user.myRecords.filter(r => r.targetName === name) : (discoveredData.find(m => m.merchantName === name)?.records || []);
            
            let stats = { YER: {t:0, v:0}, USD: {t:0, v:0}, SAR: {t:0, v:0} };
            document.getElementById('ops-list').innerHTML = rs.map(r => {
                let a = parseFloat(r.amount); let d = r.type === 'دين';
                stats[r.currency].t += d ? a : -a; if(r.isVerified) stats[r.currency].v += d ? a : -a;
                return `<div class="p-4 bg-zinc-900/50 rounded-2xl flex justify-between items-center border-r-4 ${d?'border-red-500':'border-green-500'}">
                    <div>
                        <p class="text-sm font-bold">${r.type}</p>
                        <p class="text-[9px] opacity-30">${new Date(r.id*1).toLocaleString()}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xl font-black ${d?'text-red-500':'text-green-500'}">${d?'+':'-'}${a.toLocaleString()}</p>
                        ${r.isVerified ? `<span class="verified-badge">موثق كود: ${r.authCode}</span>` : ''}
                    </div>
                </div>`;
            }).reverse().join('');

            document.getElementById('target-totals').innerHTML = Object.keys(stats).map(c => `
                <div class="stat-box text-center min-w-[80px]">
                    <p class="text-[8px] opacity-40 font-bold">${c}</p>
                    <p class="text-xs font-bold">${stats[c].t}</p>
                    <p class="text-[9px] text-green-500 font-bold mt-1">🔐 ${stats[c].v}</p>
                </div>`).join('');
        }

        async function saveOp() {
            const a = document.getElementById('op-amt').value; if(!a || !activeTarget) return;
            const op = { id: Date.now().toString(), targetName: activeTarget, amount: a, currency: document.getElementById('op-cur').value, type: document.getElementById('op-type').value, isVerified: false };
            const res = await fetch('/api/sync', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId: user.id, op }) });
            user.myRecords = (await res.json()).newRecords; showDetails(activeTarget); calculateGrand();
            document.getElementById('op-amt').value = "";
        }

        function openSmartStampModal() { openModal('smart-stamp-modal'); }
        async function submitSmartStamp() {
            const cur = document.getElementById('smart-cur').value;
            const amt = document.getElementById('smart-amt').value;
            const code = document.getElementById('smart-code').value.trim();
            if(!amt || !code) return;
            const res = await fetch('/api/verify-auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'create_smart', debtorName: user.name, merchantName: activeTarget, amount: amt, currency: cur, authCode: code }) });
            if(res.ok) { alert("تم إرسال بصمة المبلغ بنجاح"); closeModal('smart-stamp-modal'); } else alert((await res.json()).error);
        }

        async function processVerify() {
            const code = document.getElementById('verify-code-input').value.trim();
            if(!code) return;
            const res = await fetch('/api/verify-auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'check', authCode: code, merchantId: user.id }) });
            if(res.ok) { 
                user.myRecords = (await res.json()).newRecords; 
                showDetails(activeTarget); 
                calculateGrand(); 
                closeModal('verify-modal'); 
                document.getElementById('verify-code-input').value = "";
            } else alert("الكود خاطئ أو غير مخصص لمواطن لديك");
        }

        function setType(t) { userType = t; document.getElementById('sel-merchant').classList.toggle('active', t==='merchant'); document.getElementById('sel-debtor').classList.toggle('active', t==='debtor'); }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function renderList() { const ts = [...new Set(user.myRecords.map(r => r.targetName))]; document.getElementById('main-list').innerHTML = ts.map(n => `<div onclick="showDetails('${n}')" class="p-4 bg-zinc-900 rounded-2xl mb-2 cursor-pointer border border-white/5 hover:border-yellow-600 transition ${activeTarget===n?'border-yellow-600 bg-black':''}">${n}</div>`).join(''); }
        function addTarget() { const n = document.getElementById('target-search').value.trim(); if(!n) return; activeTarget = n; showDetails(n); renderList(); document.getElementById('target-search').value = ""; }
        function logout() { localStorage.removeItem('heiba_active_session'); location.reload(); }
        function removeSession(n) { let all = JSON.parse(localStorage.getItem('heiba_all_sessions') || '[]'); all = all.filter(x => x.name !== n); localStorage.setItem('heiba_all_sessions', JSON.stringify(all)); loadSessionsList(); }
    </script>
</body>
</html>
