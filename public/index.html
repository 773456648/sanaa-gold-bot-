<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ منصة فادي للاتصال الخاص</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background: #0a1928; color: white; height: 100vh; display: flex; flex-direction: column; }
        
        /* واجهة الدخول */
        #login-screen { position: fixed; inset: 0; background: #0a1928; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .card { background: #1e3a5f; padding: 40px; border-radius: 20px; border: 2px solid #ffd700; text-align: center; width: 90%; max-width: 400px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-size: 1rem; }
        
        /* واجهة الاتصال */
        #app { display: none; flex-direction: column; height: 100vh; }
        #video-grid { display: flex; gap: 10px; padding: 10px; justify-content: center; background: #000; }
        video { width: 48%; border: 2px solid #ffd700; border-radius: 10px; background: #222; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; background: rgba(255,255,255,0.05); }
        .msg { background: #1e3a5f; padding: 10px; margin-bottom: 5px; border-radius: 8px; border-right: 4px solid #ffd700; }
        .input-area { display: flex; padding: 10px; gap: 10px; background: #1e3a5f; }
        button { padding: 12px 25px; border-radius: 10px; border: none; background: #ffd700; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="card">
        <h2 style="color:#ffd700">دخول الغرفة</h2>
        <input type="text" id="room" placeholder="رقم الغرفة">
        <input type="password" id="pass" placeholder="كلمة السر">
        <button onclick="join()" style="width:100%">دخول 🚀</button>
    </div>
</div>

<div id="app">
    <div id="video-grid">
        <video id="local" autoplay muted playsinline></video>
        <video id="remote" autoplay playsinline></video>
    </div>
    <div style="text-align:center; padding: 10px;">
        <button id="callBtn" onclick="startCall()" style="background:#00ff88">📞 بدء الفيديو</button>
    </div>
    <div id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="msg" placeholder="اكتب رسالتك...">
        <button onclick="send()">إرسال</button>
    </div>
</div>

<script>
    const socket = io();
    let pc, localStream, roomID;

    function join() {
        roomID = document.getElementById('room').value;
        if(!roomID) return alert("ادخل رقم الغرفة!");
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        socket.emit('join-room', { roomID });
    }

    function send() {
        const text = document.getElementById('msg').value;
        if(text) {
            socket.emit('chat-message', { roomID, user: 'فادي', text });
            document.getElementById('msg').value = '';
        }
    }

    socket.on('chat-message', d => {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<b>${d.user}:</b> ${d.text}`;
        document.getElementById('chat-box').appendChild(div);
    });

    async function startCall() {
        localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('local').srcObject = localStream;
        pc = new RTCPeerConnection({ iceServers: [{urls:'stun:stun.l.google.com:19302'}] });
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        pc.onicecandidate = e => e.candidate && socket.emit('candidate', {roomID, candidate:e.candidate});
        pc.ontrack = e => document.getElementById('remote').srcObject = e.streams[0];
        
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('offer', {roomID, offer});
    }

    socket.on('offer', async o => {
        if(!pc) await startCall();
        await pc.setRemoteDescription(new RTCSessionDescription(o));
        const a = await pc.createAnswer();
        await pc.setLocalDescription(a);
        socket.emit('answer', {roomID, answer:a});
    });

    socket.on('answer', a => pc.setRemoteDescription(new RTCSessionDescription(a)));
    socket.on('candidate', c => pc.addIceCandidate(new RTCIceCandidate(c)));
</script>
</body>
</html>
