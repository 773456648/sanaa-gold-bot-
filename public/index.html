<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الهيبة | نظام البصمة الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #060608; color: #f0f0f0; font-family: 'Changa', sans-serif; overflow-x: hidden; }
        .gold-text { color: #d4af37; }
        .gold-btn { background: linear-gradient(135deg, #d4af37, #b8860b); color: #000; font-weight: bold; }
        .glass-card { background: rgba(15, 15, 20, 0.98); border: 1px solid #222; border-radius: 28px; }
        input, select { background: #111 !important; border: 1px solid #333 !important; color: #fff; border-radius: 16px; padding: 16px; width: 100%; outline: none; }
        .type-select { border: 2px solid #333; transition: 0.3s; cursor: pointer; }
        .type-select.active { border-color: #d4af37; background: rgba(212, 175, 55, 0.05); }
        .tafqit-box { font-size: 11px; color: #d4af37; margin-top: 5px; margin-right: 10px; font-weight: bold; font-style: italic; }
        .verified-stamp { border: 1px dashed #10b981; color: #10b981; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; }
        .expired-stamp { border: 1px solid #ef4444; color: #ef4444; opacity: 0.5; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="auth-ui" class="max-w-6xl mx-auto mt-4 space-y-12">
        <div class="text-center">
            <h1 class="text-8xl font-black gold-text italic tracking-tighter">HEIBA</h1>
            <p class="text-[12px] text-gray-500 tracking-[0.5em] uppercase mt-4">The Sovereign Financial Platform</p>
        </div>
        <div class="glass-card p-10 max-w-xl mx-auto space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div id="sel-merchant" onclick="setType('merchant')" class="type-select active p-4 rounded-2xl text-center text-xs">تاجر 👑</div>
                <div id="sel-debtor" onclick="setType('debtor')" class="type-select p-4 rounded-2xl text-center text-xs">مواطن 👤</div>
            </div>
            <input id="u-name" type="text" placeholder="الاسم الكامل">
            <input id="u-pass" type="password" placeholder="كلمة المرور">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="doAuth('login')" class="bg-zinc-800 py-4 rounded-2xl font-bold">دخول</button>
                <button onclick="doAuth('reg')" class="gold-btn py-4 rounded-2xl">تسجيل جديد</button>
            </div>
        </div>
    </div>

    <div id="main-ui" class="hidden max-w-7xl mx-auto space-y-6">
        <header class="flex justify-between items-center glass-card p-6">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 gold-btn rounded-xl flex items-center justify-center text-black font-black">H</div>
                <h2 id="display-name" class="text-xl font-bold gold-text"></h2>
            </div>
            <div class="flex gap-2">
                <button onclick="openModal('search-stamp-modal')" class="bg-zinc-900 p-3 rounded-xl border border-white/5">🔍 بحث بصمة</button>
                <button id="verify-nav-btn" onclick="openModal('verify-modal')" class="hidden bg-green-900/20 text-green-500 px-4 py-2 rounded-xl text-xs border border-green-500/20">مطابقة ✅</button>
                <button onclick="logout()" class="bg-red-900/20 text-red-500 px-4 py-2 rounded-xl text-xs">خروج</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-4">
                <div class="glass-card p-6">
                    <p class="text-[10px] text-gray-500 mb-4 uppercase">الأرصدة الصافية</p>
                    <div id="grand-totals" class="space-y-2"></div>
                </div>
                <div class="glass-card p-4 min-h-[300px]">
                    <div id="merchant-tools" class="hidden mb-4"><input id="target-search" placeholder="إضافة مواطن..." onchange="addTarget()"></div>
                    <div id="main-list" class="space-y-2"></div>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div id="details-pane" class="hidden glass-card p-8 min-h-[500px] flex flex-col">
                    <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-4">
                        <h3 id="active-target-name" class="text-2xl font-black gold-text italic"></h3>
                        <button id="stamp-all-btn" onclick="openStampModal('all')" class="hidden bg-blue-600 text-white px-3 py-1 rounded-lg text-[10px]">بصمة الكل ✋</button>
                    </div>
                    <div id="ops-list" class="flex-grow space-y-3 overflow-y-auto mb-6"></div>
                    <div id="add-form" class="hidden bg-black/40 p-5 rounded-2xl border border-white/5 space-y-4">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                            <input id="op-amt" type="number" placeholder="المبلغ" oninput="applyTafqit()">
                            <select id="op-cur"><option value="YER">يمني</option><option value="USD">دولار</option><option value="SAR">سعودي</option></select>
                            <select id="op-type"><option value="دين">دين</option><option value="سداد">سداد</option></select>
                            <input id="op-note" placeholder="البيان">
                        </div>
                        <div id="tafqit-text" class="tafqit-box"></div>
                        <button onclick="saveOp()" class="gold-btn w-full py-4 rounded-xl">تثبيت العملية</button>
                    </div>
                </div>
                <div id="empty-hint" class="glass-card p-20 text-center text-gray-700 italic">اختر حساباً للمتابعة...</div>
            </div>
        </div>
    </div>

    <div id="search-stamp-modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center z-50 p-4">
        <div class="glass-card w-full max-w-md p-8 space-y-4">
            <h3 class="gold-text font-bold">🔍 محرك البحث عن البصمات</h3>
            <input id="search-stamp-input" placeholder="أدخل كود البصمة للبحث...">
            <button onclick="searchStamp()" class="gold-btn w-full py-3 rounded-xl">بحث في السجلات</button>
            <div id="search-result" class="hidden p-4 bg-white/5 rounded-xl text-xs space-y-2 border border-white/10"></div>
            <button onclick="closeModal('search-stamp-modal')" class="w-full text-gray-500 text-xs">إغلاق</button>
        </div>
    </div>

    <div id="verify-modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center z-50 p-4">
        <div class="glass-card w-full max-w-md p-8 space-y-4">
            <h3 class="text-green-500 font-bold">تفعيل كود البصمة ✅</h3>
            <input id="verify-code-input" placeholder="أدخل الكود المستلم من المواطن">
            <button onclick="processVerify()" class="gold-btn w-full py-4 rounded-xl">تفعيل ومطابقة</button>
            <button onclick="closeModal('verify-modal')" class="w-full text-gray-500 text-xs">إلغاء</button>
        </div>
    </div>

    <div id="stamp-modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center z-50 p-4">
        <div class="glass-card w-full max-w-md p-8 space-y-4">
            <h3 class="gold-text font-bold text-center">توليد بصمة توثيق ✋</h3>
            <p class="text-[10px] text-gray-500 text-center">لا يمكن تغيير الكود أو إعادة البصمة لنفس العملية إلا بعد 48 ساعة.</p>
            <input id="stamp-code-input" placeholder="اكتب كود البصمة (يجب أن يكون فريداً)">
            <button onclick="submitStamp()" class="gold-btn w-full py-4 rounded-xl">إرسال البصمة للنظام</button>
            <button onclick="closeModal('stamp-modal')" class="w-full text-gray-500 text-xs text-center">تراجع</button>
        </div>
    </div>

    <script>
        let user = null; let activeTarget = null; let userType = 'merchant'; let discoveredData = [];
        let currentStampOpId = null;

        // الدوال الأساسية (دخول، تفقيط، إلخ)
        function setType(t) { userType = t; document.getElementById('sel-merchant').classList.toggle('active', t==='merchant'); document.getElementById('sel-debtor').classList.toggle('active', t==='debtor'); }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function logout() { localStorage.clear(); location.reload(); }

        // دالة التفقيط المبسطة
        function applyTafqit() {
            const v = document.getElementById('op-amt').value;
            document.getElementById('tafqit-text').innerText = v > 0 ? "تنبيه: سيتم الخصم من البصمات الموثقة أولاً في حال كان سداداً." : "";
        }

        async function doAuth(action) {
            const name = document.getElementById('u-name').value;
            const password = document.getElementById('u-pass').value;
            const res = await fetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, password, type: userType, action }) });
            const data = await res.json();
            if(res.ok) { user = data; start(); } else alert(data.error);
        }

        function start() {
            document.getElementById('auth-ui').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('display-name').innerText = user.name;
            if(user.type === 'merchant') {
                document.getElementById('merchant-tools').classList.remove('hidden');
                document.getElementById('add-form').classList.remove('hidden');
                document.getElementById('verify-nav-btn').classList.remove('hidden');
                renderList(); calculateTotals(user.myRecords);
            } else {
                document.getElementById('stamp-all-btn').classList.remove('hidden');
                fetchAuto(); setInterval(fetchAuto, 5000);
            }
        }

        function calculateTotals(recs) {
            let totals = { YER:0, USD:0, SAR:0, V_YER:0, V_USD:0, V_SAR:0 };
            recs.forEach(r => {
                const a = parseFloat(r.amount); const d = r.type==='دين';
                if(r.currency==='YER') { totals.YER += d?a:-a; if(r.isVerified) totals.V_YER += d?a:-a; }
                else if(r.currency==='USD') { totals.USD += d?a:-a; if(r.isVerified) totals.V_USD += d?a:-a; }
                else { totals.SAR += d?a:-a; if(r.isVerified) totals.V_SAR += d?a:-a; }
            });
            document.getElementById('grand-totals').innerHTML = `
                <div class="p-2 bg-blue-500/5 border border-blue-500/10 rounded-xl flex justify-between"><span>يمني:</span><b>${totals.YER}</b></div>
                <div class="text-[9px] text-green-500 px-2 font-bold italic">موثق بالبصمة: ${totals.V_YER}</div>
                <div class="p-2 bg-green-500/5 border border-green-500/10 rounded-xl flex justify-between"><span>دولار:</span><b>${totals.USD}</b></div>
                <div class="text-[9px] text-green-500 px-2 font-bold italic">موثق بالبصمة: ${totals.V_USD}</div>
                <div class="p-2 bg-orange-500/5 border border-orange-500/10 rounded-xl flex justify-between"><span>سعودي:</span><b>${totals.SAR}</b></div>
                <div class="text-[9px] text-green-500 px-2 font-bold italic">موثق بالبصمة: ${totals.V_SAR}</div>
            `;
        }

        function renderList() {
            const t = [...new Set(user.myRecords.map(r => r.targetName))];
            document.getElementById('main-list').innerHTML = t.map(n => `<div onclick="showDetails('${n}')" class="p-3 bg-zinc-900 rounded-xl cursor-pointer ${activeTarget===n?'border border-yellow-600':''}">${n}</div>`).join('');
        }

        async function fetchAuto() {
            const res = await fetch(`/api/auto-discover?name=${user.name}`);
            discoveredData = await res.json();
            let all = []; discoveredData.forEach(m => all = all.concat(m.records)); calculateTotals(all);
            document.getElementById('main-list').innerHTML = discoveredData.map(m => `<div onclick="showDetails('${m.merchantName}')" class="p-3 bg-zinc-900 rounded-xl mb-2 ${activeTarget===m.merchantName?'border border-blue-600':''}">${m.merchantName} <span class="text-[8px] block text-blue-400 font-bold uppercase">Live Sync</span></div>`).join('');
            if(activeTarget) showDetails(activeTarget);
        }

        function showDetails(name) {
            activeTarget = name; document.getElementById('empty-hint').classList.add('hidden'); document.getElementById('details-pane').classList.remove('hidden');
            document.getElementById('active-target-name').innerText = name;
            let recs = (user.type==='merchant') ? user.myRecords.filter(r => r.targetName === name) : (discoveredData.find(m => m.merchantName===name)?.records || []);
            
            document.getElementById('ops-list').innerHTML = recs.map(r => {
                const isD = r.type==='دين';
                let stampIcon = "";
                if(r.isVerified) stampIcon = `<span class="verified-stamp">بصمة مفعلة: ${r.authCode}</span>`;
                else if(user.type==='debtor' && isD) stampIcon = `<button onclick="openStampModal('${r.id}')" class="text-[9px] text-blue-400 underline">إرسال بصمة ✋</button>`;
                
                return `<div class="p-4 bg-zinc-900/50 rounded-2xl border-r-4 ${isD?'border-red-500':'border-green-500'} flex justify-between items-center">
                    <div><p class="font-bold text-sm">${r.note || 'عملية'}</p><div class="mt-1">${stampIcon}</div></div>
                    <div class="text-right"><p class="font-black ${isD?'text-red-500':'text-green-500'}">${isD?'+':'-'}${r.amount}</p><p class="text-[8px] opacity-40 uppercase">${r.currency}</p></div>
                </div>`;
            }).reverse().join('');
        }

        // وظائف البصمة المتطورة
        async function submitStamp() {
            const code = document.getElementById('stamp-code-input').value.trim();
            if(!code) return;
            const res = await fetch('/api/verify-auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action: 'create', debtorName: user.name, merchantName: activeTarget, opId: currentStampOpId, authCode: code }) });
            const data = await res.json();
            if(res.ok) { alert("تم إرسال البصمة! الكود مقفل لمدة 48 ساعة لحمايتك."); closeModal('stamp-modal'); } else alert(data.error);
        }

        async function processVerify() {
            const code = document.getElementById('verify-code-input').value.trim();
            const res = await fetch('/api/verify-auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action: 'check', authCode: code, merchantId: user.id }) });
            const data = await res.json();
            if(res.ok) { user.myRecords = data.newRecords; alert("تمت المطابقة وتثبيت السعر بنجاح!"); closeModal('verify-modal'); showDetails(activeTarget); } else alert(data.error);
        }

        async function searchStamp() {
            const code = document.getElementById('search-stamp-input').value.trim();
            const res = await fetch(`/api/search-stamp?code=${code}`);
            const data = await res.json();
            const box = document.getElementById('search-result'); box.classList.remove('hidden');
            if(res.ok) {
                box.innerHTML = `<div>👤 المواطن: ${data.debtorName}</div><div>👑 التاجر: ${data.merchantName}</div><div>💰 المبلغ: ${data.amount} ${data.currency}</div><div>📅 الحالة: ${data.status}</div>`;
            } else box.innerText = "البصمة غير موجودة أو مستوفاة";
        }

        async function saveOp() {
            const a = document.getElementById('op-amt').value; if(!a || !activeTarget) return;
            const res = await fetch('/api/sync', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ 
                userId: user.id, 
                op: { id: Date.now().toString(), targetName: activeTarget, amount: a, currency: document.getElementById('op-cur').value, type: document.getElementById('op-type').value, note: document.getElementById('op-note').value, date: new Date().toISOString(), isVerified: false }
            })});
            const data = await res.json();
            user.myRecords = data.newRecords; showDetails(activeTarget); calculateTotals(user.myRecords);
            document.getElementById('op-amt').value = "";
        }
    </script>
</body>
</html>
