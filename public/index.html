<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Browser | متصفحي السحابي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #0f1015; color: white; height: 100vh; overflow: hidden; }
        .browser-container { height: calc(100vh - 80px); width: 100%; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col">

    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0f1015]">
        <div class="bg-[#1a1b23] p-8 rounded-2xl w-full max-w-md text-center border border-white/5">
            <h1 class="text-2xl font-bold mb-6 text-blue-500 text-right">تسجيل الدخول</h1>
            <input type="password" id="pass" placeholder="كلمة المرور" class="w-full p-3 rounded-lg bg-black border border-gray-700 mb-4 text-center text-white">
            <button onclick="login()" class="w-full bg-blue-600 p-3 rounded-lg font-bold hover:bg-blue-700 transition">دخول السيرفر</button>
        </div>
    </div>

    <header class="h-[80px] bg-[#1a1b23] flex items-center justify-between px-6 border-b border-white/5">
        <div class="flex items-center gap-4">
            <div class="text-xl font-bold text-blue-500">CLOUD BROWSER V3</div>
            <span class="text-xs text-green-400 bg-green-400/10 px-2 py-1 rounded">متصل بالسيرفر</span>
        </div>
        <button onclick="logout()" class="text-red-400 text-sm">تسجيل الخروج</button>
    </header>

    <main class="browser-container">
        <!-- استخدام واجهة Chromium المتجاوبة -->
        <iframe id="cloudFrame" src=""></iframe>
        <div id="loading" class="absolute inset-0 flex items-center justify-center bg-black hidden">
            <div class="loader"></div>
            <p class="mr-4">جاري تشغيل المتصفح السحابي...</p>
        </div>
    </main>

    <script>
        async function login() {
            const password = document.getElementById('pass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password})
            });
            const data = await res.json();
            if(data.success) {
                localStorage.setItem('cloud_auth', 'true');
                startSystem();
            } else {
                alert('كلمة المرور خاطئة');
            }
        }

        function startSystem() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            
            // رابط واجهة المتصفح الافتراضية لـ Browserless
            const browserUrl = window.location.origin + '/?token=YOUR_TOKEN'; 
            // ملاحظة: بما أننا نستخدم Docker مخصص، سنقوم بتوجيه الإطار للمنفذ الصحيح
            document.getElementById('cloudFrame').src = window.location.origin.replace('3000', '8080');
            
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 3000);
        }

        if(localStorage.getItem('cloud_auth') === 'true') {
            startSystem();
        }

        function logout() {
            localStorage.removeItem('cloud_auth');
            window.location.reload();
        }
    </script>
</body>
</html>
