<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هيبة | النظام الموحد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #050507; color: #eee; font-family: 'Changa', sans-serif; }
        .gold-grad { background: linear-gradient(135deg, #d4af37, #aa8a2e); }
        .glass { background: rgba(20, 20, 25, 0.95); border: 1px solid #222; border-radius: 20px; }
        .card-op { border-right: 4px solid #d4af37; background: #111; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        .debt { border-right-color: #f44336; }
        .pay { border-right-color: #4caf50; }
        input, select { background: #1a1a1a !important; border: 1px solid #333 !important; color: #fff; border-radius: 10px; padding: 10px; }
    </style>
</head>
<body class="p-4">

    <!-- شاشة الدخول -->
    <div id="auth-ui" class="max-w-md mx-auto mt-10 space-y-6">
        <h1 class="text-6xl font-bold text-center text-[#d4af37] italic">HEIBA</h1>
        <div class="glass p-6 space-y-4">
            <input id="u-name" type="text" class="w-full" placeholder="الاسم الكامل">
            <input id="u-pass" type="password" class="w-full" placeholder="كلمة السر">
            <select id="u-type" class="w-full">
                <option value="merchant">أنا تاجر (صاحب عمل)</option>
                <option value="debtor">أنا مدين (أتابع ديوني)</option>
            </select>
            <div class="flex gap-2">
                <button onclick="doAuth('login')" class="flex-1 py-3 bg-zinc-800 rounded-xl font-bold">دخول</button>
                <button onclick="doAuth('reg')" class="flex-1 py-3 gold-grad text-black rounded-xl font-bold">تسجيل جديد</button>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="main-ui" class="hidden max-w-5xl mx-auto space-y-6">
        <header class="flex justify-between items-center glass p-4">
            <div>
                <h2 id="user-name-tag" class="text-xl font-bold text-[#d4af37]"></h2>
                <p id="user-type-label" class="text-[10px] text-gray-500 uppercase"></p>
            </div>
            <button onclick="location.reload()" class="text-red-500 text-sm">خروج</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
            <!-- اليمين: القائمة -->
            <div class="md:col-span-4 space-y-6">
                <!-- قسم التجار (للمدين) -->
                <div id="debtor-tools" class="hidden glass p-4">
                    <h3 class="text-sm font-bold mb-4">🔍 ابحث عن تاجر وثبته</h3>
                    <input id="search-m" type="text" class="w-full text-xs" placeholder="اسم التاجر..." oninput="searchM()">
                    <div id="search-results" class="mt-2 space-y-1"></div>
                    <hr class="my-4 border-zinc-800">
                    <h3 class="text-sm font-bold mb-2">🏢 تجاري المفضلين</h3>
                    <div id="linked-list" class="space-y-2"></div>
                </div>

                <!-- قسم الأسماء (للتاجر) -->
                <div id="merchant-tools" class="hidden glass p-4">
                    <h3 class="text-sm font-bold mb-4">👥 سجلات المدينين عندك</h3>
                    <div class="flex gap-2 mb-4">
                        <input id="new-target" class="w-full text-xs" placeholder="اسم المدين الجديد">
                        <button onclick="addTarget()" class="gold-grad text-black px-3 rounded-lg">+</button>
                    </div>
                    <div id="targets-list" class="space-y-2"></div>
                </div>

                <!-- ميزان الحساب الكلي -->
                <div class="glass p-4 border-t-2 border-[#d4af37]">
                    <h3 class="text-xs font-bold text-[#d4af37] mb-2">الميزان الختامي</h3>
                    <div class="flex justify-between">
                        <div class="text-center">
                            <p class="text-[10px] text-gray-500">يمني</p>
                            <p id="total-yer" class="text-blue-400 font-bold">0</p>
                        </div>
                        <div class="text-center">
                            <p class="text-[10px] text-gray-500">دولار</p>
                            <p id="total-usd" class="text-green-400 font-bold">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- الشمال: التفاصيل -->
            <div class="md:col-span-8">
                <div id="details-view" class="hidden glass p-6">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h3 id="active-title" class="text-2xl font-bold text-[#d4af37]"></h3>
                            <p class="text-[10px] text-gray-500">سجل المعاملات والعمليات</p>
                        </div>
                        <div class="text-right">
                            <div id="active-sum-yer" class="text-blue-400 font-bold"></div>
                            <div id="active-sum-usd" class="text-green-400 font-bold"></div>
                        </div>
                    </div>

                    <!-- السجلات -->
                    <div id="ops-list" class="space-y-3 mb-6 max-h-[400px] overflow-y-auto"></div>

                    <!-- فورم الإضافة (يظهر للتاجر فقط أو للمدين في سجلاته الخاصة) -->
                    <div id="add-form" class="bg-black/50 p-4 rounded-xl space-y-3">
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-2">
                            <input id="op-amt" type="number" placeholder="المبلغ">
                            <select id="op-cur">
                                <option value="YER">يمني</option>
                                <option value="USD">دولار</option>
                            </select>
                            <select id="op-type">
                                <option value="دين">شليت (دين)</option>
                                <option value="سداد">سددت (خصم)</option>
                            </select>
                            <input id="op-note" placeholder="البيان">
                        </div>
                        <button onclick="saveOp()" class="w-full py-3 gold-grad text-black font-bold rounded-xl">تثبيت وحفظ</button>
                    </div>
                </div>
                <div id="empty-hint" class="glass p-20 text-center text-gray-600">
                    اختر اسماً أو تاجراً من القائمة للبدء
                </div>
            </div>
        </div>
    </div>

    <script>
        let user = null;
        let activeTarget = null; // اسم الشخص أو التاجر المختار

        async function doAuth(action) {
            const name = document.getElementById('u-name').value;
            const password = document.getElementById('u-pass').value;
            const type = document.getElementById('u-type').value;
            if(!name || !password) return alert("امسح الحقول وعبيها");

            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, password, type, action })
            });
            const data = await res.json();
            if(res.ok) { user = data; start(); } else alert(data.error);
        }

        function start() {
            document.getElementById('auth-ui').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-name-tag').innerText = user.name;
            document.getElementById('user-type-label').innerText = user.type === 'merchant' ? 'خزنة تاجر' : 'محفظة مدين';
            
            if(user.type === 'merchant') {
                document.getElementById('merchant-tools').classList.remove('hidden');
            } else {
                document.getElementById('debtor-tools').classList.remove('hidden');
            }
            renderList();
            updateTotalBalance();
        }

        // --- وظائف التاجر ---
        function addTarget() {
            const name = document.getElementById('new-target').value.trim();
            if(!name) return;
            activeTarget = name;
            renderList();
            showDetails(name);
            document.getElementById('new-target').value = "";
        }

        function renderList() {
            if(user.type === 'merchant') {
                const targets = [...new Set(user.myRecords.map(r => r.targetName))];
                document.getElementById('targets-list').innerHTML = targets.map(t => `
                    <div onclick="showDetails('${t}')" class="p-3 bg-zinc-900 rounded-lg cursor-pointer hover:bg-zinc-800 ${activeTarget === t ? 'border border-[#d4af37]' : ''}">${t}</div>
                `).join('');
            } else {
                document.getElementById('linked-list').innerHTML = user.linkedMerchants.map(m => `
                    <div onclick="showDetails('${m.name}', true)" class="p-3 bg-zinc-900 rounded-lg cursor-pointer hover:bg-zinc-800">${m.name}</div>
                `).join('');
            }
        }

        // --- البحث عن تجار ---
        async function searchM() {
            const q = document.getElementById('search-m').value;
            if(q.length < 2) return;
            const res = await fetch(`/api/merchants/search?q=${q}`);
            const results = await res.json();
            document.getElementById('search-results').innerHTML = results.map(r => `
                <div onclick="linkM('${r.name}')" class="p-2 bg-zinc-800 text-xs rounded mb-1 cursor-pointer">➕ إضافة التاجر: ${r.name}</div>
            `).join('');
        }

        function linkM(name) {
            if(!user.linkedMerchants.find(m => m.name === name)) {
                user.linkedMerchants.push({ name });
                sync();
                renderList();
            }
            document.getElementById('search-results').innerHTML = "";
        }

        // --- عرض التفاصيل ---
        async function showDetails(name, isFromMerchant = false) {
            activeTarget = name;
            document.getElementById('empty-hint').classList.add('hidden');
            document.getElementById('details-view').classList.remove('hidden');
            document.getElementById('active-title').innerText = name;

            let records = [];
            if(user.type === 'merchant') {
                records = user.myRecords.filter(r => r.targetName === name);
                document.getElementById('add-form').classList.remove('hidden');
            } else {
                if(isFromMerchant) {
                    // جلب ديونه من منصة التاجر
                    const res = await fetch(`/api/fetch-debts?merchantName=${name}&debtorName=${user.name}`);
                    records = await res.json();
                    document.getElementById('add-form').classList.add('hidden'); // المدين لا يعدل في منصة التاجر
                } else {
                    records = user.myRecords.filter(r => r.targetName === name);
                    document.getElementById('add-form').classList.remove('hidden');
                }
            }

            renderOps(records);
        }

        function renderOps(records) {
            let y = 0, u = 0;
            document.getElementById('ops-list').innerHTML = records.map(r => {
                const amt = parseFloat(r.amount);
                const isDebt = r.type === 'دين';
                if(r.currency === 'YER') y += (isDebt ? amt : -amt); else u += (isDebt ? amt : -amt);

                return `
                <div class="card-op ${isDebt ? 'debt' : 'pay'}">
                    <div class="flex justify-between">
                        <div>
                            <p class="text-xs font-bold">${r.note}</p>
                            <p class="text-[9px] text-gray-500">${new Date(r.date).toLocaleString('ar-YE')}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-black ${isDebt ? 'text-red-500' : 'text-green-500'}">${isDebt ? '+' : '-'}${amt} ${r.currency}</p>
                        </div>
                    </div>
                </div>`;
            }).reverse().join('');

            document.getElementById('active-sum-yer').innerText = `يمني: ${y}`;
            document.getElementById('active-sum-usd').innerText = `دولار: ${u}`;
        }

        async function saveOp() {
            const amt = document.getElementById('op-amt').value;
            const cur = document.getElementById('op-cur').value;
            const type = document.getElementById('op-type').value;
            const note = document.getElementById('op-note').value || "عملية مالية";
            
            if(!amt || !activeTarget) return;

            user.myRecords.push({
                id: Date.now(),
                targetName: activeTarget,
                amount: amt,
                currency: cur,
                type: type,
                note: note,
                date: new Date().toISOString()
            });

            showDetails(activeTarget);
            updateTotalBalance();
            sync();
            document.getElementById('op-amt').value = "";
            document.getElementById('op-note').value = "";
        }

        function updateTotalBalance() {
            let y = 0, u = 0;
            user.myRecords.forEach(r => {
                const amt = parseFloat(r.amount);
                const isDebt = r.type === 'دين';
                if(r.currency === 'YER') y += (isDebt ? amt : -amt); else u += (isDebt ? amt : -amt);
            });
            document.getElementById('total-yer').innerText = y;
            document.getElementById('total-usd').innerText = u;
        }

        async function sync() {
            await fetch('/api/sync', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    userId: user.id, 
                    myRecords: user.myRecords, 
                    linkedMerchants: user.linkedMerchants 
                })
            });
        }
    </script>
</body>
</html>
