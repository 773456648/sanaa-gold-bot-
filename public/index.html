<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FADI OMNI-SYSTEM | المنظومة العملاقة</title>
    <style>
        :root { --main: #00ff88; --bg: #010409; --panel: #0d1117; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .sidebar, .editor { background: var(--panel); border: 1px solid #30363d; border-radius: 10px; padding: 15px; }
        textarea { width: 100%; height: 450px; background: #000; color: var(--main); border: 1px solid #30363d; padding: 10px; font-family: 'Consolas', monospace; border-radius: 5px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; background: #161b22; border: 1px solid #30363d; color: white; border-radius: 5px; }
        .btn { width: 100%; padding: 15px; background: var(--main); color: black; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        .status { margin-top: 10px; font-size: 12px; color: #8b949e; }
    </style>
</head>
<body>

    <h1 style="color: var(--main);">💠 منظومة فادي برو (الجيل الذكي)</h1>

    <div class="grid">
        <div class="sidebar">
            <h3>⚙️ إعدادات البناء</h3>
            <label>اسم التطبيق:</label>
            <input type="text" id="appName" placeholder="مثلاً: Calculator_Pro">
            
            <label>مسار الملف (اختياري):</label>
            <input type="text" id="targetFile" placeholder="smali/com/fadi/pro/MainActivity.smali">
            
            <button class="btn" onclick="buildSystem()">🚀 بدء الحقن والتجميع</button>
            <div id="status" class="status">جاهز للاستخدام...</div>
        </div>

        <div class="editor">
            <h3>📝 محرر الكود الكبير (Smali/Java)</h3>
            <textarea id="megaCode" placeholder="ضع كود التطبيق العملاق هنا..."></textarea>
        </div>
    </div>

    <script>
        async function buildSystem() {
            const name = document.getElementById('appName').value;
            const code = document.getElementById('megaCode').value;
            const file = document.getElementById('targetFile').value;
            const status = document.getElementById('status');

            if(!name || !code) return alert("يا فادي، املأ البيانات أولاً!");

            status.innerHTML = "🌀 جاري فك الملف وحقن الأكواد...";

            const response = await fetch('/build-omni-system', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ appName: name, megaCode: code, targetFile: file })
            });

            if(response.ok) {
                const blob = await response.blob();
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.download = `${name}.apk`;
                link.click();
                status.innerHTML = "✅ اكتملت العملية بنجاح!";
            } else {
                status.innerHTML = "❌ فشل السيرفر في معالجة الطلب.";
            }
        }
    </script>
</body>
</html>
