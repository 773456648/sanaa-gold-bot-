<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 منظومة فادي برو للعقارات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #e2b714; --bg: #05070a; --glass: rgba(22, 27, 34, 0.9); --border: #30363d; --success: #238636; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #e6edf3; font-family: 'Segoe UI', sans-serif; }
        header { background: var(--glass); backdrop-filter: blur(10px); padding: 15px 5%; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--gold); }
        .search-container { padding: 20px 5%; background: #0d1117; border-bottom: 1px solid var(--border); }
        .search-box { width: 100%; max-width: 600px; margin: 0 auto; position: relative; }
        .search-box input { width: 100%; padding: 15px 45px 15px 15px; background: #000; border: 1px solid var(--gold); border-radius: 30px; color: #fff; }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); }
        .container { padding: 20px 5% 100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        
        /* حركة ظهور فخمة للكروت */
        .card { background: var(--glass); border-radius: 15px; border: 1px solid var(--border); overflow: hidden; animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-body { padding: 20px; }
        .price { font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 5px; }
        .time-badge { font-size: 0.75rem; color: #8b949e; margin-bottom: 10px; display: block; }
        
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .contact-btn { padding: 12px; border-radius: 10px; background: var(--success); color: #fff; text-decoration: none; text-align: center; font-weight: bold; }
        .action-btns { display: flex; gap: 10px; }
        .action-btns button { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .btn-share { background: #1f6feb; color: #fff; }
        .btn-del { background: #da3633; color: #fff; }

        .fab { position: fixed; bottom: 25px; left: 25px; background: var(--gold); width: 60px; height: 60px; border-radius: 50%; font-size: 1.5rem; color: #000; border: none; cursor: pointer; z-index: 999; box-shadow: 0 0 15px var(--gold); }
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-box { background: #161b22; padding: 25px; border-radius: 20px; border: 1px solid var(--gold); width: 100%; max-width: 450px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; }

        /* ستايل التنبيهات الفخم */
        #toast { visibility: hidden; min-width: 250px; background-color: var(--gold); color: #000; text-align: center; border-radius: 10px; padding: 15px; position: fixed; z-index: 3000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-gem"></i> فادي برو للعقارات</div>
</header>

<div class="search-container">
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="ابحث عن عقار..." onkeyup="searchProps()">
    </div>
</div>

<div class="container" id="mainGrid"></div>

<button class="fab" onclick="showModal()"><i class="fas fa-plus"></i></button>

<div id="toast">تمت العملية بنجاح!</div>

<div id="modal">
    <div class="modal-box">
        <input type="text" id="pOwner" placeholder="الاسم">
        <input type="number" id="pPhone" placeholder="رقم الواتساب">
        <input type="text" id="pTitle" placeholder="الموقع">
        <input type="text" id="pPrice" placeholder="السعر">
        <input type="text" id="pSpace" placeholder="المساحة">
        <select id="pCat">
            <option value="apt">شقة</option>
            <option value="land">أرضية</option>
        </select>
        <input type="password" id="pPass" placeholder="كلمة سر لحذف إعلانك">
        
        <button onclick="publish()" style="width:100%; padding:15px; background:var(--gold); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">نشر العرض 🚀</button>
        <button onclick="hideModal()" style="width:100%; background:none; border:none; color:gray; margin-top:10px; cursor:pointer;">إلغاء</button>
    </div>
</div>

<script>
    let allProps = [];

    async function loadData() {
        try {
            const res = await fetch('/api/properties');
            allProps = await res.json();
            render(allProps);
        } catch (e) { console.error("خطأ في الاتصال"); }
    }

    function render(data) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = data.map(p => `
            <div class="card">
                <div class="card-body">
                    <span style="color:var(--gold); font-weight:bold;">👤 المعلن: ${p.owner}</span>
                    <span class="time-badge">🕒 نُشر في: ${p.time || 'الآن'}</span>
                    <h3 style="color:#fff; margin: 10px 0;">${p.title}</h3>
                    <div class="price" style="color:var(--gold)">💰 ${p.price}</div>
                    <div style="color:#8b949e; font-size: 0.9rem; margin-bottom:10px;">📏 المساحة: ${p.space}</div>
                    
                    <div class="btn-group">
                        <a href="https://wa.me/967${p.phone}?text=${encodeURIComponent('حياك، استفسار عن إعلانك: ' + p.title)}" class="contact-btn">
                            <i class="fab fa-whatsapp"></i> تواصل مع المالك
                        </a>
                        <div class="action-btns">
                            <button onclick="shareProp('${p.title}', '${p.price}', '${p.phone}')" class="btn-share"><i class="fas fa-share-alt"></i> شارك</button>
                            <button onclick="deleteProp('${p.id}')" class="btn-del"><i class="fas fa-trash"></i> احذف</button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function publish() {
        const prop = {
            owner: document.getElementById('pOwner').value,
            phone: document.getElementById('pPhone').value,
            title: document.getElementById('pTitle').value,
            price: document.getElementById('pPrice').value,
            space: document.getElementById('pSpace').value,
            category: document.getElementById('pCat').value,
            password: document.getElementById('pPass').value
        };
        
        if(!prop.title || !prop.password) return showToast("⚠️ لازم تكتب الموقع وكلمة السر يا خبير!");

        await fetch('/api/properties', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(prop)
        });
        
        document.querySelectorAll('#modal input').forEach(i => i.value = '');
        hideModal();
        showToast("✅ تم نشر العرض بنجاح!");
        loadData();
    }

    async function deleteProp(id) {
        const password = prompt("أدخل كلمة سر الحذف:");
        if(!password) return;

        const res = await fetch('/api/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: id, password: password })
        });

        const result = await res.json();
        if(result.success) {
            showToast("🗑️ تم الحذف بنجاح!");
            loadData();
        } else {
            showToast("❌ كلمة السر غلط يا حريف!");
        }
    }

    function shareProp(title, price, phone) {
        const text = `🏠 عقار لقطة في منظومة فادي برو!\n📍 الموقع: ${title}\n💰 السعر: ${price}\n📞 للتواصل: 967${phone}\n\nسارع قبل ما يطير! 🚀`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
    }

    function searchProps() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        render(allProps.filter(p => p.title.toLowerCase().includes(term) || p.owner.toLowerCase().includes(term)));
    }

    function showToast(msg) {
        const x = document.getElementById("toast");
        x.innerText = msg;
        x.className = "show";
        setTimeout(() => { x.className = x.className.replace("show", ""); }, 3000);
    }

    function showModal() { document.getElementById('modal').style.display = 'flex'; }
    function hideModal() { document.getElementById('modal').style.display = 'none'; }

    setInterval(loadData, 5000);
    window.onload = loadData;
</script>
</body>
</html>
