<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenVPN Config Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0b0e11; color: #fff; }
        .card { background: #1e2329; border: 1px solid #2b3139; border-radius: 1.5rem; }
        .input-field { background: #0b0e11; border: 1px solid #474d57; border-radius: 0.75rem; padding: 12px; width: 100%; color: white; outline: none; }
        .input-field:focus { border-color: #f3ba2f; }
    </style>
</head>
<body class="p-6 flex items-center justify-center min-h-screen">

    <div class="card max-w-lg w-full p-8 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-[#f3ba2f] rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-shield-halved text-black text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-[#f3ba2f]">OpenVPN Config Tool</h1>
            <p class="text-gray-400 text-xs mt-2 font-bold uppercase tracking-widest">توليد ملف الاتصال الخاص بـ Render</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-xs text-gray-500 font-bold mb-2 block">رابط سيرفر Render الخاص بك:</label>
                <input type="text" id="server-url" class="input-field" placeholder="مثلاً: my-app.onrender.com">
            </div>

            <div class="p-4 bg-yellow-500/10 border border-yellow-500/30 rounded-xl text-[10px] text-yellow-500 font-bold leading-relaxed">
                <i class="fa-solid fa-triangle-exclamation ml-1"></i>
                ملاحظة: لكي يعمل هذا الملف، يجب أن يكون الكود المرفوع على Render يدعم خدمة OpenVPN عبر منفذ TCP 443.
            </div>

            <button onclick="generateConfig()" class="w-full bg-[#f3ba2f] text-black font-black py-4 rounded-xl hover:opacity-90 transition-all flex items-center justify-center gap-2 uppercase italic">
                <i class="fa-solid fa-file-export"></i> توليد وتحميل الملف (.ovpn)
            </button>
        </div>

        <div id="result-area" class="hidden mt-8">
            <h3 class="text-xs font-bold text-gray-500 mb-2 uppercase">معاينة الملف:</h3>
            <pre id="config-text" class="bg-black p-4 rounded-xl text-[10px] text-green-400 overflow-x-auto max-h-40 border border-gray-800"></pre>
        </div>
    </div>

    <script>
        function generateConfig() {
            const serverUrl = document.getElementById('server-url').value;
            if (!serverUrl) {
                alert('يرجى إدخال رابط السيرفر أولاً!');
                return;
            }

            // بنية ملف OpenVPN المتوافقة مع Render (TCP Mode)
            const config = `client
dev tun
proto tcp
remote ${serverUrl} 443
resolv-retry infinite
nobind
persist-key
persist-tun
remote-cert-tls server
auth-user-pass
cipher AES-256-CBC
auth SHA256
compress lz4
verb 3
<ca>
-----BEGIN CERTIFICATE-----
[مفتاح CA الخاص بسيرفرك هنا]
-----END CERTIFICATE-----
</ca>
<cert>
-----BEGIN CERTIFICATE-----
[مفتاح العميل هنا]
-----END CERTIFICATE-----
</cert>
<key>
-----BEGIN PRIVATE KEY-----
[المفتاح الخاص هنا]
-----END PRIVATE KEY-----
</key>`;

            document.getElementById('config-text').innerText = config;
            document.getElementById('result-area').classList.remove('hidden');

            // تحميل الملف تلقائياً
            const blob = new Blob([config], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'RenderGaming.ovpn';
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
