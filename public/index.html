<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رادار فادي - نسخة الإصلاح</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #0f0; font-family: sans-serif; overflow: hidden; touch-action: none; }
        .radar-circle { 
            position: relative; width: 280px; height: 280px; 
            border: 2px solid #050; border-radius: 50%; margin: 20px auto; 
            background: radial-gradient(circle, #001 0%, #000 100%);
        }
        .pointer { 
            position: absolute; top: 50%; left: 50%; 
            width: 0; height: 0; 
            border-left: 10px solid transparent; border-right: 10px solid transparent; 
            border-bottom: 25px solid #0f0; 
            margin-top: -35px; margin-left: -10px;
            transform-origin: 50% 100%;
        }
        .target { 
            position: absolute; width: 12px; height: 12px; 
            background: red; border-radius: 50%; transform: translate(-50%, -50%); 
        }
        #log { font-size: 10px; color: #888; text-align: left; height: 60px; overflow-y: auto; background: #111; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body class="p-4">

    <h2 class="text-center font-bold mb-2">نظام الرصد المباشر</h2>

    <div class="radar-circle" id="radar">
        <div id="my-pointer" class="pointer"></div>
        <div id="targets-layer"></div>
        <div style="position:absolute; top:50%; width:100%; height:1px; background:#020;"></div>
        <div style="position:absolute; left:50%; height:100%; width:1px; background:#020;"></div>
    </div>

    <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 mb-4">
        <div class="flex justify-between text-sm mb-2">
            <span>المسافة: <b id="dist">--</b> متر</span>
            <span>الدقة: <b id="acc">--</b></span>
        </div>
        <button onclick="savePoint()" class="w-full bg-red-600 text-white p-3 rounded-lg font-bold mb-2">📍 رصد هدف (حفظ مكاني)</button>
        <button onclick="startSystem()" id="start-btn" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold">🚀 تشغيل الحساسات</button>
    </div>

    <div id="log">انتظر.. اضغط "تشغيل الحساسات" لبدء العمل...</div>

    <script>
        let myPos = null;
        let heading = 0;
        let savedPoint = null;

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML = "> " + msg + "<br>" + l.innerHTML;
        }

        // تشغيل الحساسات (لازم يضغط المستخدم أولاً)
        async function startSystem() {
            log("بدء تشغيل النظام...");
            
            // 1. طلب الجي بي اس
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (p) => {
                        myPos = { lat: p.coords.latitude, lng: p.coords.longitude };
                        document.getElementById('acc').innerText = p.coords.accuracy.toFixed(1) + "m";
                        log("تم تحديد موقعك بدقة " + p.coords.accuracy.toFixed(1));
                        updateUI();
                    },
                    (err) => log("خطأ جي بي اس: " + err.message),
                    { enableHighAccuracy: true }
                );
            } else {
                log("متصفحك لا يدعم الجي بي اس");
            }

            // 2. طلب البوصلة (خاصة للأيفون)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', handleCompass);
                        log("تم تفعيل البوصلة (أيفون)");
                    }
                } catch (e) { log("فشل تصريح البوصلة"); }
            } else {
                window.addEventListener('deviceorientationabsolute', handleCompass) || window.addEventListener('deviceorientation', handleCompass);
                log("تم تفعيل البوصلة (أندرويد)");
            }
            
            document.getElementById('start-btn').style.display = 'none';
        }

        function handleCompass(e) {
            heading = e.webkitCompassHeading || (360 - e.alpha) || 0;
            document.getElementById('my-pointer').style.transform = `rotate(${heading}deg)`;
            updateUI();
        }

        function savePoint() {
            if(!myPos) return log("لا يوجد إشارة GPS بعد!");
            savedPoint = { ...myPos };
            log("تم حفظ النقطة بنجاح!");
            updateUI();
        }

        function updateUI() {
            if(!myPos || !savedPoint) return;

            const dist = getDist(myPos.lat, myPos.lng, savedPoint.lat, savedPoint.lng);
            document.getElementById('dist').innerText = (dist * 1000).toFixed(1);

            const bear = getBear(myPos.lat, myPos.lng, savedPoint.lat, savedPoint.lng);
            const container = document.getElementById('targets-layer');
            container.innerHTML = '';

            // حساب مكان النقطة على الدائرة
            const relBear = (bear - heading + 360) % 360;
            const distPx = Math.min((dist * 1000), 100); // تصغير المسافة لتناسب الدائرة
            const rad = (relBear - 90) * (Math.PI / 180);
            const x = 50 + (distPx / 2) * Math.cos(rad);
            const y = 50 + (distPx / 2) * Math.sin(rad);

            container.innerHTML = `<div class="target" style="left:${x}%; top:${y}%"></div>`;
        }

        function getDist(l1, n1, l2, n2) {
            const R = 6371;
            const dL = (l2-l1)*Math.PI/180;
            const dN = (n2-n1)*Math.PI/180;
            const a = Math.sin(dL/2)**2 + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dN/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getBear(l1, n1, l2, n2) {
            const y = Math.sin((n2-n1)*Math.PI/180)*Math.cos(l2*Math.PI/180);
            const x = Math.cos(l1*Math.PI/180)*Math.sin(l2*Math.PI/180)-Math.sin(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.cos((n2-n1)*Math.PI/180);
            return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
        }
    </script>
</body>
</html>
