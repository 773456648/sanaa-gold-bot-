<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 فادي برو للعقارات VIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #e2b714; --bg: #05070a; --glass: rgba(22, 27, 34, 0.8); --border: #30363d; }
        body { background: var(--bg); color: #e6edf3; font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* الهيدر الملكي */
        header { background: var(--glass); backdrop-filter: blur(10px); padding: 15px 5%; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.6rem; font-weight: 900; color: var(--gold); letter-spacing: 1px; }

        /* منطقة الإحصائيات */
        .hero { padding: 40px 5%; text-align: center; background: radial-gradient(circle at center, #161b22 0%, #05070a 100%); }
        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; color: #fff; }

        /* الفلاتر */
        .filters { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .filter-btn { background: var(--glass); border: 1px solid var(--border); color: #fff; padding: 10px 20px; border-radius: 30px; cursor: pointer; transition: 0.3s; }
        .filter-btn.active, .filter-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }

        /* شبكة العقارات */
        .container { padding: 0 5% 100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .card { background: var(--glass); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; position: relative; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card:hover { transform: scale(1.03); border-color: var(--gold); box-shadow: 0 10px 30px rgba(226, 183, 20, 0.1); }
        
        .card-img { height: 180px; background: linear-gradient(45deg, #161b22, #0d1117); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; color: var(--gold); opacity: 0.7; }
        .badge { position: absolute; top: 15px; right: 15px; background: var(--gold); color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; }
        
        .card-content { padding: 20px; }
        .price { font-size: 1.5rem; font-weight: 800; color: #fff; margin-bottom: 5px; }
        .owner-tag { font-size: 0.8rem; color: var(--gold); margin-bottom: 15px; display: block; }
        .details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem; color: #8b949e; margin-bottom: 20px; }
        
        .contact-btn { width: 100%; padding: 12px; border-radius: 12px; background: #238636; color: #fff; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* الزر العائم */
        .fab { position: fixed; bottom: 30px; left: 30px; background: var(--gold); width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: #000; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.4); border: none; z-index: 1001; }

        /* المودال (نافذة الإضافة) */
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-box { background: #161b22; padding: 30px; border-radius: 25px; border: 1px solid var(--gold); width: 100%; max-width: 500px; }
        input, select { width: 100%; padding: 15px; margin-bottom: 15px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 12px; }
    </style>
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-crown"></i> FADI ESTATE VIP</div>
    <div id="userDisplayName" style="font-size: 0.9rem; color: #8b949e;"></div>
</header>

<div class="hero">
    <h1>سوق العقارات العالمي</h1>
    <p>بإشراف المبرمج فادي - كل ما يُنشر يظهر للجميع لحظياً</p>
</div>

<div class="filters">
    <button class="filter-btn active" onclick="filterData('all')">الكل</button>
    <button class="filter-btn" onclick="filterData('apt')">شقق</button>
    <button class="filter-btn" onclick="filterData('land')">أراضي</button>
    <button class="filter-btn" onclick="filterData('villa')">بيوت/فيلات</button>
</div>

<div class="container" id="mainGrid">
    </div>

<button class="fab" onclick="showModal()"><i class="fas fa-plus"></i></button>

<div id="modal">
    <div class="modal-box">
        <h2 style="color:var(--gold); margin-bottom:20px;">إضافة عقار جديد للكل</h2>
        <input type="text" id="pOwner" placeholder="اسمك (المعلن)">
        <input type="text" id="pTitle" placeholder="اسم العقار (مثلاً: شقة حدة)">
        <input type="number" id="pPrice" placeholder="السعر (بالريال أو الدولار)">
        <input type="number" id="pSpace" placeholder="المساحة (باللبنة الصنعانية)">
        <select id="pCat">
            <option value="apt">شقة</option>
            <option value="land">أرضية</option>
            <option value="villa">بيت / فيلا</option>
            <option value="building">عمارة</option>
        </select>
        <select id="pType">
            <option value="للإيجار">للإيجار</option>
            <option value="للبيع">للبيع</option>
        </select>
        <button class="contact-btn" onclick="publish()" style="background:var(--gold); color:#000;">نشر في المنظومة الآن 🚀</button>
        <button onclick="hideModal()" style="width:100%; background:none; border:none; color:gray; margin-top:15px; cursor:pointer;">إلغاء</button>
    </div>
</div>

<script>
    let allProps = [];

    // جلب البيانات من السيرفر
    async function loadData() {
        const res = await fetch('/api/properties');
        allProps = await res.json();
        render(allProps);
    }

    function render(data) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = data.map(p => `
            <div class="card">
                <div class="badge">${p.type}</div>
                <div class="card-img"><i class="fas ${getIcon(p.category)}"></i></div>
                <div class="card-content">
                    <span class="owner-tag"><i class="fas fa-user-tie"></i> المعلن: ${p.owner}</span>
                    <div class="price">${Number(p.price).toLocaleString()} <small style="font-size:0.8rem">${p.price > 100000 ? 'ريال' : '$'}</small></div>
                    <h3 style="margin-bottom:15px;">${p.title}</h3>
                    <div class="details">
                        <span><i class="fas fa-ruler-combined"></i> ${p.space} لبنة</span>
                        <span><i class="fas fa-calculator"></i> ${(p.price/p.space).toFixed(0)} للبنة</span>
                    </div>
                    <button class="contact-btn" onclick="contact('${p.owner}', '${p.title}')">
                        <i class="fab fa-whatsapp"></i> تواصل مع المعلن
                    </button>
                </div>
            </div>
        `).join('');
    }

    function getIcon(cat) {
        if(cat === 'apt') return 'fa-door-open';
        if(cat === 'land') return 'fa-mountain-sun';
        if(cat === 'building') return 'fa-city';
        return 'fa-home';
    }

    async function publish() {
        const prop = {
            owner: document.getElementById('pOwner').value || "فاعل خير",
            title: document.getElementById('pTitle').value,
            price: document.getElementById('pPrice').value,
            space: document.getElementById('pSpace').value,
            category: document.getElementById('pCat').value,
            type: document.getElementById('pType').value
        };

        if(!prop.title || !prop.price) return alert("أكمل البيانات يا خبير!");

        await fetch('/api/properties', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(prop)
        });

        hideModal();
        loadData();
    }

    function filterData(cat) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        if(cat === 'all') return render(allProps);
        render(allProps.filter(p => p.category === cat));
    }

    function contact(owner, title) {
        const msg = encodeURIComponent(`حياك الله يا ${owner}، استفسار بخصوص: ${title}`);
        window.open(`https://wa.me/967770000000?text=${msg}`);
    }

    function showModal() { document.getElementById('modal').style.display = 'flex'; }
    function hideModal() { document.getElementById('modal').style.display = 'none'; }

    // تحديث تلقائي كل 15 ثانية لجلب جديد الآخرين
    setInterval(loadData, 15000);
    loadData();
</script>

</body>
</html>
