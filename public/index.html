<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التحديث المستمر | Pinger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #09090b; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: #18181b; border: 1px solid #27272a; border-radius: 12px; }
        .input-dark { background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; padding: 12px; width: 100%; outline: none; }
        .input-dark:focus { border-color: #3b82f6; }
        .btn-blue { background: #3b82f6; color: white; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-blue:hover { background: #2563eb; }
        .btn-red { background: #ef4444; color: white; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-red:hover { background: #dc2626; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- شاشة الدخول -->
    <div id="login-screen" class="glass p-8 w-full max-w-sm text-center">
        <h2 class="text-2xl font-bold mb-6">النظام الإداري</h2>
        <input type="password" id="sys-pwd" class="input-dark mb-4 text-center text-lg" placeholder="كلمة المرور">
        <button onclick="login()" class="btn-blue">دخول</button>
        <p id="login-err" class="text-red-500 text-sm mt-3 hidden">كلمة المرور خاطئة</p>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="dashboard" class="glass p-8 w-full max-w-lg hidden relative">
        <button onclick="logout()" class="absolute top-4 left-4 text-xs text-gray-400 hover:text-white">تسجيل خروج</button>
        <h1 class="text-2xl font-bold mb-2">منصة التحديث المستمر</h1>
        <p class="text-sm text-gray-400 mb-6">إرسال تحديثات (Ping) كل دقيقة عبر السيرفر للحفاظ على نشاط الجلسة.</p>

        <!-- واجهة الإعداد -->
        <div id="setup-view" class="space-y-4">
            <div>
                <label class="text-xs text-gray-400 mb-1 block">معرف الجلسة (أي اسم)</label>
                <input type="text" id="bot-name" class="input-dark" dir="ltr" placeholder="مثال: my_insta_1">
            </div>
            <div>
                <label class="text-xs text-gray-400 mb-1 block">الرابط المستهدف (فيسبوك، انستقرام...)</label>
                <input type="url" id="bot-url" class="input-dark" dir="ltr" placeholder="https://www.instagram.com/">
            </div>
            <div>
                <label class="text-xs text-gray-400 mb-1 block">الكوكيز (Cookies)</label>
                <textarea id="bot-cookies" class="input-dark h-24 text-xs font-mono" dir="ltr" placeholder="الصق الكوكيز هنا..."></textarea>
            </div>
            <button onclick="startSession()" class="btn-blue mt-4">تشغيل الجلسة في السيرفر</button>
        </div>

        <!-- واجهة العمل (تظهر تلقائياً إذا كان السيرفر شغال) -->
        <div id="active-view" class="hidden text-center py-6">
            <div class="mb-4">
                <span class="status-dot"></span>
            </div>
            <h3 class="text-xl font-bold text-green-400 mb-2">الجلسة نشطة وتعمل في السيرفر!</h3>
            <p class="text-gray-300 font-mono mb-1" id="display-name" dir="ltr"></p>
            <p class="text-xs text-gray-500 mb-6" id="display-url" dir="ltr"></p>
            
            <div class="bg-black/50 border border-gray-800 p-3 rounded-lg text-sm text-gray-400 mb-6">
                السيرفر يقوم الآن بإرسال طلب تحديث لهذا الرابط كل 60 ثانية باستخدام الكوكيز الخاصة بك.
            </div>

            <button onclick="stopSession()" class="btn-red">إيقاف الجلسة</button>
        </div>

    </div>

    <script>
        const API = '/api';
        let currentActiveName = '';

        // أول ما تفتح الصفحة، ندخل بهدوء ونتأكد من حالة السيرفر
        window.onload = () => {
            if (localStorage.getItem('auth') === 'yes') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                checkServerStatus(); // فحص هادئ بالخلفية
            }
        };

        async function login() {
            const pwd = document.getElementById('sys-pwd').value;
            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                const data = await res.json();
                if(data.success) {
                    localStorage.setItem('auth', 'yes');
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    checkServerStatus();
                } else {
                    document.getElementById('login-err').classList.remove('hidden');
                }
            } catch (e) { alert('خطأ في الاتصال'); }
        }

        function logout() {
            localStorage.removeItem('auth');
            window.location.reload();
        }

        // هذه الدالة تفحص السيرفر، لو لقت الجلسة شغالة، تعرضها لك طوالي!
        async function checkServerStatus() {
            try {
                const res = await fetch(`${API}/status`);
                const data = await res.json();
                
                if (data.activeSessions && data.activeSessions.length > 0) {
                    // الجلسة شغالة!
                    const active = data.activeSessions[0];
                    currentActiveName = active.username;
                    showActiveUI(active.username, active.targetUrl);
                } else {
                    // مافي جلسة شغالة
                    showSetupUI();
                }
            } catch (e) {
                console.log('لا يمكن الوصول لحالة السيرفر الآن.');
            }
        }

        async function startSession() {
            const name = document.getElementById('bot-name').value.trim();
            const url = document.getElementById('bot-url').value.trim();
            const cookies = document.getElementById('bot-cookies').value.trim();

            if(!name || !url || !cookies) return alert('أكمل جميع البيانات أولاً!');

            // عرض الواجهة الخضراء فوراً عشان ما تحس بتعليق
            showActiveUI(name, url);
            currentActiveName = name;

            try {
                await fetch(`${API}/start`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: name, targetUrl: url, cookies: cookies })
                });
            } catch(e) {
                alert('حدث خطأ في الإرسال للسيرفر');
                showSetupUI();
            }
        }

        async function stopSession() {
            showSetupUI();
            try {
                await fetch(`${API}/stop`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentActiveName })
                });
            } catch(e) {}
            currentActiveName = '';
        }

        function showActiveUI(name, url) {
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('active-view').classList.remove('hidden');
            document.getElementById('display-name').innerText = `ID: ${name}`;
            document.getElementById('display-url').innerText = `URL: ${url}`;
        }

        function showSetupUI() {
            document.getElementById('setup-view').classList.remove('hidden');
            document.getElementById('active-view').classList.add('hidden');
        }
    </script>
</body>
</html>
