<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة فادي برو للبناء الفوري</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 15px; border: 2px solid #00d2ff; display: inline-block; width: 90%; max-width: 450px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #334155; color: white; box-sizing: border-box; }
        .btn { background: #00d2ff; color: #000; padding: 15px; width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #status { margin-top: 20px; color: #00d2ff; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🚀 FADI PRO BUILDER</h1>
    <div class="card">
        <input type="text" id="appName" placeholder="اسم التطبيق (مثلاً: ذهب صنعاء)">
        <input type="url" id="appUrl" placeholder="رابط الموقع (URL)">
        <button class="btn" onclick="startBuild()">إنشاء وتحميل APK فوراً</button>
        <div id="status"></div>
    </div>

    <script>
        async function startBuild() {
            const name = document.getElementById('appName').value;
            const url = document.getElementById('appUrl').value;
            const status = document.getElementById('status');
            
            status.innerText = "> جاري بدء المحرك السحابي...";
            
            const res = await fetch('/build-now', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, url })
            });
            
            const data = await res.json();
            if(data.success) {
                status.innerHTML = "<span style='color:#05c46b'>✅ البناء شغال! سيتم توجيهك للتحميل خلال ثوانٍ.</span>";
                // بعد 5 ثواني يفتح صفحة التحميل في GitHub
                setTimeout(() => { window.location.href = "https://github.com/YOUR_USERNAME/YOUR_REPO/releases"; }, 5000);
            }
        }
    </script>
</body>
</html>
