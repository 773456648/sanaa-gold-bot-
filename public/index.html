<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FADI AUTO BUILDER</title>
    <style>
        body { background: #010409; color: #00ff88; font-family: monospace; text-align: center; padding: 20px; }
        textarea { width: 90%; height: 350px; background: #000; color: #00ff88; border: 1px solid #00d2ff; padding: 10px; }
        .btn { padding: 20px 40px; background: #00d2ff; color: #000; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 1.2rem; }
    </style>
</head>
<body>
    <h1>💠 منظومة فادي للتغليف التلقائي</h1>
    <input type="text" id="appName" placeholder="اسم التطبيق الجديد" style="padding: 10px; width: 50%;">
    <br><br>
    <textarea id="megaCode" placeholder="الصق كود التطبيق الموحد هنا... المنظومة سترتبه تلقائياً"></textarea>
    <br>
    <button class="btn" onclick="startBuild()">🏗️ ترتيب وتحميل التطبيق طوالى</button>
    <div id="status"></div>

    <script>
        async function startBuild() {
            const name = document.getElementById('appName').value;
            const code = document.getElementById('megaCode').value;
            const status = document.getElementById('status');

            if(!name || !code) return alert("يا فادي، املأ البيانات!");

            status.innerHTML = "🌀 جاري ترتيب الملفات وبناء التطبيق...";

            const res = await fetch('/build-fadi-system', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ appName: name, megaCode: code })
            });

            if(res.ok) {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${name}.apk`;
                a.click();
                status.innerHTML = "✅ تم الترتيب والتحميل بنجاح!";
            } else {
                status.innerHTML = "❌ خطأ: السيرفر لا يدعم أدوات البناء حالياً.";
            }
        }
    </script>
</body>
</html>
