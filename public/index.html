<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الهيبة - الترقيم الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0a0a0a;
            color: #00ff41; /* لون الماتريكس */
        }
        .glass-panel {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.1);
        }
        input, select {
            background: #000 !important;
            border: 1px solid #00ff41 !important;
            color: #00ff41 !important;
        }
        .locked {
            filter: blur(2px);
            pointer-events: none;
            opacity: 0.5;
        }
        .pulse {
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(0, 255, 65, 0.4); }
            100% { box-shadow: 0 0 0 10px rgba(0, 255, 65, 0); }
        }
    </style>
</head>
<body class="p-4">

    <div class="max-w-5xl mx-auto">
        <!-- الرأس -->
        <header class="text-center py-6 mb-6">
            <h1 class="text-4xl font-bold mb-2 tracking-widest">🛡️ مَنْظُومَةُ الهَيْبَةِ</h1>
            <p class="text-gray-400">رصد وتحليل الأسواق لحظة بلحظة</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- قسم التنبيهات الخاص (المحمي بكلمة السر) -->
            <div class="lg:col-span-1 glass-panel p-6 rounded-xl">
                <h2 class="text-xl font-bold mb-4 border-b border-green-900 pb-2">🔐 تنبيهات التليجرام</h2>
                
                <div id="lock-screen">
                    <p class="text-xs text-gray-400 mb-2">لإضافة بوتك واستلام التنبيهات، أدخل رمز التحقق:</p>
                    <input type="password" id="auth-code" placeholder="كلمة السر" class="w-full p-2 rounded mb-2 text-center">
                    <button onclick="unlockSettings()" class="w-full bg-green-600 text-black font-bold p-2 rounded hover:bg-green-400 transition">تفعيل الربط</button>
                </div>

                <div id="settings-area" class="locked mt-4">
                    <div class="bg-green-900/20 p-3 rounded mb-4 text-xs text-green-200">
                        ✅ تم فتح صلاحيات الربط الخاص
                    </div>
                    <label class="block text-xs mb-1">Bot Token:</label>
                    <input type="text" id="bot-token" placeholder="توكن البوت" class="w-full p-2 text-xs rounded mb-3">
                    
                    <label class="block text-xs mb-1">Your Chat ID:</label>
                    <input type="text" id="chat-id" placeholder="معرف حسابك" class="w-full p-2 text-xs rounded mb-3">
                    
                    <button id="save-btn" onclick="saveSettings()" class="w-full bg-white text-black font-bold p-2 rounded text-sm">حفظ وتشغيل الربط</button>
                </div>
            </div>

            <!-- قسم العرض الرئيسي (متاح للكل) -->
            <div class="lg:col-span-2 space-y-6">
                <!-- كروت العملات -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="glass-panel p-4 rounded-xl flex justify-between items-center">
                        <div>
                            <span class="text-gray-400 block text-sm">BITCOIN</span>
                            <span id="price-BTC" class="text-2xl font-bold">0.00$</span>
                        </div>
                        <div id="change-BTC" class="text-sm text-green-400">0.00%</div>
                    </div>
                    <div class="glass-panel p-4 rounded-xl flex justify-between items-center">
                        <div>
                            <span class="text-gray-400 block text-sm">ETHEREUM</span>
                            <span id="price-ETH" class="text-2xl font-bold">0.00$</span>
                        </div>
                        <div id="change-ETH" class="text-sm text-green-400">0.00%</div>
                    </div>
                </div>

                <!-- التحليل المباشر -->
                <div class="glass-panel p-6 rounded-xl min-h-[300px]">
                    <h2 class="text-xl font-bold mb-4 flex justify-between">
                        <span>📊 غرفة التحليل المباشر</span>
                        <span id="status-dot" class="text-xs flex items-center"><span class="w-2 h-2 bg-green-500 rounded-full mr-2 pulse"></span> متصل بالسوق</span>
                    </h2>
                    <div id="live-logs" class="space-y-2 font-mono text-sm h-64 overflow-y-auto pr-2">
                        <div class="text-gray-500">> المنظومة تبحث عن فرص "الزلط" الآن...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const AUTH_KEY = "771232690";
        let isLinked = false;
        let config = { token: '', chatID: '' };

        // فتح الإعدادات بكلمة السر
        function unlockSettings() {
            const input = document.getElementById('auth-code').value;
            if (input === AUTH_KEY) {
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('settings-area').classList.remove('locked');
            } else {
                alert("رمز التحقق غير صحيح!");
            }
        }

        // حفظ إعدادات البوت
        function saveSettings() {
            config.token = document.getElementById('bot-token').value;
            config.chatID = document.getElementById('chat-id').value;
            if (config.token && config.chatID) {
                isLinked = true;
                alert("تم ربط حسابك بالمنظومة بنجاح! ستصلك التنبيهات فوراً.");
                addLog("تم تفعيل الربط المشفر للتليجرام ✅", "text-white");
            }
        }

        // جلب الأسعار من Binance
        async function updateMarket() {
            const symbols = ['BTCUSDT', 'ETHUSDT'];
            for (let s of symbols) {
                try {
                    const res = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${s}`);
                    const data = await res.json();
                    
                    const priceKey = s.replace('USDT', '');
                    const priceElem = document.getElementById(`price-${priceKey}`);
                    const changeElem = document.getElementById(`change-${priceKey}`);
                    
                    const price = parseFloat(data.lastPrice).toLocaleString();
                    const change = parseFloat(data.priceChangePercent).toFixed(2);
                    
                    priceElem.innerText = price + "$";
                    changeElem.innerText = (change > 0 ? '+' : '') + change + "%";
                    changeElem.className = change >= 0 ? 'text-green-400' : 'text-red-400';

                    // منطق الترقيم السريع (مثال: إذا تحركت العملة أكثر من 1% في لحظات)
                    if (Math.abs(change) > 2 && isLinked) {
                        sendToTelegram(`🚨 تنبيه ترقيم هيبة!\nالعملة: ${s}\nالسعر: ${price}\nالتغير: ${change}%\nالسوق يتحرك بقوة، جهز نفسك!`);
                    }
                } catch (e) { console.error("Error fetching price"); }
            }
        }

        async function sendToTelegram(msg) {
            if (!isLinked) return;
            const url = `https://api.telegram.org/bot${config.token}/sendMessage?chat_id=${config.chatID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
            fetch(url).catch(e => console.error("Telegram error"));
        }

        function addLog(text, colorClass = "text-green-400") {
            const logArea = document.getElementById('live-logs');
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = colorClass;
            div.innerHTML = `<span class="text-gray-600">[${time}]</span> > ${text}`;
            logArea.prepend(div);
        }

        // محاكاة تحليلات مستمرة لإضفاء جو "الهيبة"
        setInterval(() => {
            const events = [
                "فحص سيولة الحيتان في Binance...",
                "تحليل مؤشر RSI على فريم 15 دقيقة...",
                "رصد حركة غير اعتيادية في طلبات الشراء...",
                "تحديث مستويات الدعم والمقاومة للبيتكوين...",
                "تصفية صفقات الشورت بمقدار 2 مليون دولار..."
            ];
            const randomEvent = events[Math.floor(Math.random() * events.length)];
            addLog(randomEvent, "text-gray-400");
        }, 8000);

        // تشغيل التحديثات
        setInterval(updateMarket, 3000);
        updateMarket();
    </script>
</body>
</html>
