<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐 مجمع المنصات الشامل</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .header { background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid #fbbf24; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px; }
        .header h1 { color: #fbbf24; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 15px; padding: 20px; text-align: center; cursor: pointer; }
        .card h3 { color: #38bdf8; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 10px; }
        .btn { padding: 12px 20px; background: #fbbf24; border: none; border-radius: 10px; color: #0f172a; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; }
        .post { background: #334155; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-right: 4px solid #38bdf8; text-align: right;}
        #pageView { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="mainHub">
        <div class="header">
            <h1>🌐 المجمع العام للمنصات</h1>
            <button class="btn" style="width: auto;" onclick="showModal('createPageModal')">✨ إنشاء منصتي الخاصة</button>
        </div>
        <div class="grid" id="platformsGrid"></div>
    </div>

    <div id="pageView">
        <button class="btn" style="width: auto; margin-bottom: 20px;" onclick="goBack()">🔙 العودة للمجمع</button>
        <div class="header">
            <h1 id="currentPageTitle">...</h1>
            <button class="btn" style="width: auto;" onclick="showModal('addPostModal')">➕ إضافة محتوى</button>
        </div>
        <div id="postsContainer"></div>
    </div>
</div>

<div id="createPageModal" class="modal">
    <div class="modal-content">
        <h2>🚀 إنشاء منصة</h2>
        <input type="text" id="pName" placeholder="اسم المنصة">
        <input type="password" id="pAdminPass" placeholder="كلمة سر المالك">
        <input type="password" id="pVisitorPass" placeholder="كلمة سر الزوار (اختياري)">
        <button class="btn" onclick="createPlatform()">✅ إنشاء الآن</button>
        <button class="btn" onclick="closeModal('createPageModal')">❌ إلغاء</button>
    </div>
</div>

<div id="addPostModal" class="modal">
    <div class="modal-content">
        <h2>✍️ إضافة محتوى</h2>
        <textarea id="postContent" rows="4" placeholder="اكتب هنا..."></textarea>
        <button class="btn" onclick="addPost()">نشر</button>
        <button class="btn" onclick="closeModal('addPostModal')">إلغاء</button>
    </div>
</div>

<script>
    let platforms = [];
    let currentPlatformId = null;

    async function fetchPlatforms() {
        const res = await fetch('/api/platforms');
        platforms = await res.json();
        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('platformsGrid');
        grid.innerHTML = '';
        platforms.forEach(p => {
            const isLocked = p.visitorPass.trim() !== '';
            grid.innerHTML += `<div class="card" onclick="openPlatform(${p.id})">
                <h3>${p.name}</h3>
                <p>${isLocked ? '🔒 مقفلة' : '🌍 عامة'}</p>
            </div>`;
        });
    }

    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function createPlatform() {
        const pName = document.getElementById('pName').value;
        const pAdminPass = document.getElementById('pAdminPass').value;
        const pVisitorPass = document.getElementById('pVisitorPass').value;
        
        if(!pName || !pAdminPass) return alert("الاسم وكلمة السر للمالك ضرورية!");

        await fetch('/api/platforms', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: Date.now(), name: pName, adminPass: pAdminPass, visitorPass: pVisitorPass, posts: [] })
        });
        
        closeModal('createPageModal');
        fetchPlatforms();
    }

    function openPlatform(id) {
        const p = platforms.find(x => x.id === id);
        if(p.visitorPass && prompt("كلمة سر الزوار:") !== p.visitorPass && prompt("كلمة سر المالك:") !== p.adminPass) return alert("غلط!");
        
        currentPlatformId = id;
        document.getElementById('mainHub').style.display = 'none';
        document.getElementById('pageView').style.display = 'block';
        document.getElementById('currentPageTitle').innerText = p.name;
        renderPosts();
    }

    async function addPost() {
        const p = platforms.find(x => x.id === currentPlatformId);
        if(prompt("كلمة سر المالك:") !== p.adminPass) return alert("غلط!");

        const text = document.getElementById('postContent').value;
        if(!text) return;

        await fetch('/api/posts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ platformId: currentPlatformId, post: { text, date: new Date().toLocaleDateString('ar-EG') } })
        });

        closeModal('addPostModal');
        fetchPlatforms().then(() => renderPosts());
    }

    function renderPosts() {
        const p = platforms.find(x => x.id === currentPlatformId);
        const container = document.getElementById('postsContainer');
        container.innerHTML = '';
        [...p.posts].reverse().forEach(post => {
            container.innerHTML += `<div class="post"><p>${post.text}</p><p style="font-size:0.8em; color:#94a3b8;">${post.date}</p></div>`;
        });
    }

    function goBack() {
        document.getElementById('pageView').style.display = 'none';
        document.getElementById('mainHub').style.display = 'block';
        currentPlatformId = null;
    }

    fetchPlatforms();
    setInterval(fetchPlatforms, 5000); // تحديث تلقائي كل 5 ثواني عشان الكل يشوف الجديد
</script>
</body>
</html>
