<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 منظومة فادي برو للاتصالات 💎</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main-bg: #050c16; --card-bg: #101e30; --accent: #ffd700; --danger: #ff4444; --success: #00ff88; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--main-bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* شاشة الدخول الفخمة */
        #login-screen { position: fixed; inset: 0; background: radial-gradient(circle, #101e30, #050c16); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 30px; border: 2px solid var(--accent); width: 90%; max-width: 450px; text-align: center; box-shadow: 0 0 50px rgba(255, 215, 0, 0.1); }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 1px solid #1e3a5f; background: #050c16; color: white; font-size: 1rem; text-align: center; }
        
        /* الواجهة الرئيسية */
        #app { display: none; flex-direction: column; height: 100vh; }
        .header { background: var(--card-bg); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); }

        /* منطقة الفيديو */
        .video-container { position: relative; flex: 1; background: #000; display: flex; justify-content: center; align-items: center; gap: 10px; padding: 10px; }
        video { width: 48%; height: 80%; border-radius: 20px; border: 1px solid var(--accent); object-fit: cover; background: #222; }
        
        /* أزرار التحكم - الهيبة */
        .controls { position: absolute; bottom: 30px; display: flex; gap: 15px; background: rgba(0,0,0,0.6); padding: 15px 30px; border-radius: 50px; backdrop-filter: blur(10px); border: 1px solid var(--accent); }
        .btn-ctrl { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: 0.3s; }
        .btn-mute { background: #444; color: white; }
        .btn-video { background: #444; color: white; }
        .btn-end { background: var(--danger); color: white; }
        .btn-ctrl:hover { transform: scale(1.1); }

        /* منطقة الشات الجانبية */
        #chat-area { width: 300px; background: var(--card-bg); border-right: 2px solid var(--accent); display: flex; flex-direction: column; }
        @media (max-width: 768px) { #chat-area { display: none; } } /* اخفاء الشات في الجوال لتوفير مساحة */
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h1 style="color:var(--accent); margin-bottom:10px;">💎 FADI PRO 💎</h1>
        <p style="color:#aaa; margin-bottom:20px;">الجيل الجديد من الاتصالات المشفرة</p>
        <input type="text" id="userName" placeholder="اسمك المستعار">
        <input type="text" id="roomID" placeholder="رقم الغرفة (ID)">
        <input type="password" id="roomPass" placeholder="كلمة السر الخاصة">
        <button onclick="joinApp()" style="width:100%; padding:15px; border-radius:15px; background:var(--accent); border:none; font-weight:bold; cursor:pointer; margin-top:10px;">دخول آمن 🔒</button>
    </div>
</div>

<div id="app">
    <div class="header">
        <div id="info">🟢 متصل: <span id="displayRoom" style="color:var(--accent)"></span></div>
        <div style="font-weight:bold; color:var(--accent)">💎 FADI SYSTEM 💎</div>
    </div>

    <div class="video-container">
        <video id="localVid" autoplay muted playsinline></video>
        <video id="remoteVid" autoplay playsinline></video>
        
        <div class="controls">
            <button class="btn-ctrl btn-mute" id="muteBtn" onclick="toggleAudio()">🎤</button>
            <button class="btn-ctrl btn-video" id="videoBtn" onclick="toggleVideo()">📹</button>
            <button class="btn-ctrl btn-end" onclick="location.reload()">🛑</button>
        </div>
    </div>

    <div style="padding: 10px; background: var(--card-bg); text-align: center;">
        <button onclick="startCall()" style="background:var(--success); color:black; padding:10px 30px; border-radius:20px; border:none; font-weight:bold; cursor:pointer;">ابدأ الاتصال الآن 📞</button>
    </div>
</div>

<script>
    const socket = io();
    let localStream, peerConnection, room;
    let isMuted = false, isVideoOff = false;

    function joinApp() {
        const user = document.getElementById('userName').value;
        room = document.getElementById('roomID').value;
        if(!user || !room) return alert("يا فادي، ادخل اسمك ورقم الغرفة!");

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        document.getElementById('displayRoom').innerText = room;

        socket.emit('join-room', { roomID: room, user: user });
    }

    async function startCall() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVid').srcObject = localStream;

            peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

            peerConnection.onicecandidate = e => e.candidate && socket.emit('candidate', { roomID: room, candidate: e.candidate });
            peerConnection.ontrack = e => document.getElementById('remoteVid').srcObject = e.streams[0];

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', { roomID: room, offer: offer });
        } catch (e) { alert("تأكد من إذن الكاميرا والميكروفون!"); }
    }

    socket.on('offer', async data => {
        if(!peerConnection) await startCall();
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('answer', { roomID: room, answer: answer });
    });

    socket.on('answer', data => peerConnection.setRemoteDescription(new RTCSessionDescription(data)));
    socket.on('candidate', data => peerConnection.addIceCandidate(new RTCIceCandidate(data)));

    function toggleAudio() {
        isMuted = !isMuted;
        localStream.getAudioTracks()[0].enabled = !isMuted;
        document.getElementById('muteBtn').innerText = isMuted ? '🔇' : '🎤';
        document.getElementById('muteBtn').style.background = isMuted ? '#ff4444' : '#444';
    }

    function toggleVideo() {
        isVideoOff = !isVideoOff;
        localStream.getVideoTracks()[0].enabled = !isVideoOff;
        document.getElementById('videoBtn').innerText = isVideoOff ? '🚫' : '📹';
        document.getElementById('videoBtn').style.background = isVideoOff ? '#ff4444' : '#444';
    }
</script>
</body>
</html>
