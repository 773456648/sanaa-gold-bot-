<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Browser | متصفحي السحابي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #0f1015; color: white; height: 100vh; overflow: hidden; }
        .glass { background: rgba(26, 27, 35, 0.95); border: 1px solid rgba(255,255,255,0.1); }
        .browser-container { height: calc(100vh - 80px); width: 100%; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .status-dot { height: 10px; width: 10px; background: #22c55e; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #22c55e; }
    </style>
</head>
<body class="flex flex-col">

    <!-- شاشة الدخول -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0f1015]">
        <div class="glass p-8 rounded-2xl w-full max-w-md text-center">
            <h1 class="text-2xl font-bold mb-6 text-blue-500">تسجيل الدخول للنظام السحابي</h1>
            <input type="password" id="pass" placeholder="كلمة المرور" class="w-full p-3 rounded-lg bg-black border border-gray-700 mb-4 text-center">
            <button onclick="login()" class="w-full bg-blue-600 p-3 rounded-lg font-bold hover:bg-blue-700 transition">دخول</button>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <header class="h-[80px] glass flex items-center justify-between px-6 shadow-2xl">
        <div class="flex items-center gap-4">
            <div class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">CLOUD BROWSER V2</div>
            <div class="flex items-center gap-2 text-xs text-gray-400 border-r border-gray-700 pr-4 mr-4">
                <span class="status-dot"></span>
                السيرفر نشط الآن
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="window.location.reload()" class="bg-gray-800 p-2 rounded-lg text-sm">تحديث الاتصال</button>
            <button onclick="logout()" class="bg-red-900/30 text-red-400 p-2 rounded-lg text-sm">خروج</button>
        </div>
    </header>

    <main class="browser-container">
        <iframe id="cloudFrame" src=""></iframe>
    </main>

    <script>
        async function login() {
            const password = document.getElementById('pass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password})
            });
            const data = await res.json();
            if(data.success) {
                localStorage.setItem('cloud_auth', 'true');
                startSystem();
            } else {
                alert('كلمة المرور خاطئة');
            }
        }

        async function startSystem() {
            document.getElementById('login-screen').classList.add('hidden');
            const res = await fetch('/api/browser-config');
            const data = await res.json();
            // توجيه الـ iframe لرابط المتصفح الداخلي في السيرفر
            document.getElementById('cloudFrame').src = data.browserUrl;
        }

        function logout() {
            localStorage.removeItem('cloud_auth');
            window.location.reload();
        }

        // التحقق من الجلسة عند التحميل
        if(localStorage.getItem('cloud_auth') === 'true') {
            startSystem();
        }
    </script>
</body>
</html>
