 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار فادي - نظام الخصوصية والدقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #080808; }
        body { background: var(--dark); color: #fff; font-family: 'Changa', sans-serif; }
        .radar-disc { position: relative; width: 280px; height: 280px; border-radius: 50%; border: 2px solid var(--gold); background: radial-gradient(circle, #1a1a1a 0%, #000 100%); margin: auto; overflow: hidden; }
        .sweep { position: absolute; top: 50%; left: 50%; width: 50%; height: 50%; background: conic-gradient(from 0deg, transparent 80%, rgba(212, 175, 55, 0.3) 100%); transform-origin: 0% 0%; animation: rotate 4s linear infinite; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .nav-arrow { position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 24px solid var(--gold); transform-origin: 50% 100%; margin-top: -40px; margin-left: -12px; transition: 0.1s; display: none; filter: drop-shadow(0 0 10px var(--gold)); }
        .target-dot { position: absolute; width: 12px; height: 12px; background: #ff0000; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px #ff0000; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .zero-point { animation: glow 0.5s infinite alternate; color: #22c55e !important; }
        @keyframes glow { from { text-shadow: 0 0 5px #22c55e; } to { text-shadow: 0 0 20px #22c55e; } }
    </style>
</head>
<body class="p-4">

    <div id="auth-screen" class="max-w-md mx-auto mt-20 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-6xl font-black text-gold italic">RADAR</h1>
            <p class="text-gray-500 text-xs tracking-widest uppercase">نظام الرصد الخاص بك</p>
        </div>
        <div class="glass p-8 space-y-4">
            <input id="username" type="text" placeholder="اسم المستخدم" class="w-full bg-black/50 border border-white/10 p-4 rounded-xl outline-none focus:border-gold">
            <input id="password" type="password" placeholder="كلمة المرور" class="w-full bg-black/50 border border-white/10 p-4 rounded-xl outline-none focus:border-gold">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="auth('login')" class="bg-zinc-800 p-4 rounded-xl font-bold">دخول</button>
                <button onclick="auth('reg')" class="bg-gradient-to-r from-yellow-600 to-yellow-800 p-4 rounded-xl font-bold text-black">تسجيل جديد</button>
            </div>
        </div>
    </div>

    <div id="radar-screen" class="hidden max-w-md mx-auto space-y-6 pt-4">
        <div class="flex justify-between items-center glass p-4">
            <span id="user-display" class="font-bold text-gold"></span>
            <button onclick="logout()" class="text-xs text-red-500">خروج</button>
        </div>

        <div class="radar-disc" id="radar-disc">
            <div class="sweep"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3 h-3 bg-blue-500 rounded-full shadow-[0_0_10px_#3b82f6] z-30"></div>
            <div id="nav-arrow" class="nav-arrow"></div>
            <div id="target-container"></div>
        </div>

        <div class="glass p-6 text-center space-y-4">
            <div class="text-gray-400 text-sm">المسافة لنقطة الصفر</div>
            <div id="dist-display" class="text-5xl font-black text-white italic tracking-tighter">--</div>
            <div id="accuracy-display" class="text-[10px] text-gray-500 uppercase tracking-widest">انتظار إشارة GPS...</div>
            
            <button onclick="setHomePoint()" class="w-full bg-gold p-4 rounded-xl font-bold text-black shadow-lg active:scale-95 transition">
                📍 ارصد "الحجرة" في موقعي الآن
            </button>
            <button onclick="initCompass()" id="comp-btn" class="text-[10px] text-blue-400 border border-blue-400/30 px-4 py-1 rounded-full">تفعيل البوصلة للتوجيه 🧭</button>
        </div>

        <div class="glass p-4">
            <h3 class="text-xs font-bold text-gray-500 mb-2 uppercase">آخر المواقع المرصودة:</h3>
            <div id="points-list" class="space-y-2 max-h-32 overflow-y-auto pr-2"></div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let myLoc = null;
        let activePoint = null;
        let heading = 0;

        function auth(mode) {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if(!user || !pass) return alert("املا البيانات يا فادي!");

            if(mode === 'reg') {
                localStorage.setItem(`user_${user}`, pass);
                alert("تم إنشاء حسابك بنجاح");
            } else {
                if(localStorage.getItem(`user_${user}`) === pass) {
                    currentUser = user;
                    startApp();
                } else alert("البيانات غلط!");
            }
        }

        function startApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('radar-screen').classList.remove('hidden');
            document.getElementById('user-display').innerText = `المستخدم: ${currentUser}`;
            loadUserPoints();
            watchGPS();
        }

        function initCompass() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(s => {
                    if(s==='granted') window.addEventListener('deviceorientation', e => heading = e.webkitCompassHeading);
                });
            } else window.addEventListener('deviceorientationabsolute', e => heading = 360 - e.alpha);
            document.getElementById('comp-btn').innerText = "البوصلة نشطة ✅";
        }

        function watchGPS() {
            navigator.geolocation.watchPosition(pos => {
                myLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                document.getElementById('accuracy-display').innerText = `دقة الحساس: +/- ${pos.coords.accuracy.toFixed(1)} متر`;
                updateRadar();
            }, null, { enableHighAccuracy: true, maximumAge: 0 });
        }

        function setHomePoint() {
            if(!myLoc) return alert("انتظر لقط الإشارة!");
            const point = { ...myLoc, id: Date.now(), time: new Date().toLocaleTimeString() };
            let points = JSON.parse(localStorage.getItem(`points_${currentUser}`) || '[]');
            points.push(point);
            localStorage.setItem(`points_${currentUser}`, JSON.stringify(points));
            activePoint = point;
            loadUserPoints();
            alert("تم رصد الحجرة بدقة!");
        }

        function loadUserPoints() {
            const points = JSON.parse(localStorage.getItem(`points_${currentUser}`) || '[]');
            const list = document.getElementById('points-list');
            list.innerHTML = points.reverse().map(p => `
                <div onclick='setActive(${JSON.stringify(p)})' class="flex justify-between p-2 bg-white/5 rounded-lg text-xs cursor-pointer hover:bg-gold/10">
                    <span>📍 موقع رصد - ${p.time}</span>
                    <span class="text-gold">تتبع</span>
                </div>
            `).join('');
            if(points.length > 0 && !activePoint) activePoint = points[0];
        }

        function setActive(p) { activePoint = p; alert("تم تحديد الهدف للتتبع"); }

        function updateRadar() {
            if(!myLoc || !activePoint) return;

            const dist = calcDist(myLoc.lat, myLoc.lng, activePoint.lat, activePoint.lng);
            const distMeters = (dist * 1000).toFixed(2); // دقة خانتين بعد الفاصلة
            
            const display = document.getElementById('dist-display');
            display.innerText = distMeters + " م";

            // إذا وصلت لنقطة الصفر (أقل من نصف متر)
            if(distMeters <= 0.5) {
                display.classList.add('zero-point');
                display.innerText = "0.00 م";
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
            } else {
                display.classList.remove('zero-point');
            }

            const bear = calcBear(myLoc.lat, myLoc.lng, activePoint.lat, activePoint.lng);
            const relBear = (bear - heading + 360) % 360;

            const arrow = document.getElementById('nav-arrow');
            arrow.style.display = 'block';
            arrow.style.transform = `rotate(${relBear}deg)`;

            const container = document.getElementById('target-container');
            container.innerHTML = '';
            if(dist <= 0.05) { // عرض في نطاق 50 متر
                const p = (dist / 0.05) * 50;
                const r = relBear * (Math.PI/180);
                const x = 50 + (p * Math.sin(r));
                const y = 50 - (p * Math.cos(r));
                container.innerHTML = `<div class="target-dot" style="left:${x}%; top:${y}%"></div>`;
            }
        }

        function calcDist(l1, n1, l2, n2) {
            const R = 6371;
            const dL = (l2-l1)*Math.PI/180;
            const dN = (n2-n1)*Math.PI/180;
            const a = Math.sin(dL/2)**2 + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dN/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function calcBear(l1, n1, l2, n2) {
            const y = Math.sin((n2-n1)*Math.PI/180)*Math.cos(l2*Math.PI/180);
            const x = Math.cos(l1*Math.PI/180)*Math.sin(l2*Math.PI/180)-Math.sin(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.cos((n2-n1)*Math.PI/180);
            return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
        }

        function logout() { localStorage.removeItem('session'); location.reload(); }
    </script>
</body>
</html>
