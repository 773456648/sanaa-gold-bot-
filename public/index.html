<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>HEIBA GLOBAL | نظام التداول الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0f; }
        body { background: var(--bg); color: #fff; font-family: 'Changa', sans-serif; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(25, 25, 35, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 15px; }
        .gold-glow { color: #f1d279; text-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
        .btn-action { transition: 0.3s; border-radius: 10px; font-weight: bold; }
        .input-heiba { background: #000; border: 1px solid #333; border-radius: 8px; color: var(--gold); text-align: center; outline: none; }
        .asset-btn { background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
        .asset-btn.active { border-color: var(--gold); background: rgba(212, 175, 55, 0.1); }
    </style>
</head>
<body class="p-4">

    <div id="lock" class="fixed inset-0 z-[100] bg-black flex items-center justify-center">
        <div class="glass p-8 w-80 text-center">
            <h2 class="gold-glow orbitron mb-6 text-xl">HEIBA ACCESS</h2>
            <input type="password" id="pass" class="input-heiba w-full p-3 mb-4" placeholder="Password">
            <button onclick="unlock()" class="w-full bg-gradient-to-r from-[#d4af37] to-[#a17d1a] text-black py-3 rounded-xl font-bold">دخول</button>
        </div>
    </div>

    <div id="main" class="hidden">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold orbitron">HEIBA <span class="gold-glow">TRADER</span></h1>
            <div class="glass px-4 py-2 text-center">
                <div id="live-price" class="text-2xl font-black orbitron gold-glow">$0.00</div>
                <div id="active-asset-name" class="text-[10px] text-gray-500">GOLD</div>
            </div>
        </header>

        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <div class="asset-btn active" onclick="changeAsset('XAUUSD', 'GOLD')">الذهب</div>
            <div class="asset-btn" onclick="changeAsset('BTCUSDT', 'BTC')">بيتكوين</div>
            <div class="asset-btn" onclick="changeAsset('ETHUSDT', 'ETH')">إيثيريوم</div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-8">
                <div class="glass h-[450px] mb-6 overflow-hidden" id="chart-container"></div>
                <div class="glass p-6">
                    <div class="flex gap-4">
                        <input id="trade-amount" type="number" class="input-heiba flex-1 text-xl" placeholder="المبلغ $">
                        <button onclick="placeOrder('BUY')" class="flex-1 bg-green-600 btn-action py-4">BUY (شراء)</button>
                        <button onclick="placeOrder('SELL')" class="flex-1 bg-red-600 btn-action py-4">SELL (بيع)</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4 space-y-4">
                <div class="glass p-4">
                    <h3 class="text-sm gold-glow mb-4">📜 الصفقات المفتوحة</h3>
                    <div id="trades-list" class="space-y-3"></div>
                </div>
                <div class="glass p-4">
                    <h3 class="text-sm text-gray-500 mb-4">⚙️ إعداد تليجرام</h3>
                    <input id="bot-t" class="input-heiba w-full p-2 mb-2 text-xs" placeholder="Bot Token">
                    <input id="bot-c" class="input-heiba w-full p-2 mb-2 text-xs" placeholder="Chat ID">
                    <button onclick="linkBot()" class="w-full border border-gold/40 text-gold py-2 rounded text-xs">حفظ الإعدادات</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAsset = { symbol: 'OANDA:XAUUSD', name: 'GOLD' };
        let livePrice = 0;
        let vault = { trades: [] };

        function unlock() {
            if(document.getElementById('pass').value === '771232690') {
                document.getElementById('lock').style.display='none';
                document.getElementById('main').classList.remove('hidden');
                init();
            }
        }

        function init() {
            loadChart();
            setInterval(updateLivePrice, 2000);
            fetchData();
            setInterval(fetchData, 5000);
        }

        function loadChart() {
            new TradingView.widget({
                "container_id": "chart-container", "width": "100%", "height": "100%",
                "symbol": currentAsset.symbol, "interval": "15", "theme": "dark", "style": "1", "locale": "ar"
            });
        }

        function changeAsset(symbol, name) {
            currentAsset = { symbol, name };
            document.getElementById('active-asset-name').innerText = name;
            loadChart();
        }

        async function updateLivePrice() {
            try {
                // استخدام سعر بينانس كمؤشر سريع للعملات الرقمية أو الذهب المستقر
                const symbol = currentAsset.name === 'GOLD' ? 'PAXGUSDT' : currentAsset.name + 'USDT';
                const r = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
                const d = await r.json();
                livePrice = parseFloat(d.price);
                document.getElementById('live-price').innerText = "$" + livePrice.toLocaleString();
            } catch(e) {}
        }

        async function fetchData() {
            const r = await fetch('/api/data');
            vault = await r.json();
            renderTrades();
        }

        function renderTrades() {
            const list = document.getElementById('trades-list');
            list.innerHTML = vault.trades.map(t => {
                const diff = livePrice - t.entryPrice;
                const pnl = t.side === 'BUY' ? (diff * t.amount / t.entryPrice) : (-diff * t.amount / t.entryPrice);
                const color = pnl >= 0 ? 'text-green-500' : 'text-red-500';
                return `
                <div class="p-3 bg-white/5 rounded-lg border-r-4 ${pnl >=0 ? 'border-green-500':'border-red-500'}">
                    <div class="flex justify-between font-bold text-xs">
                        <span>${t.side} ${t.asset}</span>
                        <span class="${color}">${pnl.toFixed(2)}$</span>
                    </div>
                    <div class="flex justify-between text-[10px] text-gray-500 mt-2">
                        <span>دخول: ${t.entryPrice}</span>
                        <button onclick="closeTrade(${t.id})" class="text-white underline">إغلاق</button>
                    </div>
                </div>`;
            }).reverse().join('');
        }

        async function placeOrder(side) {
            const amount = document.getElementById('trade-amount').value;
            if(!amount) return alert("أدخل المبلغ");
            await fetch('/api/trade', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ asset: currentAsset.name, side, amount, entryPrice: livePrice })
            });
            fetchData();
        }

        async function closeTrade(id) {
            await fetch('/api/trade/' + id, { method: 'DELETE' });
            fetchData();
        }

        async function linkBot() {
            const token = document.getElementById('bot-t').value;
            const chatId = document.getElementById('bot-c').value;
            await fetch('/api/bots', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ token, chatId })
            });
            alert("تم ربط تليجرام بنجاح!");
        }
    </script>
</body>
</html>
