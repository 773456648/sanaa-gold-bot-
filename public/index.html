 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار المطبات والحفر 🚗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { background-color: #0f172a; color: white; overflow-x: hidden; }
        #map { height: 45vh; border-radius: 1rem; border: 2px solid #334155; z-index: 1; }
        .btn-hazard:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-4 flex flex-col h-screen">

    <div id="login-screen" class="flex-1 flex flex-col items-center justify-center space-y-4">
        <h1 class="text-3xl font-bold text-blue-400">رادار الطرقات 🚗</h1>
        <input id="username" type="text" placeholder="اكتب اسمك..." class="p-3 rounded-lg bg-slate-800 text-white border border-slate-600 w-64 text-center outline-none">
        <button onclick="startApp()" class="bg-blue-600 px-6 py-3 rounded-lg font-bold w-64 shadow-lg hover:bg-blue-500">دخول وتشغيل الرادار</button>
    </div>

    <div id="main-screen" class="hidden flex-1 flex flex-col gap-4">
        <div class="flex justify-between items-center bg-slate-800 p-3 rounded-xl shadow-lg">
            <span id="user-display" class="font-bold text-blue-400"></span>
            <span id="gps-status" class="text-sm text-yellow-400 animate-pulse">جاري البحث عن GPS...</span>
        </div>
        
        <div id="map"></div>

        <div class="grid grid-cols-2 gap-4 flex-1">
            <button onclick="reportHazard('حفرة كبيرة')" class="btn-hazard bg-red-600 rounded-2xl font-bold text-xl shadow-lg border-b-4 border-red-800 flex flex-col items-center justify-center"><span class="text-4xl mb-2">🕳️</span> حفرة كبيرة</button>
            <button onclick="reportHazard('حفرة صغيرة')" class="btn-hazard bg-orange-500 rounded-2xl font-bold text-xl shadow-lg border-b-4 border-orange-700 flex flex-col items-center justify-center"><span class="text-4xl mb-2">⭕</span> حفرة صغيرة</button>
            <button onclick="reportHazard('مطب كبير')" class="btn-hazard bg-purple-600 rounded-2xl font-bold text-xl shadow-lg border-b-4 border-purple-800 flex flex-col items-center justify-center"><span class="text-4xl mb-2">⛰️</span> مطب كبير</button>
            <button onclick="reportHazard('مطب صغير')" class="btn-hazard bg-yellow-600 rounded-2xl font-bold text-xl shadow-lg border-b-4 border-yellow-800 flex flex-col items-center justify-center"><span class="text-4xl mb-2">🚧</span> مطب صغير</button>
        </div>
    </div>

    <script>
        let userName = "", map, userMarker, currentPos = null;
        let hazards = JSON.parse(localStorage.getItem('hazards_db') || '[]');
        let audioCtx, alertedHazards = new Set();
        let hazardLayers = L.layerGroup(); // لتنظيم طبقات الخريطة

        // تسجيل Service Worker عشان يشتغل بالخلفية وأوفلاين
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        function playBeep() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square'; osc.frequency.value = 800;
            osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
            setTimeout(() => osc.stop(), 500);
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3, p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function startApp() {
            userName = document.getElementById('username').value.trim();
            if(!userName) return alert('اكتب اسمك يا جني!');
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)(); // تفعيل الصوت
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            document.getElementById('user-display').innerText = '👤 ' + userName;

            initMap();
            startGPS();
            fetchHazards(); // مزامنة مع السيرفر لو فيه نت
        }

        function initMap() {
            map = L.map('map').setView([15.3694, 44.1910], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            hazardLayers.addTo(map);
            drawHazards();
        }

        function drawHazards() {
            hazardLayers.clearLayers();
            hazards.forEach(h => {
                // رسم الدائرة الحمراء (10 متر)
                L.circle([h.lat, h.lng], { color: 'red', fillColor: '#f03', fillOpacity: 0.3, radius: 10 })
                 .bindPopup(`<b>${h.type}</b><br>رصد: ${h.reporter}`).addTo(hazardLayers);
            });
        }

        function startGPS() {
            if (!navigator.geolocation) return alert('الـ GPS مش مدعوم!');
            
            navigator.geolocation.watchPosition(pos => {
                currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                document.getElementById('gps-status').innerText = '📍 متصل';
                document.getElementById('gps-status').className = 'text-sm text-green-400';

                if(!userMarker) {
                    userMarker = L.circleMarker([currentPos.lat, currentPos.lng], { color: '#3b82f6', radius: 8, fillOpacity: 1 }).addTo(map);
                } else {
                    userMarker.setLatLng([currentPos.lat, currentPos.lng]);
                }
                map.setView([currentPos.lat, currentPos.lng]); // تتبع تلقائي

                checkProximity();
            }, err => {
                document.getElementById('gps-status').innerText = '❌ الـ GPS طافي';
            }, { enableHighAccuracy: true });
        }

        function checkProximity() {
            if(!currentPos) return;
            hazards.forEach(h => {
                const dist = getDistance(currentPos.lat, currentPos.lng, h.lat, h.lng);
                if(dist <= 10 && !alertedHazards.has(h.id)) { // 10 متر بالضبط
                    playBeep();
                    alert(`⚠️ انتبه! ${h.type} أمامك`);
                    alertedHazards.add(h.id);
                }
                if(dist > 20) alertedHazards.delete(h.id); // إعادة التفعيل لما تبعد
            });
        }

        async function reportHazard(type) {
            if(!currentPos) return alert('انتظر نلقط الـ GPS!');
            if(hazards.find(h => getDistance(currentPos.lat, currentPos.lng, h.lat, h.lng) < 10)) return alert('موجود مسبقاً!');

            const newHazard = { id: Date.now().toString(), lat: currentPos.lat, lng: currentPos.lng, type, reporter: userName };
            hazards.push(newHazard);
            localStorage.setItem('hazards_db', JSON.stringify(hazards));
            drawHazards();

            try {
                await fetch('/api/hazards', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(newHazard) });
            } catch(e) { console.log("شغالين أوفلاين، بيترفع بعدين"); }
        }

        async function fetchHazards() {
            try {
                const res = await fetch('/api/hazards');
                hazards = await res.json();
                localStorage.setItem('hazards_db', JSON.stringify(hazards));
                drawHazards();
            } catch(e) {}
        }
    </script>
</body>
</html>
