<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الهيبة | الميزان الذهبي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #060608; color: #f0f0f0; font-family: 'Changa', sans-serif; }
        .gold-border { border: 1px solid #d4af37; }
        .gold-text { color: #d4af37; }
        .gold-btn { background: linear-gradient(135deg, #d4af37, #b8860b); color: #000; font-weight: bold; }
        .glass-card { background: rgba(20, 20, 25, 0.9); border: 1px solid #222; border-radius: 20px; }
        .op-card { padding: 15px; border-radius: 12px; border-right: 4px solid #d4af37; background: #0c0c0e; margin-bottom: 12px; }
        .debt { border-right-color: #ef4444; }
        .pay { border-right-color: #22c55e; }
        input, select { background: #111 !important; border: 1px solid #333 !important; color: #fff; border-radius: 12px; padding: 12px; width: 100%; outline: none; }
        input:focus { border-color: #d4af37 !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- شاشة الدخول -->
    <div id="auth-ui" class="max-w-md mx-auto mt-12 space-y-6">
        <div class="text-center">
            <h1 class="text-6xl font-black gold-text italic">HEIBA</h1>
            <p class="text-[10px] text-gray-500 tracking-widest uppercase mt-2">Financial Control System</p>
        </div>
        <div class="glass-card p-8 space-y-4">
            <input id="u-name" type="text" placeholder="الاسم الكامل">
            <input id="u-pass" type="password" placeholder="كلمة السر">
            <select id="u-type">
                <option value="merchant">دخول كتاجر</option>
                <option value="debtor">دخول كمدين</option>
            </select>
            <div class="flex items-center gap-2 p-2">
                <input type="checkbox" id="remember-me" class="w-4 h-4 cursor-pointer">
                <label for="remember-me" class="text-xs text-gray-400 cursor-pointer">تذكرني (دخول تلقائي دائماً)</label>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="doAuth('login')" class="bg-zinc-800 py-3 rounded-xl font-bold">دخول</button>
                <button onclick="doAuth('reg')" class="gold-btn py-3 rounded-xl">تسجيل</button>
            </div>
        </div>
    </div>

    <!-- النظام الرئيسي -->
    <div id="main-ui" class="hidden max-w-6xl mx-auto space-y-6">
        <header class="flex justify-between items-center glass-card p-5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 gold-btn rounded-full flex items-center justify-center text-black">H</div>
                <div>
                    <h2 id="display-name" class="font-bold text-lg leading-none"></h2>
                    <span id="role-tag" class="text-[9px] text-gray-500 uppercase"></span>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleSettings()" class="bg-zinc-800 p-2 rounded-lg text-xs">⚙️</button>
                <button onclick="logout()" class="bg-red-900/20 text-red-500 px-4 py-2 rounded-lg text-xs font-bold">خروج</button>
            </div>
        </header>

        <!-- الإعدادات -->
        <div id="settings-ui" class="hidden glass-card p-6 mb-6 animate-pulse">
            <h3 class="text-sm font-bold gold-text mb-4">تغيير كلمة السر</h3>
            <div class="flex gap-2">
                <input id="new-password" type="password" placeholder="كلمة السر الجديدة">
                <button onclick="updatePassword()" class="gold-btn px-6 rounded-xl text-xs">حفظ</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- الشريط الجانبي -->
            <div class="lg:col-span-4 space-y-6">
                <!-- الموقف المالي العام (تم إصلاحه) -->
                <div class="glass-card p-6">
                    <h3 class="text-xs text-gray-500 font-bold mb-6 uppercase tracking-widest">الموقف المالي العام</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between border-b border-white/5 pb-4">
                            <span class="text-xs text-gray-400">إجمالي يمني</span>
                            <span id="grand-total-yer" class="text-2xl font-bold text-blue-400">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-xs text-gray-400">إجمالي دولار</span>
                            <span id="grand-total-usd" class="text-2xl font-bold text-green-400">0</span>
                        </div>
                    </div>
                </div>

                <!-- قائمة الأسماء -->
                <div id="merchant-list-pane" class="hidden glass-card p-6">
                    <h3 class="text-[10px] text-gray-500 font-bold mb-4 uppercase">المدينين المسجلين</h3>
                    <div class="flex gap-2 mb-4">
                        <input id="target-search" class="text-sm" placeholder="اسم المدين...">
                        <button onclick="addTarget()" class="gold-btn px-4 rounded-xl text-xl">+</button>
                    </div>
                    <div id="targets-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
                </div>

                <div id="debtor-list-pane" class="hidden glass-card p-6">
                    <h3 class="text-[10px] text-gray-500 font-bold mb-4 uppercase">التجار المرتبطين بك</h3>
                    <div id="auto-merchants" class="space-y-2"></div>
                </div>
            </div>

            <!-- تفاصيل المعاملات -->
            <div class="lg:col-span-8">
                <div id="details-pane" class="hidden glass-card p-8 min-h-[500px]">
                    <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-6">
                        <h3 id="active-target-name" class="text-3xl font-bold gold-text"></h3>
                        <div class="text-right">
                            <div id="current-yer" class="text-blue-400 font-bold"></div>
                            <div id="current-usd" class="text-green-400 font-bold"></div>
                        </div>
                    </div>

                    <div id="ops-list" class="space-y-3 mb-8 max-h-80 overflow-y-auto pr-2"></div>

                    <!-- فورم الإضافة -->
                    <div id="add-form" class="hidden bg-black/40 p-6 rounded-2xl space-y-4 border border-white/5">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <input id="op-amt" type="number" placeholder="المبلغ">
                            <select id="op-cur">
                                <option value="YER">يمني</option>
                                <option value="USD">دولار $</option>
                            </select>
                            <select id="op-type">
                                <option value="دين">شليت (دين)</option>
                                <option value="سداد">سددت (خصم)</option>
                            </select>
                            <input id="op-note" placeholder="البيان">
                        </div>
                        <button onclick="saveOp()" class="w-full py-4 gold-btn rounded-xl shadow-lg">تثبيت العملية الآن</button>
                    </div>
                </div>
                <div id="empty-hint" class="glass-card p-20 text-center text-gray-600 italic">
                    اختر اسماً من القائمة لبدء إدارة الحساب...
                </div>
            </div>
        </div>
    </div>

    <script>
        let user = null;
        let activeTarget = null;
        let discoveredData = [];

        // التحقق من الدخول التلقائي عند التحميل
        window.onload = () => {
            const savedUser = localStorage.getItem('heiba_user');
            if(savedUser) {
                user = JSON.parse(savedUser);
                start();
            }
        };

        async function doAuth(action) {
            const name = document.getElementById('u-name').value.trim();
            const password = document.getElementById('u-pass').value;
            const type = document.getElementById('u-type').value;
            if(!name || !password) return alert("يرجى إكمال البيانات");

            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, password, type, action })
            });
            const data = await res.json();
            if(res.ok) { 
                user = data; 
                if(document.getElementById('remember-me').checked) {
                    localStorage.setItem('heiba_user', JSON.stringify(user));
                }
                start(); 
            } else alert(data.error);
        }

        function start() {
            document.getElementById('auth-ui').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('display-name').innerText = user.name;
            document.getElementById('role-tag').innerText = user.type === 'merchant' ? 'Power User' : 'Standard User';
            
            if(user.type === 'merchant') {
                document.getElementById('merchant-list-pane').classList.remove('hidden');
                document.getElementById('add-form').classList.remove('hidden');
                renderMerchantList();
            } else {
                document.getElementById('debtor-list-pane').classList.remove('hidden');
                fetchAutoDebts();
            }
            calculateGrandTotal();
        }

        function calculateGrandTotal() {
            let y = 0, u = 0;
            user.myRecords.forEach(r => {
                const amt = parseFloat(r.amount);
                const isDebt = r.type === 'دين';
                if(r.currency === 'YER') y += (isDebt ? amt : -amt); else u += (isDebt ? amt : -amt);
            });
            document.getElementById('grand-total-yer').innerText = y.toLocaleString();
            document.getElementById('grand-total-usd').innerText = u.toLocaleString();
        }

        function addTarget() {
            const name = document.getElementById('target-search').value.trim();
            if(!name) return;
            activeTarget = name;
            showDetails(name);
            renderMerchantList();
            document.getElementById('target-search').value = "";
        }

        function renderMerchantList() {
            const targets = [...new Set(user.myRecords.map(r => r.targetName))];
            document.getElementById('targets-list').innerHTML = targets.map(t => `
                <div onclick="showDetails('${t}')" class="p-3 bg-zinc-900 rounded-xl cursor-pointer hover:bg-zinc-800 ${activeTarget === t ? 'border border-[#d4af37]' : ''}">${t}</div>
            `).join('');
        }

        async function fetchAutoDebts() {
            const res = await fetch(`/api/auto-discover?debtorName=${user.name}`);
            discoveredData = await res.json();
            document.getElementById('auto-merchants').innerHTML = discoveredData.map(m => `
                <div onclick="showDetails('${m.merchantName}', true)" class="p-3 bg-zinc-900 rounded-xl cursor-pointer hover:bg-zinc-800 border border-blue-900/30">${m.merchantName}</div>
            `).join('');
        }

        function showDetails(name, auto = false) {
            activeTarget = name;
            document.getElementById('empty-hint').classList.add('hidden');
            document.getElementById('details-pane').classList.remove('hidden');
            document.getElementById('active-target-name').innerText = name;

            let records = [];
            if(user.type === 'merchant') {
                records = user.myRecords.filter(r => r.targetName === name);
            } else {
                const found = discoveredData.find(m => m.merchantName === name);
                records = found ? found.records : [];
            }

            let y = 0, u = 0;
            document.getElementById('ops-list').innerHTML = records.map(r => {
                const amt = parseFloat(r.amount);
                const isDebt = r.type === 'دين';
                if(r.currency === 'YER') y += (isDebt ? amt : -amt); else u += (isDebt ? amt : -amt);
                return `
                <div class="op-card ${isDebt ? 'debt' : 'pay'}">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-bold">${r.note}</p>
                            <p class="text-[9px] text-gray-600">${new Date(r.date).toLocaleString('ar-YE')}</p>
                        </div>
                        <p class="text-xl font-black ${isDebt ? 'text-red-500' : 'text-green-500'}">${isDebt?'+':'-'}${amt.toLocaleString()} <span class="text-[10px] opacity-50">${r.currency}</span></p>
                    </div>
                </div>`;
            }).reverse().join('');

            document.getElementById('current-yer').innerText = y.toLocaleString() + " YER";
            document.getElementById('current-usd').innerText = u.toLocaleString() + " USD";
            if(user.type === 'merchant') renderMerchantList();
        }

        async function saveOp() {
            const amt = document.getElementById('op-amt').value;
            const cur = document.getElementById('op-cur').value;
            const type = document.getElementById('op-type').value;
            const note = document.getElementById('op-note').value || "عملية مالية";
            if(!amt || !activeTarget) return;

            user.myRecords.push({
                id: Date.now(),
                targetName: activeTarget,
                amount: amt,
                currency: cur,
                type: type,
                note: note,
                date: new Date().toISOString()
            });

            showDetails(activeTarget);
            calculateGrandTotal();
            sync();
            document.getElementById('op-amt').value = "";
            document.getElementById('op-note').value = "";
        }

        async function updatePassword() {
            const newPass = document.getElementById('new-password').value;
            if(!newPass) return;
            const res = await fetch('/api/update-pass', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: user.id, newPass })
            });
            if(res.ok) {
                user.password = newPass;
                alert("تم تحديث كلمة السر بنجاح");
                toggleSettings();
                sync();
            }
        }

        function toggleSettings() {
            const el = document.getElementById('settings-ui');
            el.classList.toggle('hidden');
        }

        function logout() {
            localStorage.removeItem('heiba_user');
            location.reload();
        }

        async function sync() {
            if(localStorage.getItem('heiba_user')) localStorage.setItem('heiba_user', JSON.stringify(user));
            await fetch('/api/sync', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: user.id, myRecords: user.myRecords })
            });
        }
    </script>
</body>
</html>
