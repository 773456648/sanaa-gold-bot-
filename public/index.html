<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رادار فادي - نسخة الثبات المطلق (Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: #d4af37; font-family: 'Changa', sans-serif; touch-action: manipulation; overflow: hidden; }
        .radar-hub { position: relative; width: 320px; height: 320px; border: 2px solid #333; border-radius: 50%; margin: 20px auto; background: radial-gradient(circle, #0a150a 0%, #000 100%); box-shadow: 0 0 50px rgba(0,255,0,0.05); overflow: hidden; }
        .grid-line { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(212,175,55,0.15); }
        .grid-v { position: absolute; left: 50%; top: 0; width: 1px; height: 100%; background: rgba(212,175,55,0.15); }
        
        /* دوائر المسافات الوهمية */
        .circle-ring { position: absolute; border: 1px dashed rgba(212,175,55,0.2); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        .sweep { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent 70%, rgba(0, 255, 0, 0.3) 100%); transform-origin: 0 0; animation: rotate 3s linear infinite; margin-top: -50%; margin-left: -50%; border-radius: 50%; pointer-events: none;}
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        
        .point-fixed { position: absolute; width: 12px; height: 12px; background: #ff0000; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px red; z-index: 10; transition: left 0.1s linear, top 0.1s linear; }
        .point-label { position: absolute; font-size: 10px; color: white; margin-top: 14px; white-space: nowrap; transform: translateX(-50%); text-shadow: 1px 1px 2px black; font-weight: bold;}
        
        .nav-pointer { position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 30px solid #d4af37; transform-origin: 50% 100%; margin-top: -45px; margin-left: -12px; display: none; z-index: 100; filter: drop-shadow(0 0 10px rgba(212,175,55,0.5)); }
        
        .target-lock { background: #8b0000 !important; border-color: #ff0000 !important; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,0,0,0.7); } 50% { transform: scale(1.02); box-shadow: 0 0 20px 10px rgba(255,0,0,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,0,0,0); } }
        
        /* مؤشر الدقة */
        #accuracy-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px solid rgba(0, 150, 255, 0.3); background: rgba(0, 150, 255, 0.1); border-radius: 50%; z-index: 5; transition: width 0.5s, height 0.5s; pointer-events: none;}
    </style>
</head>
<body class="p-4 text-center h-screen flex flex-col">

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-box" class="max-w-xs mx-auto mt-20 p-6 bg-zinc-900 rounded-3xl border border-zinc-800 shadow-2xl">
        <h1 class="text-3xl font-black mb-2 text-gold">نظام الرصد الدقيق</h1>
        <p class="text-xs text-gray-400 mb-6">خوارزميات التنعيم العسكري مفعلة</p>
        <input id="u" type="text" placeholder="اسم المستخدم" class="w-full bg-black p-3 rounded-xl mb-4 text-gold border border-zinc-700 outline-none focus:border-gold transition-colors text-center">
        <button onclick="login()" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-500 text-black font-black p-3 rounded-xl hover:scale-105 transition-transform">بدء النظام</button>
    </div>

    <!-- واجهة الرادار -->
    <div id="radar-app" class="hidden w-full max-w-md mx-auto flex-1 flex flex-col justify-between pb-4">
        
        <!-- معلومات علوية -->
        <div class="flex justify-between items-center bg-zinc-900 p-3 rounded-2xl border border-zinc-800 shadow-md">
            <span id="user-tag" class="text-xs font-bold text-gray-300"></span>
            <div class="flex flex-col text-left">
                <span class="text-[10px] text-gray-500">نطاق الخطأ (GPS)</span>
                <span id="acc-val" class="text-sm font-bold text-blue-400">جاري البحث...</span>
            </div>
        </div>

        <!-- الرادار -->
        <div class="radar-hub" id="radar-main">
            <!-- دوائر قياس -->
            <div class="circle-ring" style="width: 33%; height: 33%;"></div>
            <div class="circle-ring" style="width: 66%; height: 66%;"></div>
            <div class="grid-line"></div><div class="grid-v"></div>
            
            <div id="accuracy-ring"></div> <!-- دائرة دقة الجي بي اس -->
            <div class="sweep"></div>
            
            <!-- نقطة المركز (المستخدم) -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 bg-blue-500 rounded-full shadow-[0_0_20px_#00bfff] z-50 border-2 border-white"></div>
            
            <div id="pointer" class="nav-pointer"></div>
            <div id="points-container"></div>
        </div>

        <!-- شاشة المسافة -->
        <div id="dist-card" class="bg-zinc-900 p-5 rounded-3xl border border-zinc-800 transition-all duration-300 shadow-lg relative overflow-hidden">
            <div class="absolute top-0 right-0 w-16 h-16 bg-gradient-to-bl from-yellow-500/10 to-transparent rounded-bl-full pointer-events-none"></div>
            <div class="text-[11px] text-gray-400 mb-1">المسافة إلى الهدف المحدد</div>
            <div id="dist-val" class="text-6xl font-black italic tracking-tighter text-white drop-shadow-md">--<span class="text-xl ml-1 text-gray-500 font-normal">m</span></div>
            <div class="text-[12px] mt-2 font-bold text-yellow-500">الهدف: <span id="target-name" class="text-white">لم يتم التحديد</span></div>
        </div>

        <!-- الأزرار -->
        <div class="grid grid-cols-2 gap-3 mt-2">
            <button onclick="savePoint()" class="bg-red-900/40 border border-red-500 text-red-400 p-3 rounded-xl font-bold text-sm hover:bg-red-600 hover:text-white transition-all">📍 حفظ موقعي الحالي</button>
            <button onclick="initSensors()" id="sensor-btn" class="bg-blue-900/40 border border-blue-500 text-blue-400 p-3 rounded-xl font-bold text-sm hover:bg-blue-600 hover:text-white transition-all">🧭 تفعيل البوصلة</button>
        </div>

        <!-- قائمة النقاط -->
        <div class="mt-4 text-right bg-zinc-900 p-3 rounded-2xl border border-zinc-800 flex-1 flex flex-col">
            <div class="flex justify-between items-center mb-2 border-b border-zinc-700 pb-2">
                <h3 class="text-xs font-bold text-gray-400">بنك الأهداف المدمج:</h3>
                <button onclick="clearPoints()" class="text-[10px] text-red-500 px-2 py-1 bg-red-950 rounded">مسح الكل</button>
            </div>
            <div id="points-list" class="space-y-2 overflow-y-auto max-h-32 pr-1 custom-scrollbar"></div>
        </div>
    </div>

    <script>
        // --- متغيرات النظام الأساسية ---
        let user = "";
        let rawPoints = []; // نقاط الـ GPS الخام لتصفيتها
        let mySmoothPos = null; // الموقع المنعم والنهائي
        let points = []; // النقاط المحفوظة
        let activeTarget = null;
        
        // --- متغيرات التنعيم (Smoothing Variables) ---
        let targetHeading = 0; // القراءة القادمة من الحساس
        let currentHeading = 0; // القراءة الحالية المعروضة على الشاشة
        let gpsAccuracy = 999;
        
        // إعدادات الدقة
        const MAX_GPS_HISTORY = 4; // عدد النقاط المأخوذة للمتوسط (كلما زاد زاد الثبات وقلت السرعة)
        const RADAR_RANGE = 50; // مدى الرادار بالمتر (نصف القطر)

        function login() {
            user = document.getElementById('u').value.trim();
            if(!user) { alert("أدخل اسماً للمتابعة"); return; }
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('radar-app').style.display = 'flex';
            document.getElementById('user-tag').innerText = "👤 " + user;
            loadPoints();
            startTracking();
            requestAnimationFrame(animationLoop); // تشغيل محرك الرسوميات
        }

        function initSensors() {
            const btn = document.getElementById('sensor-btn');
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(s => {
                        if(s === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            btn.classList.add('bg-green-900/40', 'border-green-500', 'text-green-400');
                            btn.innerText = "✅ البوصلة نشطة";
                        }
                    }).catch(console.error);
                } else {
                    window.addEventListener('deviceorientationabsolute', handleOrientation) || window.addEventListener('deviceorientation', handleOrientation);
                    btn.classList.add('bg-green-900/40', 'border-green-500', 'text-green-400');
                    btn.innerText = "✅ البوصلة نشطة";
                }
            } else {
                alert("جهازك لا يدعم مستشعرات الاتجاه.");
            }
        }

        // استلام وتصفية قراءة البوصلة
        function handleOrientation(e) {
            let h = 0;
            if(e.webkitCompassHeading) {
                h = e.webkitCompassHeading; // ابل
            } else if(e.alpha) {
                h = 360 - e.alpha; // اندرويد
            }
            targetHeading = h;
        }

        function startTracking() {
            navigator.geolocation.watchPosition(pos => {
                const newPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                gpsAccuracy = pos.coords.accuracy;
                document.getElementById('acc-val').innerText = "±" + gpsAccuracy.toFixed(1) + " متر";
                
                // تحديث حجم دائرة الدقة
                const accRing = document.getElementById('accuracy-ring');
                // نسبة وتناسب: إذا كان الرادار 50 متر نصف قطر، نعكس الدقة عليه
                const accPercent = (gpsAccuracy / RADAR_RANGE) * 100;
                accRing.style.width = `${Math.min(accPercent, 100)}%`;
                accRing.style.height = `${Math.min(accPercent, 100)}%`;

                // --- خوارزمية تنعيم الـ GPS (Moving Average Filter) ---
                rawPoints.push(newPos);
                if(rawPoints.length > MAX_GPS_HISTORY) rawPoints.shift();
                
                let avgLat = 0, avgLng = 0;
                rawPoints.forEach(p => { avgLat += p.lat; avgLng += p.lng; });
                
                mySmoothPos = {
                    lat: avgLat / rawPoints.length,
                    lng: avgLng / rawPoints.length
                };

            }, (err) => {
                document.getElementById('acc-val').innerText = "إشارة ضعيفة!";
            }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 });
        }

        // --- محرك الرسوميات (60 إطار بالثانية للثبات المطلق) ---
        function animationLoop() {
            if(mySmoothPos) {
                // 1. تنعيم البوصلة (Lerp with wrap-around fix)
                let diff = targetHeading - currentHeading;
                // تعديل الفرق ليكون بين -180 و 180 لمنع الدوران العكسي الطويل
                diff = ((diff + 540) % 360) - 180; 
                currentHeading += diff * 0.08; // 0.08 هو معامل النعومة (رقم أصغر = أبطأ وأثبت)
                currentHeading = (currentHeading + 360) % 360; // إبقاء القيمة ضمن 0-360

                // 2. تحديث واجهة المستخدم بناءً على القيم المنعمة
                updateUIRender();
            }
            requestAnimationFrame(animationLoop);
        }

        function updateUIRender() {
            const container = document.getElementById('points-container');
            container.innerHTML = '';

            // رسم النقاط المحفوظة
            points.forEach(p => {
                const d = calcDist(mySmoothPos.lat, mySmoothPos.lng, p.lat, p.lng) * 1000; // مسافة بالمتر
                if(d <= RADAR_RANGE) { // داخل النطاق
                    const bear = calcBear(mySmoothPos.lat, mySmoothPos.lng, p.lat, p.lng);
                    // حساب الزاوية النسبية (الهدف ناقص اتجاهك الحالي)
                    const relBear = (bear - currentHeading + 360) % 360; 
                    
                    const distPercent = (d / RADAR_RANGE) * 50; // تحويل لنسبة مئوية من نصف القطر (50%)
                    const rad = relBear * (Math.PI/180);
                    
                    // حساب الإحداثيات على الشاشة (دائرة)
                    const x = 50 + (distPercent * Math.sin(rad));
                    const y = 50 - (distPercent * Math.cos(rad));
                    
                    const isActive = activeTarget && activeTarget.id === p.id;
                    const color = isActive ? '#00ff00' : '#ff0000';
                    const glow = isActive ? '0 0 20px #00ff00' : '0 0 10px red';
                    
                    container.innerHTML += `<div class="point-fixed" style="left:${x}%; top:${y}%; background:${color}; box-shadow:${glow}; z-index:${isActive?20:10}">
                        <div class="point-label" style="color:${color}">${p.name}</div>
                    </div>`;
                }
            });

            // تحديث بيانات الهدف النشط والسهم
            if(activeTarget) {
                const d = calcDist(mySmoothPos.lat, mySmoothPos.lng, activeTarget.lat, activeTarget.lng) * 1000;
                const dText = document.getElementById('dist-val');
                
                const bear = calcBear(mySmoothPos.lat, mySmoothPos.lng, activeTarget.lat, activeTarget.lng);
                const relBear = (bear - currentHeading + 360) % 360;
                
                const pointer = document.getElementById('pointer');
                pointer.style.display = 'block';
                pointer.style.transform = `rotate(${relBear}deg)`;

                // نظام القفل الذكي (يأخذ دقة الجوال بعين الاعتبار)
                // لا نطلب 0 متر لأن الجوال مستحيل يجيبها، نعتبر الهدف تم الوصول إليه ضمن نطاق دقة الجي بي اس (عادة 2-4 متر)
                const lockRange = Math.max(1.5, gpsAccuracy / 2); 

                if(d <= lockRange) { 
                    dText.innerHTML = `0.00<span class="text-xl ml-1 text-gray-500 font-normal">m</span>`;
                    document.getElementById('dist-card').classList.add('target-lock');
                    if(navigator.vibrate && Math.random() > 0.9) navigator.vibrate(50); // نبض خفيف
                } else {
                    dText.innerHTML = `${d.toFixed(1)}<span class="text-xl ml-1 text-gray-500 font-normal">m</span>`;
                    document.getElementById('dist-card').classList.remove('target-lock');
                }
            } else {
                document.getElementById('pointer').style.display = 'none';
                document.getElementById('dist-val').innerHTML = `--<span class="text-xl ml-1 text-gray-500 font-normal">m</span>`;
            }
        }

        // --- دوال الحفظ والبيانات ---
        function savePoint() {
            if(!mySmoothPos) return alert("انتظر حتى يستقر نظام الملاحة 📡");
            const name = prompt("أدخل اسم الهدف/النقطة:");
            if(!name) return;
            const newP = { ...mySmoothPos, id: Date.now(), name: name };
            points.push(newP);
            localStorage.setItem('points_' + user, JSON.stringify(points));
            loadPoints();
        }

        function loadPoints() {
            points = JSON.parse(localStorage.getItem('points_' + user) || '[]');
            const list = document.getElementById('points-list');
            list.innerHTML = points.map(p => `
                <div onclick="selectPoint(${p.id})" class="flex justify-between items-center p-3 bg-black/50 border border-zinc-700 rounded-xl cursor-pointer hover:border-yellow-500 transition-colors">
                    <span class="font-bold text-sm text-gray-200">📌 ${p.name}</span>
                    <span class="text-[10px] bg-zinc-800 text-yellow-500 px-2 py-1 rounded-full">تحديد الهدف</span>
                </div>
            `).join('');
            if(points.length === 0) list.innerHTML = '<div class="text-center text-xs text-zinc-600 py-4">لا توجد أهداف مسجلة</div>';
        }

        function selectPoint(id) {
            activeTarget = points.find(p => p.id === id);
            document.getElementById('target-name').innerText = activeTarget.name;
        }

        function clearPoints() { 
            if(confirm("تحذير: هل أنت متأكد من مسح كافة الإحداثيات المسجلة؟")) { 
                localStorage.removeItem('points_'+user); 
                activeTarget = null;
                document.getElementById('target-name').innerText = "لم يتم التحديد";
                loadPoints(); 
            } 
        }

        // --- معادلات الملاحة الفضائية ---
        // حساب المسافة بالكيلومتر
        function calcDist(l1, n1, l2, n2) {
            const R = 6371;
            const dL = (l2-l1)*Math.PI/180;
            const dN = (n2-n1)*Math.PI/180;
            const a = Math.sin(dL/2)**2 + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dN/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // حساب زاوية الانحراف المطلق
        function calcBear(l1, n1, l2, n2) {
            const y = Math.sin((n2-n1)*Math.PI/180)*Math.cos(l2*Math.PI/180);
            const x = Math.cos(l1*Math.PI/180)*Math.sin(l2*Math.PI/180)-Math.sin(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.cos((n2-n1)*Math.PI/180);
            return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
        }
    </script>
</body>
</html>
