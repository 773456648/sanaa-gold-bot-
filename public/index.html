<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الهيبة | النظام المالي المتكامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #060608; color: #f0f0f0; font-family: 'Changa', sans-serif; overflow-x: hidden; }
        .gold-text { color: #d4af37; }
        .gold-btn { background: linear-gradient(135deg, #d4af37, #b8860b); color: #000; font-weight: bold; }
        .glass-card { background: rgba(15, 15, 20, 0.98); border: 1px solid #222; border-radius: 28px; }
        input, select { background: #111 !important; border: 1px solid #333 !important; color: #fff; border-radius: 16px; padding: 16px; width: 100%; outline: none; }
        .type-select { border: 2px solid #333; transition: 0.3s; cursor: pointer; }
        .type-select.active { border-color: #d4af37; background: rgba(212, 175, 55, 0.05); }
        .info-section { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 20px; }
        .modal-backdrop { background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); }
        .tafqit-box { font-size: 11px; color: #d4af37; margin-top: 5px; margin-right: 10px; font-weight: bold; font-style: italic; }
        /* ستايلات جديدة للحالات */
        .status-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
        .st-pending { background: rgba(255, 165, 0, 0.1); color: orange; border: 1px solid orange; }
        .st-confirmed { background: rgba(0, 255, 0, 0.1); color: #00ff00; border: 1px solid #00ff00; }
        .st-rejected { background: rgba(255, 0, 0, 0.1); color: #ff4444; border: 1px solid #ff4444; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="auth-ui" class="max-w-6xl mx-auto mt-4 space-y-12">
        <div class="text-center">
            <h1 class="text-8xl font-black gold-text italic tracking-tighter">HEIBA</h1>
            <p class="text-[12px] text-gray-500 tracking-[0.5em] uppercase mt-4">The Sovereign Financial Platform</p>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
            <div class="glass-card p-10 space-y-6 shadow-2xl">
                <h2 class="text-2xl font-bold text-center mb-4">الدخول إلى المنصة</h2>
                <div class="grid grid-cols-2 gap-4 mb-2">
                    <div id="sel-merchant" onclick="setType('merchant')" class="type-select active p-5 rounded-2xl text-center">👑 <span class="text-sm font-bold">حساب تاجر</span></div>
                    <div id="sel-debtor" onclick="setType('debtor')" class="type-select p-5 rounded-2xl text-center">👤 <span class="text-sm font-bold">حساب مواطن</span></div>
                </div>
                <div class="space-y-4">
                    <input id="u-name" type="text" placeholder="الاسم الكامل للمستخدم">
                    <div class="relative">
                        <input id="u-pass" type="password" placeholder="كلمة المرور الخاصة بك">
                        <button onclick="togglePass('u-pass')" class="absolute left-4 top-1/2 -translate-y-1/2 opacity-40">👁️</button>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 mt-6">
                    <button onclick="doAuth('login')" class="bg-zinc-800 py-4 rounded-2xl font-bold">تسجيل الدخول</button>
                    <button onclick="doAuth('reg')" class="gold-btn py-4 rounded-2xl">إنشاء حساب</button>
                </div>
            </div>
            <div class="space-y-8">
                <h3 class="text-3xl font-black gold-text">ما هي فائدة المنصة؟</h3>
                <p class="text-gray-400 italic">أكلوا وشربوا وعلى الحق اتحسبوا...</p>
            </div>
        </div>
    </div>

    <div id="main-ui" class="hidden max-w-7xl mx-auto space-y-6">
        <header class="flex justify-between items-center glass-card p-6">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 gold-btn rounded-2xl flex items-center justify-center text-black font-black text-2xl">H</div>
                <div><h2 id="display-name" class="text-2xl font-black gold-text"></h2><span id="role-tag" class="text-[10px] text-gray-600 uppercase tracking-widest"></span></div>
            </div>
            <button onclick="logout()" class="bg-red-900/10 text-red-500 px-6 py-2 rounded-xl text-xs font-bold border border-red-500/20">خروج</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-card p-6">
                    <h3 class="text-[11px] text-gray-500 font-bold mb-6 uppercase">الرصيد الصافي العام</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center p-3 rounded-xl border border-blue-500/10 bg-blue-500/5"><span class="text-xs">يمني</span><span id="gt-yer" class="font-bold text-blue-400 text-xl">0</span></div>
                        <div class="flex justify-between items-center p-3 rounded-xl border border-green-500/10 bg-green-500/5"><span class="text-xs">دولار</span><span id="gt-usd" class="font-bold text-green-400 text-xl">0</span></div>
                        <div class="flex justify-between items-center p-3 rounded-xl border border-orange-500/10 bg-orange-500/5"><span class="text-xs">سعودي</span><span id="gt-sar" class="font-bold text-orange-400 text-xl">0</span></div>
                    </div>
                </div>
                <div class="glass-card p-6 min-h-[400px]">
                    <div id="merchant-tools" class="hidden flex gap-2 mb-4"><input id="target-search" placeholder="اسم المواطن..." onchange="addTarget()"><button onclick="addTarget()" class="gold-btn px-4 rounded-xl">+</button></div>
                    <div id="main-list" class="space-y-2"></div>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div id="details-pane" class="hidden glass-card p-8 min-h-[600px] flex flex-col">
                    <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-6">
                        <h3 id="active-target-name" class="text-3xl font-black gold-text italic"></h3>
                        <div class="flex gap-4 text-[11px] font-bold"><span id="dt-yer" class="text-blue-400"></span><span id="dt-usd" class="text-green-400"></span><span id="dt-sar" class="text-orange-400"></span></div>
                    </div>
                    <div id="ops-list" class="flex-grow space-y-3 overflow-y-auto max-h-[450px] mb-6"></div>
                    
                    <div id="add-form" class="hidden bg-black/40 p-5 rounded-2xl border border-white/5 space-y-4">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <div class="relative"><input id="op-amt" type="number" placeholder="المبلغ" oninput="applyTafqit()"><div id="tafqit-text" class="tafqit-box"></div></div>
                            <select id="op-cur" onchange="applyTafqit()"><option value="YER">يمني</option><option value="USD">دولار</option><option value="SAR">سعودي</option></select>
                            <select id="op-type"><option value="دين">دين</option><option value="سداد">سداد</option></select>
                            <input id="op-note" placeholder="البيان (اختياري)">
                        </div>
                        <button onclick="saveOp()" class="gold-btn w-full py-4 rounded-xl">تثبيت العملية فوراً</button>
                    </div>
                </div>
                <div id="empty-hint" class="glass-card p-24 text-center text-gray-700 italic flex items-center justify-center min-h-[600px]">اختر حساباً لمتابعة السجلات الحية...</div>
            </div>
        </div>
    </div>

    <script>
        let user = null; let activeTarget = null; let userType = 'merchant'; let discoveredData = [];

        function togglePass(id) { const input = document.getElementById(id); input.type = input.type === 'password' ? 'text' : 'password'; }

        function formatAr(num) {
            if (num == 0) return "صفر";
            const units = ["", "واحد", "اثنان", "ثلاثة", "أربعة", "خمسة", "ستة", "سبعة", "ثمانية", "تسعة", "عشرة", "أحد عشر", "اثنا عشر", "ثلاثة عشر", "أربعة عشر", "خمسة عشر", "ستة عشر", "سبعة عشر", "ثمانية عشر", "تسعة عشر"];
            const tens = ["", "", "عشرون", "ثلاثون", "أربعون", "خمسون", "ستون", "سبعون", "ثمانون", "تسعون"];
            const hundreds = ["", "مائة", "مائتان", "ثلاثمائة", "أربعمائة", "خمسمائة", "ستمائة", "سبعمائة", "ثمانمائة", "تسعمائة"];
            function conv(n) {
                let r = ""; const h = Math.floor(n / 100); const t = n % 100;
                if (h > 0) r += hundreds[h];
                if (t > 0) { if (r !== "") r += " و "; if (t < 20) r += units[t]; else { const s = t % 10; const ten = Math.floor(t / 10); if (s > 0) r += units[s] + " و "; r += tens[ten]; } }
                return r;
            }
            let res = ""; const m = Math.floor(num / 1000000); const th = Math.floor((num % 1000000) / 1000); const rem = num % 1000;
            if (m > 0) res += (m === 1 ? "مليون" : (m === 2 ? "مليونان" : conv(m) + " ملايين"));
            if (th > 0) { if (res !== "") res += " و "; res += (th === 1 ? "ألف" : (th === 2 ? "ألفين" : conv(th) + " آلاف")); }
            if (rem > 0) { if (res !== "") res += " و "; res += conv(rem); }
            return res;
        }

        function applyTafqit() {
            const val = document.getElementById('op-amt').value;
            const cur = document.getElementById('op-cur').options[document.getElementById('op-cur').selectedIndex].text;
            document.getElementById('tafqit-text').innerText = val > 0 ? formatAr(parseInt(val)) + " " + cur : "";
        }

        function setType(t) { userType = t; document.getElementById('sel-merchant').classList.toggle('active', t === 'merchant'); document.getElementById('sel-debtor').classList.toggle('active', t === 'debtor'); }

        window.onload = () => { const saved = localStorage.getItem('heiba_auth_session'); if (saved) { user = JSON.parse(saved); start(); } };

        async function doAuth(action) {
            const name = document.getElementById('u-name').value.trim();
            const password = document.getElementById('u-pass').value;
            if(!name || !password) return;
            const res = await fetch('/api/auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, password, type: userType, action }) });
            const data = await res.json();
            if(res.ok) { user = data; if(document.getElementById('remember-me')?.checked) localStorage.setItem('heiba_auth_session', JSON.stringify(user)); start(); } else alert(data.error);
        }

        function start() {
            document.getElementById('auth-ui').classList.add('hidden'); document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('display-name').innerText = user.name;
            document.getElementById('role-tag').innerText = user.type === 'merchant' ? '👑 رتبة تاجر' : '👤 رتبة مواطن';
            if(user.type === 'merchant') { document.getElementById('merchant-tools').classList.remove('hidden'); document.getElementById('add-form').classList.remove('hidden'); renderList(); calculateGrand(user.myRecords); }
            else { fetchAutoDebts(); setInterval(fetchAutoDebts, 4000); }
        }

        function calculateGrand(recs) {
            let y=0, u=0, s=0; 
            // فقط العملات المؤكدة تدخل في الحساب الصافي
            recs.filter(r => r.status === 'confirmed').forEach(r => { 
                const a = parseFloat(r.amount); const d = r.type === 'دين'; 
                if(r.currency === 'YER') y += d?a:-a; else if(r.currency === 'USD') u += d?a:-a; else s += d?a:-a; 
            });
            document.getElementById('gt-yer').innerText = y.toLocaleString(); document.getElementById('gt-usd').innerText = u.toLocaleString(); document.getElementById('gt-sar').innerText = s.toLocaleString();
        }

        function renderList() {
            const t = [...new Set(user.myRecords.map(r => r.targetName))];
            document.getElementById('main-list').innerHTML = t.map(n => `<div onclick="showDetails('${n}')" class="p-4 bg-black rounded-2xl cursor-pointer border border-white/5 hover:border-yellow-600 transition ${activeTarget === n ? 'border-yellow-600 bg-zinc-900 shadow-xl' : ''}">${n}</div>`).join('');
        }

        async function fetchAutoDebts() {
            const res = await fetch(`/api/auto-discover?debtorName=${encodeURIComponent(user.name)}`);
            discoveredData = await res.json();
            let all = []; discoveredData.forEach(m => all = all.concat(m.records)); calculateGrand(all);
            document.getElementById('main-list').innerHTML = discoveredData.map(m => `<div onclick="showDetails('${m.merchantName}')" class="p-4 bg-zinc-900 border border-blue-900/30 rounded-2xl mb-2"><p class="font-bold text-sm">${m.merchantName}</p></div>`).join('');
            if(activeTarget) showDetails(activeTarget);
        }

        function showDetails(name) {
            activeTarget = name; document.getElementById('empty-hint').classList.add('hidden'); document.getElementById('details-pane').classList.remove('hidden');
            document.getElementById('active-target-name').innerText = name;
            let records = (user.type === 'merchant') ? user.myRecords.filter(r => r.targetName === name) : (discoveredData.find(m => m.merchantName === name)?.records || []);
            
            let y=0, u=0, s=0;
            document.getElementById('ops-list').innerHTML = records.map(r => {
                const a = parseFloat(r.amount); const d = r.type === 'دين'; 
                if(r.status === 'confirmed') { if(r.currency === 'YER') y += d?a:-a; else if(r.currency === 'USD') u += d?a:-a; else s += d?a:-a; }
                
                let statusHtml = r.status === 'confirmed' ? '<span class="status-badge st-confirmed">✅ مؤكد</span>' : (r.status === 'rejected' ? '<span class="status-badge st-rejected">❌ مرفوض</span>' : '<span class="status-badge st-pending">⏳ تحت الانتظار</span>');
                
                // أزرار المواطن
                let actionBtns = "";
                if(user.type === 'debtor' && r.status === 'pending') {
                    actionBtns = `<div class="mt-2 flex gap-2">
                        <button onclick="handleStatus('${r.id}', 'confirmed', '${name}')" class="bg-green-600 text-white px-3 py-1 rounded-lg text-[10px]">موافق</button>
                        <button onclick="handleStatus('${r.id}', 'rejected', '${name}')" class="bg-red-600 text-white px-3 py-1 rounded-lg text-[10px]">اعتراض</button>
                    </div>`;
                }

                return `<div class="p-4 bg-zinc-900/50 rounded-2xl border-r-4 ${d?'border-red-500':'border-green-500'} flex justify-between items-start shadow-sm">
                    <div>
                        <div class="flex items-center gap-2">${statusHtml} <p class="font-bold text-sm">${r.note || 'عملية مالية'}</p></div>
                        <p class="text-[10px] text-gray-600 mt-1">${new Date(r.date).toLocaleDateString('ar-YE')}</p>
                        ${r.rejectReason ? `<p class="text-[10px] text-red-400 italic mt-1">سبب الرفض: ${r.rejectReason}</p>` : ''}
                        ${actionBtns}
                    </div>
                    <div class="text-right">
                        <p class="text-xl font-black ${d?'text-red-500':'text-green-500'}">${d?'+':'-'}${a.toLocaleString()}</p>
                        <p class="text-[9px] opacity-40 uppercase font-bold tracking-widest">${r.currency}</p>
                    </div>
                </div>`;
            }).reverse().join('');
            
            document.getElementById('dt-yer').innerText = y.toLocaleString(); document.getElementById('dt-usd').innerText = u.toLocaleString(); document.getElementById('dt-sar').innerText = s.toLocaleString();
        }

        async function handleStatus(opId, newStatus, merchantName) {
            let reason = "";
            if(newStatus === 'rejected') {
                reason = prompt("يرجى كتابة سبب الرفض (إجباري):");
                if(!reason) return alert("لا يمكنك الرفض بدون كتابة السبب!");
            }
            const res = await fetch('/api/op-status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ opId, newStatus, reason, merchantName, debtorName: user.name })
            });
            if(res.ok) fetchAutoDebts();
        }

        async function saveOp() {
            const a = document.getElementById('op-amt').value; if(!a || !activeTarget) return;
            const newOp = { 
                id: "OP" + Date.now(), 
                targetName: activeTarget, 
                amount: a, 
                currency: document.getElementById('op-cur').value, 
                type: document.getElementById('op-type').value, 
                note: document.getElementById('op-note').value, 
                date: new Date().toISOString(),
                status: 'pending' // تبدأ دائماً تحت الانتظار
            };
            user.myRecords.push(newOp);
            showDetails(activeTarget); calculateGrand(user.myRecords);
            fetch('/api/sync', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId: user.id, myRecords: user.myRecords }) });
            document.getElementById('op-amt').value = ""; document.getElementById('op-note').value = "";
        }

        function logout() { localStorage.removeItem('heiba_auth_session'); location.reload(); }
    </script>
</body>
</html>
