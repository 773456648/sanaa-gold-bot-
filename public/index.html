<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 FADI ESTATE PRO | إدارة العقارات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #ffd700; --dark: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --success: #238636; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--dark); color: var(--text); overflow-x: hidden; }

        /* الشاشة الرئيسية */
        .dashboard { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
        
        /* القائمة الجانبية */
        aside { background: var(--card); border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .brand { font-size: 1.5rem; color: var(--gold); font-weight: bold; text-align: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .menu-item { padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .menu-item:hover, .menu-item.active { background: var(--gold); color: black; }

        /* المحتوى الرئيسي */
        main { padding: 30px; overflow-y: auto; }
        .top-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid var(--border); text-align: right; position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; bottom: 0; right: 0; width: 5px; height: 100%; background: var(--gold); }
        .stat-card h3 { font-size: 0.9rem; color: #8b949e; }
        .stat-card p { font-size: 1.5rem; font-weight: bold; margin-top: 10px; color: #fff; }

        /* قائمة العقارات */
        .section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .add-btn { background: var(--gold); color: #000; padding: 10px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        
        .prop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .prop-card { background: var(--card); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; transition: 0.3s; }
        .prop-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .prop-img { height: 200px; background: #21262d; position: relative; display: flex; align-items: center; justify-content: center; font-size: 4rem; color: #30363d; }
        .prop-badge { position: absolute; top: 15px; right: 15px; background: var(--success); color: white; padding: 5px 15px; border-radius: 50px; font-size: 0.8rem; }
        .prop-body { padding: 20px; }
        .prop-price { font-size: 1.4rem; font-weight: bold; color: var(--gold); margin-bottom: 10px; }
        .prop-features { display: flex; gap: 15px; font-size: 0.85rem; color: #8b949e; margin-top: 15px; border-top: 1px solid var(--border); pt: 15px; }

        /* نافذة الإضافة */
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; border: 1px solid var(--gold); }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid var(--border); color: white; border-radius: 8px; }

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
            aside { display: none; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <aside>
        <div class="brand">💎 فادي برو</div>
        <div class="menu-item active"><i class="fas fa-home"></i> الرئيسية</div>
        <div class="menu-item"><i class="fas fa-building"></i> جميع العقارات</div>
        <div class="menu-item"><i class="fas fa-users"></i> المستأجرين</div>
        <div class="menu-item"><i class="fas fa-file-invoice-dollar"></i> الحسابات</div>
        <div class="menu-item"><i class="fas fa-cog"></i> الإعدادات</div>
    </aside>

    <main>
        <div class="top-stats">
            <div class="stat-card">
                <h3>إجمالي المحصل</h3>
                <p>1,250,000 ريال</p>
            </div>
            <div class="stat-card">
                <h3>عقارات نشطة</h3>
                <p>24 عقار</p>
            </div>
            <div class="stat-card">
                <h3>ديون متأخرة</h3>
                <p style="color: #ff4444;">180,000 ريال</p>
            </div>
            <div class="stat-card">
                <h3>طلبات جديدة</h3>
                <p>5 طلبات</p>
            </div>
        </div>

        <div class="section-title">
            <h2>قائمة العقارات المتوفرة</h2>
            <button class="add-btn" onclick="openModal()">+ إضافة عقار</button>
        </div>

        <div class="prop-grid" id="propGrid">
            </div>
    </main>
</div>

<div id="modal">
    <div class="modal-content">
        <h3>إضافة عقار جديد للديوان</h3>
        <input type="text" id="pTitle" placeholder="عنوان العقار (مثلاً: شقة حي حدة)">
        <input type="number" id="pPrice" placeholder="السعر">
        <select id="pType">
            <option value="rent">للإيجار</option>
            <option value="sale">للبيع</option>
        </select>
        <input type="text" id="pSpace" placeholder="المساحة (باللبنة)">
        <button class="add-btn" onclick="addProperty()" style="width: 100%; margin-top: 10px;">حفظ في المنظومة ✅</button>
        <button onclick="closeModal()" style="background:none; color: gray; border:none; margin-top: 10px; width: 100%; cursor:pointer;">إلغاء</button>
    </div>
</div>

<script>
    // بيانات افتراضية
    let properties = [
        { title: "عمارة تجارية - شارع الستين", price: "500,000 $", space: "40 لبنة", type: "للبيع", icon: "fa-city", color: "#1f6feb" },
        { title: "شقة عائلية - فج عطان", price: "150,000 ريال", space: "4 غرف", type: "للإيجار", icon: "fa-door-open", color: "#238636" }
    ];

    function renderProperties() {
        const grid = document.getElementById('propGrid');
        grid.innerHTML = '';
        properties.forEach((p, index) => {
            grid.innerHTML += `
                <div class="prop-card">
                    <div class="prop-img">
                        <i class="fas ${p.icon}"></i>
                        <span class="prop-badge" style="background:${p.color}">${p.type}</span>
                    </div>
                    <div class="prop-body">
                        <div class="prop-price">${p.price}</div>
                        <h4>${p.title}</h4>
                        <div class="prop-features">
                            <span><i class="fas fa-expand-arrows-alt"></i> ${p.space}</span>
                            <span><i class="fas fa-map-marker-alt"></i> صنعاء</span>
                        </div>
                        <div style="display:flex; gap:10px; margin-top:20px;">
                            <button onclick="whatsapp('${p.title}')" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--gold); background:transparent; color:var(--gold); cursor:pointer;"><i class="fab fa-whatsapp"></i> تواصل</button>
                            <button onclick="deleteProp(${index})" style="padding:10px; border-radius:8px; border:none; background:#ff444422; color:#ff4444; cursor:pointer;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function addProperty() {
        const title = document.getElementById('pTitle').value;
        const price = document.getElementById('pPrice').value;
        const type = document.getElementById('pType').value;
        const space = document.getElementById('pSpace').value;

        if(title && price) {
            properties.push({
                title: title,
                price: price + (type === 'rent' ? ' ريال' : ' $'),
                space: space + ' لبنة',
                type: type === 'rent' ? 'للإيجار' : 'للبيع',
                icon: "fa-home",
                color: type === 'rent' ? "#238636" : "#1f6feb"
            });
            renderProperties();
            closeModal();
        }
    }

    function deleteProp(i) {
        properties.splice(i, 1);
        renderProperties();
    }

    function whatsapp(title) {
        window.open(`https://wa.me/967770000000?text=استفسار عن عقار: ${title}`);
    }

    // التشغيل الأول
    renderProperties();
</script>

</body>
</html>
