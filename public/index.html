<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEIBA ROYAL | منظومة الهيبة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ff41; }
        body { 
            font-family: 'Changa', sans-serif; 
            background: #020202; 
            color: #fff; 
            background-image: radial-gradient(circle at center, #001a08 0%, #020202 100%);
            min-height: 100vh;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .neon-border { border: 1px solid var(--neon); box-shadow: 0 0 15px rgba(0, 255, 65, 0.1); }
        .glass { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); border-radius: 24px; }
        input { background: #000 !important; border: 1px solid #1a1a1a !important; color: var(--neon) !important; text-align: center; }
        input:focus { border-color: var(--neon) !important; outline: none; box-shadow: 0 0 10px var(--neon); }
        .btn-royal { background: var(--neon); color: #000; font-weight: 800; transition: 0.4s; cursor: pointer; }
        .btn-royal:hover { box-shadow: 0 0 30px var(--neon); transform: translateY(-2px); }
        .status-dot { width: 8px; height: 8px; background: var(--neon); border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-16">
            <h1 class="text-6xl font-black mb-2 orbitron tracking-tighter text-[#00ff41]">HEIBA ROYAL</h1>
            <p class="text-gray-500 text-[10px] tracking-[0.6em] uppercase">Global Security Trading Protocol</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <!-- لوحة التحكم -->
            <div class="lg:col-span-4">
                <div class="glass neon-border p-8">
                    <h2 class="text-xl font-bold mb-6 flex items-center border-b border-green-900 pb-4">
                        <span class="ml-3 text-green-500">🛡️</span> وحدة التفعيل
                    </h2>
                    <div class="space-y-4">
                        <input type="password" id="m_pass" placeholder="كلمة السر" class="w-full p-4 rounded-xl">
                        <input type="text" id="m_name" placeholder="الاسم" class="w-full p-4 rounded-xl">
                        <input type="text" id="m_token" placeholder="Bot Token" class="w-full p-4 rounded-xl text-xs">
                        <input type="text" id="m_chatid" placeholder="Chat ID" class="w-full p-4 rounded-xl">
                        <button onclick="register()" class="btn-royal w-full py-5 rounded-xl uppercase">تفعيل الربط والتعليمات ⚡</button>
                    </div>
                </div>
            </div>

            <!-- رادار الوحدات -->
            <div class="lg:col-span-8">
                <div class="glass neon-border p-8">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-2xl font-bold">📡 الوحدات النشطة بالسيرفر</h2>
                        <div class="flex items-center">
                            <span class="text-[10px] text-green-500 ml-4"><span class="status-dot ml-2"></span> ON-LINE</span>
                            <span id="bot-count" class="bg-green-900 text-green-400 px-4 py-1 rounded-full text-xs orbitron">00</span>
                        </div>
                    </div>
                    <div id="bots-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- الوحدات تظهر هنا آلياً -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + "/api";

        async function register() {
            const body = {
                password: document.getElementById('m_pass').value,
                name: document.getElementById('m_name').value,
                token: document.getElementById('m_token').value,
                chatid: document.getElementById('m_chatid').value
            };
            try {
                const res = await fetch(`${API_BASE}/bots/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) { 
                    alert("تم تفعيل الهيبة! تفقد تليجرام فوراً."); 
                    load(); 
                } else { alert("خطأ: " + data.error); }
            } catch(e) { alert("السيرفر لا يستجيب!"); }
        }

        async function load() {
            try {
                const res = await fetch(`${API_BASE}/bots`);
                const bots = await res.json();
                document.getElementById('bot-count').innerText = bots.length.toString().padStart(2, '0');
                const list = document.getElementById('bots-list');
                list.innerHTML = "";
                bots.forEach(b => {
                    list.innerHTML += `
                        <div class="bg-black/40 border border-green-900/20 p-4 rounded-xl flex justify-between items-center group hover:border-green-500 transition">
                            <div class="flex items-center text-right">
                                <div class="w-2 h-2 bg-green-500 rounded-full ml-3 pulse"></div>
                                <div>
                                    <p class="font-bold text-sm text-white">${b.name}</p>
                                    <p class="text-[9px] text-gray-500 uppercase orbitron">Active Module</p>
                                </div>
                            </div>
                            <button onclick="removeBot(${b.id})" class="text-red-900 hover:text-red-500 opacity-0 group-hover:opacity-100 transition">🗑️</button>
                        </div>`;
                });
            } catch(e) {}
        }

        async function removeBot(id) {
            const password = prompt("كلمة السر للحذف:");
            if(!password) return;
            await fetch(`${API_BASE}/bots/remove`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id, password })
            });
            load();
        }

        setInterval(load, 5000);
        load();
    </script>
</body>
</html>
