<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الهيبة | الخصوصية المطلقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0c; }
        body { background: var(--bg); color: #e0e0e0; font-family: 'Changa', sans-serif; }
        .glass { background: rgba(20, 20, 25, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.1); border-radius: 20px; }
        .gold-text { color: var(--gold); text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        .input-h { background: #000; border: 1px solid #222; border-radius: 12px; padding: 12px; color: var(--gold); outline: none; width: 100%; }
        .btn-h { background: linear-gradient(135deg, #d4af37, #8a6d3b); color: #000; font-weight: bold; transition: 0.3s; }
        .btn-h:hover { transform: scale(1.02); box-shadow: 0 0 15px var(--gold); }
        .page-card { transition: 0.3s; cursor: pointer; border: 1px solid transparent; }
        .page-card:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.05); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="home-view" class="max-w-4xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-5xl font-black gold-text mb-4 italic">HEIBA VAULT</h1>
            <p class="text-gray-500 text-sm tracking-widest uppercase">منصة الصفحات المشفرة والخصوصية التامة</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- قسم البحث -->
            <div class="glass p-8">
                <h2 class="text-xl font-bold mb-6 gold-text">🔎 ابحث عن صفحة</h2>
                <input type="text" id="search-in" class="input-h mb-4" placeholder="اكتب اسم الصفحة هنا..." oninput="search()">
                <div id="results" class="space-y-3 max-h-60 overflow-y-auto pr-2">
                    <p class="text-gray-600 text-xs text-center">ابدأ البحث للعثور على الأصدقاء</p>
                </div>
            </div>

            <!-- قسم الإنشاء -->
            <div class="glass p-8 border-t-4 border-gold">
                <h2 class="text-xl font-bold mb-6 gold-text">✨ أنشئ صفحتك الخاصة</h2>
                <div class="space-y-4">
                    <input type="text" id="reg-name" class="input-h" placeholder="اسم الصفحة (يظهر للكل)">
                    <input type="password" id="reg-pass" class="input-h" placeholder="كلمة سر الخصوصية">
                    <textarea id="reg-desc" class="input-h" placeholder="وصف بسيط للصفحة"></textarea>
                    <button onclick="createPage()" class="w-full btn-h py-3 rounded-xl">تفعيل صفحة الهيبة</button>
                </div>
            </div>
        </div>
    </div>

    <!-- واجهة الصفحة الشخصية بعد الدخول -->
    <div id="page-view" class="hidden max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <button onclick="location.reload()" class="text-gray-500 hover:text-white">← العودة للرئيسية</button>
            <h2 id="view-title" class="text-3xl font-black gold-text"></h2>
            <button onclick="deletePage()" class="text-red-500 text-xs border border-red-500/20 px-3 py-1 rounded">حذف صفحتي</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- نصوص وديون -->
            <div class="lg:col-span-8 space-y-6">
                <div class="glass p-6">
                    <h3 class="text-sm font-bold mb-4 gold-text">📝 مذكراتك وخصوصيتك</h3>
                    <textarea id="page-text" class="input-h h-40" placeholder="اكتب هنا أسرارك أو أي شيء تود حفظه..."></textarea>
                </div>

                <div class="glass p-6">
                    <h3 class="text-sm font-bold mb-4 gold-text">💸 سجل الديون والمالية</h3>
                    <div id="debts-ui" class="space-y-2 mb-4"></div>
                    <div class="flex gap-2">
                        <input id="debt-name" class="input-h text-xs" placeholder="اسم الشخص">
                        <input id="debt-amt" class="input-h text-xs" placeholder="المبلغ">
                        <button onclick="addDebt()" class="btn-h px-4 rounded-lg">+</button>
                    </div>
                </div>
            </div>

            <!-- وسائط (صور وفيديو) -->
            <div class="lg:col-span-4 space-y-6">
                <div class="glass p-6">
                    <h3 class="text-sm font-bold mb-4 gold-text">🖼 معرض الصور والفيديو</h3>
                    <input type="file" id="file-in" class="hidden" onchange="uploadFile()">
                    <button onclick="document.getElementById('file-in').click()" class="w-full bg-white/5 border border-white/10 py-3 rounded-xl text-xs mb-4 hover:bg-white/10">رفع ملف جديد</button>
                    
                    <div id="media-ui" class="grid grid-cols-2 gap-2 max-h-[400px] overflow-y-auto">
                        <!-- ملفات الميديا تظهر هنا -->
                    </div>
                </div>
                <button onclick="saveChanges()" class="w-full btn-h py-4 rounded-2xl shadow-xl">حفظ جميع التغييرات</button>
            </div>
        </div>
    </div>

    <!-- نافذة طلب كلمة السر -->
    <div id="auth-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-6 z-[200]">
        <div class="glass p-10 max-w-sm w-full text-center">
            <h3 id="auth-target" class="text-xl font-bold gold-text mb-6"></h3>
            <input type="password" id="auth-pass" class="input-h text-center text-2xl mb-6" placeholder="••••">
            <button onclick="accessPage()" class="w-full btn-h py-3 rounded-xl">فتح الخصوصية</button>
            <button onclick="closeModal()" class="mt-4 text-gray-500 text-xs">إلغاء</button>
        </div>
    </div>

    <script>
        let currentPage = null;
        let selectedPageName = "";

        async function createPage() {
            const body = {
                name: document.getElementById('reg-name').value,
                password: document.getElementById('reg-pass').value,
                description: document.getElementById('reg-desc').value
            };
            const res = await fetch('/api/pages/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            if(res.ok) {
                alert("✅ تم إنشاء صفحة الهيبة الخاصة بك! ابحث عنها الآن للدخول.");
                location.reload();
            } else {
                const err = await res.json();
                alert(err.error);
            }
        }

        async function search() {
            const q = document.getElementById('search-in').value;
            const res = await fetch(`/api/pages/search?q=${q}`);
            const data = await res.json();
            document.getElementById('results').innerHTML = data.map(p => `
                <div onclick="openAuth('${p.name}')" class="glass p-4 page-card">
                    <div class="font-bold gold-text">${p.name}</div>
                    <div class="text-[10px] text-gray-500">${p.description}</div>
                </div>
            `).join('') || '<p class="text-center text-gray-600 text-xs">لا توجد نتائج</p>';
        }

        function openAuth(name) {
            selectedPageName = name;
            document.getElementById('auth-target').innerText = `دخول صفحة: ${name}`;
            document.getElementById('auth-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('auth-modal').style.display = 'none'; }

        async function accessPage() {
            const pass = document.getElementById('auth-pass').value;
            const res = await fetch('/api/pages/access', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: selectedPageName, password: pass })
            });
            if(res.ok) {
                currentPage = await res.json();
                showPage();
            } else { alert("❌ كلمة السر خاطئة!"); }
        }

        function showPage() {
            closeModal();
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('page-view').classList.remove('hidden');
            document.getElementById('view-title').innerText = currentPage.name;
            document.getElementById('page-text').value = currentPage.content.text;
            renderDebts();
            renderMedia();
        }

        function renderDebts() {
            document.getElementById('debts-ui').innerHTML = currentPage.content.debts.map((d, i) => `
                <div class="flex justify-between items-center bg-white/5 p-2 rounded text-xs">
                    <span>${d.name}</span>
                    <span class="gold-text font-bold">${d.amount}</span>
                    <button onclick="removeDebt(${i})" class="text-red-500">×</button>
                </div>
            `).join('');
        }

        function addDebt() {
            const name = document.getElementById('debt-name').value;
            const amount = document.getElementById('debt-amt').value;
            if(!name || !amount) return;
            currentPage.content.debts.push({ name, amount });
            renderDebts();
            document.getElementById('debt-name').value = "";
            document.getElementById('debt-amt').value = "";
        }

        function removeDebt(i) {
            currentPage.content.debts.splice(i, 1);
            renderDebts();
        }

        async function uploadFile() {
            const file = document.getElementById('file-in').files[0];
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch('/api/pages/upload', { method: 'POST', body: formData });
            const data = await res.json();
            currentPage.content.media.push(data);
            renderMedia();
        }

        function renderMedia() {
            document.getElementById('media-ui').innerHTML = currentPage.content.media.map(m => {
                if(m.type.startsWith('image')) return `<img src="${m.url}" class="w-full h-24 object-cover rounded-lg">`;
                return `<video src="${m.url}" class="w-full h-24 object-cover rounded-lg"></video>`;
            }).join('');
        }

        async function saveChanges() {
            currentPage.content.text = document.getElementById('page-text').value;
            const res = await fetch('/api/pages/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: currentPage.id, password: currentPage.password, content: currentPage.content })
            });
            if(res.ok) alert("✅ تم حفظ أسرارك بنجاح!");
        }

        async function deletePage() {
            if(!confirm("هل أنت متأكد من حذف صفحتك نهائياً؟")) return;
            const res = await fetch('/api/pages/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: currentPage.id, password: currentPage.password })
            });
            if(res.ok) location.reload();
        }
        
        // البحث الأولي
        search();
    </script>
</body>
</html>
