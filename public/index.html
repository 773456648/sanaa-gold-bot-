<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار فادي - نسخة الثبات المطلق</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: #d4af37; font-family: 'Changa', sans-serif; touch-action: manipulation; }
        .radar-hub { position: relative; width: 320px; height: 320px; border: 2px solid #333; border-radius: 50%; margin: 20px auto; background: radial-gradient(circle, #0a150a 0%, #000 100%); box-shadow: 0 0 50px rgba(0,255,0,0.05); overflow: hidden; }
        .grid-line { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(212,175,55,0.1); }
        .grid-v { position: absolute; left: 50%; top: 0; width: 1px; height: 100%; background: rgba(212,175,55,0.1); }
        .sweep { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent 70%, rgba(212, 175, 55, 0.2) 100%); transform-origin: 0 0; animation: rotate 4s linear infinite; margin-top: -50%; margin-left: -50%; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .point-fixed { position: absolute; width: 10px; height: 10px; background: #ff0000; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px red; z-index: 10; }
        .point-label { position: absolute; font-size: 8px; color: white; margin-top: 12px; white-space: nowrap; transform: translateX(-50%); }
        .nav-pointer { position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 25px solid #d4af37; transform-origin: 50% 100%; margin-top: -40px; margin-left: -10px; display: none; z-index: 100; }
        .target-lock { background: #ff0000 !important; color: white !important; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="p-4 text-center">

    <div id="auth-box" class="max-w-xs mx-auto mt-20 p-6 bg-zinc-900 rounded-3xl border border-zinc-800">
        <h1 class="text-2xl font-black mb-4 italic">تسجيل دخول</h1>
        <input id="u" type="text" placeholder="اسمك" class="w-full bg-black p-3 rounded-lg mb-2 text-gold border border-zinc-800 outline-none">
        <input id="p" type="password" placeholder="كلمة السر" class="w-full bg-black p-3 rounded-lg mb-4 text-gold border border-zinc-800">
        <button onclick="login()" class="w-full bg-gold text-black font-bold p-3 rounded-lg">دخول الرادار</button>
    </div>

    <div id="radar-app" class="hidden max-w-sm mx-auto">
        <div class="flex justify-between items-center mb-4 text-[10px] uppercase tracking-widest opacity-60">
            <span id="user-tag"></span>
            <span>GPS Dقة: <span id="acc-val">--</span></span>
        </div>

        <div class="radar-hub" id="radar-main">
            <div class="grid-line"></div><div class="grid-v"></div>
            <div class="sweep"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3 h-3 bg-blue-500 rounded-full shadow-[0_0_15px_blue] z-50"></div>
            <div id="pointer" class="nav-pointer"></div>
            <div id="points-container"></div>
        </div>

        <div id="dist-card" class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 mb-4 transition-all duration-300">
            <div class="text-[10px] opacity-50 mb-1">المسافة لنقطة الصفر</div>
            <div id="dist-val" class="text-6xl font-black italic tracking-tighter text-white">--</div>
            <div class="text-[10px] mt-2 text-gold">المكان المختار: <span id="target-name">لا يوجد</span></div>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-4">
            <button onclick="savePoint()" class="bg-red-900/30 border border-red-600 text-red-500 p-4 rounded-2xl font-bold text-sm">📍 رصد هدف جديد</button>
            <button onclick="clearPoints()" class="bg-zinc-900 border border-zinc-700 text-gray-500 p-4 rounded-2xl font-bold text-sm">🗑 مسح الكل</button>
        </div>

        <button onclick="initCompass()" class="text-[10px] opacity-40 mb-4">تفعيل الحساسات 🧭</button>

        <div class="text-right">
            <h3 class="text-xs font-bold mb-2 opacity-50">النقاط المرصودة (المكنة):</h3>
            <div id="points-list" class="space-y-2 max-h-40 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        let user = "";
        let myPos = null;
        let points = [];
        let activeTarget = null;
        let heading = 0;

        function login() {
            user = document.getElementById('u').value;
            if(!user) return;
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('radar-app').style.display = 'block';
            document.getElementById('user-tag').innerText = "المستخدم: " + user;
            loadPoints();
            startTracking();
        }

        function initCompass() {
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(s => {
                        if(s === 'granted') window.addEventListener('deviceorientation', e => heading = e.webkitCompassHeading || (360 - e.alpha));
                    });
                } else window.addEventListener('deviceorientationabsolute', e => heading = 360 - e.alpha);
            }
        }

        function startTracking() {
            navigator.geolocation.watchPosition(pos => {
                myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                document.getElementById('acc-val').innerText = pos.coords.accuracy.toFixed(1) + "m";
                updateUI();
            }, null, { enableHighAccuracy: true, maximumAge: 0 });
        }

        function savePoint() {
            if(!myPos) return alert("انتظر لقط إشارة الـ GPS");
            const name = prompt("سمِّ النقطة (مثلًا: لغم 1، حجرة):");
            if(!name) return;
            const newP = { ...myPos, id: Date.now(), name: name };
            points.push(newP);
            localStorage.setItem('points_' + user, JSON.stringify(points));
            loadPoints();
        }

        function loadPoints() {
            points = JSON.parse(localStorage.getItem('points_' + user) || '[]');
            const list = document.getElementById('points-list');
            list.innerHTML = points.map(p => `
                <div onclick="selectPoint(${p.id})" class="flex justify-between p-3 bg-zinc-900 border border-zinc-800 rounded-xl cursor-pointer hover:border-gold">
                    <span class="font-bold">📍 ${p.name}</span>
                    <span class="text-[10px] text-gold">تتبع الآن</span>
                </div>
            `).join('');
        }

        function selectPoint(id) {
            activeTarget = points.find(p => p.id === id);
            document.getElementById('target-name').innerText = activeTarget.name;
        }

        function updateUI() {
            if(!myPos) return;

            const container = document.getElementById('points-container');
            container.innerHTML = '';

            points.forEach(p => {
                const d = calcDist(myPos.lat, myPos.lng, p.lat, p.lng);
                if(d <= 0.05) { // عرض في نطاق 50 متر
                    const bear = calcBear(myPos.lat, myPos.lng, p.lat, p.lng);
                    const relBear = (bear - heading + 360) % 360;
                    const distP = (d / 0.05) * 50;
                    const r = relBear * (Math.PI/180);
                    const x = 50 + (distP * Math.sin(r));
                    const y = 50 - (distP * Math.cos(r));
                    
                    container.innerHTML += `<div class="point-fixed" style="left:${x}%; top:${y}%; background:${activeTarget?.id === p.id ? '#00ff00' : 'red'}">
                        <div class="point-label">${p.name}</div>
                    </div>`;
                }
            });

            if(activeTarget) {
                const d = calcDist(myPos.lat, myPos.lng, activeTarget.lat, activeTarget.lng) * 1000;
                const dText = document.getElementById('dist-val');
                dText.innerText = d.toFixed(2);

                const bear = calcBear(myPos.lat, myPos.lng, activeTarget.lat, activeTarget.lng);
                const relBear = (bear - heading + 360) % 360;
                const pointer = document.getElementById('pointer');
                pointer.style.display = 'block';
                pointer.style.transform = `rotate(${relBear}deg)`;

                if(d <= 0.6) { // دقة نصف متر
                    dText.innerText = "0.00";
                    document.getElementById('dist-card').classList.add('target-lock');
                    if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                } else {
                    document.getElementById('dist-card').classList.remove('target-lock');
                }
            }
        }

        function calcDist(l1, n1, l2, n2) {
            const R = 6371;
            const dL = (l2-l1)*Math.PI/180;
            const dN = (n2-n1)*Math.PI/180;
            const a = Math.sin(dL/2)**2 + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dN/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function calcBear(l1, n1, l2, n2) {
            const y = Math.sin((n2-n1)*Math.PI/180)*Math.cos(l2*Math.PI/180);
            const x = Math.cos(l1*Math.PI/180)*Math.sin(l2*Math.PI/180)-Math.sin(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.cos((n2-n1)*Math.PI/180);
            return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
        }

        function clearPoints() { if(confirm("أكيد تشتي تمسح كل النقاط؟")) { localStorage.removeItem('points_'+user); loadPoints(); } }
    </script>
</body>
</html>
