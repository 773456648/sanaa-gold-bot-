<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الهيبة | نظام البصمة المتناقصة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #060608; color: #f0f0f0; font-family: 'Changa', sans-serif; }
        .gold-text { color: #d4af37; }
        .gold-btn { background: linear-gradient(135deg, #d4af37, #b8860b); color: #000; font-weight: bold; }
        .glass-card { background: rgba(15, 15, 20, 0.98); border: 1px solid #222; border-radius: 28px; }
        input, select { background: #111 !important; border: 1px solid #333 !important; color: #fff; border-radius: 16px; padding: 16px; width: 100%; outline: none; }
        .type-select { border: 2px solid #333; cursor: pointer; transition: 0.3s; }
        .type-select.active { border-color: #d4af37; background: rgba(212, 175, 55, 0.05); }
        .stamp-card { background: linear-gradient(to bottom right, #1a1a1a, #0d0d0d); border: 1px dashed #d4af37; border-radius: 20px; padding: 15px; }
        .modal-backdrop { background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- شاشة الدخول -->
    <div id="auth-ui" class="max-w-4xl mx-auto mt-10">
        <div class="text-center mb-10">
            <h1 class="text-7xl font-black gold-text italic">HEIBA</h1>
            <p class="text-gray-500 uppercase tracking-widest text-xs mt-2">Royal Financial Management</p>
        </div>
        <div class="glass-card p-10 space-y-6 shadow-2xl">
            <div class="grid grid-cols-2 gap-4">
                <div id="sel-merchant" onclick="setType('merchant')" class="type-select active p-4 rounded-2xl text-center">👑 تاجر</div>
                <div id="sel-debtor" onclick="setType('debtor')" class="type-select p-4 rounded-2xl text-center">👤 مواطن</div>
            </div>
            <input id="u-name" placeholder="الاسم بالكامل">
            <input id="u-pass" type="password" placeholder="كلمة المرور">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="doAuth('login')" class="bg-zinc-800 py-4 rounded-2xl font-bold">دخول</button>
                <button onclick="doAuth('reg')" class="gold-btn py-4 rounded-2xl">إنشاء حساب</button>
            </div>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div id="main-ui" class="hidden max-w-7xl mx-auto space-y-6">
        <header class="flex justify-between items-center glass-card p-6">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 gold-btn rounded-xl flex items-center justify-center font-bold text-xl">H</div>
                <div>
                    <h2 id="display-name" class="text-xl font-bold gold-text"></h2>
                    <span id="role-tag" class="text-[10px] text-gray-500"></span>
                </div>
            </div>
            <div class="flex gap-2">
                <button id="btn-search-stamp" onclick="openModal('search-modal')" class="hidden bg-blue-900/20 text-blue-400 border border-blue-500/30 px-4 rounded-xl text-xs">بحث بلاغ 🔍</button>
                <button onclick="logout()" class="bg-red-900/20 text-red-500 px-4 py-2 rounded-xl text-xs">خروج</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- القائمة الجانبية -->
            <div class="lg:col-span-4 space-y-4">
                <div class="glass-card p-6">
                    <h3 class="text-xs text-gray-500 mb-4 uppercase">بلاغات الخصم النشطة (البصمة)</h3>
                    <div id="stamps-list" class="space-y-3">
                        <!-- هنا تظهر كروت البصمات -->
                    </div>
                </div>
                <div class="glass-card p-6 min-h-[300px]">
                    <h3 class="text-xs text-gray-500 mb-4">قائمة التجار / المواطنين</h3>
                    <div id="merchant-tools" class="hidden mb-4">
                        <input id="target-search" class="text-xs" placeholder="اسم المواطن..." onchange="addTarget()">
                    </div>
                    <div id="main-list" class="space-y-2"></div>
                </div>
            </div>

            <!-- لوحة العمليات -->
            <div class="lg:col-span-8">
                <div id="details-pane" class="hidden glass-card p-8 min-h-[500px] flex flex-col">
                    <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-4">
                        <h3 id="active-target-name" class="text-2xl font-bold gold-text"></h3>
                        <button id="btn-create-stamp" onclick="openModal('create-stamp-modal')" class="hidden gold-btn px-4 py-2 rounded-xl text-[10px]">إنشاء بلاغ خصم ✋</button>
                    </div>
                    <div id="ops-list" class="flex-grow space-y-2 overflow-y-auto mb-4"></div>
                    <div id="add-form" class="hidden bg-zinc-900/50 p-4 rounded-2xl border border-white/5 space-y-3">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                            <input id="op-amt" type="number" placeholder="المبلغ">
                            <select id="op-cur"><option value="YER">يمني</option><option value="USD">دولار</option><option value="SAR">سعودي</option></select>
                            <select id="op-type"><option value="دين">دين</option><option value="سداد">سداد</option></select>
                            <input id="op-note" placeholder="البيان">
                        </div>
                        <button onclick="saveOp()" class="gold-btn w-full py-3 rounded-xl">تثبيت العملية</button>
                    </div>
                </div>
                <div id="empty-hint" class="glass-card p-20 text-center text-gray-600 italic">يرجى تحديد حساب للمتابعة...</div>
            </div>
        </div>
    </div>

    <!-- مودال إنشاء بلاغ -->
    <div id="create-stamp-modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center z-50 p-4">
        <div class="glass-card w-full max-w-sm p-8 space-y-4">
            <h3 class="gold-text font-bold text-center underline">إنشاء بلاغ خصم جديد</h3>
            <p class="text-[10px] text-gray-400 text-center">سيتم تحويل هذا المبلغ إلى كود بصمة ليخصمه التاجر</p>
            <input id="st-amt" type="number" placeholder="مبلغ البلاغ">
            <select id="st-cur"><option value="YER">يمني</option><option value="USD">دولار</option><option value="SAR">سعودي</option></select>
            <input id="st-code" placeholder="كود البصمة السري">
            <button onclick="submitStamp()" class="gold-btn w-full py-4 rounded-xl">اعتماد البلاغ</button>
            <button onclick="closeModal('create-stamp-modal')" class="w-full text-xs text-gray-500">إلغاء</button>
        </div>
    </div>

    <!-- مودال البحث والخصم (للتاجر) -->
    <div id="search-modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center z-50 p-4">
        <div class="glass-card w-full max-w-sm p-8 space-y-4">
            <h3 class="text-blue-400 font-bold text-center">بحث ومطابقة البلاغ</h3>
            <input id="v-code" placeholder="أدخل كود البلاغ">
            <button onclick="fetchStampInfo()" class="bg-blue-600 text-white w-full py-3 rounded-xl text-xs">بحث وتفقد الكود 🔍</button>
            <div id="stamp-info-box" class="hidden p-4 bg-black/50 rounded-xl border border-blue-500/20 text-xs space-y-2">
                <p>🙋 المواطن: <span id="inf-name" class="font-bold"></span></p>
                <p>💰 المتبقي: <span id="inf-amt" class="text-green-500 font-bold"></span></p>
                <div class="border-t border-white/5 pt-2">
                    <input id="inf-discount" type="number" placeholder="المبلغ المراد خصمه الآن" class="!p-2 !text-xs">
                    <button onclick="applyDiscount()" class="gold-btn w-full mt-2 py-2 rounded-lg text-xs">تأكيد الخصم الآن ✅</button>
                </div>
            </div>
            <button onclick="closeModal('search-modal')" class="w-full text-xs text-gray-500">إغلاق</button>
        </div>
    </div>

    <script>
        let user = null, activeTarget = null, userType = 'merchant', discoveredData = [], activeStamps = [];

        function setType(t) { userType = t; document.getElementById('sel-merchant').classList.toggle('active', t === 'merchant'); document.getElementById('sel-debtor').classList.toggle('active', t === 'debtor'); }

        window.onload = () => { const s = localStorage.getItem('heiba_auth_session'); if(s) { user = JSON.parse(s); start(); } };

        async function doAuth(action) {
            const name = document.getElementById('u-name').value.trim(), password = document.getElementById('u-pass').value;
            if(!name || !password) return;
            const res = await fetch('/api/auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, password, type: userType, action }) });
            if(res.ok) { user = await res.json(); localStorage.setItem('heiba_auth_session', JSON.stringify(user)); start(); } else alert("خطأ في البيانات");
        }

        function start() {
            document.getElementById('auth-ui').classList.add('hidden'); document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('display-name').innerText = user.name;
            document.getElementById('role-tag').innerText = user.type === 'merchant' ? 'تاجر ملكي' : 'مواطن هيبة';
            if(user.type === 'merchant') {
                document.getElementById('merchant-tools').classList.remove('hidden');
                document.getElementById('btn-search-stamp').classList.remove('hidden');
                document.getElementById('add-form').classList.remove('hidden');
                renderList();
            } else {
                document.getElementById('btn-create-stamp').classList.remove('hidden');
                fetchAutoData(); setInterval(fetchAutoData, 5000);
            }
        }

        async function fetchAutoData() {
            const res = await fetch(`/api/auto-discover?debtorName=${encodeURIComponent(user.name)}`);
            const data = await res.json();
            discoveredData = data.results;
            activeStamps = data.myStamps;
            renderStamps(activeStamps);
            document.getElementById('main-list').innerHTML = discoveredData.map(m => `<div onclick="showDetails('${m.merchantName}')" class="p-3 bg-zinc-900 rounded-xl cursor-pointer border border-white/5">${m.merchantName}</div>`).join('');
            if(activeTarget) showDetails(activeTarget);
        }

        function renderStamps(stamps) {
            document.getElementById('stamps-list').innerHTML = stamps.map(s => `
                <div class="stamp-card text-[11px]">
                    <div class="flex justify-between items-start mb-2">
                        <span class="gold-text font-bold">كود: ${s.code}</span>
                        <span class="text-gray-500">${new Date(s.date).toLocaleDateString()}</span>
                    </div>
                    <p>التاجر: ${s.merchantName}</p>
                    <div class="flex justify-between mt-2 border-t border-dashed border-white/10 pt-2">
                        <span>الأصل: ${s.originalAmount}</span>
                        <span class="text-green-500 font-bold">المتبقي: ${s.currentAmount}</span>
                    </div>
                </div>
            `).join('');
        }

        function addTarget() { const n = document.getElementById('target-search').value.trim(); if(n) { activeTarget = n; showDetails(n); document.getElementById('target-search').value = ""; } }

        function renderList() {
            const t = [...new Set(user.myRecords.map(r => r.targetName))];
            document.getElementById('main-list').innerHTML = t.map(n => `<div onclick="showDetails('${n}')" class="p-3 bg-zinc-900 rounded-xl cursor-pointer ${activeTarget===n?'border-gold-text border':''}">${n}</div>`).join('');
        }

        function showDetails(name) {
            activeTarget = name; document.getElementById('empty-hint').classList.add('hidden'); document.getElementById('details-pane').classList.remove('hidden');
            document.getElementById('active-target-name').innerText = name;
            let recs = (user.type === 'merchant') ? user.myRecords.filter(r => r.targetName === name) : (discoveredData.find(m => m.merchantName === name)?.records || []);
            document.getElementById('ops-list').innerHTML = recs.map(r => `
                <div class="p-4 bg-zinc-900/40 rounded-xl flex justify-between items-center border-l-2 ${r.type==='دين'?'border-red-500':'border-green-500'}">
                    <div class="text-[11px]">
                        <p class="font-bold">${r.note || 'عملية'}</p>
                        <p class="text-gray-600">${new Date(r.date).toLocaleString()}</p>
                    </div>
                    <p class="font-black ${r.type==='دين'?'text-red-500':'text-green-500'}">${r.type==='دين'?'+':'-'}${r.amount}</p>
                </div>
            `).reverse().join('');
            if(user.type==='merchant') renderList();
        }

        async function saveOp() {
            const a = document.getElementById('op-amt').value; if(!a || !activeTarget) return;
            user.myRecords.push({ id: Date.now(), targetName: activeTarget, amount: parseFloat(a), currency: document.getElementById('op-cur').value, type: document.getElementById('op-type').value, note: document.getElementById('op-note').value, date: new Date().toISOString() });
            showDetails(activeTarget);
            fetch('/api/sync', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId: user.id, myRecords: user.myRecords }) });
            document.getElementById('op-amt').value = "";
        }

        // دوال البلاغات (البصمة المتناقصة)
        async function submitStamp() {
            const res = await fetch('/api/stamps/create', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ debtorName: user.name, merchantName: activeTarget, amount: document.getElementById('st-amt').value, currency: document.getElementById('st-cur').value, code: document.getElementById('st-code').value }) });
            if(res.ok) { alert("✅ تم إنشاء البلاغ بنجاح"); closeModal('create-stamp-modal'); fetchAutoData(); } else alert("❌ الكود مستخدم");
        }

        async function fetchStampInfo() {
            const code = document.getElementById('v-code').value;
            const res = await fetch(`/api/stamps/info/${code}`);
            if(res.ok) {
                const s = await res.json();
                document.getElementById('inf-name').innerText = s.debtorName;
                document.getElementById('inf-amt').innerText = s.currentAmount + " " + s.currency;
                document.getElementById('stamp-info-box').classList.remove('hidden');
            } else alert("❌ لا يوجد بلاغ بهذا الكود");
        }

        async function applyDiscount() {
            const code = document.getElementById('v-code').value;
            const amt = document.getElementById('inf-discount').value;
            if(!amt) return;
            const res = await fetch('/api/stamps/apply-discount', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ merchantId: user.id, code, discountAmount: amt }) });
            if(res.ok) {
                const data = await res.json(); user = data.merchant;
                alert("✅ تم الخصم بنجاح من البلاغ!");
                closeModal('search-modal'); if(activeTarget) showDetails(activeTarget);
            } else { const e = await res.json(); alert(e.error); }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
