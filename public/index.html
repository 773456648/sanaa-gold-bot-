<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 FADI SYSTEM PRO - GLOBAL</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --gold: #ffd700; --dark: #050c16; --card: #101e30; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--dark); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #login { position: fixed; inset: 0; background: var(--dark); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .box { background: var(--card); padding: 30px; border: 2px solid var(--gold); border-radius: 20px; text-align: center; width: 90%; max-width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: none; text-align: center; }
        .v-grid { flex: 1; display: none; flex-direction: column; gap: 5px; padding: 5px; background: #000; position: relative; z-index: 500; }
        video { width: 100%; height: 48%; border-radius: 10px; border: 1px solid var(--gold); object-fit: cover; background: #111; }
        #u-list { padding: 10px; background: var(--card); display: flex; gap: 10px; overflow-x: auto; border-bottom: 1px solid var(--gold); }
        .u-btn { background: var(--gold); color: black; padding: 10px 15px; border-radius: 10px; cursor: pointer; white-space: nowrap; font-weight: bold; }
    </style>
</head>
<body>

<div id="login">
    <div class="box">
        <h2 style="color:var(--gold)">💎 فادي برو (عالمي)</h2>
        <input type="text" id="uName" placeholder="اسمك">
        <input type="text" id="rID" placeholder="رقم الغرفة">
        <button onclick="init()" style="background:var(--gold); padding:10px; border-radius:10px; width:100%; cursor:pointer;">دخول 🚀</button>
    </div>
</div>

<div id="u-list"></div>

<div id="v-box" class="v-grid">
    <video id="lv" autoplay muted playsinline></video>
    <video id="rv" autoplay playsinline></video>
    <button onclick="location.reload()" style="background:red; color:white; padding:10px; border:none; border-radius:10px; margin-top:5px;">إنهاء 🛑</button>
</div>

<div id="chat" style="flex:1; padding:20px; overflow-y:auto; font-size: 14px; color: #aaa;">
    انتظر دخول الطرف الآخر بنفس الرقم...
</div>

<script>
    const socket = io();
    let peer, myStream;

    function init() {
        const name = document.getElementById('uName').value;
        const room = document.getElementById('rID').value;
        if(!name || !room) return;

        // الربط مع سيرفر PeerJS العالمي لتجاوز حواجز الشركات
        peer = new Peer(); 

        peer.on('open', (id) => {
            socket.emit('join-room', { roomID: room, user: name, pId: id });
            document.getElementById('login').style.display = 'none';
        });

        // استقبال الاتصال من أي نت
        peer.on('call', async (call) => {
            if(confirm("موافقة على اتصال الفيديو؟")) {
                myStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                document.getElementById('v-box').style.display = 'flex';
                document.getElementById('lv').srcObject = myStream;
                call.answer(myStream);
                call.on('stream', (rs) => { document.getElementById('rv').srcObject = rs; });
            }
        });
    }

    socket.on('update-users', (users) => {
        const list = document.getElementById('u-list');
        list.innerHTML = '';
        users.forEach(u => {
            if(u.id !== socket.id) {
                const btn = document.createElement('div');
                btn.className = 'u-btn';
                btn.innerHTML = "اتصل بـ " + u.name;
                btn.onclick = () => makeCall(u.pId);
                list.appendChild(btn);
            }
        });
    });

    async function makeCall(pId) {
        myStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('v-box').style.display = 'flex';
        document.getElementById('lv').srcObject = myStream;
        const call = peer.call(pId, myStream);
        call.on('stream', (rs) => { document.getElementById('rv').srcObject = rs; });
    }
</script>
</body>
</html>
