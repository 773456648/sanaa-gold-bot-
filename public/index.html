<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 منظومة فادي برو للعقارات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #e2b714; --bg: #05070a; --glass: rgba(22, 27, 34, 0.9); --border: #30363d; --success: #238636; --danger: #da3633; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #e6edf3; font-family: 'Segoe UI', sans-serif; }
        header { background: var(--glass); backdrop-filter: blur(10px); padding: 15px 5%; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--gold); }
        .search-container { padding: 20px 5%; background: #0d1117; border-bottom: 1px solid var(--border); }
        .search-box { width: 100%; max-width: 600px; margin: 0 auto; position: relative; }
        .search-box input { width: 100%; padding: 15px 45px 15px 15px; background: #000; border: 1px solid var(--gold); border-radius: 30px; color: #fff; font-size: 1rem; }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); }
        .filters { display: flex; justify-content: center; gap: 10px; padding: 15px; flex-wrap: wrap; }
        .filter-btn { background: var(--glass); border: 1px solid var(--border); color: #fff; padding: 8px 18px; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        .filter-btn.active { background: var(--gold); color: #000; font-weight: bold; }
        .container { padding: 20px 5% 100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--glass); border-radius: 15px; border: 1px solid var(--border); overflow: hidden; position: relative; transition: 0.3s; }
        .card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .badge { position: absolute; top: 15px; right: 15px; background: var(--gold); color: #000; padding: 4px 12px; border-radius: 15px; font-weight: bold; font-size: 0.75rem; }
        .card-body { padding: 20px; }
        .price { font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 5px; }
        .owner-info { font-size: 0.85rem; color: var(--gold); margin-bottom: 10px; display: block; }
        .details { background: #0d1117; padding: 12px; border-radius: 8px; margin-bottom: 15px; color: #8b949e; display: flex; justify-content: space-between; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        .contact-btn { padding: 12px; border-radius: 10px; background: var(--success); color: #fff; text-decoration: none; text-align: center; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .delete-btn { background: transparent; color: #8b949e; border: none; font-size: 0.8rem; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .delete-btn:hover { color: var(--danger); }
        .fab { position: fixed; bottom: 25px; left: 25px; background: var(--gold); width: 60px; height: 60px; border-radius: 50%; font-size: 1.5rem; color: #000; border: none; cursor: pointer; z-index: 999; box-shadow: 0 5px 15px rgba(226, 183, 20, 0.3); }
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-box { background: #161b22; padding: 25px; border-radius: 20px; border: 1px solid var(--gold); width: 100%; max-width: 450px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; }
        input:focus { border-color: var(--gold); outline: none; }
    </style>
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-gem"></i> فادي برو للعقارات</div>
    <span style="font-size: 0.8rem; color: #8b949e;">نظام التشفير والحذف مفعّل 🔒</span>
</header>

<div class="search-container">
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="ابحث عن عقار أو منطقة..." onkeyup="searchProps()">
    </div>
</div>

<div class="filters">
    <button class="filter-btn active" onclick="filterData('all', this)">الكل</button>
    <button class="filter-btn" onclick="filterData('apt', this)">شقق</button>
    <button class="filter-btn" onclick="filterData('land', this)">أراضي</button>
    <button class="filter-btn" onclick="filterData('villa', this)">فلل</button>
</div>

<div class="container" id="mainGrid"></div>

<button class="fab" onclick="showModal()"><i class="fas fa-plus"></i></button>

<div id="modal">
    <div class="modal-box">
        <h3 style="text-align:center; color:var(--gold); margin-bottom:15px;">إضافة عرض جديد</h3>
        <input type="text" id="pOwner" placeholder="اسمك الكريم">
        <input type="number" id="pPhone" placeholder="رقم واتساب">
        <input type="text" id="pTitle" placeholder="عنوان العقار (مثلاً: أرض في حدة)">
        <input type="text" id="pPrice" placeholder="السعر">
        <input type="text" id="pSpace" placeholder="المساحة">
        <select id="pCat">
            <option value="apt">شقة</option>
            <option value="land">أرضية</option>
            <option value="villa">بيت / فيلا</option>
        </select>
        <div style="background: #0d1117; padding: 10px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 12px;">
            <p style="font-size: 0.75rem; color: var(--gold); margin-bottom: 5px;">⚠️ كلمة سر لحذف العرض لاحقاً:</p>
            <input type="password" id="pPass" placeholder="كلمة السر" style="margin-bottom: 0;">
        </div>
        <button onclick="publish()" style="width:100%; padding:15px; background:var(--gold); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">نشر الآن 🚀</button>
        <button onclick="hideModal()" style="width:100%; background:none; border:none; color:gray; margin-top:10px; cursor:pointer;">إلغاء</button>
    </div>
</div>

<script>
    // استخدمت LocalStorage عشان البيانات ما تضيعش لما تحدد الصفحة
    let allProps = JSON.parse(localStorage.getItem('fadi_properties')) || [];

    function render(data) {
        const grid = document.getElementById('mainGrid');
        if(data.length === 0) {
            grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #8b949e; padding: 50px;">لا توجد نتائج مطابقة..</p>`;
            return;
        }
        grid.innerHTML = data.map(p => `
            <div class="card">
                <div class="badge">${p.category === 'land' ? 'أرض' : 'عقار'}</div>
                <div class="card-body">
                    <span class="owner-info"><i class="fas fa-user"></i> ${p.owner}</span>
                    <h3 style="color:#fff; margin-bottom:10px;">${p.title}</h3>
                    <div class="price" style="color:var(--gold)">${p.price}</div>
                    <div class="details">
                        <span><i class="fas fa-ruler-combined"></i> ${p.space}</span>
                    </div>
                    <div class="btn-group">
                        <a href="https://wa.me/967${p.phone}?text=${encodeURIComponent('حياك الله، استفسار عن: ' + p.title)}" class="contact-btn">
                            <i class="fab fa-whatsapp"></i> تواصل مع المعلن
                        </a>
                        <button onclick="deleteProp('${p.id}')" class="delete-btn">
                            <i class="fas fa-trash-alt"></i> حذف الإعلان
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function publish() {
        const title = document.getElementById('pTitle').value;
        const pass = document.getElementById('pPass').value;
        
        if(!title || !pass) return alert("يا صاحبي، لازم تكتب العنوان وكلمة السر!");

        const newProp = {
            id: Date.now().toString(), // معرف فريد
            owner: document.getElementById('pOwner').value || "فاعل خير",
            phone: document.getElementById('pPhone').value || "777777777",
            title: title,
            price: document.getElementById('pPrice').value || "غير محدد",
            space: document.getElementById('pSpace').value || "غير محدد",
            category: document.getElementById('pCat').value,
            password: pass // تخزين كلمة السر
        };

        allProps.push(newProp);
        saveAndRender();
        hideModal();
        // تصفير الحقول
        document.querySelectorAll('#modal input').forEach(i => i.value = '');
    }

    function deleteProp(id) {
        const target = allProps.find(p => p.id === id);
        const userPass = prompt("أدخل كلمة السر لحذف هذا العرض:");
        
        if (userPass === null) return; // إلغاء

        if (userPass === target.password) {
            allProps = allProps.filter(p => p.id !== id);
            saveAndRender();
            alert("تم الحذف بنجاح ✅");
        } else {
            alert("كلمة السر غلط! لا تحاول تحذف عروض غيرك يا حريف 😉");
        }
    }

    function saveAndRender() {
        localStorage.setItem('fadi_properties', JSON.stringify(allProps));
        render(allProps);
    }

    function searchProps() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allProps.filter(p => 
            p.title.toLowerCase().includes(term) || 
            p.owner.toLowerCase().includes(term)
        );
        render(filtered);
    }

    function filterData(cat, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(cat === 'all') return render(allProps);
        render(allProps.filter(p => p.category === cat));
    }

    function showModal() { document.getElementById('modal').style.display = 'flex'; }
    function hideModal() { document.getElementById('modal').style.display = 'none'; }

    // تشغيل العرض عند فتح الصفحة
    window.onload = () => render(allProps);
</script>

</body>
</html>
