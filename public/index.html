<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منصة الهيبة</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;400;700&display=swap" rel="stylesheet">

<style>

body{
background:#060608;
color:#f0f0f0;
font-family:'Changa',sans-serif;
overflow-x:hidden;
}

.gold-text{color:#d4af37;}

.gold-btn{
background:linear-gradient(135deg,#d4af37,#b8860b);
color:#000;
font-weight:bold;
}

.glass-card{
background:rgba(15,15,20,0.98);
border:1px solid #222;
border-radius:28px;
}

input,select{
background:#111 !important;
border:1px solid #333 !important;
color:#fff;
border-radius:16px;
padding:16px;
width:100%;
outline:none;
}

.type-select{
border:2px solid #333;
transition:.3s;
cursor:pointer;
}

.type-select.active{
border-color:#d4af37;
background:rgba(212,175,55,0.05);
}

.tafqit-box{
font-size:11px;
color:#d4af37;
margin-top:5px;
margin-right:10px;
font-weight:bold;
font-style:italic;
}

</style>

</head>


<body class="p-4 md:p-8">


<!-- ================= AUTH UI ================= -->

<div id="auth-ui" class="max-w-md mx-auto glass-card p-8 space-y-4">

<h2 class="text-2xl text-center gold-text font-bold">منصة الهيبة</h2>

<div class="grid grid-cols-2 gap-3">

<div id="sel-merchant"
onclick="setType('merchant')"
class="type-select active p-3 text-center rounded-xl">

تاجر

</div>

<div id="sel-debtor"
onclick="setType('debtor')"
class="type-select p-3 text-center rounded-xl">

مواطن

</div>

</div>


<input id="u-name" placeholder="الاسم">

<div class="relative">

<input id="u-pass" type="password" placeholder="كلمة المرور">

<button
onclick="togglePass('u-pass')"
class="absolute left-4 top-1/2 -translate-y-1/2">

👁

</button>

</div>


<div class="grid grid-cols-2 gap-3">

<button onclick="doAuth('login')" class="bg-zinc-800 py-3 rounded-xl">
دخول
</button>

<button onclick="doAuth('reg')" class="gold-btn py-3 rounded-xl">
تسجيل
</button>

</div>

</div>



<!-- ================= MAIN UI ================= -->

<div id="main-ui" class="hidden max-w-5xl mx-auto space-y-6">

<header class="glass-card p-6 flex justify-between">

<h2 id="display-name" class="gold-text font-bold text-xl"></h2>

<button onclick="logout()" class="bg-red-500 px-4 py-2 rounded-xl">
خروج
</button>

</header>


<div class="glass-card p-6 space-y-4">

<div class="grid grid-cols-3 gap-3 text-center">

<div>
<p class="text-xs">يمني</p>
<p id="gt-yer">0</p>
</div>

<div>
<p class="text-xs">دولار</p>
<p id="gt-usd">0</p>
</div>

<div>
<p class="text-xs">سعودي</p>
<p id="gt-sar">0</p>
</div>

</div>

</div>



<div class="glass-card p-6">

<div class="flex gap-3">

<input id="target-search" placeholder="اسم الحساب">

<button onclick="addTarget()" class="gold-btn px-4 rounded-xl">+</button>

</div>

<div id="main-list" class="mt-4 space-y-2"></div>

</div>



<div id="details-pane" class="hidden glass-card p-6 space-y-4">

<h3 id="active-target-name" class="gold-text font-bold"></h3>

<div id="ops-list" class="space-y-2"></div>


<div class="grid grid-cols-4 gap-2">

<input id="op-amt" type="number" placeholder="المبلغ" oninput="applyTafqit()">

<select id="op-cur">
<option value="YER">يمني</option>
<option value="USD">دولار</option>
<option value="SAR">سعودي</option>
</select>

<select id="op-type">
<option value="دين">دين</option>
<option value="سداد">سداد</option>
</select>

<input id="op-note" placeholder="بيان">

</div>

<div id="tafqit-text" class="tafqit-box"></div>

<button onclick="saveOp()" class="gold-btn w-full py-3 rounded-xl">

حفظ العملية

</button>

</div>


</div>



<script>

/* ================= VARIABLES ================= */

let user=null
let userType="merchant"
let activeTarget=null
let discoveredData=[]



/* ================= UTIL ================= */

function togglePass(id){

const input=document.getElementById(id)

input.type=input.type==="password"?"text":"password"

}


function logout(){

localStorage.removeItem("heiba_auth_session")
location.reload()

}


/* ================= AUTH ================= */

function setType(t){

userType=t

document
.getElementById('sel-merchant')
.classList.toggle('active',t==="merchant")

document
.getElementById('sel-debtor')
.classList.toggle('active',t==="debtor")

}



async function doAuth(action){

const name=document.getElementById('u-name').value.trim()
const password=document.getElementById('u-pass').value

if(!name||!password) return


const res=await fetch('/api/auth',{

method:'POST',

headers:{'Content-Type':'application/json'},

body:JSON.stringify({

name,
password,
type:userType,
action

})

})

const data=await res.json()

if(res.ok){

user=data

localStorage.setItem(
'heiba_auth_session',
JSON.stringify(user)
)

start()

}else{

alert(data.error)

}

}



/* ================= START ================= */

window.onload=()=>{

const saved=localStorage.getItem('heiba_auth_session')

if(saved){

user=JSON.parse(saved)

start()

}

}


function start(){

document.getElementById('auth-ui').classList.add('hidden')
document.getElementById('main-ui').classList.remove('hidden')

document.getElementById('display-name').innerText=user.name

calculateGrand(user.myRecords||[])

renderList()

}



/* ================= RECORDS ================= */

function addTarget(){

const name=document
.getElementById('target-search')
.value.trim()

if(!name) return

activeTarget=name

showDetails(name)

document.getElementById('target-search').value=""

}



function renderList(){

const targets=[...new Set(user.myRecords.map(r=>r.targetName))]

document.getElementById('main-list').innerHTML=

targets.map(n=>`

<div onclick="showDetails('${n}')"
class="p-3 bg-black rounded-xl cursor-pointer">

${n}

</div>

`).join('')

}



function showDetails(name){

activeTarget=name

document.getElementById('details-pane').classList.remove('hidden')

document.getElementById('active-target-name').innerText=name

const records=user.myRecords.filter(r=>r.targetName===name)

document.getElementById('ops-list').innerHTML=

records.map(r=>`

<div class="p-3 bg-zinc-900 rounded-xl flex justify-between">

<span>${r.note||"عملية"}</span>

<span>${r.amount} ${r.currency}</span>

</div>

`).join('')

}



/* ================= OPERATIONS ================= */

function saveOp(){

const amt=document.getElementById('op-amt').value

if(!amt||!activeTarget) return


user.myRecords.push({

id:Date.now(),

targetName:activeTarget,

amount:amt,

currency:document.getElementById('op-cur').value,

type:document.getElementById('op-type').value,

note:document.getElementById('op-note').value,

date:new Date().toISOString()

})


calculateGrand(user.myRecords)

showDetails(activeTarget)

renderList()

fetch('/api/sync',{

method:'POST',

headers:{'Content-Type':'application/json'},

body:JSON.stringify({

userId:user.id,
myRecords:user.myRecords

})

})

document.getElementById('op-amt').value=""
document.getElementById('op-note').value=""

}



/* ================= CALCULATE ================= */

function calculateGrand(recs){

let y=0
let u=0
let s=0

recs.forEach(r=>{

const a=parseFloat(r.amount)
const d=r.type==="دين"

if(r.currency==="YER")
y+=d?a:-a

else if(r.currency==="USD")
u+=d?a:-a

else
s+=d?a:-a

})

document.getElementById('gt-yer').innerText=y
document.getElementById('gt-usd').innerText=u
document.getElementById('gt-sar').innerText=s

}



/* ================= TAFQIT ================= */

function applyTafqit(){

const val=document.getElementById('op-amt').value

document.getElementById('tafqit-text').innerText=
val?val+" ريال":""

}

</script>


</body>
</html>
