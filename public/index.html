<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FADI FACTORY PRO | مصنع الحقن</title>
    <style>
        body { background: #020617; color: #00ff88; font-family: monospace; padding: 20px; text-align: center; }
        .container { border: 2px solid #00d2ff; padding: 20px; border-radius: 15px; max-width: 800px; margin: auto; background: #0f172a; }
        textarea { width: 100%; height: 300px; background: #000; color: #00ff88; border: 1px solid #00d2ff; padding: 10px; font-family: monospace; margin: 10px 0; }
        input { width: 80%; padding: 10px; margin: 5px 0; background: #1e293b; border: 1px solid #00ff88; color: white; }
        button { width: 85%; padding: 15px; background: #00d2ff; color: #000; font-weight: bold; cursor: pointer; border: none; font-size: 1.1rem; }
        #log { text-align: right; background: #000; padding: 10px; height: 100px; overflow-y: auto; margin-top: 10px; font-size: 12px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏗️ منظومة فادي لحقن الأكواد</h1>
        <input type="text" id="appName" placeholder="اسم التطبيق الجديد">
        <p>الصق كود الـ Smali الكبير هنا:</p>
        <textarea id="megaCode" placeholder=".class public Lcom/fadi/pro/MainActivity..."></textarea>
        <button onclick="startInjection()">🚀 حقن الكود وبناء التطبيق</button>
        <div id="log"></div>
    </div>

    <script>
        function addLog(m) { document.getElementById('log').innerHTML += `> ${m}<br>`; }

        async function startInjection() {
            const name = document.getElementById('appName').value;
            const code = document.getElementById('megaCode').value;

            if(!name || !code) return alert("يا فادي، عبي الاسم والكود الكبير!");

            addLog("بدء العملية... جاري إرسال الكود للمصنع");

            fetch('/build-mega-system', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ appName: name, megaCode: code })
            })
            .then(res => {
                if(!res.ok) throw new Error();
                return res.blob();
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${name}_Injected.apk`;
                a.click();
                addLog("✅ اكتمل الحقن! تم تحميل التطبيق الجديد.");
            })
            .catch(() => addLog("❌ فشل: السيرفر لا يتحمل الحقن الحقيقي (يحتاج Java/Apktool)."));
        }
    </script>
</body>
</html>
