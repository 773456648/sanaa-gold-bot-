<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الهيبة | HEIBA ELITE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;500;700&family=Noto+Sans+Arabic:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --gold-dark: #b8860b; --bg: #050507; }
        body { background: var(--bg); color: #fff; font-family: 'Changa', sans-serif; scroll-behavior: smooth; }
        .elite-font { font-family: 'Noto Sans Arabic', sans-serif; }
        .glass-panel { background: rgba(15, 15, 20, 0.8); backdrop-filter: blur(25px); border: 1px solid rgba(212, 175, 55, 0.12); border-radius: 28px; }
        .gold-border { border: 1px solid var(--gold); }
        .gold-text { background: linear-gradient(to bottom right, #f1d279, #d4af37, #a17d1a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-gold { background: linear-gradient(135deg, #d4af37, #8a6d3b); color: #000; font-weight: bold; border-radius: 15px; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); }
        .btn-gold:active { transform: scale(0.96); }
        .input-elite { background: rgba(0,0,0,0.5); border: 1px solid #222; border-radius: 16px; padding: 14px; color: var(--gold); outline: none; transition: 0.3s; }
        .input-elite:focus { border-color: var(--gold); background: rgba(212, 175, 55, 0.05); }
        .media-card { overflow: hidden; position: relative; border-radius: 20px; background: #111; border: 1px solid #222; }
        .badge { background: rgba(212, 175, 55, 0.1); color: var(--gold); padding: 4px 10px; border-radius: 8px; font-size: 10px; border: 1px solid rgba(212, 175, 55, 0.2); }
        /* تحسينات الفيديو */
        video { background: #000; border-radius: 15px; width: 100%; max-height: 250px; }
        .loader { border-top-color: var(--gold); animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-10">

    <!-- شاشة الترحيب والبحث -->
    <div id="home-view" class="max-w-5xl mx-auto space-y-12">
        <div class="text-center py-10">
            <h1 class="text-7xl font-black elite-font gold-text italic tracking-tighter mb-4">HEIBA</h1>
            <p class="text-gray-500 uppercase tracking-[0.6em] text-[10px]">The Elite Private Vault System</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <!-- البحث -->
            <div class="glass-panel p-8 space-y-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold">💎 استكشاف المنظومة</h2>
                    <span class="text-[10px] text-gray-600">Secure Search</span>
                </div>
                <input type="text" id="search-in" class="input-elite w-full" placeholder="ابحث عن اسم الصفحة..." oninput="search()">
                <div id="results" class="space-y-4 max-h-[400px] overflow-y-auto custom-scroll">
                    <!-- النتائج هنا -->
                </div>
            </div>

            <!-- الإنشاء -->
            <div class="glass-panel p-8 space-y-6 border-t-2 border-gold/30">
                <h2 class="text-xl font-bold gold-text">✨ إنشاء صفحة ملكية</h2>
                <div class="space-y-4">
                    <div class="group">
                        <label class="text-[10px] text-gray-500 block mb-1 px-2 uppercase">Page Identity</label>
                        <input type="text" id="reg-name" class="input-elite w-full" placeholder="اسم الصفحة الشخصي">
                    </div>
                    <div class="group">
                        <label class="text-[10px] text-gray-500 block mb-1 px-2 uppercase">Access Key</label>
                        <input type="password" id="reg-pass" class="input-elite w-full" placeholder="كلمة سر الخصوصية">
                    </div>
                    <textarea id="reg-desc" class="input-elite w-full h-24" placeholder="وصف بسيط للصفحة (ديون، أسرار، وسائط...)"></textarea>
                    <button onclick="createPage()" class="w-full btn-gold py-4 text-lg">تفعيل الصفحة</button>
                </div>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم الشخصية (الخزنة) -->
    <div id="page-view" class="hidden max-w-7xl mx-auto">
        <div class="glass-panel p-6 mb-8 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-gold rounded-2xl flex items-center justify-center text-black font-black text-xl orbitron">H</div>
                <div>
                    <h2 id="view-title" class="text-2xl font-black gold-text uppercase"></h2>
                    <p id="view-desc" class="text-[10px] text-gray-500"></p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="saveChanges()" class="bg-gold/10 text-gold border border-gold/20 px-6 py-2 rounded-xl font-bold hover:bg-gold/20 transition">حفظ السحابة</button>
                <button onclick="location.reload()" class="bg-white/5 text-gray-400 px-4 py-2 rounded-xl text-xs">خروج</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- العمود الجانبي: مذكرات وديون -->
            <div class="lg:col-span-4 space-y-8">
                <!-- المذكرات -->
                <div class="glass-panel p-6">
                    <h3 class="text-xs font-bold mb-4 flex items-center gap-2 uppercase tracking-widest text-gray-400">📝 Private Notes</h3>
                    <textarea id="page-text" class="input-elite w-full h-48 text-sm leading-relaxed" placeholder="اكتب أسرارك هنا..."></textarea>
                </div>

                <!-- الديون -->
                <div class="glass-panel p-6">
                    <h3 class="text-xs font-bold mb-4 flex justify-between items-center text-red-400 uppercase tracking-widest">
                        💸 سجل الديون
                        <span id="debt-count" class="badge">0</span>
                    </h3>
                    <div id="debts-ui" class="space-y-3 mb-6 max-h-60 overflow-y-auto"></div>
                    <div class="space-y-2 bg-black/40 p-3 rounded-2xl border border-white/5">
                        <input id="debt-name" class="input-elite w-full text-xs" placeholder="اسم الشخص">
                        <input id="debt-amt" type="number" class="input-elite w-full text-xs" placeholder="المبلغ">
                        <button onclick="addDebt()" class="w-full btn-gold py-2 rounded-xl text-xs mt-2">إضافة سجل</button>
                    </div>
                </div>
            </div>

            <!-- المحتوى الرئيسي: وسائط وإيجارات -->
            <div class="lg:col-span-8 space-y-8">
                <!-- الإيجارات -->
                <div class="glass-panel p-6">
                    <h3 class="text-xs font-bold mb-6 flex items-center gap-2 text-blue-400 uppercase tracking-widest">🏠 Rent Management</h3>
                    <div id="rentals-ui" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>
                    <div class="flex flex-wrap gap-3 bg-black/40 p-4 rounded-2xl">
                        <input id="rent-name" class="input-elite flex-1 min-w-[150px] text-xs" placeholder="وصف الإيجار">
                        <input id="rent-amt" type="number" class="input-elite w-24 text-xs" placeholder="المبلغ">
                        <input id="rent-date" type="date" class="input-elite w-32 text-xs">
                        <button onclick="addRental()" class="btn-gold px-6 rounded-xl text-xs">إضافة</button>
                    </div>
                </div>

                <!-- الوسائط -->
                <div class="glass-panel p-8">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="text-xs font-bold text-purple-400 uppercase tracking-widest">🎬 Media Vault (No Auto-Play)</h3>
                        <input type="file" id="file-in" class="hidden" onchange="uploadFile()">
                        <button onclick="document.getElementById('file-in').click()" class="bg-purple-600/20 text-purple-400 border border-purple-500/20 px-4 py-2 rounded-xl text-[10px] font-bold">رفع مادة جديدة</button>
                    </div>

                    <div id="upload-progress" class="hidden mb-6 bg-white/5 h-2 rounded-full overflow-hidden">
                        <div class="h-full bg-purple-500 w-0 transition-all" id="progress-bar"></div>
                    </div>
                    
                    <div id="media-ui" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- الوسائط تظهر هنا بشكل احترافي -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال الحماية -->
    <div id="auth-modal" class="fixed inset-0 bg-black/98 hidden items-center justify-center p-6 z-[300]">
        <div class="glass-panel p-10 max-w-sm w-full text-center border-gold/50">
            <div class="w-20 h-20 bg-gradient-to-tr from-gold to-yellow-600 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-[0_0_30px_rgba(212,175,55,0.3)]">
                <svg class="w-10 h-10 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h3 id="auth-target" class="text-2xl font-black gold-text mb-2 uppercase"></h3>
            <p class="text-[10px] text-gray-500 mb-8 tracking-widest">ENTER ACCESS KEY</p>
            <input type="password" id="auth-pass" class="input-elite text-center text-3xl mb-8 tracking-widest" placeholder="••••">
            <button onclick="accessPage()" class="w-full btn-gold py-5 rounded-2xl text-xl uppercase tracking-tighter">Open Vault</button>
            <button onclick="closeModal()" class="mt-6 text-gray-600 text-[10px] hover:text-white transition">CANCEL</button>
        </div>
    </div>

    <script>
        let currentPage = null;
        let selectedPageName = "";

        async function createPage() {
            const name = document.getElementById('reg-name').value;
            const password = document.getElementById('reg-pass').value;
            const description = document.getElementById('reg-desc').value;
            if(!name || !password) return alert("املأ البيانات الأساسية");
            
            const res = await fetch('/api/pages/create', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, password, description }) });
            if(res.ok) { alert("✅ تم تفعيل خزنتك بنجاح!"); location.reload(); } else alert("الاسم محجوز!");
        }

        async function search() {
            const q = document.getElementById('search-in').value;
            const res = await fetch(`/api/pages/search?q=${q}`);
            const data = await res.json();
            document.getElementById('results').innerHTML = data.map(p => `
                <div onclick="openAuth('${p.name}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 cursor-pointer hover:border-gold/40 transition group">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-gray-200 group-hover:text-gold transition">${p.name}</span>
                        <span class="text-[10px] text-gray-600 uppercase">View Vault</span>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-gray-700 text-xs py-10">لا توجد خزنات بهذا الاسم</p>';
        }

        function openAuth(name) {
            selectedPageName = name;
            document.getElementById('auth-target').innerText = name;
            document.getElementById('auth-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('auth-modal').style.display = 'none'; }

        async function accessPage() {
            const password = document.getElementById('auth-pass').value;
            const res = await fetch('/api/pages/access', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name: selectedPageName, password }) });
            if(res.ok) { currentPage = await res.json(); renderFullVault(); } else alert("❌ مفتاح الدخول غير صحيح");
        }

        function renderFullVault() {
            closeModal();
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('page-view').classList.remove('hidden');
            document.getElementById('view-title').innerText = currentPage.name;
            document.getElementById('view-desc').innerText = currentPage.description;
            document.getElementById('page-text').value = currentPage.content.text;
            renderAll();
        }

        function renderAll() {
            renderDebts();
            renderRentals();
            renderMedia();
        }

        function renderDebts() {
            const debts = currentPage.content.debts || [];
            document.getElementById('debt-count').innerText = debts.length;
            document.getElementById('debts-ui').innerHTML = debts.map((d, i) => {
                const days = Math.floor((new Date() - new Date(d.date)) / (1000 * 60 * 60 * 24));
                return `
                <div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center border border-white/5">
                    <div>
                        <div class="text-xs font-bold text-gray-200">${d.name}</div>
                        <div class="text-[9px] text-gray-500">${days} يوم مضى</div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-sm font-black text-gold">$${parseFloat(d.amount).toLocaleString()}</span>
                        <button onclick="removeDebt(${i})" class="text-gray-600 hover:text-red-500">×</button>
                    </div>
                </div>`;
            }).reverse().join('');
        }

        function addDebt() {
            const name = document.getElementById('debt-name').value;
            const amt = document.getElementById('debt-amt').value;
            if(!name || !amt) return;
            currentPage.content.debts.push({ name, amount: amt, date: new Date().toISOString() });
            renderDebts();
            document.getElementById('debt-name').value = ""; document.getElementById('debt-amt').value = "";
        }
        function removeDebt(i) { currentPage.content.debts.splice(i, 1); renderDebts(); }

        function renderRentals() {
            document.getElementById('rentals-ui').innerHTML = (currentPage.content.rentals || []).map((r, i) => {
                const start = new Date(r.startDate);
                const diffDays = Math.floor((new Date() - start) / (1000*60*60*24)) % 30;
                const progress = Math.min((diffDays / 30) * 100, 100);
                return `
                <div class="bg-black/40 p-5 rounded-3xl border border-white/5">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-xs font-bold text-blue-400">${r.name}</span>
                        <button onclick="removeRental(${i})" class="text-gray-700">×</button>
                    </div>
                    <div class="flex justify-between text-[11px] mb-3">
                        <span class="gold-text font-bold">$${parseFloat(r.amount).toLocaleString()} / شهر</span>
                        <span class="text-gray-500">يومياً: $${(r.amount/30).toFixed(1)}</span>
                    </div>
                    <div class="w-full bg-white/5 h-1.5 rounded-full mb-2">
                        <div class="h-full rounded-full bg-blue-500" style="width: ${progress}%"></div>
                    </div>
                    <div class="text-[9px] text-gray-500 flex justify-between">
                        <span>يوم ${diffDays} من 30</span>
                        <span>${progress > 85 ? '🚨 موعد السداد قارب' : 'حالة مستقرة'}</span>
                    </div>
                </div>`;
            }).join('');
        }

        function addRental() {
            const name = document.getElementById('rent-name').value;
            const amt = document.getElementById('rent-amt').value;
            const date = document.getElementById('rent-date').value;
            if(!name || !amt) return;
            currentPage.content.rentals.push({ name, amount: amt, startDate: date || new Date().toISOString() });
            renderRentals();
        }
        function removeRental(i) { currentPage.content.rentals.splice(i, 1); renderRentals(); }

        async function uploadFile() {
            const file = document.getElementById('file-in').files[0];
            if(!file) return;
            
            document.getElementById('upload-progress').classList.remove('hidden');
            const formData = new FormData();
            formData.append('file', file);

            const res = await fetch('/api/pages/upload', { method: 'POST', body: formData });
            const data = await res.json();
            
            document.getElementById('upload-progress').classList.add('hidden');
            currentPage.content.media.push(data);
            renderMedia();
        }

        function renderMedia() {
            document.getElementById('media-ui').innerHTML = (currentPage.content.media || []).map((m, i) => {
                const isImg = m.type.startsWith('image');
                return `
                <div class="media-card group">
                    ${isImg ? 
                        `<img src="${m.url}" class="w-full h-48 object-cover" loading="lazy">` : 
                        `<div class="relative bg-black h-48 flex items-center justify-center">
                            <video id="vid-${i}" preload="none" class="w-full h-full">
                                <source src="${m.url}" type="${m.type}">
                            </video>
                            <button id="play-btn-${i}" onclick="loadAndPlay(${i})" class="absolute bg-gold w-14 h-14 rounded-full flex items-center justify-center shadow-2xl transition hover:scale-110">
                                <svg class="w-6 h-6 text-black ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M4.5 3.5v13L16 10 4.5 3.5z"></path></svg>
                            </button>
                        </div>`
                    }
                    <div class="p-3 bg-black/60 flex justify-between items-center border-t border-white/5">
                        <span class="text-[9px] text-gray-400 uppercase">${isImg ? 'Image' : 'Video Control'}</span>
                        <div class="flex gap-2">
                            <a href="${m.url}" download class="text-[9px] bg-white/5 px-2 py-1 rounded border border-white/10">تحميل</a>
                            <button onclick="removeMedia(${i})" class="text-[9px] bg-red-900/20 text-red-500 px-2 py-1 rounded border border-red-500/20">حذف</button>
                        </div>
                    </div>
                </div>`;
            }).reverse().join('');
        }

        // ميزة التحكم في تشغيل الفيديو لمنع سحب الرصيد
        function loadAndPlay(i) {
            const vid = document.getElementById(`vid-${i}`);
            const btn = document.getElementById(`play-btn-${i}`);
            vid.setAttribute('controls', 'true');
            vid.play();
            btn.style.display = 'none';
        }

        function removeMedia(i) { 
            if(confirm("هل تريد حذف هذه المادة نهائياً؟")) {
                currentPage.content.media.splice(i, 1); renderMedia(); 
            }
        }

        async function saveChanges() {
            currentPage.content.text = document.getElementById('page-text').value;
            const res = await fetch('/api/pages/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: currentPage.id, password: currentPage.password, content: currentPage.content })
            });
            if(res.ok) alert("✅ تم تأمين جميع البيانات في السحابة");
        }

        async function deletePage() {
            if(confirm("تحذير: سيتم تدمير الخزنة وكل محتوياتها نهائياً! هل أنت متأكد؟")) {
                await fetch('/api/pages/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id: currentPage.id, password: currentPage.password }) });
                location.reload();
            }
        }

        search();
    </script>
</body>
</html>
