<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>💎 FADI PRO SYSTEM 💎</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --gold: #ffd700; --dark: #050c16; --card: #101e30; }
        body { background: var(--dark); color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; margin: 0; }
        #login { position: fixed; inset: 0; background: var(--dark); z-index: 10; display: flex; align-items: center; justify-content: center; }
        .box { background: var(--card); padding: 30px; border: 2px solid var(--gold); border-radius: 20px; text-align: center; }
        input { width: 80%; padding: 10px; margin: 10px; border-radius: 10px; border: none; }
        #main { display: none; grid-template-columns: 250px 1fr; height: 100vh; }
        .side { background: var(--card); border-left: 2px solid var(--gold); padding: 10px; }
        .chat { display: flex; flex-direction: column; flex: 1; position: relative; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { background: #1e3a5f; padding: 10px; border-radius: 10px; margin-bottom: 5px; width: fit-content; }
        #video-view { position: absolute; inset: 0; background: black; display: none; flex-direction: column; z-index: 5; }
        video { width: 45%; border: 1px solid var(--gold); border-radius: 10px; margin: 5px; }
        .user-link { cursor: pointer; color: var(--gold); padding: 10px; display: block; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

<div id="login">
    <div class="box">
        <h2 style="color:var(--gold)">💎 فادي برو</h2>
        <input type="text" id="u" placeholder="اسمك">
        <input type="text" id="r" placeholder="رقم الغرفة">
        <button onclick="enter()" style="background:var(--gold); padding:10px 30px; border-radius:10px; cursor:pointer;">دخول</button>
    </div>
</div>

<div id="main">
    <div class="side">
        <h4 style="color:var(--gold)">المتواجدون 👤</h4>
        <div id="u-list"></div>
    </div>
    <div class="chat">
        <div id="video-view">
            <div style="flex:1; display:flex; align-items:center; justify-content:center;">
                <video id="lv" autoplay muted playsinline></video>
                <video id="rv" autoplay playsinline></video>
            </div>
            <button onclick="location.reload()" style="background:red; color:white; padding:15px;">إنهاء الاتصال 🛑</button>
        </div>
        <div id="messages"></div>
        <div style="padding:15px; display:flex; gap:10px; background:var(--card);">
            <input type="text" id="m" placeholder="اكتب رسالتك..." style="flex:1; margin:0;">
            <button onclick="send()" style="background:var(--gold); border:none; padding:10px 20px; border-radius:10px;">إرسال</button>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let name, room;

    function enter() {
        name = document.getElementById('u').value;
        room = document.getElementById('r').value;
        if(name && room) {
            document.getElementById('login').style.display = 'none';
            document.getElementById('main').style.display = 'grid';
            socket.emit('join-room', { roomID: room, user: name });
        }
    }

    socket.on('update-users', users => {
        const list = document.getElementById('u-list');
        list.innerHTML = '';
        users.forEach(u => {
            if(u.id !== socket.id) {
                list.innerHTML += `<div class="user-link" onclick="call('${u.id}')">📞 ${u.name}</div>`;
            }
        });
    });

    function send() {
        const t = document.getElementById('m').value;
        if(t) {
            socket.emit('chat-message', { roomID: room, user: name, text: t });
            document.getElementById('m').value = '';
        }
    }

    socket.on('chat-message', d => {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<b>${d.user}:</b> ${d.text}`;
        document.getElementById('messages').appendChild(div);
    });

    function call(id) {
        alert("جاري طلب الاتصال...");
        socket.emit('request-call', { to: id });
    }

    socket.on('incoming-call', d => {
        if(confirm(d.fromName + " يشتي يتصل بك، توافق؟")) {
            document.getElementById('video-view').style.display = 'flex';
            // هنا يكمل كود الـ WebRTC للاتصال
        }
    });
</script>
</body>
</html>
