<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة فادي برو للعقارات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #05070a; color: #e6edf3; }
        .gold-border { border-color: #e2b714; }
        .gold-text { color: #e2b714; }
        .gold-bg { background-color: #e2b714; }
        .glass { background: rgba(22, 27, 34, 0.98); backdrop-filter: blur(15px); }
        input, select { background-color: #000 !important; color: #fff !important; border: 1px solid #30363d !important; }
        input:focus { border-color: #e2b714 !important; }
    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 z-50 glass border-b-2 gold-border px-6 py-4 flex justify-between items-center shadow-2xl">
        <div class="text-2xl font-black gold-text flex items-center gap-2">
            <i class="fas fa-city"></i>
            <span>منظومة فادي برو</span>
        </div>
        <div class="text-[10px] gold-text opacity-70">نظام فصيح ومستقر</div>
    </header>

    <!-- البحث -->
    <div class="p-4 bg-[#0d1117] border-b border-[#30363d]">
        <div class="max-w-2xl mx-auto space-y-4">
            <div class="relative">
                <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 gold-text"></i>
                <input type="text" id="searchBar" placeholder="ابحث هنا..." class="w-full rounded-xl py-3 pr-12 pl-4 outline-none">
            </div>
            <div class="flex gap-2 overflow-x-auto justify-center">
                <button onclick="applyFilter('الكل')" class="px-5 py-2 rounded-full bg-[#e2b714] text-black font-bold text-sm">الكل</button>
                <button onclick="applyFilter('شقة')" class="px-5 py-2 rounded-full bg-[#161b22] border border-[#30363d] text-sm">شقق</button>
                <button onclick="applyFilter('أرضية')" class="px-5 py-2 rounded-full bg-[#161b22] border border-[#30363d] text-sm">أراضي</button>
                <button onclick="applyFilter('بيت')" class="px-5 py-2 rounded-full bg-[#161b22] border border-[#30363d] text-sm">بيوت</button>
            </div>
        </div>
    </div>

    <!-- الشبكة -->
    <main id="gridBox" class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-7xl mx-auto pb-24">
        <div class="col-span-full text-center py-20 text-gray-500">جاري الاتصال بالسحاب...</div>
    </main>

    <!-- زر الإضافة -->
    <button onclick="document.getElementById('addModal').style.display='flex'" class="fixed bottom-8 left-8 w-16 h-16 gold-bg text-black rounded-full shadow-2xl flex items-center justify-center z-40">
        <i class="fas fa-plus text-2xl"></i>
    </button>

    <!-- نافذة الإضافة -->
    <div id="addModal" class="fixed inset-0 bg-black/90 z-[100] hidden items-center justify-center p-4">
        <div class="bg-[#161b22] w-full max-w-lg border-2 gold-border rounded-3xl p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold gold-text">إضافة عرض جديد</h2>
                <button onclick="document.getElementById('addModal').style.display='none'"><i class="fas fa-times text-xl text-gray-500"></i></button>
            </div>
            <div class="space-y-4">
                <input type="text" id="f_name" placeholder="اسم المعلن" class="w-full p-4 rounded-xl outline-none">
                <input type="number" id="f_phone" placeholder="رقم التواصل" class="w-full p-4 rounded-xl outline-none">
                <input type="text" id="f_loc" placeholder="موقع العقار (مهم جداً)" class="w-full p-4 rounded-xl outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="f_price" placeholder="السعر" class="w-full p-4 rounded-xl outline-none">
                    <input type="text" id="f_area" placeholder="المساحة" class="w-full p-4 rounded-xl outline-none">
                </div>
                <select id="f_cat" class="w-full p-4 rounded-xl outline-none">
                    <option value="شقة">شقة</option>
                    <option value="أرضية">أرضية</option>
                    <option value="بيت">بيت</option>
                </select>
                <div class="pt-4 border-t border-[#30363d]">
                    <label class="text-xs gold-text mb-2 block">رمز الحماية للحذف</label>
                    <input type="password" id="f_pass" placeholder="أدخل كلمة سر" class="w-full p-4 rounded-xl outline-none text-center">
                </div>
                <button id="saveBtn" class="w-full gold-bg text-black font-black py-4 rounded-xl shadow-lg">نشر الآن</button>
            </div>
        </div>
    </div>

    <!-- نافذة الحذف -->
    <div id="delModal" class="fixed inset-0 bg-black/95 z-[110] hidden items-center justify-center p-6">
        <div class="bg-[#161b22] border border-red-500 rounded-3xl p-8 w-full max-w-sm text-center">
            <h3 class="text-xl font-bold mb-6 text-white">تأكيد الحذف</h3>
            <input type="password" id="delInput" class="w-full p-4 rounded-xl text-center mb-6 outline-none" placeholder="أدخل رمز الحماية">
            <div class="flex gap-3">
                <button id="confirmDelBtn" class="flex-1 bg-red-600 py-3 rounded-xl font-bold">حذف</button>
                <button onclick="document.getElementById('delModal').style.display='none'" class="flex-1 bg-gray-700 py-3 rounded-xl">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = JSON.parse('__firebase_config');
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'fadi_v3_final';

        let properties = [];
        let currentFilter = 'الكل';
        let deleteId = null;
        let deleteKey = null;

        signInAnonymously(auth).then(() => {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'listings'), (snap) => {
                properties = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            });
        });

        function render() {
            const grid = document.getElementById('gridBox');
            const search = document.getElementById('searchBar').value.toLowerCase();
            const filtered = properties.filter(p => {
                const mSearch = (p.loc || "").toLowerCase().includes(search) || (p.name || "").toLowerCase().includes(search);
                const mCat = currentFilter === 'الكل' || p.cat === currentFilter;
                return mSearch && mCat;
            });

            grid.innerHTML = filtered.map(p => `
                <div class="bg-[#161b22] border border-[#30363d] rounded-2xl p-6 relative group">
                    <button onclick="window.initDel('${p.id}', '${p.pass}')" class="absolute top-4 left-4 text-gray-700 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="fas fa-trash"></i>
                    </button>
                    <div class="text-[#e2b714] text-xs mb-2 font-bold">${p.name}</div>
                    <h3 class="text-xl font-bold mb-4">${p.loc}</h3>
                    <div class="flex justify-between items-center mb-6 bg-black/40 p-3 rounded-xl border border-[#30363d]">
                        <div><span class="text-[10px] text-gray-500 block">السعر</span><span class="gold-text font-bold">${p.price || "اتفاق"}</span></div>
                        <div class="text-left"><span class="text-[10px] text-gray-500 block">المساحة</span><span class="text-sm font-bold">${p.area || "--"}</span></div>
                    </div>
                    <a href="https://wa.me/967${p.phone}" target="_blank" class="w-full bg-[#238636] text-white py-3 rounded-xl flex items-center justify-center gap-2 font-bold">
                        <i class="fab fa-whatsapp"></i> مراسلة
                    </a>
                </div>
            `).join('');
        }

        // إضافة دالة الحفظ بشكل صحيح ومباشر
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const data = {
                name: document.getElementById('f_name').value,
                phone: document.getElementById('f_phone').value,
                loc: document.getElementById('f_loc').value,
                price: document.getElementById('f_price').value,
                area: document.getElementById('f_area').value,
                cat: document.getElementById('f_cat').value,
                pass: document.getElementById('f_pass').value
            };

            if(!data.loc || !data.pass) return alert("املا الموقع وكلمة السر!");

            document.getElementById('saveBtn').innerText = "جاري الحفظ...";
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'listings'), data);
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('saveBtn').innerText = "نشر الآن";
            // تفريغ
            ['f_name','f_phone','f_loc','f_price','f_area','f_pass'].forEach(id => document.getElementById(id).value='');
        });

        // دوال مساعدة في الـ window لتكون متاحة للـ HTML
        window.applyFilter = (cat) => { currentFilter = cat; render(); };
        window.initDel = (id, key) => { deleteId = id; deleteKey = key; document.getElementById('delModal').style.display='flex'; };
        
        document.getElementById('confirmDelBtn').addEventListener('click', async () => {
            if(document.getElementById('delInput').value === deleteKey) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'listings', deleteId));
                document.getElementById('delModal').style.display='none';
                document.getElementById('delInput').value = '';
            } else { alert("الرمز غلط!"); }
        });

        document.getElementById('searchBar').oninput = render;

    </script>
</body>
</html>
