<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ATOMIC PREDICTOR | المنظومة الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        body { background: #050507; color: #eee; font-family: 'Changa', sans-serif; }
        .glass { background: rgba(15, 15, 25, 0.9); border: 1px solid rgba(197,160,89,0.2); backdrop-filter: blur(10px); }
        input { background: #0c0c14 !important; border: 1px solid #222 !important; color: #c5a059 !important; padding: 12px; border-radius: 12px; width: 100%; outline: none; margin-bottom: 10px; font-size: 13px;}
    </style>
</head>
<body class="p-4">

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- العمود الأول: الرادار والإشارات -->
        <div class="lg:col-span-1 space-y-4">
            <div class="glass p-6 rounded-[2rem] text-center">
                <h2 class="text-[#c5a059] font-bold mb-4">رادار التحليل المباشر</h2>
                <div id="sig-text" class="text-4xl font-black my-4 text-gray-500 italic">جاري الفحص..</div>
                <div id="price-val" class="text-xl font-bold orbitron mb-4">$ --,---</div>
                <div id="sig-advice" class="text-[11px] text-gray-400 bg-black/40 p-3 rounded-xl italic">
                    النظام يراقب السوق ويرسل التنبيهات للبوتات المسجلة تلقائياً..
                </div>
            </div>

            <!-- إضافة بوت -->
            <div class="glass p-6 rounded-[2rem]">
                <h3 class="text-sm font-bold mb-4 text-[#c5a059]">➕ إضافة بوت جديد</h3>
                <input type="text" id="name" placeholder="اسمك">
                <input type="text" id="token" placeholder="Bot Token">
                <input type="text" id="chatid" placeholder="Chat ID">
                <input type="password" id="pass" placeholder="كلمة سر الحماية">
                <button onclick="addBot()" class="w-full bg-[#c5a059] text-black font-bold py-3 rounded-xl hover:bg-white transition">اشتراك وتفعيل</button>
            </div>
        </div>

        <!-- العمود الثاني والثالث: الشارت -->
        <div class="lg:col-span-2">
            <div class="glass rounded-[2rem] overflow-hidden h-[600px]">
                <div id="tv_chart" class="w-full h-full"></div>
            </div>
        </div>

        <!-- العمود الرابع: قائمة المشتركين -->
        <div class="lg:col-span-1">
            <div class="glass p-6 rounded-[2rem] h-full overflow-y-auto">
                <h3 class="text-[#c5a059] font-bold mb-4 border-b border-white/5 pb-2">المشتركين النشطين</h3>
                <div id="bots-list" class="space-y-3">
                    <!-- Bots list here -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // الشارت
        new TradingView.widget({
            "width": "100%", "height": "100%", "symbol": "BINANCE:BTCUSDT",
            "interval": "1", "theme": "dark", "container_id": "tv_chart",
            "studies": ["RSI@tv-basicstudies"]
        });

        // تحديث البيانات
        async function update() {
            try {
                const r = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
                const d = await r.json();
                document.getElementById('price-val').innerText = "$" + parseFloat(d.price).toLocaleString();

                // محاكاة الإشارة في الواجهة (لأن السيرفر يرسل للبوت)
                const rsiMock = Math.floor(Math.random() * 60) + 20;
                const sig = document.getElementById('sig-text');
                if(rsiMock < 30) { sig.innerText = "شراء 🟢"; sig.className = "text-4xl font-black my-4 text-green-500 animate-pulse"; }
                else if(rsiMock > 70) { sig.innerText = "بيع 🔴"; sig.className = "text-4xl font-black my-4 text-red-500 animate-pulse"; }
                else { sig.innerText = "انتظر 🔍"; sig.className = "text-4xl font-black my-4 text-gray-500"; }
            } catch(e) {}
        }
        setInterval(update, 3000);

        async function loadBots() {
            const r = await fetch('/api/list-bots');
            const data = await r.json();
            document.getElementById('bots-list').innerHTML = data.map(b => `
                <div class="bg-white/5 p-3 rounded-xl flex justify-between items-center border border-white/5">
                    <div>
                        <div class="text-[12px] font-bold text-[#c5a059]">${b.ownerName}</div>
                        <div class="text-[9px] text-gray-500">${b.chatId}</div>
                    </div>
                    <button onclick="delBot(${b.id})" class="text-red-500 text-[10px]">حذف</button>
                </div>
            `).join('');
        }

        async function addBot() {
            const body = {
                ownerName: document.getElementById('name').value,
                botToken: document.getElementById('token').value,
                chatId: document.getElementById('chatid').value,
                userPassword: document.getElementById('pass').value
            };
            await fetch('/api/link-bot', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            alert("تم الاشتراك!");
            loadBots();
        }

        async function delBot(id) {
            const pass = prompt("أدخل كلمة السر للحذف:");
            const r = await fetch('/api/remove-bot', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id, pass })
            });
            const res = await r.json();
            if(res.success) loadBots(); else alert(res.msg);
        }

        loadBots();
    </script>
</body>
</html>
